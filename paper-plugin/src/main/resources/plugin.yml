name: c-imagine
version: 0.1.0
main: dev.cim.paper.CimPlugin
api-version: '1.21'
description: Paper-side lifecycle bridge for the c-imagine CRUSSTY module (mini NeoForge 1.21.1 inside Paper 26.3)
author: PLANETA9091
website: https://github.com/PLANETA9091/c-imagine
commands:
  cim:
    description: c-imagine module status
    usage: /cim
  keyboard:
    description: Toggle the virtual keyboard for mod keybindings
    usage: /keyboard
  minimap:
    description: Toggle the minimap
    usage: /minimap
  modmenu:
    description: Open a translated mod menu
    usage: /modmenu <id>
    permission: cim.modmenu
permissions:
  cim.modmenu:
    default: op
