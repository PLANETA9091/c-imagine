name: c-imagine
version: 0.1.0
main: dev.cim.paper.CimPlugin
api-version: '1.21'
description: Paper-side lifecycle bridge for the c-imagine CRUSSTY module (mini NeoForge 1.21.1 inside Paper 26.3)
author: PLANETA9091
website: https://github.com/PLANETA9091/c-imagine
commands:
  cim:
    description: c-imagine module status
    usage: /cim
    # 14-e7: the walk's light poke arrives as `cimscene lightpoke` (the
    # truth-leg command spelling, shared by both legs' workflows) — the
    # alias routes it into this dispatcher.
    aliases: [cimscene]
  keyboard:
    description: Toggle the virtual keyboard for mod keybindings
    usage: /keyboard
  modscreen:
    description: Open a scanned mod screen
    usage: /modscreen <ClassName>
    permission: cim.modscreen
permissions:
  cim.modscreen:
    default: op
