name: menus

# The menu gate on its own: real NeoForge frames beside c-imagine on vanilla 26.3,
# pixel for pixel. It skips the gallery's block and entity walks, so a run takes
# minutes. Slices run in parallel, sized so each walks about 24 menus.

on:
  push:
    branches: [ci/menu-compare-2, ci/menu-100-green]
    paths:
      - 'paper-plugin/**'
      - 'scene-mod/**'
      - 'scripts/hud/**'
      - 'scripts/cimscene/menu-sheet.py'
      - 'scripts/visual/**'
      - 'live-mod/**'
      - 'java/**'
      - 'crates/**'
      - '.github/workflows/menus.yml'
  workflow_dispatch:
    inputs:
      ns:
        description: 'Only these namespaces (space separated) — a quick check of one fix'
        required: false
        default: ''

concurrency:
  group: menus-${{ github.ref }}
  cancel-in-progress: true


jobs:
  plan:
    name: menus plan (mods and menu counts from the jars)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache: false
      - uses: actions/setup-java@v4
        id: jdk25
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: paper-plugin/pom.xml
      - uses: actions/setup-java@v4
        id: jdk21
        with:
          distribution: temurin
          java-version: 21
      # NeoForge's decompile is the slow part of a harness build, and it never changes.
      - name: restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            scene-mod/build/moddev
            scene-mod/.gradle
          key: menus-gradle-${{ hashFiles('scene-mod/build.gradle', 'scene-mod/gradle.properties') }}
      - name: restore scene jar
        id: jars
        uses: actions/cache@v4
        with:
          path: scene-mod/build/libs
          key: menus-scene-${{ hashFiles('scene-mod/src/**', 'scene-mod/*.gradle*') }}
      - name: build scene jar (cache miss)
        if: steps.jars.outputs.cache-hit != 'true'
        run: gradle build --no-daemon -p scene-mod
      - name: restore NeoForge server
        id: layer
        uses: actions/cache@v4
        with:
          path: layer-srv
          key: neoforge-layer-21.1.265
      - name: install NeoForge server (cache miss)
        if: steps.layer.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-srv-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-srv-installer.jar --installServer layer-srv
      - name: restore mods
        id: mods
        uses: actions/cache@v4
        with:
          path: mods-ladder
          key: menus-mods-${{ hashFiles('scripts/cimscene/mods.lock') }}
      - name: fetch mods (cache miss)
        if: steps.mods.outputs.cache-hit != 'true'
        run: bash scripts/cimscene/fetch-ladder.sh mods-ladder $(grep -vE '^\s*(#|$)' scripts/cimscene/mods.lock | cut -d= -f1)
      - name: count every mod's menus
        id: plan
        env:
          J21: ${{ steps.jdk21.outputs.path }}
          ONLY_NS: ${{ github.event.inputs.ns }}
        run: bash scripts/hud/menu-plan.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plan-scenes
          path: plan-scenes
      - name: keep the plan's server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-log
          path: srv-plan/boot.log
          if-no-files-found: warn

  slice:
    name: menus ${{ matrix.ns }} ${{ matrix.si }}/${{ matrix.k }}
    runs-on: ubuntu-latest
    # The crawl presses up to 40 controls per menu, each settled and captured on both stacks.
    timeout-minutes: 45
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache: false
      - uses: actions/setup-java@v4
        id: jdk25
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: paper-plugin/pom.xml
      - uses: actions/setup-java@v4
        id: jdk21
        with:
          distribution: temurin
          java-version: 21
      # NeoForge's decompile is the slow part of a harness build, and it never changes.
      - name: restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            scene-mod/build/moddev
            scene-mod/.gradle
          key: menus-gradle-${{ hashFiles('scene-mod/build.gradle', 'scene-mod/gradle.properties') }}
      - name: restore scene jar
        id: jars
        uses: actions/cache@v4
        with:
          path: scene-mod/build/libs
          key: menus-scene-${{ hashFiles('scene-mod/src/**', 'scene-mod/*.gradle*') }}
      - name: build scene jar (cache miss)
        if: steps.jars.outputs.cache-hit != 'true'
        run: gradle build --no-daemon -p scene-mod
      - name: restore NeoForge server
        id: layer
        uses: actions/cache@v4
        with:
          path: layer-srv
          key: neoforge-layer-21.1.265
      - name: install NeoForge server (cache miss)
        if: steps.layer.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-srv-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-srv-installer.jar --installServer layer-srv
      - name: restore mods
        id: mods
        uses: actions/cache@v4
        with:
          path: mods-ladder
          key: menus-mods-${{ hashFiles('scripts/cimscene/mods.lock') }}
      - name: fetch mods (cache miss)
        if: steps.mods.outputs.cache-hit != 'true'
        run: bash scripts/cimscene/fetch-ladder.sh mods-ladder $(grep -vE '^\s*(#|$)' scripts/cimscene/mods.lock | cut -d= -f1)
      - name: restore NeoForge client
        id: nfc
        uses: actions/cache@v4
        with:
          path: |
            nfc
            truth-client
          key: neoforge-truth-client-1211-v4
      - name: fetch NeoForge client (cache miss)
        if: steps.nfc.outputs.cache-hit != 'true'
        run: |
          python3 scripts/truth/fetch-truth-client.py nfc truth-client --assets
          sed -i 's/^java /java -Xmx2G /' truth-client/launch.txt
      - name: restore vanilla client and Paper
        uses: actions/cache@v4
        with:
          path: |
            visual-client
            srv-ours/paper.jar
            srv-ours/libraries
            srv-ours/versions
            srv-ours/cache
          key: menus-ours-26.3-v1
      - name: GL libraries
        run: |
          NEED=""
          for pkg in libgl1-mesa-dri mesa-vulkan-drivers libglx-mesa0 libxtst6 xvfb; do
            dpkg -s "$pkg" >/dev/null 2>&1 || NEED="$NEED $pkg"
          done
          if [ -n "$NEED" ]; then sudo apt-get update -qq; sudo apt-get install -y -qq $NEED; fi
      - uses: actions/download-artifact@v4
        with:
          name: plan-scenes
          path: plan-scenes
      # Ours is the c-imagine stack: Paper under CRUSSTY with the layer and cimlive, so every
      # open, slot move and button press runs the mod's own code (roadmap M6.3).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build the layer (bootstrap, module, cimlive)
        env:
          JAVA_HOME: ${{ steps.jdk21.outputs.path }}
        run: |
          bash scripts/build-bootstrap.sh
          CIM_BOOTSTRAP_JAR="$PWD/java/cim-bootstrap/build/cim-bootstrap.jar" bash scripts/package-module.sh
          gradle build --no-daemon -p live-mod
      - name: scaffold Paper 26.3 with CRUSSTY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm i -g crussty
          crussty init --platform paper --version 26.3 --dir srv-crus 2>&1 | tee init.log
          # init only warns when a release download fails (GitHub 504 on the direct asset
          # URL, measured); whatever it missed comes through the API.
          TAG=$(grep -oE 'releases/download/v[0-9.]+' init.log | head -1 | sed 's#releases/download/##')
          [ -s srv-crus/launcher/launcher.jar ] || { mkdir -p srv-crus/launcher; gh release download "$TAG" -R PLANETA9091/CRUSSTY -p launcher.jar -D srv-crus/launcher --clobber; }
          [ -s srv-crus/libcrussty_runtime.so ] || gh release download "$TAG" -R PLANETA9091/CRUSSTY -p libcrussty_runtime.so -D srv-crus --clobber
          ls -la srv-crus/launcher/launcher.jar srv-crus/libcrussty_runtime.so
      - name: truth, ours and the pixel verdict
        env:
          J21: ${{ steps.jdk21.outputs.path }}
          J25: ${{ steps.jdk25.outputs.path }}
          OURS_CRUSSTY: ${{ github.workspace }}/srv-crus
        run: bash scripts/hud/menu-shard.sh ${{ matrix.ns }} ${{ matrix.si }} ${{ matrix.k }}
      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menus-${{ matrix.ns }}-${{ matrix.si }}
          path: |
            gallery-report
            srv-wall/boot.log
            srv-ours/boot.log
            truth-client/client.out
            visual-client/client.out
            srv-wall/c-imagine/screens/*.presses
            plugin-build.log
          if-no-files-found: warn

  verdict:
    name: menus verdict
    runs-on: ubuntu-latest
    needs: [plan, slice]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: GREEN or RED
        run: |
          # A crawl can reach a menu from another slice: its best verdict stands.
          find all -name menus.md -exec cat {} + | grep -E '^\| ' | grep -v '^| menu' | sort -u \
            | awk -F'|' '{k=$2; g=($3 ~ /GREEN/); if(!(k in r) || g || (r[k] ~ /not opened/ && $0 !~ /not opened/)) r[k]=$0} END{for(k in r) print r[k]}' | sort > all.md
          G=$(grep -c '| GREEN |' all.md || true); T=$(wc -l < all.md)
          { echo "### Menus: $G of $T GREEN"; echo; echo '| menu | verdict | detail |'; echo '|---|---|---|'; cat all.md; } >> "$GITHUB_STEP_SUMMARY"
          echo "menus: $G of $T GREEN"
          [ "$T" -gt 0 ] && [ "$G" = "$T" ]
