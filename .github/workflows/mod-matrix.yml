name: mod-matrix

# M5.5 real-mod parity program (owner directive 2026-10-29) — MODPACK.md
# Tier 0. This workflow hosts the ladder: P0 Create, P1 BOP / Dynamic Trees /
# Combat Roll, P2 the Aged modpack. Each ladder row = the SAME cimscene
# harness run on BOTH stacks; this file's jobs are the truth legs and the
# diff jobs join them against the c-imagine legs.
#
# Skeleton stage (12-g): cimscene itself (the ordinary-mod harness) builds
# and boots on a REAL NeoForge 21.1.265 server — the anti-bias baseline:
# the harness must behave identically on real NeoForge and inside c-imagine
# before any target mod is added. Census parity is the FIRST gate.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scene-mod/**'
      - 'scripts/**'
      - 'crates/**'
      - 'java/**'
      - '.github/workflows/mod-matrix.yml'

jobs:
  cimscene-truth:
    name: cimscene on real NeoForge 21.1.265 server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: build cimscene mod (NeoForge 1.21.1)
        working-directory: scene-mod
        run: gradle build --no-daemon

      - name: assert jar
        run: |
          test -f scene-mod/build/libs/cimscene-1.0.0.jar
          unzip -l scene-mod/build/libs/cimscene-1.0.0.jar | grep -q "dev/cim/scenemod/CimSceneMod.class"
          unzip -p scene-mod/build/libs/cimscene-1.0.0.jar META-INF/neoforge.mods.toml | grep -q 'modId = "cimscene"'

      - name: restore NeoForge server layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer-srv
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 21.1.265 server (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-srv-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-srv-installer.jar --installServer layer-srv

      - name: prepare server directory (isolated copy)
        run: |
          cp -r layer-srv srv-truth
          mkdir -p srv-truth/mods
          cp scene-mod/build/libs/cimscene-1.0.0.jar srv-truth/mods/
          echo "eula=true" > srv-truth/eula.txt
          cat > srv-truth/server.properties <<'PROPS'
          online-mode=false
          difficulty=peaceful
          level-type=minecraft:flat
          level-seed=42
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          PROPS

      - name: boot real NeoForge server (console FIFO) + census gates
        run: |
          set -euo pipefail
          cd srv-truth
          mkfifo console.in
          tail -f console.in | ./run.sh > boot.log 2>&1 &
          cd ..
          for i in $(seq 1 150); do
            grep -q "Done (" srv-truth/boot.log 2>/dev/null && break
            sleep 2
          done
          grep -q "Done (" srv-truth/boot.log || { tail -40 srv-truth/boot.log; exit 1; }
          # the harness's own lifecycle markers (the ordinary-mod contract)
          grep -q "\[cimscene\] mod constructed" srv-truth/boot.log \
            || { tail -40 srv-truth/boot.log; exit 1; }
          grep -q "\[cimscene\] common setup ok" srv-truth/boot.log \
            || { tail -40 srv-truth/boot.log; exit 1; }
          grep -q "\[cimscene\] census written scene-manifest.tsv" srv-truth/boot.log \
            || { tail -40 srv-truth/boot.log; exit 1; }
          grep -q "\[cimscene\] commands registered" srv-truth/boot.log \
            || { tail -40 srv-truth/boot.log; exit 1; }
          # the control command through the REAL server console (permission 4)
          echo "cimscene census" > srv-truth/console.in
          for i in $(seq 1 10); do
            grep -q "census totals" srv-truth/boot.log 2>/dev/null && break
            sleep 1
          done
          grep -q "census totals" srv-truth/boot.log || { tail -20 srv-truth/boot.log; exit 1; }
          # vanilla selftest scene: the vanilla-iron cube lands where the
          # camera math says (the console executor has no rotation; the
          # marker proves the scene primitive end to end)
          echo "execute in minecraft:overworld run cimscene selftest" > srv-truth/console.in
          for i in $(seq 1 10); do
            grep -q "\[cimscene\] selftest iron_block" srv-truth/boot.log 2>/dev/null && break
            sleep 1
          done
          grep -q "\[cimscene\] selftest iron_block" srv-truth/boot.log \
            || { tail -20 srv-truth/boot.log; exit 1; }
          # GAME-classloader probes: WHERE does the real server resolve the
          # client classes the Create construct chain touches? The probe uses
          # a vanilla class's defining loader — the exact delegation context
          # a game class (Screen) experiences at define time. The ANSWER is
          # the data: OK/FAIL + code source each way is parity-relevant.
          for C in net.minecraft.client.gui.components.Renderable \
                   net.minecraft.client.gui.screens.Screen \
                   net.minecraft.client.resources.model.BakedModel \
                   net.minecraft.client.player.LocalPlayer; do
            echo "cimscene probe-class $C" > srv-truth/console.in
            for i in $(seq 1 10); do
              grep -q "probe-class $C = " srv-truth/boot.log 2>/dev/null && break
              sleep 1
            done
            grep -q "probe-class $C = " srv-truth/boot.log \
              || { echo "probe-class $C produced no marker"; tail -20 srv-truth/boot.log; exit 1; }
          done
          grep "probe-class" srv-truth/boot.log | tail -8
          echo "cimscene-truth: ALL OK"

      - name: census parity sanity (real NeoForge rows exist)
        run: |
          T=srv-truth/c-imagine/scenes/scene-manifest.tsv
          test -f "$T" || { echo "census TSV missing"; exit 1; }
          # awk -F'\\t' is tab-proof (a space-corrupted grep once masked a green census)
          awk -F'\t' '$1=="block" && $2=="minecraft" {ok=1} END{exit !ok}' "$T" \
            || { echo "no minecraft block row in the census"; cat "$T"; exit 1; }
          awk -F'\t' '$1=="block" && $2=="cimscene" {ok=1} END{exit !ok}' "$T" || true
          cat "$T"

      - name: upload cimscene truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cimscene-truth-evidence
          path: |
            srv-truth/boot.log
            srv-truth/c-imagine/scenes/scene-manifest.tsv
            srv-truth/c-imagine/scenes/scene-manifest-entries.tsv

  # ---------------------------------------------------------------------
  # P0 — CREATE (owner: 100% identical is the single top priority).
  # First rung: REGISTRATION PARITY — the census with Create loaded on
  # BOTH stacks (shadow-space layer harness vs real NeoForge server).
  # RED rows here name exactly what the layer fails to register; every
  # red row is fixed before the visual rungs move.
  # ---------------------------------------------------------------------
  create-truth:
    name: P0 Create — truth leg (real NeoForge server census)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: build cimtest + cimscene
        run: |
          gradle build --no-daemon -p test-mods
          gradle build --no-daemon -p scene-mod

      - name: restore NeoForge server layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer-srv
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 21.1.265 server (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-srv-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-srv-installer.jar --installServer layer-srv

      - name: fetch P0 Create (Modrinth ladder fetch)
        run: bash scripts/cimscene/fetch-ladder.sh mods-create create

      - name: prepare server directory
        run: |
          cp -r layer-srv srv-create
          mkdir -p srv-create/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv-create/mods/
          cp scene-mod/build/libs/cimscene-1.0.0.jar srv-create/mods/
          cp mods-create/*.jar srv-create/mods/
          echo "eula=true" > srv-create/eula.txt
          cat > srv-create/server.properties <<'PROPS'
          online-mode=false
          difficulty=peaceful
          level-type=minecraft:flat
          level-seed=42
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          PROPS

      - name: boot real NeoForge + Create (console FIFO)
        run: |
          set -euo pipefail
          cd srv-create
          mkfifo console.in
          tail -f console.in | ./run.sh > boot.log 2>&1 &
          cd ..
          for i in $(seq 1 150); do
            grep -q "Done (" srv-create/boot.log 2>/dev/null && break
            sleep 2
          done
          grep -q "Done (" srv-create/boot.log || { tail -60 srv-create/boot.log; exit 1; }
          grep -q "\[cimscene\] census written scene-manifest.tsv" srv-create/boot.log \
            || { tail -60 srv-create/boot.log; exit 1; }
          echo "create-truth: server up + census written"

      - name: assert create census rows
        run: |
          T=srv-create/c-imagine/scenes/scene-manifest.tsv
          test -f "$T" || { echo "create census TSV missing"; exit 1; }
          cat "$T"
          awk -F'\t' '$1=="block" && $2=="create" {ok=1} END{exit !ok}' "$T" \
            || { echo "no create block rows in the truth census"; exit 1; }
          awk -F'\t' '$1=="item" && $2=="create" {ok=1} END{exit !ok}' "$T" \
            || { echo "no create item rows in the truth census"; exit 1; }

      # -------------------------------------------------------------------
      # THE GALLERY sweep (roadmap M5.5 main gate, truth leg): every Create
      # blockstate on the deterministic wall, one manifest per page. The
      # camera-lock environment pins ride here so the screenshots the parity
      # job takes against THIS wall are comparable across legs.
      # -------------------------------------------------------------------
      - name: gallery sweep (truth leg — every Create blockstate)
        run: |
          set -euo pipefail
          echo "gamerule doDaylightCycle false" > srv-create/console.in
          echo "time set noon" > srv-create/console.in
          echo "gamerule doWeatherCycle false" > srv-create/console.in
          echo "weather clear" > srv-create/console.in
          echo "gamerule doMobSpawning false" > srv-create/console.in
          sleep 2
          PAGES=0
          # No artificial page cap: the break below fires on the scene's own
          # exhausted=1 marker, so the sweep covers EVERY Create blockstate
          # (the old cap 60 silently dropped pages 60+ — Create has more).
          for p in $(seq 0 999); do
            echo "cimscene gallery page create $p" > srv-create/console.in
            ok=0
            for i in $(seq 1 30); do
              grep -q "gallery done ns=create page=$p " srv-create/boot.log 2>/dev/null && { ok=1; break; }
              sleep 1
            done
            [ "$ok" = "1" ] || { echo "gallery page $p produced no done marker"; tail -20 srv-create/boot.log; exit 1; }
            line=$(grep "gallery done ns=create page=$p " srv-create/boot.log | tail -1)
            echo "$line"
            echo "$line" | grep -q "cells=0" && { echo "gallery exhausted at page $p (content pages: $PAGES)"; break; }
            PAGES=$((PAGES+1))
            test -f "srv-create/c-imagine/scenes/gallery-create-p$p.tsv" \
              || { echo "gallery manifest p$p missing"; exit 1; }
          done
          [ "$PAGES" -gt 0 ] || { echo "no gallery pages were placed"; exit 1; }
          # -----------------------------------------------------------------
          # Wall existence probe — MANIFEST-DRIVEN (measured, not guessed).
          # Every page rebuilds the SAME wall region, so after the sweep the
          # wall holds exactly the LAST built page; and cells whose state was
          # skipped (fluid/invisible) are legitimately AIR. The stale probe
          # "first cell of page 0 must not be air" failed exactly there
          # (page 59's index-0 state was a waterlogged stairs -> skipped ->
          # air). The truth manifest knows which cells are placed: probe
          # EVERY placed cell of the last page with `execute unless block`.
          # -----------------------------------------------------------------
          LAST=$((PAGES-1))
          MAN="srv-create/c-imagine/scenes/gallery-create-p$LAST.tsv"
          N=0
          while IFS=$'\t' read -r kind x y z state rest; do
            [ "$kind" = "cell" ] || continue
            case "$x" in ''|*[!0-9-]*) continue;; esac   # header row guard
            [ "$x" != "-1" ] || continue
            bid="${state%%\[*}"
            echo "execute unless block $x $y $z $bid run say WALLCHECK_MISSING $x $y $z" > srv-create/console.in
            N=$((N+1))
          done < "$MAN"
          [ "$N" -gt 0 ] || { echo "last page manifest has no placed cells"; exit 1; }
          sleep 4
          if grep -q "WALLCHECK_MISSING" srv-create/boot.log; then
            echo "gallery wall probe: cells the world does NOT have:"
            grep "WALLCHECK_MISSING" srv-create/boot.log | tail -20
            exit 1
          fi
          echo "create-truth gallery: PAGES=$PAGES placed=$N wall probe ALL OK"

      - name: dump the REAL classpath contract (autopsy telemetry)
        run: |
          echo "=== installed unix_args.txt (the real server's launch contract) ==="
          cat srv-create/libraries/net/neoforged/neoforge/21.1.265/unix_args.txt
          echo "=== jars at the server ROOT (outside libraries/) ==="
          ls -la srv-create/ | head -30
          echo "=== game jar contents: client-class presence ==="
          for j in srv-create/libraries/net/minecraft/server/*/server-*.jar \
                   srv-create/libraries/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-*.jar \
                   srv-create/*.jar; do
            test -f "$j" || continue
            n=$(unzip -l "$j" 2>/dev/null | grep -c "\.class$" || true)
            r=$(unzip -l "$j" 2>/dev/null | grep -c "client/gui/components/Renderable.class" || true)
            s=$(unzip -l "$j" 2>/dev/null | grep -c "client/gui/screens/Screen.class" || true)
            echo "$j classes=$n renderable=$r screen=$s"
          done
          echo "=== does the boot log name any other class source? ==="
          grep -iE "Found mod file|libraries.list|versions.list|modules.list" srv-create/boot.log | head -20
          echo "=== the PATCHED DELTA anatomy (the real server's second game-class source) ==="
          echo "the installer profile: binarypatcher --clean srg --apply server.lzma ->"
          echo "neoforge-<ver>-server.jar = the PATCHED DELTA (patch set cut against the"
          echo "merged client∪server jar, so patched client classes legitimately ship)."
          B=srv-create/libraries/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-server.jar
          python3 - "$B" <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile(sys.argv[1])
          classes = [n for n in z.namelist() if n.endswith(".class")]
          client = [n for n in classes if n.startswith("net/minecraft/client/")]
          print("delta classes total:", len(classes))
          print("delta net/minecraft/client/** classes:", len(client))
          for probe in ["client/gui/screens/Screen", "client/resources/model/BakedModel",
                        "client/gui/components/Renderable", "client/renderer/RenderType",
                        "client/multiplayer/ClientLevel"]:
              hit = sum(1 for n in classes if probe in n)
              print("delta", probe, "->", hit)
          PY

      - name: upload create truth census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-truth-census
          path: |
            srv-create/c-imagine/scenes/scene-manifest.tsv
            srv-create/c-imagine/scenes/scene-manifest-entries.tsv
            srv-create/c-imagine/scenes/gallery-create-*.tsv
          if-no-files-found: ignore

      - name: upload create truth boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-truth-bootlog
          path: srv-create/boot.log
          if-no-files-found: ignore

  create-layer:
    name: P0 Create — layer leg (shadow-space harness census)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4

      - name: build rust (release)
        run: cargo build --release --quiet

      - name: build java bootstrap
        run: bash scripts/build-bootstrap.sh

      - name: build cimtest + cimscene
        run: |
          gradle build --no-daemon -p test-mods
          gradle build --no-daemon -p scene-mod

      - name: restore NeoForge 1.21.1 layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer1211
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 1.21.1 layer (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-installer.jar --installServer layer1211

      - name: fetch P0 Create (Modrinth ladder fetch)
        run: bash scripts/cimscene/fetch-ladder.sh mods-create create

      - name: assemble mods dir
        run: |
          mkdir -p mods
          cp mods-create/*.jar mods/
          cp test-mods/build/libs/cimtest-1.0.0.jar mods/
          cp scene-mod/build/libs/cimscene-1.0.0.jar mods/

      - name: run shadow-space harness with Create
        env:
          CIM_DUMP_RELOC: '1'
        run: bash scripts/run-m2-harness.sh layer1211/libraries mods out-create


      - name: assert create layer markers + census
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          L=out-create/harness.log
          grep -q "mod execution ok" $L || { tail -60 $L; fail "layer mod execution FAILED with Create"; }
          grep -q "\[c-imagine\] mod create: constructed" $L || fail "create not constructed in the layer"
          grep -q "\[cimscene\] census written scene-manifest.tsv" $L || fail "census missing in the layer (Create leg)"
          test -f out-create/c-imagine/scenes/scene-manifest.tsv || fail "census file missing"
          grep -q "probe: BakedModel NOT loadable" $L || fail "delta client class BakedModel served by the layer — the real dist checker rejects it (measured: invalid dist DEDICATED_SERVER)"
          grep -q "probe: Renderable NOT loadable" $L || fail "unpatched client class Renderable resolved in the layer (must stay absent, as on the real server)"
          grep -q "invalid dist DEDICATED_SERVER" $L || fail "layer missing the real server's invalid-dist rejection contract"
          grep -q "dist-strip: " $L || fail "@OnlyIn(CLIENT) member strip did not fire — the real pipeline strips them before verification"
          grep -q "mixin gate: activated" $L || fail "mixin gate did not activate (harness contract §8 — sponge-mixin in the shadow space)"
          grep -q "probe: BlockBehaviour accessor APPLIED" $L || fail "accessor mixin not applied to BlockBehaviour (§8 acceptance — the LeverBlock→BlockBehaviourAccessor cast contract, run b0960b9)"
          cat out-create/c-imagine/scenes/scene-manifest.tsv

      - name: autopsy relocated-class dumps (on failure)
        if: failure()
        run: |
          D=/tmp/cim-dump
          test -d "$D" || { echo "no relocated-class dumps"; exit 0; }
          echo "dumped classes: $(ls "$D" | wc -l)"
          echo "=== dumps carrying net/minecraft/client refs ==="
          for f in "$D"/*.class; do
            if grep -q "net/minecraft/client/" "$f" 2>/dev/null; then
              echo "--- $f"
              grep -oaE "net/minecraft/client/[a-zA-Z0-9/_$]*" "$f" | sort -u | head -8
            fi
          done | head -80

      - name: upload create layer census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-layer-census
          path: |
            out-create/c-imagine/scenes/scene-manifest.tsv
            out-create/c-imagine/scenes/scene-manifest-entries.tsv
          if-no-files-found: ignore

      - name: upload create layer harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-layer-harness-log
          path: out-create/harness.log
          if-no-files-found: ignore

  create-census-diff:
    name: P0 Create — census parity (layer vs real NeoForge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [create-truth, create-layer]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: create-truth-census
          path: truth

      - uses: actions/download-artifact@v4
        with:
          name: create-layer-census
          path: layer

      - name: diff the registries (Create registration parity)
        run: |
          T=$(find truth -name scene-manifest.tsv | head -1)
          L=$(find layer -name scene-manifest.tsv | head -1)
          TE=$(find truth -name scene-manifest-entries.tsv | head -1)
          LE=$(find layer -name scene-manifest-entries.tsv | head -1)
          test -n "$T" || { echo "truth census missing"; exit 1; }
          test -n "$L" || { echo "layer census missing"; exit 1; }
          echo "truth=$T layer=$L"
          # counts first; when both entry listings exist, the join goes to
          # EXACT set equality per registry (counts can match, sets can't lie)
          if test -n "$TE" && test -n "$LE"; then
            python3 scripts/cimscene/census-diff.py "$T" "$L" "$TE" "$LE" | tee create-census-diff.txt
          else
            echo "(entry listings missing — counts-only diff)"
            python3 scripts/cimscene/census-diff.py "$T" "$L" | tee create-census-diff.txt
          fi
          grep -q "CENSUS PARITY: GREEN" create-census-diff.txt || {
            echo "Create registration parity RED — rows above are the fix backlog"
            exit 1
          }

      - name: upload create census diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-census-diff-report
          path: create-census-diff.txt
          if-no-files-found: ignore
