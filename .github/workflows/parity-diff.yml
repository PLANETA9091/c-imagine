name: parity-diff

# The F2F owner directive crown proof: modded content must render on the
# stock vanilla client IDENTICALLY to the modded client. Job 1 boots a REAL
# NeoForge 21.1.265 server + the REAL NeoForge 1.21.1 client (cimtest
# installed) under xvfb and captures the ground-truth screenshots; job 2
# pixel-diffs them against the c-imagine visual run's shots (hotbar slot-0
# icon crop — the same model, the same vanilla GUI math on both sides).
#
# Inputs: visual_run_id — the visual.yml run whose visual-contract-evidence
# artifact carries the c-imagine side shots. Since the visual.yml re-arm
# (feat/parity-modern, 2026-11-05) that artifact ALSO carries the seed v2
# ladder surfaces (gal-item/gal-held/gal-inv shots per LADDER_NS + the
# ordered sound replay logs + the item manifests + visual-sounds.tsv);
# when they are present this workflow measures the per-channel identity
# beyond the calibrated cimtest datums.
#
# Actions policy (owner directive): dispatch-only, budget is scarce — one
# dispatch = one measured identity datum per channel.

on:
  workflow_dispatch:
    inputs:
      visual_run_id:
        description: "visual.yml run id with visual-contract-evidence"
        required: true
        type: string

env:
  # THE LADDER mirror (gallery.yml is the single source of these lists —
  # keep the two in sync when the ladder grows)
  LADDER_SLUGS: "create biomes-o-plenty glitchcore terrablender dynamictrees combat-roll playeranimator cloth-config"
  LADDER_NS: "create biomesoplenty dynamictrees combat_roll"

jobs:
  modded-truth:
    name: ground truth — real NeoForge 1.21.1 client + cimtest under xvfb
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # cimscene rides the truth side since the ladder re-arm: the SOUND
      # walk's packet-capture mixin (SoundPacketCaptureMixin) IS the
      # SoundCapture window, and the item walk writes the manifests the
      # ladder give legs read. The calibrated cimtest legs are unchanged.
      - name: build cimtest + cimscene mods (NeoForge 1.21.1)
        run: |
          gradle build --no-daemon -p test-mods
          gradle build --no-daemon -p scene-mod
          test -f test-mods/build/libs/cimtest-1.0.0.jar
          test -f scene-mod/build/libs/cimscene-1.0.0.jar

      # THE LADDER JARS (locked, scripts/cimscene/mods.lock — the same pins
      # the gallery seed walked): the truth client renders the REAL modded
      # items and the registries carry the modded sound events the sound
      # walk plays. Both sides of the parity pair ride the SAME locked
      # versions, so the sorted-registry walks pair row-for-row.
      - name: fetch ladder mods (locked)
        run: bash scripts/cimscene/fetch-ladder.sh mods-ladder $LADDER_SLUGS

      # --- caches: installer output (~130 MB) + vanilla assets (~830 MB) ---
      - name: restore NeoForge client install (cache)
        id: nfc-cache
        uses: actions/cache@v4
        with:
          path: nfc
          key: neoforge-client-21.1.265

      - name: restore vanilla 1.21.1 assets + libs (cache)
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: |
            truth-client/assets
            truth-client/libraries
          key: truth-assets-17

      - name: fetch + assemble the NeoForge client runtime
        run: |
          python3 scripts/truth/fetch-truth-client.py nfc truth-client \
            --assets ${{ steps.nfc-cache.outputs.cache-hit == 'true' && '--skip-installer' || '' }}
          wc -c truth-client/classpath.txt truth-client/launch.txt
          # heap: the manifest launch line carries no -Xmx (launchers add it)
          sed -i 's/^java /java -Xmx2G /' truth-client/launch.txt

      # --- the real NeoForge server (ground truth world) ---
      - name: restore NeoForge server layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer-srv
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 21.1.265 server (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-srv-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-srv-installer.jar --installServer layer-srv

      - name: prepare server directory (isolated copy)
        run: |
          cp -r layer-srv srv-truth
          mkdir -p srv-truth/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv-truth/mods/
          cp scene-mod/build/libs/cimscene-1.0.0.jar srv-truth/mods/
          cp mods-ladder/*.jar srv-truth/mods/
          echo "eula=true" > srv-truth/eula.txt
          cat > srv-truth/server.properties <<'PROPS'
          online-mode=false
          # SAME seed/level-type as the c-imagine visual run — the superflat
          # scenes must be comparable pixel-to-pixel
          difficulty=peaceful
          level-type=minecraft:flat
          level-seed=42
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          max-players=5
          PROPS

      - name: boot real NeoForge server (console FIFO)
        run: |
          set -euo pipefail
          cd srv-truth
          mkfifo console.in
          tail -f console.in | ./run.sh > boot.log 2>&1 &
          cd ..
          for i in $(seq 1 150); do
            grep -q "Done (" srv-truth/boot.log 2>/dev/null && break
            sleep 2
          done
          grep -q "Done (" srv-truth/boot.log || { tail -40 srv-truth/boot.log; exit 1; }
          grep -q "\[cimtest\] common setup ok" srv-truth/boot.log \
            || { tail -40 srv-truth/boot.log; exit 1; }
          # pin the daylight so both sides' sky matches the c-imagine shots;
          # weather OFF too — camera-lock-26-3.md: rain/sky drift between the
          # parity sides is poison for the pixel identity measurements
          echo "gamerule doDaylightCycle false" > srv-truth/console.in
          echo "time set noon" > srv-truth/console.in
          echo "gamerule doWeatherCycle false" > srv-truth/console.in
          echo "weather clear" > srv-truth/console.in
          # camera-lock: NO ambient mobs (mirror of visual.yml — a wandering
          # peaceful mob would pollute the locked pre/shot pair)
          echo "gamerule doMobSpawning false" > srv-truth/console.in
          echo "server up"

      # --- the modded client under xvfb ---
      - name: NeoForge client joins under xvfb + truth shots
        run: |
          set -euo pipefail
          javac -d vtools scripts/visual/Shot.java scripts/visual/PixelDiff.java scripts/visual/PixelDiffTol.java scripts/visual/Key.java
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri mesa-vulkan-drivers libglx-mesa0
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          XVFB_PID=$!
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          # join pre-conditions (the 26.3 harness lessons apply verbatim):
          # no first-run onboarding + a seeded servers.dat + THE MOD: the
          # client-side mod discovery reads gameDir/mods (run 2 lesson).
          # SERVERS.DAT FORMAT (run 3 autopsy measured): 1.21.1 ServerList.load
          # calls NbtIo.read(Path) — the UNCOMPRESSED format (same as 26.3; the
          # earlier --gzip note was wrong — the stack proves it: readFully/readUTF
          # EOF on the gzip magic). Seed RAW NBT.
          mkdir -p truth-client/game/mods
          echo "onboardAccessibility:false" > truth-client/game/options.txt
          python3 scripts/visual/make_servers_dat.py truth-client/game
          cp test-mods/build/libs/cimtest-1.0.0.jar truth-client/game/mods/
          cp scene-mod/build/libs/cimscene-1.0.0.jar truth-client/game/mods/
          cp mods-ladder/*.jar truth-client/game/mods/
          ls -la truth-client/game/mods/
          ( cd truth-client && bash -c "$(cat launch.txt)" > client.out 2>&1 ) &
          CLIENT_PID=$!
          JOINED=0
          for i in $(seq 1 240); do
            # JOIN MARKER (run 3 autopsy): the 1.21.1 client does NOT log the
            # [CHAT] join line reliably (system chat raced the GUI init — the
            # server log proves the join happened), but BOTH of these are
            # solid: the server's "logged in with entity id" line and the
            # client's advancement-load line (play-phase packet processing).
            if grep -q "logged in with entity id" srv-truth/boot.log 2>/dev/null \
               && grep -q "Loaded .* advancements" truth-client/client.out 2>/dev/null; then JOINED=1; break; fi
            if [ "$((i % 30))" = "0" ]; then
              echo "--- [wait $i] client.out tail ---"
              tail -8 truth-client/client.out || true
            fi
            sleep 3
          done
          if [ "$JOINED" != "1" ]; then
            echo "--- client.out tail ---"; tail -60 truth-client/client.out || true
            java -cp vtools Shot shots/t99-stall.png || true
            exit 1
          fi
          # let the chunks stream in under llvmpipe (the run 3 stall shot
          # proved the world RENDERS — the HUD was alive at +90s)
          sleep 45
          # TIER-1 NET ROUND TRIP (cimtest-net — the same jar rides both
          # sides): the client joined, the server responded S2C (hello on
          # cimtest_net:hello), the CLIENT MOD echoed it back C2S
          # (cimtest_net:echo) and the server logged the receipt — the FULL
          # payload round trip through the net pipeline. Token equality
          # (4242) is the expect/actual pair proof.
          grep -q "\[cimtest-net\] s2c hello sent player=cimviewer token=4242" srv-truth/boot.log \
            || { echo "cimtest-net s2c hello never sent (S2C send leg broken)"; tail -30 srv-truth/boot.log; exit 1; }
          grep -q "\[cimtest-net\] s2c hello received token=4242 (client echo follows)" truth-client/client.out \
            || { echo "cimtest-net hello never reached the client (S2C inbound leg broken)"; tail -40 truth-client/client.out; exit 1; }
          grep -q "\[cimtest-net\] c2s echo received player=cimviewer token=4242 (round-trip ok)" srv-truth/boot.log \
            || { echo "cimtest-net echo never returned (C2S leg broken — round trip open)"; tail -30 srv-truth/boot.log; exit 1; }
          # Tier-1 cap leg rides the same boot: capability registration +
          # round trip fired at load-complete on the real server
          grep -q "\[cimtest-cap\] capabilities registered (item=cimtest:test_block cap=energy)" srv-truth/boot.log \
            || { echo "cimtest-cap capability registration missing"; tail -30 srv-truth/boot.log; exit 1; }
          grep -q "\[cimtest-cap\] capability round-trip ok (cap=energy item=cimtest:test_block set=42 got=42)" srv-truth/boot.log \
            || { echo "cimtest-cap capability round-trip missing"; tail -30 srv-truth/boot.log; exit 1; }
          echo "cimtest-net round trip closed (hello -> client -> echo -> receipt, token=4242)"
          # pin the client-side daylight too (the client renders its own sky)
          java -cp vtools Shot shots/t00-baseline.png
          # hotbar item ground truth: the REAL modded BlockItem in slot 0
          echo "clear cimviewer" > srv-truth/console.in
          sleep 2
          echo "give cimviewer cimtest:test_block 1" > srv-truth/console.in
          sleep 5
          java -cp vtools Shot shots/t01-item.png
          # in-world block ground truth: the REAL modded block 3 ahead of the
          # viewer (feet level — the same placement the c-imagine leg does)
          echo "execute at cimviewer run setblock ^ ^ ^3 cimtest:test_block" > srv-truth/console.in
          sleep 5
          java -cp vtools Shot shots/t02-block.png
          # CAMERA-LOCK BLOCK IDENTITY (the EXACT mirror of visual.yml's
          # 13/14 leg — docs/runtime-analysis/camera-lock-26-3.md). MEASURED
          # lessons baked in (runs 45/46): VANILLA pitch sign is +DOWN;
          # Paper randomizes the join spawn per run — sweep fill covers the
          # whole spawn radius; console `execute ...` can be silent — PLAIN
          # + ABSOLUTE commands only (both stacks).
          echo "kill @e[type=!player]" > srv-truth/console.in
          sleep 2
          echo "tp cimviewer 0.5 -60 0.5 0 30" > srv-truth/console.in
          sleep 2
          echo "fill -12 -60 -12 12 -50 16 air" > srv-truth/console.in
          sleep 2
          java -cp vtools Key F1
          sleep 1
          java -cp vtools Shot shots/t03-locked-pre.png
          echo "setblock 0 -60 3 cimtest:test_block" > srv-truth/console.in
          sleep 5   # block/light/section rebuild (camera NOT touched)
          java -cp vtools Shot shots/t04-block-locked.png
          java -cp vtools Key F1
          # console-feedback gate (mirror of visual.yml): the truth block
          # MUST have been placed — a silent setblock would make the diff
          # job's identity datum meaningless
          grep -q "Changed the block at 0, -60, 3" srv-truth/boot.log \
            || { echo "truth setblock feedback MISSING — block never placed"; tail -20 srv-truth/boot.log; exit 1; }
          # --------------------------------------------------------------
          # LADDER PARITY LEGS (seed v2 re-arm, 2026-11-05): the REAL
          # modded client renders the REAL registry — page 0 per ladder
          # namespace, the mirror of the visual.yml ladder legs:
          #   t-item-<ns>.png   hotbar slot-0 with the REAL modded item
          #                     (the identity pair of gal-item-<ns>.png)
          #   t-held-<ns>.png   first-person held (pairs gal-held-<ns>.png)
          #   gallery-sound-<ns>-p0.log  the ordered stream the sound-
          #                     capture mixin recorded while the cimscene
          #                     sound walk played every registered
          #                     SoundEvent of the ns in sorted order
          #                     (pairs the ours replay log; sound-diff.py
          #                     joins the two streams per page)
          # No artifact pairing is ASSUMED: this side re-walks page 0
          # itself over the SAME locked jars (mods.lock) — the diff job
          # guards the pairing by comparing the two sides' manifests'
          # first rows. Camera pinned to the gallery held-class convention
          # (0.5 -60 0.5 yaw 0 pitch 0), HUD on, first person — the state
          # the locked leg above left the client in.
          mkdir -p srv-truth/c-imagine/scenes
          for NS in $LADDER_NS; do
            echo "=== truth ladder leg: $NS ==="
            # the item walk writes the manifest the give leg reads
            echo "cimscene gallery item $NS 0" > srv-truth/console.in
            ITEM_STATUS=$(bash scripts/cimscene/wait-scene-marker.sh \
              "srv-truth/c-imagine/scenes/gallery-item-$NS-p0" 240) \
              || { echo "[ladder] $NS: the item walk did not complete"; tail -20 srv-truth/boot.log; exit 1; }
            FIRST=""
            if [ "$ITEM_STATUS" = "done" ]; then
              FIRST=$(awk -F'\t' '$1=="cell" && $2 ~ /^-?[0-9]+$/{print $5; exit}' \
                "srv-truth/c-imagine/scenes/gallery-item-$NS-p0.tsv")
            fi
            if [ -z "$FIRST" ]; then
              echo "[ladder] $NS: no item rows on manifest page 0 (registry empty for the class — combat_roll case) — item/held legs skipped, honest absence"
            else
              echo "[ladder] $NS: first item row = $FIRST"
              echo "clear cimviewer" > srv-truth/console.in
              sleep 2
              echo "tp cimviewer 0.5 -60 0.5 0 0" > srv-truth/console.in
              sleep 2
              echo "give cimviewer $FIRST 1" > srv-truth/console.in
              sleep 4
              java -cp vtools Shot "shots/t-item-$NS.png"
              java -cp vtools Key 1
              sleep 1
              java -cp vtools Shot "shots/t-held-$NS.png"
            fi
            # THE SOUNDCAPTURE WINDOW: `cimscene gallery sound` arms the
            # packet-capture mixin before the first play and disarms after
            # the last (the window holds exactly this page's outgoing
            # ClientboundSound* packets) — the log IS the ordered stream.
            echo "cimscene gallery sound $NS 0" > srv-truth/console.in
            for i in $(seq 1 240); do
              [ -f "srv-truth/c-imagine/scenes/gallery-sound-$NS-p0.done" ] && break
              sleep 1
            done
            [ -f "srv-truth/c-imagine/scenes/gallery-sound-$NS-p0.done" ] \
              || { echo "[ladder] $NS: the sound walk never wrote its done marker"; tail -20 srv-truth/boot.log; exit 1; }
            [ -f "srv-truth/c-imagine/scenes/gallery-sound-$NS-p0.log" ] \
              || { echo "[ladder] $NS: the sound capture log is missing (the capture window never fired)"; exit 1; }
            echo "[ladder] $NS: sound stream events = $(wc -l < "srv-truth/c-imagine/scenes/gallery-sound-$NS-p0.log")"
          done
          kill $CLIENT_PID $XVFB_PID 2>/dev/null || true
          ls -la shots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truth-shots
          path: |
            shots/
            srv-truth/boot.log
            truth-client/client.out
            truth-client/launch.txt
            truth-client/summary.json
            # the ladder legs' manifests + capture logs (the diff job's
            # pairing guard reads the item manifests; sound-diff.py joins
            # the capture logs against the ours replay logs)
            srv-truth/c-imagine/scenes/
          if-no-files-found: warn

  # --- the identity diff ------------------------------------------------------
  # Hotbar slot-0 icon crop (scale-3 GUI at 1280x720, measured vanilla math):
  # slot cell = (scaledW/2 - 91 + 3) GUI, icon 16x16 at +0..16 → pixels
  # (375, 663) size 48x48. The modded client renders cimtest:test_block's
  # item model there; the c-imagine client renders the pack's range_dispatch
  # to the SAME copied model — identical intent.
  parity-diff:
    name: pixel identity — modded client vs c-imagine stock client
    needs: modded-truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: download truth shots (this run)
        uses: actions/download-artifact@v4
        with:
          name: truth-shots
          path: truth

      - name: download c-imagine visual shots (run ${{ inputs.visual_run_id }})
        uses: actions/download-artifact@v4
        with:
          name: visual-contract-evidence
          path: cim
          run-id: ${{ inputs.visual_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: crop + diff (identity measurements)
        run: |
          set -euo pipefail
          javac -d vtools scripts/visual/PixelDiff.java scripts/visual/PixelDiffTol.java scripts/visual/PixelDiffNorm.java
          # sanity: both sides must actually show the item in slot 0
          AE_truth=$(java -cp vtools PixelDiff truth/shots/t00-baseline.png truth/shots/t01-item.png 375 663 48 48)
          AE_cim=$(java -cp vtools PixelDiff cim/shots/00-baseline.png cim/shots/02-cmd-paper.png 375 663 48 48)
          echo "AE(icon: truth baseline vs item) = $AE_truth"
          echo "AE(icon: cim baseline vs item)   = $AE_cim"
          [ "$AE_truth" -gt "500" ] || { echo "the item never appeared in the truth hotbar"; exit 1; }
          [ "$AE_cim" -gt "500" ] || { echo "the item never appeared in the c-imagine hotbar"; exit 1; }
          # THE identity datum: the same modded item model through the two
          # stacks — measured, then gated (first dispatch reports; the gate
          # tightens to the measured value)
          AE_ident=$(java -cp vtools PixelDiff truth/shots/t01-item.png cim/shots/02-cmd-paper.png 375 663 48 48)
          echo "AE(icon identity: truth vs c-imagine) = $AE_ident  <-- THE F2F DATUM"
          # in-world block region (measured geometry: block 3 ahead, feet
          # level, pitch-0 camera): generous rect around the cube face —
          # REPORT for now, the gate locks after the first measurement
          AE_block=$(java -cp vtools PixelDiff truth/shots/t02-block.png cim/shots/10-block.png 500 460 280 220)
          echo "AE(block region: truth vs c-imagine) = $AE_block  <-- measurement (ungated)"
          # CAMERA-LOCK legs (the real identity rig — camera-lock-26-3.md):
          # CUBE-ONLY region (545,170,190,115 — the projected cube, measured
          # run 47; floor outside it carries the cross-version grass/lightmap
          # drift) + PixelDiffTol tolerance 4 (the ±2/255 lightmap drift
          # between the 1.21.1 and 26.3 clients; the exact-match AE would
          # otherwise count EVERY pixel differing — measured run 5: 114990
          # on a VISUALLY identical frame). Both sides must show the block
          # appearing on the SAME locked camera (appearance gates), then THE
          # BLOCK IDENTITY DATUM: the truth client's REAL modded block vs
          # the c-imagine stock client's pack-rendered stand-in — same
          # camera, same cell, same sun, same TEXTURE (the mod carries its
          # own — the 26.3 vanilla iron_block.png was redrawn, SHA differs),
          # F1 (no HUD) on both sides.
          AE_truth_locked=$(java -cp vtools PixelDiffTol truth/shots/t03-locked-pre.png truth/shots/t04-block-locked.png 545 170 190 115 4)
          AE_cim_locked=$(java -cp vtools PixelDiffTol cim/shots/13-locked-pre.png cim/shots/14-locked.png 545 170 190 115 4)
          echo "AE(block appearance: truth locked) = $AE_truth_locked (tol 4, cube-only)"
          echo "AE(block appearance: c-imagine locked) = $AE_cim_locked (tol 4, cube-only)"
          [ "$AE_truth_locked" -gt "3000" ] || { echo "truth locked block did not appear (camera-lock leg broken)"; exit 1; }
          [ "$AE_cim_locked" -gt "3000" ] || { echo "c-imagine locked block did not appear (camera-lock leg broken)"; exit 1; }
          # THE BLOCK IDENTITY DATUM: luminance-NORMALIZED (PixelDiffNorm —
          # the 26.3 client renders block faces a constant ~1.0703x brighter,
          # measured across runs 5-7; same texture pixels, same face ratios,
          # same edges) — the datum is "structurally identical at tol 4".
          read AE_block_ident BLOCK_LUM_RATIO <<< "$(java -cp vtools PixelDiffNorm truth/shots/t04-block-locked.png cim/shots/14-locked.png 545 170 190 115 4)"
          echo "AE(block identity: truth vs c-imagine) = $AE_block_ident (luminance ratio $BLOCK_LUM_RATIO)  <-- THE BLOCK IDENTITY DATUM (normalized, tol 4, cube-only)"
          # GATE LOCKED (runs 5-9 calibration: 1531 reproduced locally AND in
          # CI on identical artifacts; appearance 20802==20802 across three
          # runs): the stock 26.3 client must render the modded block
          # structurally identical to the modded 1.21.1 client at the
          # documented 0.9343 luminance factor — 2500 is ~7.5% of the region
          # (the measured stable value is 1531 = 7.0%)
          [ "$AE_block_ident" -le "2500" ] || { echo "BLOCK IDENTITY GATE FAILED: $AE_block_ident > 2500 — the stock client no longer renders the modded block identically"; exit 1; }
          echo "F2F parity diff: identity datum recorded"
          # --------------------------------------------------------------
          # PER-CHANNEL LADDER IDENTITY (seed v2 re-arm, 2026-11-05) —
          # measured, REPORT-FIRST per the repo's calibration discipline
          # (a gate locks to the measured value + tolerance in a later
          # dispatch, never before). The calibrated cimtest datums above
          # are untouched. Paths: the visual artifact (since the visual.yml
          # re-arm) carries the seed v2 surfaces under cim/srv/...; the
          # truth artifact carries this run's re-walked manifests + the
          # SoundCapture logs under truth/srv-truth/...
          SC="cim/srv/c-imagine/scenes"
          TC="truth/srv-truth/c-imagine/scenes"
          SMAP="cim/srv/c-imagine/f2v/visual-sounds.tsv"
          pip install -q pillow numpy   # framediff.py (the held full-frame join)
          mkdir -p parity-identity
          if [ ! -d "$SC" ] || [ ! -d "$TC" ]; then
            echo "LADDER IDENTITY: a side carries no ladder surfaces (a pre-re-arm visual run) — the per-channel identity legs are SKIPPED, named not silent"
          else
            for NS in $LADDER_NS; do
              echo "=== ladder identity: $NS ==="
              TI="truth/shots/t-item-$NS.png"; TH="truth/shots/t-held-$NS.png"
              CI="cim/shots/gal-item-$NS.png"; CH="cim/shots/gal-held-$NS.png"
              if [ ! -f "$TI" ] || [ ! -f "$CI" ]; then
                echo "[ladder] $NS: the item leg is absent on a side (honest absence: a registry-empty ns or a skipped leg) — SKIPPED, named"
                continue
              fi
              # PAIRING GUARD: both sides must have walked the SAME manifest
              # row — the two dispatches must ride the same locked inputs
              # (mods.lock); a mismatch would make every datum garbage.
              TF=$(awk -F'\t' '$1=="cell" && $2 ~ /^-?[0-9]+$/{print $5; exit}' "$TC/gallery-item-$NS-p0.tsv")
              CF=$(awk -F'\t' '$1=="cell" && $2 ~ /^-?[0-9]+$/{print $5; exit}' "$SC/gallery-item-$NS-p0.tsv")
              if [ -z "$TF" ] || [ "$TF" != "$CF" ]; then
                echo "LADDER ITEM DESYNC ($NS): truth first row '$TF' != c-imagine first row '$CF' — the two dispatches rode different inputs"
                exit 1
              fi
              echo "[ladder] $NS: paired item row = $TF"
              # appearance sanity (the item must be IN the slot-0 crop on
              # both sides — the same contract the cimtest icon sanity uses)
              AE_ti=$(java -cp vtools PixelDiff truth/shots/t00-baseline.png "$TI" 375 663 48 48)
              AE_ci=$(java -cp vtools PixelDiff cim/shots/00-baseline.png "$CI" 375 663 48 48)
              echo "AE(icon appearance: truth)=$AE_ti AE(icon appearance: c-imagine)=$AE_ci"
              [ "$AE_ti" -gt "500" ] || { echo "[ladder] $NS: the real modded item never appeared in the truth hotbar"; exit 1; }
              [ "$AE_ci" -gt "500" ] || { echo "[ladder] $NS: the pack carrier never appeared in the c-imagine hotbar"; exit 1; }
              # THE ITEM IDENTITY datum (ungated REPORT — the GUI crop path,
              # the same math the cimtest icon datum measured at 2300/2304;
              # each ns item locks its own gate after its first dispatch)
              AE_ii=$(java -cp vtools PixelDiff "$TI" "$CI" 375 663 48 48)
              echo "AE(item identity $NS: truth vs c-imagine) = $AE_ii  <-- LADDER ITEM IDENTITY DATUM (ungated report)"
              # HELD first-person identity: the gallery held class' full-frame
              # framediff join (EMPTY names a dead side, CONTENT measures the
              # divergence; DIAGNOSTIC-ONLY per the flip law — no gate here)
              if [ -f "$TH" ] && [ -f "$CH" ]; then
                python3 scripts/cimscene/framediff.py --truth "$TH" --ours "$CH" \
                  --ns "$NS" --page 0 --class-name held \
                  --out "parity-identity/held-$NS.json" || true
              else
                echo "[ladder] $NS: the held shot is missing on a side — held identity SKIPPED, named"
              fi
              # SOUND ordered-stream identity: sound-diff.py joins the truth
              # capture (the packet-capture mixin's window) against the ours
              # replay log (the post-rewrite ids the vanilla client received);
              # --map previews the RESOLVED comparison (the future flipped
              # verdict's shape). DIAGNOSTIC (|| true) per the flip law until
              # the channel is measured stable.
              if [ -f "$TC/gallery-sound-$NS-p0.log" ] && [ -f "$SC/gallery-sound-$NS-p0.log" ]; then
                python3 scripts/cimscene/sound-diff.py \
                  --truth "$TC/gallery-sound-$NS-p0.log" \
                  --ours "$SC/gallery-sound-$NS-p0.log" \
                  --ns "$NS" --page 0 --map "$SMAP" \
                  --out "parity-identity/sound-$NS.json" || true
              else
                echo "[ladder] $NS: a sound capture log is missing — the sound identity is SKIPPED, named"
              fi
            done
            echo "F2F parity diff: ladder identity measured (item crops reported, held/sound joins diagnostic — the flip law applies)"
          fi

      - name: upload the ladder identity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-identity
          path: parity-identity/
          if-no-files-found: warn
