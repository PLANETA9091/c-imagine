name: profiling

# Performance law enforcement (docs/ARCHITECTURE.md §4.6):
#  - criterion benchmarks with cached baselines (>=10% regression fails)
#  - bare Paper vs Paper+c-imagine boot time + RSS budget gate
on:
  workflow_dispatch: # economy mode (owner directive 2026-10-26): no nightly cron

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: criterion benches (+ baseline cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: restore baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: baseline
          key: criterion-baseline-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            criterion-baseline-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
      - name: validate gate contracts
        run: |
          python3 scripts/perf/test-criterion-gate.py
          python3 scripts/perf/test-boot-budget.py
          python3 scripts/perf/test-tick-budget.py
      - name: measure baseline source on this runner
        run: |
          set -euo pipefail
          if [ -n '${{ steps.baseline.outputs.cache-matched-key }}' ]; then
            cp -a baseline baseline-cached
            baseline_source=$(python3 - <<'PYBASE'
          import json, re
          from pathlib import Path
          source = json.loads(Path('baseline/provenance.json').read_text())['source_sha']
          if not isinstance(source, str) or not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('cached baseline has no valid source commit')
          print(source)
          PYBASE
            )
          else
            baseline_source=$(git rev-parse HEAD^)
          fi
          # Retain the last passing source anchor, including on a cache hit.
          # Cached timings from another VM/toolchain are not comparable.
          if ! git cat-file -e "${baseline_source}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$baseline_source"
          fi
          git worktree add --detach baseline-source "$baseline_source"
          rm -rf target/criterion target/criterion-baseline-a target/criterion-baseline-b
          CARGO_TARGET_DIR="$PWD/target" cargo bench --workspace --manifest-path baseline-source/Cargo.toml
          mv target/criterion target/criterion-baseline-a
          CARGO_TARGET_DIR="$PWD/target" cargo bench --workspace --manifest-path baseline-source/Cargo.toml
          mv target/criterion target/criterion-baseline-b
          python3 scripts/perf/criterion-gate.py snapshot --current target/criterion-baseline-a --current target/criterion-baseline-b --baseline baseline --source-sha "$baseline_source"
      - name: run benches (two legs — the min median is the measurement, one slow leg is interference noise)
        run: |
          rm -rf target/criterion target/criterion-a target/criterion-b
          cargo bench --workspace
          mv target/criterion target/criterion-a
          cargo bench --workspace
          mv target/criterion target/criterion-b
      - name: compare against baseline (fail on >10% regression)
        run: |
          set -o pipefail
          cp -a baseline baseline-before
          python3 scripts/perf/criterion-gate.py compare --baseline baseline --current target/criterion-a --current target/criterion-b --source-sha "$GITHUB_SHA" --report criterion-deltas.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: snapshot passing measurements
        run: python3 scripts/perf/criterion-gate.py snapshot --current target/criterion-a --current target/criterion-b --baseline baseline --source-sha "$GITHUB_SHA"
      - name: save new baseline
        uses: actions/cache/save@v4
        with:
          path: baseline
          key: criterion-baseline-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-report
          path: |
            target/criterion-a
            target/criterion-b
            baseline
            baseline-before
            baseline-cached
            target/criterion-baseline-a
            target/criterion-baseline-b
            criterion-deltas.json
          if-no-files-found: error

  budget:
    name: bare vs c-imagine boot + RSS budget
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: build artifacts
        run: |
          bash scripts/build-bootstrap.sh
          CIM_BOOTSTRAP_JAR="$PWD/java/cim-bootstrap/build/cim-bootstrap.jar" \
            bash scripts/package-module.sh
          # THE TICK-LOAD PROBE needs the cimtest multi-mod jar (the
          # mod, cimtest_heavy, rides it) staged into the modded boot mods
          # dir — without it the layer reports "no jars in mods", the FML
          # seed skips, and the selfarm marker has nothing to arm
          JAVA_HOME="$JAVA_HOME_21_X64" gradle build --no-daemon -p test-mods
          PV=$(bash scripts/resolve-paper-version.sh 26.3)
          mvn -B -ntp -f paper-plugin/pom.xml -Dpaper.version="$PV" package


      - name: scaffold Paper 26.3 (shared template)
        run: |
          npm i -g crussty
          crussty init --platform paper --version 26.3 --dir tmpl
          echo "eula=true" > tmpl/eula.txt
          cat > tmpl/server.properties <<'PROPS'
          online-mode=false
          level-type=minecraft:flat
          view-distance=4
          simulation-distance=4
          max-players=5
          PROPS

      - name: restore NeoForge runtime (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer1211
          key: neoforge-layer-21.1.265

      - name: install NeoForge runtime (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -fLsS --max-time 300 -o nf-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          "$JAVA_HOME_21_X64/bin/java" -jar nf-installer.jar --installServer layer1211

      - name: boot A — bare Paper (x3, the median is the datum)
        run: |
          # The single-sample ratio measured unstable (0.879 green on
          # #e943e2e -> 1.284 red on #dfe859bf): bare Paper swung 13.840s ->
          # 11.295s (a 22% swing the c-imagine merge cannot touch), so the
          # modded/bare ratio crossed the 1.25 limit on runner noise alone.
          # The limits did NOT move; the measurement got honest: 3 boots per
          # leg, the gate compares MEDIANS (scripts/perf/boot-budget.py).
          for i in 1 2 3; do
            cp -r tmpl bare-$i && cd bare-$i
            set +e
            ( while true; do ps -o rss= -C java >> rss.log 2>/dev/null || true; sleep 2; done ) &
            sampler=$!
            # Keep the original 360-second RSS window. Diagnostics happen
            # only after the sampler stops, so inspection cannot improve or
            # inflate the budget's measurements. This is a diagnostic branch.
            timeout 430 crussty run > boot.log 2>&1 &
            boot_runner=$!
            sleep 360
            kill "$sampler" 2>/dev/null || true
            wait "$sampler" 2>/dev/null || true
            boot_java_pid=""
            for java_pid in $(ps -o pid= -C java); do
              if grep -zFq "$PWD/versions/paper-26.3.jar" "/proc/$java_pid/cmdline" 2>/dev/null; then
                boot_java_pid="$java_pid"
                cat "/proc/$java_pid/smaps_rollup" > smaps-rollup.log
                timeout 20 "$JAVA_HOME_25_X64/bin/jcmd" "$java_pid" GC.heap_info > heap-info.log 2>&1
                timeout 20 "$JAVA_HOME_25_X64/bin/jcmd" "$java_pid" GC.class_histogram -all > heap-histogram.log 2>&1
                timeout 20 "$JAVA_HOME_25_X64/bin/jcmd" "$java_pid" VM.classloader_stats > classloader-stats.log 2>&1
              fi
            done
            kill "$boot_runner" 2>/dev/null || true
            wait "$boot_runner" 2>/dev/null || true
            # Do not sample a previous JVM's post-inspection allocations in
            # the next boot: the launcher may return before its JVM exits.
            if [ -n "$boot_java_pid" ]; then
              for shutdown_poll in $(seq 1 30); do
                kill -0 "$boot_java_pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$boot_java_pid" 2>/dev/null; then
                echo "previous boot JVM did not stop; refusing contaminated next sample"
                exit 1
              fi
            fi
            grep -q 'Total' heap-histogram.log || { echo "heap histogram missing"; exit 1; }
            cd ..
          done

      - name: boot B — Paper + c-imagine (x3, the median is the datum)
        run: |
          for i in 1 2 3; do
            cp -r tmpl modded-$i
            unzip -o dist/module-imagine.zip -d modded-$i/modules/
            cp java/cim-bootstrap/build/cim-bootstrap.jar modded-$i/modules/imagine/cim-bootstrap.jar
            mkdir -p modded-$i/crus modded-$i/plugins
            printf '%s\n' '{"layerDir":"../layer1211/libraries"}' > modded-$i/crus/c-imagine.json
            cp paper-plugin/target/cim-paper-plugin.jar modded-$i/plugins/
            cp scripts/log4j2-layer.xml modded-$i/
            # THE TICK-LOAD PROBE (cimtest-heavy, Tier-1): the selfarm marker
            # arms a deterministic 10ms/tick burn for 600 ticks on world
            # start — the boot log carries the [cimtest_heavy] load-done
            # markers the compare parses (the module's own tick charge under
            # a KNOWN load; the bare boot has no mod and no marker). Every
            # modded boot carries the identical workload, so all three
            # samples are comparable and tick-budget parses all three.
            mkdir -p modded-$i/mods
            cp test-mods/build/libs/cimtest-1.0.0.jar modded-$i/mods/
            printf '10 600\n' > modded-$i/mods/cimtest-heavy.selfarm
            cd modded-$i
            set +e
            ( while true; do ps -o rss= -C java >> rss.log 2>/dev/null || true; sleep 2; done ) &
            sampler=$!
            # Keep the original 360-second RSS window. Diagnostics happen
            # only after the sampler stops, so inspection cannot improve or
            # inflate the budget's measurements. This is a diagnostic branch.
            timeout 430 crussty run > boot.log 2>&1 &
            boot_runner=$!
            sleep 360
            kill "$sampler" 2>/dev/null || true
            wait "$sampler" 2>/dev/null || true
            boot_java_pid=""
            for java_pid in $(ps -o pid= -C java); do
              if grep -zFq "$PWD/versions/paper-26.3.jar" "/proc/$java_pid/cmdline" 2>/dev/null; then
                boot_java_pid="$java_pid"
                cat "/proc/$java_pid/smaps_rollup" > smaps-rollup.log
                timeout 20 "$JAVA_HOME_25_X64/bin/jcmd" "$java_pid" GC.heap_info > heap-info.log 2>&1
                timeout 20 "$JAVA_HOME_25_X64/bin/jcmd" "$java_pid" GC.class_histogram -all > heap-histogram.log 2>&1
                timeout 20 "$JAVA_HOME_25_X64/bin/jcmd" "$java_pid" VM.classloader_stats > classloader-stats.log 2>&1
              fi
            done
            kill "$boot_runner" 2>/dev/null || true
            wait "$boot_runner" 2>/dev/null || true
            # Do not sample a previous JVM's post-inspection allocations in
            # the next boot: the launcher may return before its JVM exits.
            if [ -n "$boot_java_pid" ]; then
              for shutdown_poll in $(seq 1 30); do
                kill -0 "$boot_java_pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$boot_java_pid" 2>/dev/null; then
                echo "previous boot JVM did not stop; refusing contaminated next sample"
                exit 1
              fi
            fi
            grep -q 'Total' heap-histogram.log || { echo "heap histogram missing"; exit 1; }
            cd ..
          done

      - name: compare budgets
        run: |
          set -o pipefail
          # Paper reaching Done is insufficient if the hosted layer failed —
          # EVERY modded boot must carry the full marker set, not just one.
          for i in 1 2 3; do
            grep -Fq '[c-imagine] layer boot ok' modded-$i/boot.log
            grep -Fq '[c-imagine] mod execution ok' modded-$i/boot.log
            grep -Fq '[cimtest_heavy] mod constructed' modded-$i/boot.log
            # M9 open blocker (2026-11-10): the heavy workload rides the REAL
            # shadow-space DedicatedServer (lifecycle driven by Paper's main
            # thread) — the arm/done markers must exist before the budget reads
            # them, and a missing completion still fails tick-budget unchanged.
            grep -Fq '[c-imagine] layer server: started' modded-$i/boot.log
            grep -Fq '[cimtest_heavy] load armed' modded-$i/boot.log
          done
          BARE_ARGS=""
          MODDED_ARGS=""
          for i in 1 2 3; do
            BARE_ARGS="$BARE_ARGS --bare bare-$i"
            MODDED_ARGS="$MODDED_ARGS --modded modded-$i"
          done
          python3 scripts/perf/boot-budget.py $BARE_ARGS $MODDED_ARGS | tee -a "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3; do
            python3 scripts/perf/tick-budget.py modded-$i/boot.log | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiling-logs
          path: |
            bare-*/boot.log
            bare-*/rss.log
            bare-*/heap-info.log
            bare-*/heap-histogram.log
            bare-*/classloader-stats.log
            bare-*/smaps-rollup.log
            modded-*/boot.log
            modded-*/rss.log
            modded-*/heap-info.log
            modded-*/heap-histogram.log
            modded-*/classloader-stats.log
            modded-*/smaps-rollup.log
          if-no-files-found: error
