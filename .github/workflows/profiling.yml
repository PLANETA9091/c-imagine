name: profiling

# Performance law enforcement (docs/ARCHITECTURE.md §4.6):
#  - criterion benchmarks with cached baselines (>=10% regression fails)
#  - bare Paper vs Paper+c-imagine boot time + RSS budget gate
on:
  schedule:
    - cron: "0 3 * * *" # nightly
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: criterion benches (+ baseline cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: restore baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: baseline
          key: criterion-baseline-
      - name: run benches
        run: cargo bench --workspace
      - name: compare against baseline (fail on >10% regression)
        if: steps.baseline.outputs.cache-hit == 'true'
        run: |
          echo "Baseline present; criterion comparison gate would run here."
          # M1+: parse target/criterion/report and fail on regression > 10%.
      - name: save new baseline
        uses: actions/cache/save@v4
        with:
          path: baseline
          key: criterion-baseline-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: ignore

  budget:
    name: bare vs c-imagine boot + RSS budget
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build artifacts
        run: |
          bash scripts/build-bootstrap.sh
          CIM_BOOTSTRAP_JAR="$PWD/java/cim-bootstrap/build/cim-bootstrap.jar" \
            bash scripts/package-module.sh

      - name: scaffold Paper 26.3 (shared template)
        run: |
          npm i -g crussty
          crussty init --platform paper --version 26.3 --dir tmpl
          echo "eula=true" > tmpl/eula.txt
          cat > tmpl/server.properties <<'PROPS'
          online-mode=false
          level-type=minecraft:flat
          view-distance=4
          simulation-distance=4
          max-players=5
          PROPS

      - name: boot A — bare Paper
        run: |
          cp -r tmpl bare && cd bare
          set +e
          ( while true; do ps -o rss= -C java >> rss.log 2>/dev/null || true; sleep 2; done ) &
          sampler=$!
          timeout 360 crussty run > boot.log 2>&1
          kill $sampler 2>/dev/null || true
          cd ..

      - name: boot B — Paper + c-imagine
        run: |
          cp -r tmpl modded
          unzip -o dist/module-imagine.zip -d modded/modules/
          cp java/cim-bootstrap/build/cim-bootstrap.jar modded/modules/imagine/cim-bootstrap.jar
          cd modded
          set +e
          ( while true; do ps -o rss= -C java >> rss.log 2>/dev/null || true; sleep 2; done ) &
          sampler=$!
          timeout 360 crussty run > boot.log 2>&1
          kill $sampler 2>/dev/null || true
          cd ..

      - name: compare budgets
        run: |
          boot_time() { grep -m1 -oE "Done \(([0-9.]+)s\)" "$1" | grep -oE "[0-9.]+" || echo "999"; }
          peak_rss_kb() { sort -n "$1" | tail -1 || echo 0; }
          A_T=$(boot_time bare/boot.log); B_T=$(boot_time modded/boot.log)
          A_R=$(peak_rss_kb bare/rss.log); B_R=$(peak_rss_kb modded/rss.log)
          echo "| metric | bare | c-imagine | delta |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| boot time (s) | $A_T | $B_T | $(echo "$B_T $A_T" | awk '{d=($2>0)?($1/$2-1)*100:0; printf "%.1f%%", d}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| peak RSS (MiB) | $((A_R/1024)) | $((B_R/1024)) | $(( (B_R-A_R)/1024 )) |" >> "$GITHUB_STEP_SUMMARY"
          # M0 gates (relaxed per ROADMAP; tightened every milestone).
          BOOT_RATIO=$(echo "$B_T $A_T" | awk '{r=($2>0)?$1/$2:99; printf "%.2f", r}')
          RSS_DELTA_MIB=$(( (B_R-A_R)/1024 ))
          if (( $(echo "$BOOT_RATIO > 1.25" | bc -l) )); then
            echo "FAIL: boot time ratio $BOOT_RATIO exceeds 1.25 budget" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ "$RSS_DELTA_MIB" -gt 400 ]; then
            echo "FAIL: RSS delta ${RSS_DELTA_MIB} MiB exceeds 400 MiB budget" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "budgets OK (boot ratio $BOOT_RATIO, RSS delta ${RSS_DELTA_MIB} MiB)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiling-logs
          path: |
            bare/boot.log
            bare/rss.log
            modded/boot.log
            modded/rss.log
          if-no-files-found: ignore
