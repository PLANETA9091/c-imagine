name: profiling

# Performance law enforcement (docs/ARCHITECTURE.md §4.6):
#  - criterion benchmarks with cached best-of-3 baselines (>=10% regression fails)
#  - bare Paper vs Paper+c-imagine boot time + RSS budget gate
on:
  workflow_dispatch: # economy mode (owner directive 2026-10-26): no nightly cron

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: criterion benches (+ baseline cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: restore baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: baseline
          key: criterion-baseline-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            criterion-baseline-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
      - name: validate gate contracts
        run: |
          python3 scripts/perf/test-criterion-gate.py
          python3 scripts/perf/test-boot-budget.py
      - name: measure parent baseline on cache miss
        if: steps.baseline.outputs.cache-matched-key == ''
        run: |
          parent=$(git rev-parse HEAD^)
          git worktree add --detach baseline-source "$parent"
          # Best-of-3 parent baseline: the SAME aggregation the compare uses,
          # so both sides of the gate carry the same noise-floor statistic.
          rm -rf target/parent-run-*
          for i in 1 2 3; do
            CARGO_TARGET_DIR="$PWD/target" cargo bench --workspace --manifest-path baseline-source/Cargo.toml
            mv target/criterion target/parent-run-$i
          done
          python3 scripts/perf/criterion-gate.py snapshot --current target/parent-run-1 --current target/parent-run-2 --current target/parent-run-3 --baseline baseline --source-sha "$parent"
          rm -rf target/parent-run-*
      - name: run benches
        run: |
          # Best-of-3 (measured: run 42280303622 flagged ring_roundtrip_4k
          # +13.076% with ZERO ring changes since the initial import — local
          # re-runs reproduce the ~68.5ns baseline stably and inflate the same
          # bench 50-76% under CPU contention). Every comparison takes the
          # per-benchmark MIN median across the 3 runs on BOTH sides; the 10%
          # limit itself is unchanged — a true regression shifts all 3 runs.
          rm -rf target/criterion-run-*
          for i in 1 2 3; do
            cargo bench --workspace
            mv target/criterion target/criterion-run-$i
          done
      - name: compare against baseline (fail on >10% regression)
        run: |
          set -o pipefail
          cp -a baseline baseline-before
          python3 scripts/perf/criterion-gate.py compare --baseline baseline --current target/criterion-run-1 --current target/criterion-run-2 --current target/criterion-run-3 --source-sha "$GITHUB_SHA" --report criterion-deltas.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: snapshot passing measurements
        run: python3 scripts/perf/criterion-gate.py snapshot --current target/criterion-run-1 --current target/criterion-run-2 --current target/criterion-run-3 --baseline baseline --source-sha "$GITHUB_SHA"
      - name: save new baseline
        uses: actions/cache/save@v4
        with:
          path: baseline
          key: criterion-baseline-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-report
          path: |
            target/criterion-run-*
            baseline
            baseline-before
            criterion-deltas.json
          if-no-files-found: error

  budget:
    name: bare vs c-imagine boot + RSS budget
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build artifacts
        run: |
          bash scripts/build-bootstrap.sh
          CIM_BOOTSTRAP_JAR="$PWD/java/cim-bootstrap/build/cim-bootstrap.jar" \
            bash scripts/package-module.sh
          # THE TICK-LOAD PROBE needs the cimtest multi-mod jar (the 5th
          # mod, cimtest_heavy, rides it) staged into the modded boot mods
          # dir — without it the layer reports "no jars in mods", the FML
          # seed skips, and the selfarm marker has nothing to arm
          JAVA_HOME=/usr/lib/jvm/java-21-openjdk gradle build --no-daemon -p test-mods


      - name: scaffold Paper 26.3 (shared template)
        run: |
          npm i -g crussty
          crussty init --platform paper --version 26.3 --dir tmpl
          echo "eula=true" > tmpl/eula.txt
          cat > tmpl/server.properties <<'PROPS'
          online-mode=false
          level-type=minecraft:flat
          view-distance=4
          simulation-distance=4
          max-players=5
          PROPS

      - name: boot A — bare Paper
        run: |
          cp -r tmpl bare && cd bare
          set +e
          ( while true; do ps -o rss= -C java >> rss.log 2>/dev/null || true; sleep 2; done ) &
          sampler=$!
          timeout 360 crussty run > boot.log 2>&1
          kill $sampler 2>/dev/null || true
          cd ..

      - name: boot B — Paper + c-imagine
        run: |
          cp -r tmpl modded
          unzip -o dist/module-imagine.zip -d modded/modules/
          cp java/cim-bootstrap/build/cim-bootstrap.jar modded/modules/imagine/cim-bootstrap.jar
          # THE TICK-LOAD PROBE (cimtest-heavy, Tier-1): the selfarm marker
          # arms a deterministic 10ms/tick burn for 600 ticks on world
          # start — the boot log carries the [cimtest_heavy] load-done
          # markers the compare parses (the module's own tick charge under
          # a KNOWN load; the bare boot has no mod and no marker)
          mkdir -p modded/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar modded/mods/
          printf '10 600\n' > modded/mods/cimtest-heavy.selfarm
          cd modded
          set +e
          ( while true; do ps -o rss= -C java >> rss.log 2>/dev/null || true; sleep 2; done ) &
          sampler=$!
          timeout 360 crussty run > boot.log 2>&1
          kill $sampler 2>/dev/null || true
          cd ..

      - name: compare budgets
        run: |
          set -o pipefail
          python3 scripts/perf/boot-budget.py bare modded | tee -a "$GITHUB_STEP_SUMMARY"
          # THE TICK-LOAD BUDGET: the cimtest-heavy load-done markers carry the
          # per-tick overshoot of a KNOWN 10ms burn under the module — the gate:
          # the average overshoot stays within 2ms (the scheduler/allocator charge
          # the module may add to a known load)
          if grep -q "load done" modded/boot.log; then
            AVG=$(grep -o "avgOverMsPerTick=[0-9.]*" modded/boot.log | tail -1 | cut -d= -f2)
            echo "tick-load probe (10ms burn x600 under the module): avgOverMsPerTick=$AVG" | tee -a "$GITHUB_STEP_SUMMARY"
            python3 -c "
          import sys
          avg = float('$AVG' or '0')
          limit = 2.0
          if avg > limit:
              print(f'TICK-LOAD BUDGET FAILED: avgOverMsPerTick={avg} > {limit}ms — the module charges the known load beyond the budget'); sys.exit(1)
          print(f'tick-load budget ok: {avg} <= {limit}ms')"
          else
            echo "TICK-LOAD BUDGET INCOMPLETE: no [cimtest_heavy] load-done marker in the modded boot log — the selfarm did not fire"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiling-logs
          path: |
            bare/boot.log
            bare/rss.log
            modded/boot.log
            modded/rss.log
          if-no-files-found: ignore
