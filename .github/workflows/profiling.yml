name: profiling

# Performance law enforcement (docs/ARCHITECTURE.md §4.6):
#  - criterion benchmarks with cached baselines (>=10% regression fails)
#  - bare Paper vs Paper+c-imagine boot time + RSS budget gate
on:
  workflow_dispatch: # economy mode (owner directive 2026-10-26): no nightly cron

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: criterion benches (+ baseline cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: restore baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: baseline
          key: criterion-baseline-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            criterion-baseline-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
      - name: validate gate contracts
        run: |
          python3 scripts/perf/test-criterion-gate.py
          python3 scripts/perf/test-boot-budget.py
      - name: measure parent baseline on cache miss
        if: steps.baseline.outputs.cache-matched-key == ''
        run: |
          parent=$(git rev-parse HEAD^)
          git worktree add --detach baseline-source "$parent"
          rm -rf target/criterion
          CARGO_TARGET_DIR="$PWD/target" cargo bench --workspace --manifest-path baseline-source/Cargo.toml
          python3 scripts/perf/criterion-gate.py snapshot --current target/criterion --baseline baseline --source-sha "$parent"
          rm -rf target/criterion
      - name: run benches
        run: |
          rm -rf target/criterion
          cargo bench --workspace
      - name: compare against baseline (fail on >10% regression)
        run: |
          set -o pipefail
          cp -a baseline baseline-before
          python3 scripts/perf/criterion-gate.py compare --baseline baseline --current target/criterion --source-sha "$GITHUB_SHA" --report criterion-deltas.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: snapshot passing measurements
        run: python3 scripts/perf/criterion-gate.py snapshot --current target/criterion --baseline baseline --source-sha "$GITHUB_SHA"
      - name: save new baseline
        uses: actions/cache/save@v4
        with:
          path: baseline
          key: criterion-baseline-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-report
          path: |
            target/criterion
            baseline
            baseline-before
            criterion-deltas.json
          if-no-files-found: error

  budget:
    name: bare vs c-imagine boot + RSS budget
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build artifacts
        run: |
          bash scripts/build-bootstrap.sh
          CIM_BOOTSTRAP_JAR="$PWD/java/cim-bootstrap/build/cim-bootstrap.jar" \
            bash scripts/package-module.sh

      - name: scaffold Paper 26.3 (shared template)
        run: |
          npm i -g crussty
          crussty init --platform paper --version 26.3 --dir tmpl
          echo "eula=true" > tmpl/eula.txt
          cat > tmpl/server.properties <<'PROPS'
          online-mode=false
          level-type=minecraft:flat
          view-distance=4
          simulation-distance=4
          max-players=5
          PROPS

      - name: boot A — bare Paper
        run: |
          cp -r tmpl bare && cd bare
          set +e
          ( while true; do ps -o rss= -C java >> rss.log 2>/dev/null || true; sleep 2; done ) &
          sampler=$!
          timeout 360 crussty run > boot.log 2>&1
          kill $sampler 2>/dev/null || true
          cd ..

      - name: boot B — Paper + c-imagine
        run: |
          cp -r tmpl modded
          unzip -o dist/module-imagine.zip -d modded/modules/
          cp java/cim-bootstrap/build/cim-bootstrap.jar modded/modules/imagine/cim-bootstrap.jar
          cd modded
          set +e
          ( while true; do ps -o rss= -C java >> rss.log 2>/dev/null || true; sleep 2; done ) &
          sampler=$!
          timeout 360 crussty run > boot.log 2>&1
          kill $sampler 2>/dev/null || true
          cd ..

      - name: compare budgets
        run: |
          set -o pipefail
          python3 scripts/perf/boot-budget.py bare modded | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiling-logs
          path: |
            bare/boot.log
            bare/rss.log
            modded/boot.log
            modded/rss.log
          if-no-files-found: ignore
