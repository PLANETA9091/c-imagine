name: ci

# Actions policy (owner directive, 2026-10-26): minutes nearly exhausted —
# sparing use. Fast guard runs on push to main ONLY when code changes
# (paths below); docs-only pushes burn nothing. Manual dispatch for anything else.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "third_party/**"
      - "java/**"
      - "paper-plugin/**"
      - "test-mods/**"
      - "tools/**"
      - "scripts/cimscene/**"
      - "scripts/fetch-visual-client.py"
      - "scripts/visual/**"
      - "scripts/perf/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gallery-reports:
    name: gallery report contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: report schema regressions
        run: python3 scripts/cimscene/test-flip-report.py
      - name: gallery verdict classes
        run: |
          pip install -q numpy pillow
          python3 scripts/cimscene/test-gallery-diff.py
          python3 scripts/cimscene/test-wait-scene-marker.py
          python3 scripts/cimscene/test-parity-channels.py
      - name: client download recovery
        run: python3 scripts/visual/test-fetch-client.py
      - name: performance evidence gates
        run: |
          python3 scripts/perf/test-criterion-gate.py
          python3 scripts/perf/test-boot-budget.py
          python3 scripts/perf/test-tick-budget.py
      - name: embedded shell syntax
        run: |
          python3 scripts/test-audit-runblocks.py
          python3 scripts/audit_runblocks.py

  rust:
    name: rust (fmt, clippy, test, release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: release build (module)
        run: cargo build -p imagine --release
      - name: release build (benches compile)
        run: cargo bench --no-run --workspace

  java-bootstrap:
    name: java bootstrap (javac 21, jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: build
        run: bash scripts/build-bootstrap.sh
      - name: bridge selftests (M3.2 tables + M3.3 sidecar)
        run: |
          java -cp java/cim-bootstrap/build/cim-bootstrap.jar dev.cim.bridge.StateMapper --selftest
          java -cp java/cim-bootstrap/build/cim-bootstrap.jar dev.cim.bridge.SidecarStore --selftest
          mkdir -p java/cim-bootstrap/build/test-classes
          javac --release 21 -cp java/cim-bootstrap/build/cim-bootstrap.jar \
            -d java/cim-bootstrap/build/test-classes \
            java/cim-bootstrap/src/test/java/dev/cim/layer/FmlHostTest.java
          java -cp java/cim-bootstrap/build/cim-bootstrap.jar:java/cim-bootstrap/build/test-classes \
            dev.cim.layer.FmlHostTest
      - uses: actions/upload-artifact@v4
        with:
          name: cim-bootstrap-jar
          path: java/cim-bootstrap/build/cim-bootstrap.jar
          if-no-files-found: error

  paper-plugin:
    name: paper plugin (maven, paper-api 26.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # Paper 26.3 API jars are class-file v69 (Java 25); the compiler
          # must read them, so build with JDK 25 (plugin bytecode stays 21).
          distribution: temurin
          java-version: 25
      - name: resolve newest stable paper-api for 26.3
        id: paper
        run: |
          PV=$(bash scripts/resolve-paper-version.sh 26.3)
          echo "version=$PV" >> "$GITHUB_OUTPUT"
          echo "paper-api version: $PV"
      - name: build
        working-directory: paper-plugin
        run: mvn -B -ntp -Dpaper.version="${{ steps.paper.outputs.version }}" package
      - name: f2v pack builder selftest (M5.2)
        working-directory: paper-plugin
        # gson is needed outside the server (F2vPack parses model JSON; on a
        # live Paper the server supplies it — measured contract of
        # scripts/build-paper-plugin-offline.sh). dependency:build-classpath
        # rebuilds the exact classpath the compiler saw (paper-api's
        # transitive provided deps).
        run: |
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/selftest-cp.txt
          java -cp "target/cim-paper-plugin.jar:$(cat target/selftest-cp.txt)" dev.cim.f2v.F2vPack --selftest
      - name: hud, keyboard and menu selftests
        working-directory: paper-plugin
        run: |
          for t in KeyCensus KeyboardState HudPack; do
            java -cp "target/cim-paper-plugin.jar:$(cat target/selftest-cp.txt)" "dev.cim.hud.$t" --selftest
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cim-paper-plugin
          path: paper-plugin/target/cim-paper-plugin.jar
          if-no-files-found: error

  test-mods:
    name: test mod cimtest (NeoForge 1.21.1, ModDevGradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        working-directory: test-mods
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cimtest-mod-jar
          path: test-mods/build/libs/cimtest-1.0.0.jar
          if-no-files-found: error
