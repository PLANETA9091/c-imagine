          # stand, the pattern banner, the sherd pot, the playing jukebox.
          # The settle pass (+40 ticks, then the 12-as rewrite) carries the
          # RUNTIME assertions (effect still active, trim still worn, glint
          # still there, BE patterns/sherds/song state held, the song still
          # playing) — a cell that fails them is a named skip row, exactly
          # the honesty channel the gate's ABSENCE_NOTES read. The shots are
          # DIAGNOSTIC: the ours leg has NO variant replay channel yet (the
          # F2V projection per kind is the named lane), so the gate reports
          # the missing ours shots loudly without a red verdict.
          for KIND in painting wolf cat frog villager effect trimmaterial trimpattern banner pot enchant jukebox blockentity; do
            for NS in $LADDER_NS; do
              EX=0
              for p in $(seq $SI $K $MAXP); do
                base_of "gallery-variant-$KIND-$NS-p$p"
                rcon "cimscene cleanup-assemblies" "kill @e[type=!player]" "cimscene gallery variant $KIND $NS $p"
                RC=0; wait_done "gallery-variant-$KIND-$NS-p$p" "$V0D" "$V0E" || RC=$?
                [ "$RC" = "2" ] && { echo "$NS $KIND variant page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
                if [ "$RC" = "1" ]; then EX=1; break; fi
                grep "gallery-variant done kind=$KIND ns=$NS page=$p " srv-wall/boot.log | tail -1 || true
                sleep 2   # the settled subjects hold; the final rewrite lands inside this window
                rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
                bash scripts/visual/shot.sh "truth-shots/gal-v$KIND-$NS$p.png" \
                  || echo "$NS $KIND variant page $p shot failed (diagnostic tolerated)"
                echo "shot $NS $KIND variant page $p"
              done
              [ "$EX" = "1" ] || { echo "$NS $KIND variant walk hit the MAXP cap without exhausted"; exit 1; }
            done
          done
          ls truth-shots/ | wc -l

      - name: shot listing (the coverage gate joins this, not the bytes)
        run: |
          (cd truth-shots && ls *.png > shots.txt.tmp && mv shots.txt.tmp shots.txt)
          wc -l truth-shots/shots.txt

      - name: upload truth shots s${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-truth-shots-${{ matrix.shard }}
          path: truth-shots/
          if-no-files-found: warn

      - name: upload truth meta s${{ matrix.shard }} (manifests + boot log + listing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-truth-meta-${{ matrix.shard }}
          path: |
            srv-wall/c-imagine/scenes/
            srv-wall/boot.log
            truth-pins.log
            ground-fill.log
            truth-client-mods.sha256
            truth-client/client.out
            truth-shots/shots.txt
            truth-client-deaths/
            truth-screens/
          if-no-files-found: warn

  # ------------------------------------------------------------ wall-ours --
  # K shards, each = one full ours stack (Paper 26.3 + plugin + pack +
  # vanilla client) replaying the SAME stride as truth shard i, then
  # downloading ONLY truth shard i and running the per-page pixel join
  # INLINE. The pack + manifests come from the seeded cache (content-keyed)
  # — the join re-verifies them against the fresh truth manifests every run.
  wall-ours:
    name: gallery ours s${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [seed]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SI: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      # the SAME fingerprint the seed job stamps into f2v/inputs.sha1 — the
      # ours shard must serve the pack built from THIS input tree (measured
      # #47: a prefix-restored older pack silently served the stale builder;
      # hashFiles lives in a step — job-level env rejects it, measured #48)
      - name: seed input fingerprint
        id: seed-inputs
        run: echo "hash=${{ hashFiles('.github/workflows/gallery.yml', 'scripts/f2v/**', 'scripts/cimscene/**', 'scene-mod/src/**', 'test-mods/src/**', 'test-mods/*.gradle*', 'scene-mod/*.gradle*', 'gradle/**', 'paper-plugin/src/**', 'paper-plugin/pom.xml') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        id: jdk25
        with:
          distribution: temurin
          java-version: 25    # paper 26.3 api + the 26.3 client are class 69

      - name: restore seed (cache, restore-only)
        id: seed-cache
        uses: actions/cache/restore@v4
        with:
          path: seed-pack
          key: gallery-seed-v3-${{ steps.seed-inputs.outputs.hash }}
          restore-keys: |
            gallery-seed-v3-

      - name: seed payload freshness (stale prefix hit -> the artifact)
        id: seed-verify
        env:
          SEED_INPUTS: ${{ steps.seed-inputs.outputs.hash }}
        run: |
          set -euo pipefail
          if [ -f seed-pack/f2v/inputs.sha1 ] && [ "$(cat seed-pack/f2v/inputs.sha1)" = "$SEED_INPUTS" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "seed payload fresh: inputs=$SEED_INPUTS"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "seed payload STALE (payload inputs=$(cat seed-pack/f2v/inputs.sha1 2>/dev/null || echo none), want=$SEED_INPUTS) — download this run's seed artifact"
            rm -rf seed-pack
          fi

      - name: seed artifact fallback (cache eviction / staleness)
        if: steps.seed-verify.outputs.hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: seed-pack
          path: seed-pack

      - name: verify the seed payload
        run: |
          set -euo pipefail
          test -f seed-pack/f2v/pack.sha1 || { echo "seed payload stale: no pack.sha1"; exit 1; }
          test -f seed-pack/plugin/cim-paper-plugin.jar || { echo "seed payload stale: no plugin jar"; exit 1; }
          # block manifests of EVERY ladder namespace (per-ns glob is exact)
          N=0
          for NS in $LADDER_NS; do
            NB=$(ls seed-pack/scenes/gallery-$NS-p*.tsv 2>/dev/null | wc -l || true)
            N=$((N + ${NB:-0}))
          done
          [ "${N:-0}" -gt 100 ] || { echo "seed payload stale: only $N block manifests"; exit 1; }
          echo "seed ready: pack.sha1=$(cat seed-pack/f2v/pack.sha1), $N block manifests"

      # 14-di THE EARLY ART HANDSHAKE: poll this run's artifacts for the
      # truth sibling's ScreenArt dump (the gui-first walk publishes it
      # minutes into the shard). Bounded ~40 min; on timeout the ours leg
      # boots without the overlay (the named scene-gap reds stay — never
      # staged away), never fails the shard on the sibling's account.
      - name: wait for this shard's truth art (14-di early handshake)
        id: truth-art
        run: |
          set -euo pipefail
          FOUND=""
          for i in $(seq 1 80); do
            N=$(curl -sf -m 30 -H "Authorization: Bearer ${{ github.token }}" \
                  "$GITHUB_API_URL/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for a in d['artifacts'] if a['name']=='wall-truth-screens-${{ matrix.shard }}' and not a['expired']))" || echo 0)
            if [ "${N:-0}" -ge 1 ]; then FOUND=1; echo "truth art landed after ~$((i*30))s"; break; fi
            sleep 30
          done
          if [ -z "$FOUND" ]; then
            echo "WARN: this shard's truth screens did not land in ~40 min — booting without the 14-di overlay"
          fi
          echo "art=${FOUND:-0}" >> "$GITHUB_OUTPUT"

      - name: download truth screens (14-di)
        if: steps.truth-art.outputs.art == '1'
        uses: actions/download-artifact@v4
        with:
          name: wall-truth-screens-${{ matrix.shard }}
          path: truth-meta-screens

      - name: launch Paper (background, FAST BOOT) + prepare the client while it boots
        run: |
          set -euo pipefail
          # THE OURS LEG RUNS NO MODS, BY DESIGN (stated plainly per the
          # staging review 2026-11-04): the Paper server gets cim-paper-
          # plugin.jar ONLY — no mod jars, no layer, no scene-mod. Unlike
          # integration.yml's m2-real-mods harness (which stages real
          # Modrinth mods into the shadow-space layer), the gallery's ours
          # side is purely PROTOCOL/PACK-based: the seeded F2vPack (built
          # from the truth side's mod jars) carries every visual the
          # vanilla 26.3 client renders, and the plugin replays the truth
          # manifests as display rigs. A channel the pack cannot express
          # (mod particles, mod sounds, mod menus...) shows up as
          # nochannel/empty in the join — the honest backlog, never staged
          # away.
          mkdir -p srv-wall/plugins srv-wall/c-imagine/f2v srv-wall/c-imagine/scenes
          cp seed-pack/plugin/cim-paper-plugin.jar srv-wall/plugins/
          cp -r seed-pack/f2v/. srv-wall/c-imagine/f2v/
          cp -r seed-pack/scenes/. srv-wall/c-imagine/scenes/
          ls srv-wall/c-imagine/scenes/ | wc -l
          # 14-di THE RUN-CAPTURE OVERLAY's input: the early-art handshake
          # landed this shard's truth ScreenArt dump; the plugin merges it
          # into the served pack + the replay's scene list at boot.
          mkdir -p srv-wall/c-imagine/screens
          if [ -d truth-meta-screens ]; then cp -r truth-meta-screens/. srv-wall/c-imagine/screens/; fi
          echo "14-di run captures: $(ls srv-wall/c-imagine/screens 2>/dev/null | wc -l)"
          echo "eula=true" > srv-wall/eula.txt
          cat > srv-wall/server.properties <<PROPS
          online-mode=false
          white-list=false
          difficulty=peaceful
          level-type=minecraft\:flat
          level-seed=42
          view-distance=6
          simulation-distance=4
          spawn-protection=0
          max-players=5
          enable-rcon=true
          rcon.port=25575
          rcon.password=cimgate
          PROPS
          mkdir -p srv-wall
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          echo "paper: $URL"
          curl -sL --max-time 300 -o srv-wall/paper.jar "$URL"
          wc -c srv-wall/paper.jar
          cd srv-wall
          rm -rf world world_nether world_the_end
          # -Dcim.f2v.fastBoot=true: serve the seeded pack; the boot-time
          # rebuild is skipped (the same pure function ran in the seed; the
          # play-phase offer pins the same SHA1 for the client's hash check).
          # Measured cost of
          # the rebuild: 4.8 min of every ours boot (#35).
          setsid bash -c "java -Xmx3G -Dcim.f2v.fastBoot=true -Dcim.f2v.screenOverlay=true -jar paper.jar --nogui >> boot.log 2>&1" < /dev/null > /dev/null 2>&1 &
          cd ..
          javac -d vtools scripts/visual/Shot.java scripts/visual/ShotD.java scripts/visual/Key.java
          # MEASURED (run 42250969085, all 8 ours shards): the client died
          # with "Couldn't find matching GLX visual / opengl_missing" while
          # the truth shards (1.21.1 client) joined on the same runners —
          # the 26.3 client's GLX requirements are stricter, and the
          # dpkg -s skip trusted the RUNNER IMAGE's pre-installed mesa,
          # which rolled under us and no longer exposes the visual the
          # 26.3 GlDevice requests. Install UNCONDITIONALLY (the apt
          # version, not whatever the image ships) and probe the GLX
          # visual list right after Xvfb starts — a fast named failure
          # instead of a 12-minute blind client stall.
          apt_retry() {
            # THE RUNNER DNS INCIDENT (43046583185 + rerun: all 8 ours shards died at
            # apt with "Temporary failure resolving security.ubuntu.com" — exit 100,
            # the GL stack never installed, the client never launched). The failure
            # is on the runner's resolver, not the repo; ride it out: up to 4 tries
            # with a 30s gap, Acquire::Retries for the packet-level retries.
            local need="$*"
            for i in 1 2 3 4; do
              # Keep apt's signed security suite on the official archive if
              # only the security host fails DNS; retries alone cannot fix it.
              if ! timeout 10 getent ahosts security.ubuntu.com >/dev/null 2>&1 \
                 && timeout 10 getent ahosts archive.ubuntu.com >/dev/null 2>&1; then
                sudo python3 scripts/visual/ubuntu-mirror-fallback.py /etc/apt
              fi
              if sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq $need; then
                return 0
              fi
              echo "[apt_retry] attempt $i failed — retrying in 30s"
              sleep 30
            done
            echo "[apt_retry] all attempts failed"
            return 1
          }
          apt_retry libgl1-mesa-dri mesa-vulkan-drivers libglx-mesa0 libxtst6 mesa-utils
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 1
          export DISPLAY=:99
          GLXV=$(glxinfo -B 2>/dev/null | grep -c "GLX Visuals" || true)
          OPENGLV=$(glxinfo -B 2>/dev/null | grep -E "OpenGL version" || true)
          echo "GLX probe: visuals_block=$GLXV | $OPENGLV"
          [ -n "$OPENGLV" ] || { echo "GLX probe FAILED — no OpenGL renderer on :99 (the 26.3 client would crash opengl_missing)"; glxinfo -display :99 2>&1 | head -20; exit 1; }
          # the visual client runtime (piston-meta, with assets) — cached
          [ -f visual-client/launch.txt ] || python3 scripts/fetch-visual-client.py 26.3 visual-client --assets
          wc -c visual-client/classpath.txt visual-client/launch.txt
          # 14-cp: the pack grew to ~166k gallery models (the per-cell
          # native liquid replay added ~40k over the 21c545f era) and the
          # stock 2G heap OOM'd in ModelManager.loadBlockModels on every
          # ours shard (runs 42413757062, 42412879537). 5G leaves headroom
          # for the model+atlas load peak next to the 3G Paper server.
          sed -i 's/^java /java -Xmx5G /' visual-client/launch.txt
          # THE VULKAN FALLBACK (measured 2026-11-06: the rolled runner
          # image's GLX offers GL 4.5 COMPAT while the 26.3 GlDevice
          # demands more — "Couldn't find matching GLX visual" killed every
          # ours join; the 1.21.1 truth client (GL 3.2) is permissive and
          # joined). The 26.3 client carries a VULKAN backend: launch-arg
          # --graphicsBackend vulkan bypasses GLX entirely; locally
          # verified: the client initializes Vulkan and runs. Probe-gated:
          # only when the GLX OpenGL version is below 4.6 (lavapipe from
          # mesa-vulkan-drivers serves Vulkan 1.3 with no GLX involved).
          GLMAJ=$(echo "$OPENGLV" | grep -oE "[0-9]+\.[0-9]+" | head -1 | cut -d. -f1)
          GLMIN=$(echo "$OPENGLV" | grep -oE "[0-9]+\.[0-9]+" | head -1 | cut -d. -f2)
          if [ "${GLMAJ:-0}" -lt 4 ] || { [ "${GLMAJ:-0}" -eq 4 ] && [ "${GLMIN:-0}" -lt 6 ]; }; then
            echo "GL $GLMAJ.$GLMIN < 4.6 — switching the 26.3 client to the VULKAN backend (lavapipe)"
            sed -i 's/--graphicsBackend opengl/--graphicsBackend vulkan/' visual-client/launch.txt
            grep -oE "\-\-graphicsBackend [a-z]*" visual-client/launch.txt
          fi
          mkdir -p visual-client/game
          # 14-bo THE REAL CLIENT PROBE: run #192 measured glxinfo printing
          # "OpenGL version string: 4.5" while the 26.3 client died exactly
          # the same way as 42250969085 — "Couldn't find matching GLX visual
          # / opengl_missing" (the client windows through SDL, so no external
          # probe replicates its request). The honest probe IS the client:
          # launch it headless-short and read its own verdict from the log.
          # opengl_missing -> try the ladder below; the window actually
          # coming up ("Sound engine started") -> the backend stands.
          probe_client() {
            OUT=$(mktemp)
            timeout 75 env DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
              $(cat visual-client/launch.txt) > "$OUT" 2>&1 || true
            if grep -q "opengl_missing" "$OUT"; then
              echo "PROBE: opengl_missing on $1"
              tail -4 "$OUT" | sed 's/^/PROBE: /'
              rm -f "$OUT"; return 3
            fi
            if grep -qE "Sound engine started|Backend: OpenGL|Created: .*atlas" "$OUT"; then
              echo "PROBE: window up on $1"
              rm -f "$OUT"; return 0
            fi
            # inconclusive = the client is slow, not broken: opengl_missing
            # is instant (the GLX refusal fires at window creation). Keep the
            # current backend — the real run allows 12 minutes, not 75s.
            echo "PROBE: inconclusive on $1 (no backend verdict in 75s) — keeping the current backend"
            tail -4 "$OUT" | sed 's/^/PROBE: /'
            rm -f "$OUT"; return 0
          }
          printf 'onboardAccessibility:false\nfov:0.0\npauseOnLostFocus:false\nrenderClouds:false\npreferredGraphicsBackend:opengl\n' > visual-client/game/options.txt
          GLBACKEND=opengl
          if ! probe_client "opengl/24bit"; then
            # fallback 1: a 32-bit screen exposes RGBA visuals a 24-bit one lacks
            pkill -f "Xvfb :99" 2>/dev/null || true
            sleep 1
            Xvfb :99 -screen 0 1280x720x32 +extension GLX +render -noreset &
            sleep 2
            if probe_client "opengl/32bit"; then
              echo "GLPROBE: recovered on the 32-bit screen — the opengl pin stands"
            else
              # fallback 2: the rolled image's GLX cannot serve the client at
              # all — but the #192 crash report showed the Vulkan device
              # enumerating fine (llvmpipe Vulkan 1.4.318). Flip the pin,
              # VERIFY the flip with the same probe, and let the gate MEASURE
              # instead of crashing 8/8. The flip is LOUD: this run's parity
              # read rides a different renderer, and the worklog names it.
              printf 'onboardAccessibility:false\nfov:0.0\npauseOnLostFocus:false\nrenderClouds:false\npreferredGraphicsBackend:vulkan\n' > visual-client/game/options.txt
              if probe_client "vulkan/32bit"; then
                GLBACKEND=vulkan
                echo "GLPROBE: FLIPPED to vulkan and verified — this run's ours parity rides lavapipe"
              else
                echo "GLPROBE: neither backend can start the 26.3 client on this image"
                exit 1
              fi
            fi
          else
            echo "GLPROBE: the opengl pin stands (the client's window came up)"
          fi
          # THE 26.3 FOV PIN (14-av, re-measured locally 2026-11-05, probe-14av.sh):
          # the old -0.65 pin was calibrated (2026-11-01) against a CI truth
          # frame that was ITSELF rendered off-contract (the whole #95-era
          # matched both legs at ~1.47x the 70-deg geometry) — the fit chain
          # was self-consistent at the wrong scale. The decisive A/B places
          # REAL iron blocks at the contract rig (camera 0.5,-60,0.5, wall
          # z=9) and measures their px width on the raw 26.3 client:
          # fov:-0.65 -> 103 px/block (~43 deg), fov:-0.45 -> 86 px/block,
          # fov:0.0 -> 60.3 px/block = THE CONTRACT 60.5 (70 deg, F=514.1).
          # The 26.3 slider maps IDENTICALLY to 1.21.1 (fov = 70 + 40*v) and
          # both legs now pin the same fov:0.0 = 70. Expected ISOLATE_SCALE
          # after the fix: the casing drops 78x79 -> ~56x57 (78*514/712).
          # $GLBACKEND comes from the 14-bo probe ladder above: opengl unless
          # the rolled image's GLX cannot serve the client's own GLFW request.
          # Match the native reference default explicitly on both stacks.
          printf 'onboardAccessibility:false\nfov:0.0\npauseOnLostFocus:false\nmipmapLevels:4\nrenderClouds:false\npreferredGraphicsBackend:%s\n' "$GLBACKEND" > visual-client/game/options.txt
          # Keep the final options write at the same native mipmap setting.
          # This write also pins the tutorial; it must preserve both clients' 4.
          # tutorialStep:none (menus lane, 12a0ec6c): no first-join tutorial overlay in the frames.
          printf 'tutorialStep:none\nonboardAccessibility:false\nfov:0.0\npauseOnLostFocus:false\nmipmapLevels:4\nrenderClouds:false\npreferredGraphicsBackend:%s\n' "$GLBACKEND" > visual-client/game/options.txt
          python3 scripts/visual/make_servers_dat.py visual-client/game

      - name: server pins + forceload + client joins (pack accepted)
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=4
          R=""
          for i in $(seq 1 300); do
            R=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1 || true)
            [ -n "$R" ] && break
            sleep 1
          done
          [ -n "$R" ] || { tail -30 srv-wall/boot.log; exit 1; }
          # fastBoot must have served the seeded pack
          grep -q "f2v pack: FAST BOOT" srv-wall/boot.log || { tail -30 srv-wall/boot.log; echo "fastBoot marker missing"; exit 1; }
          grep -q "f2v pack: serving" srv-wall/boot.log || { tail -30 srv-wall/boot.log; exit 1; }
          echo "cim server up + pack serving: $R"
          # 14-ab GROUND NEUTRALIZATION — the truth-leg mirror (same fills,
          # the same deterministic smooth_stone floor; see the truth leg's
          # comment for the #74 grass-floor forensics). Runs after the
          # forceload so the far band sits inside loaded chunks.
          # 14-at GAMERULE RENAMES (measured locally on paper-26.3-242,
          # scripts/p263_gamerule.sh + the live rcon probes): the 26.3
          # GameRuleRegistryFix renamed the rules — doDaylightCycle ->
          # advance_time, doWeatherCycle -> advance_weather, doMobSpawning
          # -> spawn_mobs. The old names fail with "Incorrect argument"
          # (measured run #107: the ours leg's pins all died, the daylight
          # stayed TRUE, and the mob/item pages shot at NIGHT against the
          # truth's noon). The ours leg runs Paper 26.3 — the new names;
          # the truth leg (1.21.1) keeps the old ones.
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "gamerule advance_time false" "time set noon" \
            "gamerule advance_weather false" "weather clear" \
            "gamerule spawn_mobs false" "forceload add -64 -32 64 48" \
            | tee ours-pins.log
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "forceload add -128 8 128 104" \
            "fill -40 -61 -2 40 -61 9 minecraft:smooth_stone" \
            "fill -128 -61 10 128 -61 100 minecraft:smooth_stone" | tee ground-fill.log
          LAUNCH=$(cat visual-client/launch.txt)
          ARGS="${LAUNCH#java }"
          CLIENT_JAVA="${{ steps.jdk25.outputs.path }}/bin/java"
          setsid bash -c "cd visual-client && $CLIENT_JAVA $ARGS > client.out 2>&1" < /dev/null > /dev/null 2>&1 &
          for i in $(seq 1 90); do
            L=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1 || true)
            case "$L" in *cimviewer*) break;; esac
            sleep 1
          done
          case "$L" in *cimviewer*) echo "cim client joined: $L";;
            *) tail -30 visual-client/client.out; exit 1;; esac
          # Offer in play: Paper's status event does not cover the login
          # configuration phase's server.properties pack. This sends the
          # same served ZIP and pinned SHA1 using the real player API.
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "cim pack cimviewer"
          # A reload/advancement log is not proof that the required server
          # pack applied. The stock client rejects packs over 250 MiB and can
          # remain connected with fallback items; require its protocol result.
          PACK_LOADED=0
          for i in $(seq 1 600); do
            if grep -Fq 'f2v pack: status cimviewer=SUCCESSFULLY_LOADED' srv-wall/boot.log; then
              PACK_LOADED=1
              break
            fi
            if grep -qE 'f2v pack: status cimviewer=(DECLINED|FAILED_DOWNLOAD|FAILED_RELOAD|INVALID_URL|DISCARDED)' srv-wall/boot.log; then
              echo "vanilla client rejected the resource pack"
              tail -30 visual-client/client.out
              exit 1
            fi
            sleep 1
          done
          [ "$PACK_LOADED" = 1 ] || { echo "no successful client pack application"; tail -30 visual-client/client.out; exit 1; }
          sleep 8

      - name: wall replay — STRIDE (blocks + probes + isolated displays)
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=4
          # 14-bt THE PERSISTENT RCON DRIVER (mirror of the truth leg): ONE
          # --batch process carries every replay command of this step; the
          # placed-marker asserts consume the SAME per-command responses the
          # per-call invocations printed. A dead driver fails the step the
          # same way a failed per-call rcon did.
