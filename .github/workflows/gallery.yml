name: gallery

# THE GATE IS PIXELS — owner directive 2026-10-30 (docs/ROADMAP.md M5.5,
# MODPACK.md Tier 0). The universal block-state gallery runs on BOTH stacks
# and the pixel join is RED unless 100% of cells match inside the measured
# drift datum. Census/construct/mixin markers are diagnostics — they never
# green a rank.
#
# EVERYTHING in this workflow is measured, not assumed (2026-10-29 end-to-end
# sandbox run, docs/worklog.md 12-w):
#   - console FIFOs died on the first EOF -> ALL server control is RCON
#     (scripts/cimscene/rcon.py); every command's response is asserted
#   - the truth client is KICKED without the server's mods (registry sync) ->
#     the client carries the same mod jars
#   - a survival viewer FALLS 1 block below the contract eye height -> the
#     walk switches the viewer to spectator (camera == tp point, no hand)
#   - the FIRST teleport of a session is eaten by the terrain-download
#     barrier -> the walk does a warm-up pass (tp only) before shooting
#   - MC java shields SIGTERM -> SIGKILL everywhere, stale locks cleaned
#   - "fov:45.0" is NOT degrees (the slider stores an offset; 45 deg = -0.625)
#   - waterlogged blockstates release their fluid into the corridor and flood
#     the pixels -> the gallery skips fluid-bearing states on both stacks
#   - wall stride must cover the camera corridor (12) or wall N+1 plows wall N
#
# job 1 gallery-truth: real NeoForge 21.1.265 server + real NeoForge 1.21.1
#   client under xvfb — /cimscene gallery (universal: EVERY registered block
#   from every loaded mod + all states + vanilla controls) + per-wall shots.
#   Uploads gallery.tsv = THE CELL CONTRACT for the cim leg.
# job 2 gallery-cim (needs truth): Paper 26.3 + c-imagine plugin + F2vPack +
#   vanilla 26.3 client — cim-gallery-walk.py mirrors the truth manifest:
#   vanilla cells as real setblock, modded cells as block_display carriers
#   (pack overrides note_block); blocks without a carrier = red_concrete
#   markers = honest RED rows (the f2v port's fix backlog).
# job 3 gallery-diff: per-cell pixel join (scripts/cimscene/gallery-diff.py)
#   — geometry derived from the manifests; the drift datum is MEASURED on the
#   vanilla control cells of this very pair of runs; RED ships triptychs
#   (truth | ours | heat) + TSV report as artifacts.

on:
  # SUPERSEDED on the push path (merge faffd74/12-x): this flow drives the
  # corridor-line harness (`cimscene gallery 8 1440` + walk scripts + block
  # display carriers) whose scene-mod geometry was replaced by the wall-grid
  # line (GalleryPack + ItemDisplay CMD replay; gate = mod-matrix.yml
  # create-truth). Kept for manual reference runs of the corridor design —
  # its measured lessons (rcon console, ghost protocol, fov slider units,
  # spectator warm-up, OOM heaps) are folded into the worklog 12-w.
  workflow_dispatch: {}

jobs:
  gallery-truth:
    name: gallery — truth leg (real NeoForge server + client, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: build cimtest + cimscene
        run: |
          gradle build --no-daemon -p test-mods
          gradle build --no-daemon -p scene-mod

      - name: restore NeoForge server layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer-srv
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 21.1.265 server (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-srv-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-srv-installer.jar --installServer layer-srv

      - name: fetch P0 Create (Modrinth ladder fetch)
        run: bash scripts/cimscene/fetch-ladder.sh mods-create create

      - name: assemble server dir
        run: |
          cp -r layer-srv srv-truth
          mkdir -p srv-truth/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv-truth/mods/
          cp scene-mod/build/libs/cimscene-1.0.0.jar srv-truth/mods/
          cp mods-create/*.jar srv-truth/mods/
          echo "eula=true" > srv-truth/eula.txt
          cat > srv-truth/server.properties <<'PROPS'
          online-mode=false
          white-list=false
          difficulty=peaceful
          level-type=minecraft:flat
          level-seed=42
          view-distance=6
          simulation-distance=4
          spawn-protection=0
          max-players=5
          enable-rcon=true
          rcon.port=25575
          rcon.password=cimgate
          PROPS

      - name: boot real NeoForge server (RCON after the port settles)
        run: |
          set -euo pipefail
          cd srv-truth
          rm -rf world world_nether world_the_end   # fresh flat world: no inherited fluids
          setsid bash -c "java -Xmx2G @libraries/net/neoforged/neoforge/21.1.265/unix_args.txt --nogui >> boot.log 2>&1" < /dev/null > /dev/null 2>&1 &
          cd ..
          for i in $(seq 1 150); do
            R=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1)
            [ -n "$R" ] && break
            sleep 2
          done
          [ -n "$R" ] || { tail -60 srv-truth/boot.log; exit 1; }
          echo "truth server up: $R"

      - name: camera pins + build the universal gallery (RCON, responses asserted)
        run: |
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "gamerule doDaylightCycle false" "time set noon" \
            "gamerule doWeatherCycle false" "weather clear" \
            "gamerule doMobSpawning false" "cimscene gallery 8 1440" \
            | tee truth-rcon.log
          grep -q "gallery built" truth-rcon.log
          test -f srv-truth/c-imagine/scenes/gallery.tsv

      - name: restore NeoForge truth client runtime (cache)
        id: nfc-cache
        uses: actions/cache@v4
        with:
          path: truth-client
          key: neoforge-truth-client-1211-v2

      - name: fetch + assemble the NeoForge client runtime (cache miss)
        if: steps.nfc-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/truth/fetch-truth-client.py nfc truth-client --assets
          wc -c truth-client/classpath.txt truth-client/launch.txt
          sed -i 's/^java /java -Xmx2G /' truth-client/launch.txt

      - name: NeoForge client joins under xvfb (with the server's mods)
        run: |
          set -euo pipefail
          javac -d vtools scripts/visual/Shot.java
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri libglx-mesa0 libxtst6
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=2
          mkdir -p truth-client/game/mods
          cp srv-truth/mods/*.jar truth-client/game/mods/   # registry sync needs them
          printf 'onboardAccessibility:false\nfov:-0.625\nrenderClouds:false\n' > truth-client/game/options.txt
          python3 scripts/visual/make_servers_dat.py truth-client/game
          LAUNCH=$(cat truth-client/launch.txt)
          setsid bash -c "cd truth-client && $LAUNCH > client.out 2>&1" < /dev/null > /dev/null 2>&1 &
          for i in $(seq 1 90); do
            L=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1)
            case "$L" in *cimviewer*) break;; esac
            sleep 2
          done
          case "$L" in *cimviewer*) echo "truth client joined: $L";;
            *) tail -30 truth-client/client.out; exit 1;; esac
          for i in $(seq 1 30); do
            grep -qE "Loaded [0-9]+ advancements" truth-client/client.out 2>/dev/null && break
            sleep 2
          done
          sleep 8   # first chunk render on llvmpipe

      - name: gallery walk — spectator camera, warm-up pass, shots per wall
        run: |
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=2
          export CIM_VTOOLS=vtools
          python3 scripts/cimscene/gallery-walk.py \
            srv-truth/c-imagine/scenes/gallery.tsv rcon:127.0.0.1:25575:cimgate truth-shots
          ls -la truth-shots/

      - name: upload truth gallery artifacts (gallery.tsv = THE CELL CONTRACT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-truth
          path: |
            truth-shots/
            srv-truth/c-imagine/scenes/gallery.tsv
            truth-rcon.log
            srv-truth/boot.log

  gallery-cim:
    name: gallery — c-imagine leg (Paper 26.3 + pack carriers, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [gallery-truth]   # the truth manifest IS the cell contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-java@v4
        id: jdk25
        with:
          distribution: temurin
          java-version: 25    # paper 26.3 api + the 26.3 client are class 69

      - uses: actions/download-artifact@v4
        with:
          name: gallery-truth
          path: truth

      - name: resolve newest stable paper-api for 26.3
        id: paper
        run: |
          PV=$(bash scripts/resolve-paper-version.sh 26.3)
          echo "version=$PV" >> "$GITHUB_OUTPUT"

      - name: build plugin (maven, proven contract)
        working-directory: paper-plugin
        run: mvn -B -ntp -Dpaper.version="${{ steps.paper.outputs.version }}" package
          && test -f target/cim-paper-plugin.jar
        env:
          JAVA_HOME: ${{ steps.jdk25.outputs.path }}

      - uses: gradle/actions/setup-gradle@v4

      - name: fetch P0 Create (assets source for the pack)
        run: bash scripts/cimscene/fetch-ladder.sh mods-create create

      - name: fetch visual client runtime (piston-meta, with assets)
        run: |
          python3 scripts/fetch-visual-client.py 26.3 visual-client --assets
          wc -c visual-client/classpath.txt visual-client/launch.txt
          sed -i 's/^java /java -Xmx1G /' visual-client/launch.txt

      - uses: actions/setup-java@v4
        id: jdk25
        with:
          distribution: temurin
          java-version: 25    # the 26.3 client is class 69

      - name: fetch Paper 26.3 (fill API v3, bare)
        run: |
          set -euo pipefail
          mkdir -p srv-cim
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          echo "paper: $URL"
          curl -sL --max-time 300 -o srv-cim/paper.jar "$URL"
          wc -c srv-cim/paper.jar

      - name: stage plugin + pack (pre-boot build, deterministic)
        run: |
          set -euo pipefail
          mkdir -p srv-cim/plugins srv-cim/mods srv-cim/c-imagine/f2v
          cp paper-plugin/target/cim-paper-plugin.jar srv-cim/plugins/
          (cd test-mods/src/main/resources && zip -qr /tmp/cimtest-assets.jar assets)
          cp /tmp/cimtest-assets.jar srv-cim/mods/cimtest-1.0.0.jar
          cp mods-create/*.jar srv-cim/mods/
          cp scripts/f2v/visual-items.tsv scripts/f2v/visual-equipment.tsv scripts/f2v/visual-blocks.tsv scripts/f2v/visual-palettes.tsv srv-cim/c-imagine/f2v/
          JAVA_HOME=${{ steps.jdk25.outputs.path }} PATH=${{ steps.jdk25.outputs.path }}/bin:$PATH \
            java -cp srv-cim/plugins/cim-paper-plugin.jar dev.cim.f2v.F2vPack \
            --build srv-cim/mods srv-cim/c-imagine/f2v
          test -f srv-cim/c-imagine/f2v/pack.sha1

      - name: assemble server properties (pack + RCON)
        run: |
          SHA1=$(cat srv-cim/c-imagine/f2v/pack.sha1)
          echo "eula=true" > srv-cim/eula.txt
          cat > srv-cim/server.properties <<PROPS
          online-mode=false
          white-list=false
          difficulty=peaceful
          level-type=minecraft\:flat
          level-seed=42
          view-distance=6
          simulation-distance=4
          spawn-protection=0
          max-players=5
          enable-rcon=true
          rcon.port=25575
          rcon.password=cimgate
          resource-pack=http\://127.0.0.1\:25580/cim-f2v-pack.zip
          resource-pack-sha1=$SHA1
          PROPS

      - name: boot Paper (RCON after the port settles)
        run: |
          set -euo pipefail
          cd srv-cim
          rm -rf world world_nether world_the_end
          setsid bash -c "java -Xmx1G -jar paper.jar --nogui >> boot.log 2>&1" < /dev/null > /dev/null 2>&1 &
          cd ..
          for i in $(seq 1 120); do
            R=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1)
            [ -n "$R" ] && break
            sleep 2
          done
          [ -n "$R" ] || { tail -30 srv-cim/boot.log; exit 1; }
          grep -q "f2v pack: serving" srv-cim/boot.log || { tail -30 srv-cim/boot.log; exit 1; }
          echo "cim server up + pack serving: $R"

      - name: camera pins + force-load the gallery ground
        run: |
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "gamerule doDaylightCycle false" "time set noon" \
            "gamerule doWeatherCycle false" "weather clear" \
            "gamerule doMobSpawning false" "forceload add -64 -32 64 48" \
            | tee cim-pins.log
          # Paper unloads spawn chunks: the summons need the ground loaded
          grep -q "Marked" cim-pins.log || grep -q "forceload" cim-pins.log

      - name: pack-carrier gallery mirror (truth manifest = cell contract)
        run: |
          T=$(find truth -name gallery.tsv | head -1)
          test -n "$T" || { echo "truth gallery manifest missing"; exit 1; }
          mkdir -p srv-cim/c-imagine/scenes
          python3 scripts/cimscene/cim-gallery-walk.py "$T" \
            scripts/f2v/visual-blocks.tsv srv-cim/c-imagine/scenes/gallery.tsv -60 \
            > /tmp/summons.txt 2> mirror.log
          grep -v "^#" /tmp/summons.txt > /tmp/summons-cmds.txt
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate --f /tmp/summons-cmds.txt \
            > summons.log 2>&1
          ! grep -qE "Invalid ID|not loaded" summons.log || {
            echo "SUMMONS FAILED"; grep -E "Invalid|not loaded" summons.log | head; exit 1; }
          grep -c "MISSING-CARRIER" mirror.log || echo "0 missing carriers"

      - name: vanilla client joins under xvfb + pack accepted
        run: |
          set -euo pipefail
          javac -d vtools scripts/visual/Shot.java
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri mesa-vulkan-drivers libglx-mesa0 libxtst6
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=2
          # 26.3 (renderpearl) probes Vulkan even with the opengl launch pin —
          # mesa-vulkan-drivers above satisfies the probe; the render stays GL
          printf 'onboardAccessibility:false\nfov:-0.625\nrenderClouds:false\npreferredGraphicsBackend:opengl\n' > visual-client/game/options.txt
          python3 scripts/visual/make_servers_dat.py visual-client/game
          LAUNCH=$(cat visual-client/launch.txt)
          ARGS="${LAUNCH#java }"
          CLIENT_JAVA="${{ steps.jdk25.outputs.path }}/bin/java"
          setsid bash -c "cd visual-client && $CLIENT_JAVA $ARGS > client.out 2>&1" < /dev/null > /dev/null 2>&1 &

      - name: wait join + pack reload markers
        run: |
          for i in $(seq 1 90); do
            L=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1)
            case "$L" in *cimviewer*) break;; esac
            sleep 2
          done
          case "$L" in *cimviewer*) echo "cim client joined: $L";;
            *) tail -30 visual-client/client.out; exit 1;; esac
          # the SECOND reload line is the server pack applying (measured)
          for i in $(seq 1 30); do
            N=$(grep -c "Reloading ResourceManager" visual-client/client.out || true)
            [ "${N:-0}" -ge 2 ] && break
            sleep 2
          done
          for i in $(seq 1 30); do
            grep -qE "Loaded [0-9]+ advancements" visual-client/client.out 2>/dev/null && break
            sleep 2
          done
          sleep 8

      - name: gallery walk — spectator camera, warm-up pass, shots per wall
        run: |
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=2
          export CIM_VTOOLS=vtools
          python3 scripts/cimscene/gallery-walk.py \
            srv-cim/c-imagine/scenes/gallery.tsv rcon:127.0.0.1:25575:cimgate cim-shots
          ls -la cim-shots/

      - name: upload cim gallery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-cim
          path: |
            cim-shots/
            srv-cim/c-imagine/scenes/gallery.tsv
            mirror.log
            summons.log
            srv-cim/boot.log

  gallery-diff:
    name: gallery — pixel join (RED unless 100% inside the measured datum)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gallery-truth, gallery-cim]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gallery-truth
          path: truth

      - uses: actions/download-artifact@v4
        with:
          name: gallery-cim
          path: cim

      - name: per-cell pixel join
        run: |
          T=$(find truth -name gallery.tsv | head -1)
          C=$(find cim -name gallery.tsv | head -1)
          test -n "$T" || { echo "truth gallery manifest missing"; exit 1; }
          test -n "$C" || { echo "cim gallery manifest missing"; exit 1; }
          mkdir -p truth-shots cim-shots gallery-report
          find truth -name 'wall_*.png' -exec cp {} truth-shots/ \;
          find cim   -name 'wall_*.png' -exec cp {} cim-shots/ \;
          # geometry from the manifests; the drift datum is MEASURED on the
          # vanilla control cells of this pair of runs (no alignment fudges:
          # --datum 0 would be pure parity — the honest backlog keeps it RED)
          python3 scripts/cimscene/gallery-diff.py "$T" truth-shots "$C" cim-shots \
            gallery-report --top 40 || GATE=$?
          echo "=== worst rows ==="
          sort -t$'\t' -k8 -rn gallery-report/gallery-diff.tsv | head -20 || true
          exit ${GATE:-0}
      - name: upload gallery diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-diff-report
          path: gallery-report/
