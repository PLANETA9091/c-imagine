            # sail[south/west/down], contact[down], pole[south]) spawns
            # through the PLUGIN's own Bukkit path and renders NOTHING
            # in-page. One suspect per ONE-CELL manifest page at its real
            # wall cell: if it renders here, the page context (display
            # count / neighbours) is the poison; if not, the composite's
            # Bukkit-path bake is.
            # 14-p VANTAGE FIX: one cell per isolate needs its own camera —
            # the p9002 sail cell (-2,-54,9) sits 6 blocks ABOVE the cispot
            # (0.5,-60,0.5), a ~34 deg vertical angle that exceeds the ~27
            # deg half-cone at the contract fov (-0.65): the 14-n sailsouth
            # shot came out EMPTY (measured #64) while the cell rendered
            # (local probe). Each ENTRY now carries yaw/pitch aimed at its
            # cell: 9001 = the wall cell at (-5,-60,9) south-west, yaw 0
            # catches it right-of-center; 9002 = up and south-west,
