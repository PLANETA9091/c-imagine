              echo "$OUT" | tee "ours-rcon-e$SERIES$p.log"
              echo "$OUT" | grep -q "gallerypage-entity minecraft p$p $SERIES -> placed=" \
                || { echo "$SERIES page $p no placed marker in the RCON response"; exit 1; }
              ours_alive || { echo "ours client died on $SERIES page $p — the ours leg must never die"; exit 1; }
              sleep 5
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "ours-shots/ours-gal-e$SERIES$p.png"
              sleep 2   # 14-bf the self-consistency pair (the truth-leg mirror): the ANIMATED class needs BOTH legs' second shots
              bash scripts/visual/shot.sh "ours-shots/ours-gal-e$SERIES$p-self.png"
              echo "shot $SERIES page $p"
            done
          done
          # MOD-NAMESPACE entity replay (per ladder ns): the staged
          # manifests are the page set; modded types count as nochannel
          # (honest backlog the join names) — the replay still runs + shoots
          # every page.
          for SERIES in mobs dyn large; do
            TAG=$([ "$SERIES" = mobs ] && echo entity || echo entity$SERIES)
            for NS in $LADDER_NS; do
              EX=0
              for p in $(seq $SI $K $MAXP); do
                M="srv-wall/c-imagine/scenes/gallery-$TAG-$NS-p$p.tsv"
                [ -f "$M" ] || { echo "no manifest for $NS $SERIES page $p — exhausted"; EX=1; break; }
                OUT=$(rcon "kill @e[type=!player]" "cim galleryclear" \
                  "cim gallerypage-entity $NS $p $SERIES")
                echo "$OUT" | tee "ours-rcon-e$SERIES-$NS$p.log"
                # THE MARKER CONTRACT (measured #34: create mobs died here):
                # the plugin prints the series tag ONLY for dyn/large — a mobs
                # call answers tag-less ("create p0 -> placed="), exactly like
                # the vanilla mob gate. The expected marker must follow the
                # series, or create mobs is a false red forever.
                STAG=$([ "$SERIES" = mobs ] && echo "" || echo " $SERIES")
                echo "$OUT" | grep -q "gallerypage-entity $NS p$p$STAG -> placed=" \
                  || { echo "$NS $SERIES page $p no placed marker"; exit 1; }
                ours_alive || { echo "ours client died on $NS $SERIES page $p — the ours leg must never die"; exit 1; }
                sleep 4
                rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
                bash scripts/visual/shot.sh "ours-shots/ours-gal-e$SERIES-$NS$p.png"
                test -s "ours-shots/ours-gal-e$SERIES-$NS$p.png" || { echo "$NS $SERIES page $p shot missing"; exit 1; }
                echo "shot $NS $SERIES page $p"
              done
              [ "$EX" = "1" ] || { echo "ours $NS $SERIES replay hit the MAXP cap"; exit 1; }
            done
          done
          # the last entity page is still standing here. Kill it NOW and let
          # its death-poof particles expire: killed at the first item page,
          # they land inside the shot at random positions on either leg
          rcon "kill @e[type=!player]" >/dev/null 2>&1
          sleep 3
          # ITEM replay (per ladder ns): the pack's item channel carries
          # every item; missing pack rows count as nochannel and the join
          # names them.
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq $SI $K $MAXP); do
              M="srv-wall/c-imagine/scenes/gallery-item-$NS-p$p.tsv"
              [ -f "$M" ] || { echo "no manifest for $NS item page $p — exhausted"; EX=1; break; }
              OUT=$(rcon "kill @e[type=!player]" "cim galleryclear" \
                "cim gallerypage-item $NS $p")
              echo "$OUT" | tee "ours-rcon-i-$NS$p.log"
              echo "$OUT" | grep -q "gallerypage-item $NS p$p -> placed=" \
                || { echo "$NS item page $p no placed marker"; exit 1; }
              ours_alive || { echo "ours client died on $NS item page $p — the ours leg must never die"; exit 1; }
              sleep 1   # static item displays settle like the block pages
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "ours-shots/ours-gal-i-$NS$p.png"
              # HELD replay (truth-leg mirror, DIAGNOSTIC): the plugin
              # stages the SAME manifest row's item as the pack CMD carrier
              # into hotbar slot 0; restore the HUD, press "1", shoot
              # first-person (held=<item> cmd=<n|nochannel> names the row)
              HOUT=$(rcon "cim gallerypage-held $NS $p")
              echo "$HOUT" | tee "ours-rcon-held-$NS$p.log" || true
              java -cp vtools Key F1 1 || true   # one JVM for the pair (14-bt)
              sleep 1
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "ours-shots/ours-gal-h-$NS$p.png" \
                || echo "$NS held page $p shot failed (diagnostic tolerated)"
              java -cp vtools Key F1 || true   # hide the HUD again
              test -s "ours-shots/ours-gal-i-$NS$p.png" || { echo "$NS item page $p shot missing"; exit 1; }
              echo "shot $NS item page $p"
            done
            [ "$EX" = "1" ] || { echo "ours $NS item replay hit the MAXP cap"; exit 1; }
          done
          # PARTICLE replay (per ladder ns): no mod-particle channel on
          # Paper — every cell is nochannel, the shot shows the honestly
          # empty wall and the join names every cell (the backlog is
          # VISIBLE). The FIXED 1s shot window mirrors the truth leg.
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq $SI $K $MAXP); do
              M="srv-wall/c-imagine/scenes/gallery-particle-$NS-p$p.tsv"
              [ -f "$M" ] || { echo "no manifest for $NS particle page $p — exhausted"; EX=1; break; }
              OUT=$(rcon "kill @e[type=!player]" "cim galleryclear" \
                "cim gallerypage-particle $NS $p")
              echo "$OUT" | tee "ours-rcon-pa-$NS$p.log"
              echo "$OUT" | grep -q "gallerypage-particle $NS p$p -> placed=" \
                || { echo "$NS particle page $p no placed marker"; exit 1; }
              ours_alive || { echo "ours client died on $NS particle page $p — the ours leg must never die"; exit 1; }
              sleep 1   # THE FIXED SHOT WINDOW (mirror of the truth leg)
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "ours-shots/ours-gal-pa-$NS$p.png"
              test -s "ours-shots/ours-gal-pa-$NS$p.png" || { echo "$NS particle page $p shot missing"; exit 1; }
              sleep 2   # 14-dx the particle self pair (truth-leg mirror — the same 2s window after the main shot, the 14-bw fluid pair's contract)
              bash scripts/visual/shot.sh "ours-shots/ours-gal-pa-$NS$p-self.png"
              echo "shot $NS particle page $p"
            done
            [ "$EX" = "1" ] || { echo "ours $NS particle replay hit the MAXP cap"; exit 1; }
          done
          # FLUID replay (per ladder ns): vanilla-namespace block rows become
          # REAL sealed liquid states on Paper (the same glass cases the
          # truth leg builds); mod fluids/buckets are nochannel (honest
          # backlog the join names). FIXED 1s shot window (mirror of the
          # truth leg).
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq $SI $K $MAXP); do
              M="srv-wall/c-imagine/scenes/gallery-fluid-$NS-p$p.tsv"
              [ -f "$M" ] || { echo "no manifest for $NS fluid page $p — exhausted"; EX=1; break; }
              OUT=$(rcon "kill @e[type=!player]" "cim galleryclear" \
                "cim gallerypage-fluid $NS $p")
              echo "$OUT" | tee "ours-rcon-fl-$NS$p.log"
              echo "$OUT" | grep -q "gallerypage-fluid $NS p$p -> placed=" \
                || { echo "$NS fluid page $p no placed marker"; exit 1; }
              ours_alive || { echo "ours client died on $NS fluid page $p — the ours leg must never die"; exit 1; }
              sleep 1   # THE FIXED SHOT WINDOW (mirror of the truth leg)
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "ours-shots/ours-gal-fl-$NS$p.png"
              test -s "ours-shots/ours-gal-fl-$NS$p.png" || { echo "$NS fluid page $p shot missing"; exit 1; }
              sleep 2   # 14-bw the fluid self-consistency pair (the truth-leg mirror)
              bash scripts/visual/shot.sh "ours-shots/ours-gal-fl-$NS$p-self.png"
              echo "shot $NS fluid page $p"
            done
            [ "$EX" = "1" ] || { echo "ours $NS fluid replay hit the MAXP cap"; exit 1; }
          done
          # SOUND replay (per ladder ns, DIAGNOSTIC): the plugin sends one
          # REAL ClientboundSoundPacket per manifest cell through the
          # visual-sounds.tsv rewrite (a stale seed without the mapping
          # file keeps the honestly-empty log) and records the post-rewrite
          # id the vanilla client received — the SAME artifact shape the
          # truth mixin writes. The join is sound-diff.py in the inline
          # step.
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq $SI $K $MAXP); do
              M="srv-wall/c-imagine/scenes/gallery-sound-$NS-p$p.tsv"
              [ -f "$M" ] || { echo "no manifest for $NS sound page $p — exhausted"; EX=1; break; }
              OUT=$(rcon "cim gallerypage-sound $NS $p")
              echo "$OUT" | tee "ours-rcon-s-$NS$p.log"
              echo "$OUT" | grep -q "gallerypage-sound $NS p$p -> placed=" \
                || { echo "$NS sound page $p no placed marker"; exit 1; }
              ours_alive || { echo "ours client died on $NS sound page $p — the ours leg must never die"; exit 1; }
              echo "replayed $NS sound page $p (no shot: the stream IS the picture)"
            done
            [ "$EX" = "1" ] || { echo "ours $NS sound replay hit the MAXP cap"; exit 1; }
          done
          # GUI replay (per ladder ns, DIAGNOSTIC): the plugin draws the scanned
          # screen for the menu the truth leg recorded. It lives on the HUD,
          # so F1 must be off, and Esc would open the pause menu instead.
          java -cp vtools Key F1 || true
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq $SI $K $MAXP); do
              M="srv-wall/c-imagine/scenes/gallery-gui-$NS-p$p.tsv"
              [ -f "$M" ] || { echo "no manifest for $NS gui page $p — exhausted"; EX=1; break; }
              OUT=$(rcon "cim gallerypage-gui $NS $p")
              echo "$OUT" | tee "ours-rcon-gui-$NS$p.log"
              echo "$OUT" | grep -q "gallerypage-gui $NS p$p -> placed=" \
                || { echo "$NS gui page $p no placed marker"; exit 1; }
              ours_alive || { echo "ours client died on $NS gui page $p — the ours leg must never die"; exit 1; }
              sleep 2   # the screen-settle window (mirror of the truth leg)
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "ours-shots/ours-gal-gui-$NS$p.png" \
                || echo "$NS gui page $p shot failed (diagnostic tolerated)"
            done
            [ "$EX" = "1" ] || { echo "ours $NS gui replay hit the MAXP cap"; exit 1; }
          done
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "cim guiclose" >/dev/null 2>&1 || true
          java -cp vtools Key F1 || true
          # BIOME-TINT replay (per ladder ns, DIAGNOSTIC): the plugin places
          # the SAME sample rig (real vanilla blocks) and counts every
          # modded biome nochannel; the shot shows the honestly untinted rig.
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq $SI $K $MAXP); do
              M="srv-wall/c-imagine/scenes/gallery-biome-$NS-p$p.tsv"
              [ -f "$M" ] || { echo "no manifest for $NS biome page $p — exhausted"; EX=1; break; }
              OUT=$(rcon "cim gallerypage-biome $NS $p")
              echo "$OUT" | tee "ours-rcon-b-$NS$p.log"
              echo "$OUT" | grep -q "gallerypage-biome $NS p$p -> placed=" \
                || { echo "$NS biome page $p no placed marker"; exit 1; }
              ours_alive || { echo "ours client died on $NS biome page $p — the ours leg must never die"; exit 1; }
              sleep 1   # the biome-sync window (mirror of the truth leg)
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "ours-shots/ours-gal-b-$NS$p.png" \
                || echo "$NS biome page $p shot failed (diagnostic tolerated)"
            done
            [ "$EX" = "1" ] || { echo "ours $NS biome replay hit the MAXP cap"; exit 1; }
          done
          # INVENTORY replay (per ladder ns, DIAGNOSTIC): the plugin fills
          # the viewer's REAL inventory slots from the SAME manifest rows
          # (each item as the pack's CMD carrier — the item channel), then
          # the same E/settle/shot/ESC sequence as the truth leg. The F1 pin
          # mirrors the truth leg (HUD visible).
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq $SI $K $MAXP); do
              M="srv-wall/c-imagine/scenes/gallery-inv-$NS-p$p.tsv"
              [ -f "$M" ] || { echo "no manifest for $NS inv page $p — exhausted"; EX=1; break; }
              OUT=$(rcon "cim gallerypage-inv $NS $p")
              echo "$OUT" | tee "ours-rcon-inv-$NS$p.log"
              echo "$OUT" | grep -q "gallerypage-inv $NS p$p -> placed=" \
                || { echo "$NS inv page $p no placed marker"; exit 1; }
              ours_alive || { echo "ours client died on $NS inv page $p — the ours leg must never die"; exit 1; }
              java -cp vtools Key F1 E || true   # one JVM for the pair (14-bt; adjacent presses only)
              sleep 2   # the inventory screen renders (fixed window, BOTH legs)
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "ours-shots/ours-gal-inv-$NS$p.png" \
                || echo "$NS inv page $p shot failed (diagnostic tolerated)"
              java -cp vtools Key ESC || true
            done
            [ "$EX" = "1" ] || { echo "ours $NS inv replay hit the MAXP cap"; exit 1; }
          done
          ls ours-shots/ | wc -l

      - name: shot listing
        run: |
          (cd ours-shots && ls *.png > shots.txt.tmp && mv shots.txt.tmp shots.txt)
          wc -l ours-shots/shots.txt

      - name: wait for this shard's truth artifacts (14-aa race guard)
        run: |
          set -euo pipefail
          # The render-settled truth walk (up to 8 shots per page) can finish
          # AFTER its ours sibling reaches the join: #73 lost 7 of 8 joins to
          # "Artifact not found" (the ours leg overtook the truth leg and the
          # download raced a not-yet-registered artifact). Poll the API until
          # BOTH artifacts exist, bounded 30 min.
          for ART in "wall-truth-shots-${{ matrix.shard }}" "wall-truth-meta-${{ matrix.shard }}"; do
            OK=""
            for i in $(seq 1 90); do
              N=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" \
                    "$GITHUB_API_URL/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for a in d['artifacts'] if a['name']=='$ART' and not a['expired']))" || echo 0)
              if [ "${N:-0}" -ge 1 ]; then OK=1; echo "artifact $ART present"; break; fi
              sleep 20
            done
            [ -n "$OK" ] || { echo "TIMEOUT waiting for artifact $ART"; exit 1; }
          done

      - name: download this shard's truth artifacts (shots + meta)
        uses: actions/download-artifact@v4
        with:
          name: wall-truth-shots-${{ matrix.shard }}
          path: truth-shots

      - name: download this shard's truth meta (manifests + boot log)
        uses: actions/download-artifact@v4
        with:
          name: wall-truth-meta-${{ matrix.shard }}
          path: truth-meta

      - name: INLINE pixel join — this shard's stride, gate-hard
        run: |
          set -euo pipefail
          pip install -q numpy pillow
          mkdir -p gallery-report
          GATE=0
          # A failed item bake is one root cause, not N pixel reds: every
          # cell shares the paper definition, so a single atlas-mixing model
          # turns the whole walk into missing-model cubes. Name it up front;
          # the pages still join below for the forensics.
          if grep -qa "Unable to bake item model" visual-client/client.out; then
            echo "::error::item model bake failed on the real client — per-cell REDs below are its fallout"
            grep -a -A1 "Unable to bake item model" visual-client/client.out | cut -c1-200
            GATE=1
          fi
          # A failed ATLAS upload kills the reload and the client re-enters a
          # vanilla-only reload (the server pack is dropped): measured run
          # 42099936223, three re-hosted mcmeta with "frames": [] crashed
          # SpriteContents.uploadFirstFrame and every cell rendered the paper
          # fallback. Name it up front the same way.
          if grep -qa "not large enough to write a rectangle" visual-client/client.out; then
            echo "::error::atlas upload failed on the real client — the server pack was dropped, every cell renders vanilla (paper); per-cell REDs below are its fallout"
            grep -a -B2 "not large enough to write a rectangle" visual-client/client.out | cut -c1-200
            GATE=1
          fi
          echo "=== BLOCK pages (stride $SI +$K): manifest-driven, per ladder ns (the FRESH truth manifests ARE the page set) ==="
          for NS in $LADDER_NS; do
            for p in $(seq $SI $K $MAXP); do
              T="truth-shots/gal-p-$NS$p.png"
              O="ours-shots/ours-gal-p-$NS$p.png"
              M="truth-meta/srv-wall/c-imagine/scenes/gallery-$NS-p$p.tsv"
              # the stride's exhausted page has NO manifest and NO shots on
              # EITHER leg (the terminal page is never placed) — that is the
              # same exhaustion signal the replays break on, not a hole
              test -f "$M" || { echo "$NS page $p: no truth manifest — stride exhausted here"; break; }
              test -f "$T" || { echo "missing $NS truth shot p$p"; GATE=1; continue; }
              test -f "$O" || { echo "missing $NS ours shot p$p"; GATE=1; continue; }
              # determinism probes: page 0 ONLY (the -again shots are page 0
              # re-placements); a probe against another page compares different
              # content and is meaningless
              if [ "$p" = "0" ] && [ -f "truth-shots/gal-p-${NS}0-again.png" ]; then
                python3 scripts/cimscene/gallery-diff.py --truth "$T" \
                  --ours "truth-shots/gal-p-${NS}0-again.png" --manifest "$M" \
                  --out "gallery-report/determinism-truth-$NS-p0.json" || true
              fi
              if [ "$p" = "0" ] && [ -f "ours-shots/ours-gal-p-${NS}0-again.png" ]; then
                python3 scripts/cimscene/gallery-diff.py --truth "$O" \
                  --ours "ours-shots/ours-gal-p-${NS}0-again.png" --manifest "$M" \
                  --out "gallery-report/determinism-ours-$NS-p0.json" || true
              fi
              # 14-br THE BLOCK SELF-CONSISTENCY PAIR: the anim probes already
              # shoot t0/t1 2s apart on BOTH legs for every dyn=1 page — feed
              # the second frames to the join so a cell that MOVES AGAINST
              # ITSELF (either leg) demotes to ANIMATED with evidence, the
              # 14-bf law's honest escape hatch. Static cells (settled doors,
              # unpowered machines) keep their self_ae ~0 and stay gated.
              SELF_T=""; SELF_O=""
              [ -f "truth-shots/gal-p-$NS$p-t1.png" ] && SELF_T="--truth-self truth-shots/gal-p-$NS$p-t1.png"
              [ -f "ours-shots/ours-gal-p-$NS$p-t1.png" ] && SELF_O="--ours-self ours-shots/ours-gal-p-$NS$p-t1.png"
              python3 scripts/cimscene/gallery-diff.py --truth "$T" --ours "$O" \
                --manifest "$M" \
                --replay-manifests srv-wall/c-imagine/scenes \
                --out "gallery-report/join-$NS-p$p.json" \
                --diff-dir "gallery-report/diff-$NS-p$p" --gate-dyn \
                --demote-family '^dynamictrees:[a-z_0-9]*(leaves|branch|root|trunk|sapling|pod|cocoa)[a-z_0-9]*(?:\[|$)' \
                --demote-family '^biomesoplenty:[a-z_0-9]*(leaves|vine)[a-z_0-9]*\[.*mossy=true[,\]]' \
                $SELF_T $SELF_O || GATE=1
            done
          done
          echo "=== ENTITY pages: the same gate, no channel excuses ==="
          for p in $(seq $SI $K $((EPAGES-1))); do
            T="truth-shots/gal-e$p.png"
            O="ours-shots/ours-gal-e$p.png"
            M="truth-meta/srv-wall/c-imagine/scenes/gallery-entity-minecraft-p$p.tsv"
            test -f "$T" || { echo "missing truth mob shot p$p"; GATE=1; continue; }
            test -f "$O" || { echo "missing ours mob shot p$p"; GATE=1; continue; }
            test -f "$M" || { echo "missing mob manifest p$p"; GATE=1; continue; }
            if [ "$p" = "0" ] && [ -f "truth-shots/gal-e0-again.png" ]; then
              python3 scripts/cimscene/gallery-diff.py --truth "$T" \
                --ours truth-shots/gal-e0-again.png --manifest "$M" \
                --out "gallery-report/determinism-truth-e0.json" \
                --pitch 2 --gate 240000 || true
            fi
            if [ "$p" = "0" ] && [ -f "ours-shots/ours-gal-e0-again.png" ]; then
              python3 scripts/cimscene/gallery-diff.py --truth "$O" \
                --ours ours-shots/ours-gal-e0-again.png --manifest "$M" \
                --out "gallery-report/determinism-ours-e0.json" \
                --pitch 2 --gate 240000 || true
            fi
            # 14-aj: the self-consistency pair (each leg's second shot) drives
            # the ANIMATED class — a cell that moves against ITSELF is a mob
            # idle animation, never a channel defect (its gate is the
            # real-client leg; the ours-vs-truth ANIM probe below covers the
            # SHOULD-move block pages, a different question)
            SELF_T=""; SELF_O=""
            [ -f "truth-shots/gal-e$p-self.png" ] && SELF_T="--truth-self truth-shots/gal-e$p-self.png"
            [ -f "ours-shots/ours-gal-e$p-self.png" ] && SELF_O="--ours-self ours-shots/ours-gal-e$p-self.png"
            python3 scripts/cimscene/gallery-diff.py --gate-dyn --truth "$T" --ours "$O" $SELF_T $SELF_O \
              --manifest "$M" --out "gallery-report/join-e$p.json" \
              --diff-dir "gallery-report/diff-e$p" \
              --pitch 2 --gate 240000 || GATE=1
          done
          echo "=== DYN + LARGE pages (minecraft): THE GATE since 14-bf — vanilla non-Mob entities both legs render (mod-ns dyn/large stay diagnostic below) ==="
          for p in $(seq $SI $K $((EDPAGES-1))); do
            for SERIES in dyn large; do
              T="truth-shots/gal-e$SERIES$p.png"
              O="ours-shots/ours-gal-e$SERIES$p.png"
              M="truth-meta/srv-wall/c-imagine/scenes/gallery-entity$SERIES-minecraft-p$p.tsv"
              test -f "$T" || { echo "missing truth $SERIES shot p$p"; GATE=1; continue; }
              test -f "$O" || { echo "missing ours $SERIES shot p$p"; GATE=1; continue; }
              test -f "$M" || { echo "missing $SERIES manifest p$p"; GATE=1; continue; }
              # 14-bf the ANIMATED flags (the mob-join pattern): a vanilla
              # entity that moved against ITSELF on either leg is animation
              # phase, never a channel defect — the join demotes to ANIMATED
              # instead of a false gate red
              SELF_T=""; SELF_O=""
              [ -f "truth-shots/gal-e$SERIES$p-self.png" ] && SELF_T="--truth-self truth-shots/gal-e$SERIES$p-self.png"
              [ -f "ours-shots/ours-gal-e$SERIES$p-self.png" ] && SELF_O="--ours-self ours-shots/ours-gal-e$SERIES$p-self.png"
              python3 scripts/cimscene/gallery-diff.py --gate-dyn --truth "$T" --ours "$O" $SELF_T $SELF_O \
                --manifest "$M" --out "gallery-report/join-e-$SERIES-minecraft-p$p.json" \
                --diff-dir "gallery-report/diff-e-$SERIES-minecraft-p$p" \
                --pitch 2 --gate 240000 || GATE=1
            done
          done
          echo "=== MOD-NAMESPACE entity pages (per ladder ns): mobs = the gate, dyn/large = diagnostic ==="
          for NS in $LADDER_NS; do
            for SERIES in mobs dyn large; do
              TAG=$([ "$SERIES" = mobs ] && echo entity || echo entity$SERIES)
              for M in $(find truth-meta -name "gallery-$TAG-$NS-p*.tsv" | sort -V); do
                B=$(basename "$M" .tsv); p=${B##*-p}
                # only THIS shard's stride pages were shot — filter by the stride
                T="truth-shots/gal-e$SERIES-$NS$p.png"
                O="ours-shots/ours-gal-e$SERIES-$NS$p.png"
                if [ -f "$T" ] && [ -f "$O" ]; then
                  if [ "$SERIES" = mobs ]; then
                    python3 scripts/cimscene/gallery-diff.py --gate-dyn --truth "$T" --ours "$O" \
                      --manifest "$M" --out "gallery-report/join-e-$NS-$p.json" \
                      --diff-dir "gallery-report/diff-e-$NS-$p" \
                      --pitch 2 --gate 240000 || GATE=1
                  else
                    python3 scripts/cimscene/gallery-diff.py --truth "$T" --ours "$O" \
                      --manifest "$M" --out "gallery-report/diag-e-$NS-$SERIES-$p.json" \
                      --diff-dir "gallery-report/diff-e-$NS-$SERIES-$p" \
                      --pitch 2 --gate 240000 || true
                  fi
                elif [ "$SERIES" = mobs ]; then
                  echo "$NS mobs page $p shots missing"; GATE=1
                else
                  echo "$NS $SERIES page $p shots missing (diagnostic tolerated)"
                fi
              done
            done
          done
          echo "=== ITEM pages: the item channel's gate (CMD rows generated from the same manifests) ==="
          for NS in $LADDER_NS; do
            for M in $(find truth-meta -name "gallery-item-$NS-p*.tsv" | sort -V); do
              B=$(basename "$M" .tsv); p=${B##*-p}
              T="truth-shots/gal-i-$NS$p.png"
              O="ours-shots/ours-gal-i-$NS$p.png"
              test -f "$T" || { echo "missing $NS truth item shot p$p"; GATE=1; continue; }
              test -f "$O" || { echo "missing $NS ours item shot p$p"; GATE=1; continue; }
              python3 scripts/cimscene/gallery-diff.py --gate-dyn --truth "$T" --ours "$O" \
                --manifest "$M" --out "gallery-report/join-item-$NS-p$p.json" \
                --diff-dir "gallery-report/diff-item-$NS-p$p" || GATE=1
            done
          done
          echo "=== PARTICLE pages: diagnostic join (dyn class, fixed 1s shot window) ==="
          for NS in $LADDER_NS; do
            for M in $(find truth-meta -name "gallery-particle-$NS-p*.tsv" | sort -V); do
              B=$(basename "$M" .tsv); p=${B##*-p}
              T="truth-shots/gal-pa-$NS$p.png"
              O="ours-shots/ours-gal-pa-$NS$p.png"
              if [ -f "$T" ] && [ -f "$O" ]; then
                # 14-dx the particle self-consistency pair: feed the second
                # frames when present so a cell that moves against ITSELF on
                # either leg demotes to ANIMATED (the 14-bw fluid join's
                # contract verbatim) — absent frames keep the page exactly
                # as before, the demotion only ever rides measured pairs
                ST=""; SO=""
                [ -f "truth-shots/gal-pa-$NS$p-self.png" ] && ST="--truth-self truth-shots/gal-pa-$NS$p-self.png"
                [ -f "ours-shots/ours-gal-pa-$NS$p-self.png" ] && SO="--ours-self ours-shots/ours-gal-pa-$NS$p-self.png"
                python3 scripts/cimscene/gallery-diff.py --truth "$T" --ours "$O" \
                  --manifest "$M" $ST $SO --out "gallery-report/diag-particle-$NS-p$p.json" || true
              else
                echo "$NS particle page $p shots missing (tolerated: diagnostic)"
              fi
            done
          done
          echo "=== FLUID pages: gated join, no missing-shot excuses (dyn class, fixed 1s shot window, pitch-2 cases) ==="
          for NS in $LADDER_NS; do
            for M in $(find truth-meta -name "gallery-fluid-$NS-p*.tsv" | sort -V); do
              B=$(basename "$M" .tsv); p=${B##*-p}
              T="truth-shots/gal-fl-$NS$p.png"
              O="ours-shots/ours-gal-fl-$NS$p.png"
              test -f "$T" || { echo "missing $NS truth fluid shot p$p"; GATE=1; continue; }
              test -f "$O" || { echo "missing $NS ours fluid shot p$p"; GATE=1; continue; }
              # 14-bw the fluid self-consistency pair: feed the second frames
              # when present so a cell that moves against ITSELF on either leg
              # demotes to ANIMATED (the 14-bf law's honest escape hatch) —
              # absent frames keep the page gated exactly as before
              ST=""; SO=""
              [ -f "truth-shots/gal-fl-$NS$p-self.png" ] && ST="--truth-self truth-shots/gal-fl-$NS$p-self.png"
              [ -f "ours-shots/ours-gal-fl-$NS$p-self.png" ] && SO="--ours-self ours-shots/ours-gal-fl-$NS$p-self.png"
              python3 scripts/cimscene/gallery-diff.py --gate-dyn --truth "$T" --ours "$O" \
                --manifest "$M" --out "gallery-report/join-fluid-$NS-p$p.json" \
                --diff-dir "gallery-report/diff-fluid-$NS-p$p" \
                $ST $SO --pitch 2 --gate 240000 || GATE=1
            done
          done
          echo "=== SOUND pages: census-style stream join (DIAGNOSTIC — the flip law lives in coverage-gate.py) ==="
          for NS in $LADDER_NS; do
            for M in $(find truth-meta -name "gallery-sound-$NS-p*.tsv" | sort -V); do
              B=$(basename "$M" .tsv); p=${B##*-p}
              TL="truth-meta/srv-wall/c-imagine/scenes/gallery-sound-$NS-p$p.log"
              OL="srv-wall/c-imagine/scenes/gallery-sound-$NS-p$p.log"
              if [ -f "$TL" ] && [ -f "$OL" ]; then
                # --map + --gate-mapped: THE FLIPPED VERDICT — GREEN iff the
                # ours stream answers every truth event's mapped vanilla
                # target at the same position (raw modded-id equality is
                # impossible by construction: truth records modded ids,
                # ours records the post-rewrite vanilla ids). The sound
                # flip law: flip after mapped-identity measured stable on
                # two consecutive runs; SOUND_FLIP=on is the single switch. FLIPPED 2026-11-07:
                # the last two full runs measured mapped-identity PERFECT in all six
                # namespaces (#214, #226 — position_hits == expected, order_exact on
                # every diag; the #226 preview: ae2 1/1, bop 11/11, combat_roll 2/2,
                # create 77/77, dynamictrees 11/11, mekanism 46/46) — the report-only
                # preview had zero disagreements to show, the gate rides it now.
                GATE_FLAG=""
                [ "$SOUND_FLIP" = "on" ] && GATE_FLAG="--gate-mapped"
                python3 scripts/cimscene/sound-diff.py --truth "$TL" --ours "$OL" \
                  --ns "$NS" --page "$p" \
                  --map "srv-wall/c-imagine/f2v/visual-sounds.tsv" $GATE_FLAG \
                  --out "gallery-report/diag-sound-$NS-p$p.json" || true
              else
                echo "$NS sound page $p capture logs missing (tolerated: diagnostic)"
              fi
            done
          done
          echo "=== PARTICLE-STREAM pages: census-style stream join (DIAGNOSTIC — the sound flip law, same shape) ==="
          for NS in $LADDER_NS; do
            for M in $(find truth-meta -name "gallery-particle-$NS-p*.tsv" | sort -V); do
              B=$(basename "$M" .tsv); p=${B##*-p}
              TL="truth-meta/srv-wall/c-imagine/scenes/gallery-particle-$NS-p$p.log"
              OL="srv-wall/c-imagine/scenes/gallery-particle-$NS-p$p.log"
              if [ -f "$TL" ] && [ -f "$OL" ]; then
                python3 scripts/cimscene/particle-diff.py --truth "$TL" --ours "$OL" \
                  --ns "$NS" --page "$p" \
                  --map "srv-wall/c-imagine/f2v/visual-particles.tsv" \
                  --out "gallery-report/diag-pstream-$NS-p$p.json" || true
              else
                echo "$NS particle-stream page $p capture logs missing (tolerated: diagnostic)"
              fi
            done
          done
          echo "=== ANIM liveness probe join (DIAGNOSTIC — kinetic pages only, manifest-driven) ==="
          for NS in $LADDER_NS; do
            for M in $(find truth-meta -name "gallery-$NS-p*.tsv" | sort -V); do
              B=$(basename "$M" .tsv); p=${B##*-p}
              T0="truth-shots/gal-p-$NS$p-t0.png"
              O0="ours-shots/ours-gal-p-$NS$p-t0.png"
              T1="truth-shots/gal-p-$NS$p-t1.png"
              O1="ours-shots/ours-gal-p-$NS$p-t1.png"
              if [ -f "$T0" ] && [ -f "$T1" ] && [ -f "$O0" ] && [ -f "$O1" ]; then
                python3 scripts/cimscene/anim-diff.py --truth-t0 "$T0" --truth-t1 "$T1" \
                  --ours-t0 "$O0" --ours-t1 "$O1" --ns "$NS" --page "$p" \
                  --out "gallery-report/diag-anim-$NS-p$p.json" || true
              fi
            done
          done
          echo "=== INVENTORY pages: full-frame + per-slot GUI join (DIAGNOSTIC — geometry/gates FIRST-RUN-UNMEASURED, see inv-diff.py) ==="
          for NS in $LADDER_NS; do
            for M in $(find truth-meta -name "gallery-inv-$NS-p*.tsv" | sort -V); do
              B=$(basename "$M" .tsv); p=${B##*-p}
              T="truth-shots/gal-inv-$NS$p.png"
              O="ours-shots/ours-gal-inv-$NS$p.png"
              if [ -f "$T" ] && [ -f "$O" ]; then
                python3 scripts/cimscene/inv-diff.py --truth "$T" --ours "$O" \
                  --ns "$NS" --page "$p" \
                  --out "gallery-report/diag-inv-$NS-p$p.json" || true
              else
                echo "$NS inv page $p shots missing (tolerated: diagnostic)"
              fi
            done
          done
          echo "=== HELD/GUI/BIOME pages: full-frame framediff join (DIAGNOSTIC — the classes are shot on both legs with no per-cell contract; framediff.py measures the whole frame, EMPTY names the dead side) ==="
          for KLASS in held gui biome; do
            case "$KLASS" in
              held)  STEM="h";   MAN="item" ;;   # held rides the item pages
              gui)   STEM="gui"; MAN="gui" ;;
              biome) STEM="b";   MAN="biome" ;;
            esac
            for NS in $LADDER_NS; do
              for M in $(find truth-meta -name "gallery-$MAN-$NS-p*.tsv" | sort -V); do
                B=$(basename "$M" .tsv); p=${B##*-p}
                T="truth-shots/gal-$STEM-$NS$p.png"
                O="ours-shots/ours-gal-$STEM-$NS$p.png"
                if [ -f "$T" ] && [ -f "$O" ]; then
                  python3 scripts/cimscene/framediff.py --truth "$T" --ours "$O" \
                    --ns "$NS" --page "$p" --class-name "$KLASS" \
                    --out "gallery-report/diag-$KLASS-$NS-p$p.json" || true
                else
                  echo "$NS $KLASS page $p shots missing (tolerated: diagnostic)"
                fi
              done
            done
          done
          echo "=== MENU gate: every menu pixel-identical or RED ==="
          # 14-di: the run's own screen art (when the truth walk dumped it)
          # bounds the judgement first; the seed's captures stay the fallback
          RUN_ART=""
          [ -d truth-meta/truth-screens ] && RUN_ART="--art-run truth-meta/truth-screens"
          python3 scripts/cimscene/menu-sheet.py --meta truth-meta --truth truth-shots \
            --ours ours-shots --art seed-pack/screens $RUN_ART --stride "$SI/$K" --out gallery-report/menus \
            --report gallery-report --ns "$LADDER_NS" || GATE=1
          cat gallery-report/menus/menus.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo "=== per-page verdicts (this shard) ==="
          python3 - <<'PY'
          import glob, json
          for f in sorted(glob.glob('gallery-report/join-*.json')):
              r = json.load(open(f))
              print(f, r['verdict'], 'cells=%d red=%d dynamic=%d skipped=%d'
                    % (r['cells'], r['red'], r['dynamic'], r['skipped']))
              for row in r['rows']:
                  if row['verdict'] == 'RED':
                      print('  RED', row.get('state'), 'ae=%s' % row.get('ae'))
          PY
          echo "gate=$GATE"
          exit $GATE

      - name: shard gate JSON
        if: always()
        run: |
          mkdir -p gallery-report
          python3 - <<'PY'
          import glob, json, os
          # job.status: 'success' only when the INLINE join step passed its
          # gate; a failed join (pixel reds, missing shots) must land as
          # gate=1 here — the verdict job ANDs these JSONs
          gate = 1 if os.environ.get('JOIN_OK', '') != 'success' else 0
          reds = []
          pages = 0
          for f in sorted(glob.glob('gallery-report/join-*.json')):
              try:
                  r = json.load(open(f))
              except Exception as e:
                  reds.append(f"{f}: unreadable ({e})"); gate = 1; continue
              pages += 1
              if r['verdict'] != 'GREEN':
                  for row in r['rows']:
                      if row['verdict'] == 'RED':
                          reds.append(f"{row.get('state')} ae={row.get('ae')}")
          shard = os.environ.get('SI', '?')
          json.dump({"shard": shard, "gate": gate, "join_pages": pages,
                     "reds": reds[:200]},
                    open('gallery-report/gate.json', 'w'), indent=1)
          print(json.dumps({"shard": shard, "gate": gate,
                            "join_pages": pages, "reds": len(reds)}))
          PY
        env:
          JOIN_OK: ${{ job.status }}

      - name: upload ours shots s${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-ours-shots-${{ matrix.shard }}
          path: |
            ours-shots/
            ours-rcon-*.log
          if-no-files-found: warn

      - name: upload ours meta s${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-ours-meta-${{ matrix.shard }}
          path: |
            srv-wall/boot.log
            ours-pins.log
            ground-fill.log
            visual-client/client.out
            ours-shots/shots.txt
            # the stream logs (sound + particle capture): the census-style
            # joins read them inline, the artifacts keep them inspectable
            srv-wall/c-imagine/scenes/
          if-no-files-found: warn

      - name: upload shard report s${{ matrix.shard }} (joins + triptychs + gate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-report-${{ matrix.shard }}
          path: gallery-report/
          if-no-files-found: warn

  # ---------------------------------------------------------- wall-verdict --
  # THE JOIN: coverage gate over the MERGED ledger (manifests fresh from the
  # truth shards, boot logs merged across shards, shot LISTS per the
  # coverage-gate.py shard-shot-list contract) + every shard's gate JSON.
  # RED unless ALL shards reported green AND every class walked to
  # exhaustion. A missing shard report is RED — a hole in the wall is not a
  # green verdict.
  wall-verdict:
    name: gallery verdict (coverage gate + shard gates)
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [wall-truth, wall-ours]
    steps:
      - uses: actions/checkout@v4

      - name: download all truth meta (manifests + boot logs + pins)
        uses: actions/download-artifact@v4
        with:
          pattern: wall-truth-meta-*
          path: truth-meta

      - name: download all ours meta (boot logs + shot listings)
        uses: actions/download-artifact@v4
        with:
          pattern: wall-ours-meta-*
          path: ours-meta

      - name: download all shard reports (gate JSONs + joins)
        uses: actions/download-artifact@v4
        with:
          pattern: gallery-report-*
          path: reports

      - name: THE COVERAGE GATE + the merged shard verdict
        run: |
          set -euo pipefail
          mkdir -p scenes verdict gallery-verdict
          python3 scripts/cimscene/flip-report.py --json gallery-verdict/class-summary.json \
            reports/gallery-report-* | tee gallery-verdict/class-summary.txt
          {
            echo '### Measured gallery classes'
            echo '```text'
            cat gallery-verdict/class-summary.txt
            echo '```'
            echo "[Truth and ours screenshots and per-cell diffs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"
          # merge the fresh truth manifests (ANY shard's copy of the index /
          # reconciliation file is byte-identical — registry-derived)
          find truth-meta -name 'gallery-*.tsv' -exec cp {} scenes/ \;
          # merge the boot logs (each shard's exhaustion markers live in its
          # own log; the terminal-marker check must see the union)
          find truth-meta -name 'boot.log' -type f | sort | xargs cat > merged-boot.log
          wc -l merged-boot.log
          # the shot LISTS (13-b): existence joins the listings, not bytes
          mkdir -p verdict/truth-shots verdict/ours-shots
          find truth-meta -name 'shots.txt' -path '*truth-shots*' -exec cat {} \; | sort -u > verdict/truth-shots/shots.txt
          find ours-meta -name 'shots.txt' -exec cat {} \; | sort -u > verdict/ours-shots/shots.txt
          wc -l verdict/truth-shots/shots.txt verdict/ours-shots/shots.txt
          GATE=0
          # the coverage gate runs ONCE PER LADDER NAMESPACE (each ns owns
          # its ledger, manifests and exhaustion markers)
          for NS in $LADDER_NS; do
            IDX=$(find scenes -name "gallery-$NS-index.tsv" | head -1)
            if [ -z "$IDX" ]; then
              echo "missing $NS coverage index — the ledger is mandatory"
              exit 1
            fi
            python3 scripts/cimscene/coverage-gate.py --ns $NS --index "$IDX" \
              --scenes scenes --truth-shots verdict/truth-shots \
              --ours-shots verdict/ours-shots --boot merged-boot.log || GATE=1
          done
          echo "=== THE SHARD GATES: a missing shard report is RED ==="
          SHARD_GATE=0
          python3 - <<'PY' || SHARD_GATE=$?
          import glob, json, os, sys
          K = int(os.environ.get("K", "8"))
          seen = {}
          for f in sorted(glob.glob('reports/*/gate.json')):
              g = json.load(open(f))
              seen[str(g["shard"])] = g
          missing = [str(i) for i in range(K) if str(i) not in seen]
          if missing:
              print("MISSING SHARD REPORTS:", ", ".join(missing),
                    "— a hole in the wall is not a green verdict")
              sys.exit(1)
          bad = 0
          for i in range(K):
              g = seen[str(i)]
              mark = "GREEN" if g["gate"] == 0 else "RED"
              print(f"shard {i}: {mark} joins={g['join_pages']} reds={len(g['reds'])}")
              if g["gate"] != 0:
                  bad += 1
                  for r in g["reds"][:20]:
                      print("   RED", r)
          sys.exit(1 if bad else 0)
          PY
          if [ "$SHARD_GATE" != "0" ]; then GATE=1; fi
          echo "=== per-page verdicts (merged) ==="
          python3 - <<'PY'
          import glob, json
          for f in sorted(glob.glob('reports/*/join-*.json')):
              r = json.load(open(f))
              print(f, r['verdict'], 'cells=%d red=%d dynamic=%d skipped=%d'
                    % (r['cells'], r['red'], r['dynamic'], r['skipped']))
          PY
          echo "=== THE VERDICT ==="
          if [ "$GATE" = "0" ]; then
            echo "GREEN: every shard joined green, every class walked to exhaustion"
          else
            echo "RED: see the named holes above — the gate is pixels and coverage"
          fi
          python3 - <<'PY'
          import glob, json
          summary = {"shards": {}, "coverage": "see log"}
          for f in sorted(glob.glob('reports/*/gate.json')):
              g = json.load(open(f))
              summary["shards"][g["shard"]] = {"gate": g["gate"],
                                               "join_pages": g["join_pages"],
                                               "reds": g["reds"][:50]}
          json.dump(summary, open('gallery-verdict/verdict-summary.json', 'w'), indent=1)
          PY
          exit $GATE
        env:
          K: ${{ env.K }}

      - name: upload the merged verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-verdict
          path: gallery-verdict/
          if-no-files-found: warn
