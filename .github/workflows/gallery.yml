            # 9011 = ONE cell of the same state (multiplicity control);
            # 9012 = FIVE identical tuff_pillar[axis=y] cells (axis control —
            #   axis=y is mostly green in the gate).
            # Metric after the run: cell-to-cell NCC + dark-row positions of
            # the identical cells inside each shot.
            SC10=scenes/gallery-create-p9010.tsv
            printf 'cell\tx\ty\tz\tstate\n' > "srv-wall/c-imagine/$SC10"
            for XI in -4 -3 -2 -1 0; do
              printf 'cell\t%s\t-58\t9\tcreate:tuff_pillar[axis=x,east=false,north=false,south=false,west=false]\n' "$XI" >> "srv-wall/c-imagine/$SC10"
            done
            SC11=scenes/gallery-create-p9011.tsv
            printf 'cell\tx\ty\tz\tstate\n' > "srv-wall/c-imagine/$SC11"
            printf 'cell\t-2\t-58\t9\tcreate:tuff_pillar[axis=x,east=false,north=false,south=false,west=false]\n' >> "srv-wall/c-imagine/$SC11"
            SC12=scenes/gallery-create-p9012.tsv
            printf 'cell\tx\ty\tz\tstate\n' > "srv-wall/c-imagine/$SC12"
            for XI in -4 -3 -2 -1 0; do
              printf 'cell\t%s\t-58\t9\tcreate:tuff_pillar[axis=y,east=false,north=false,south=false,west=false]\n' "$XI" >> "srv-wall/c-imagine/$SC12"
            done
            for ENTRY in "9010:instab5x:5" "9011:instab1x:1" "9012:instab5y:5"; do
              P=$(printf '%s' "$ENTRY" | cut -d: -f1)
              NAME=$(printf '%s' "$ENTRY" | cut -d: -f2)
              WANT=$(printf '%s' "$ENTRY" | cut -d: -f3)
              OUT=$(rcon "kill @e[type=!player]" "cim galleryclear" \
                "cim gallerypage create $P")
              echo "$OUT" | tee "ours-rcon-iso14z-$NAME.log"
              echo "$OUT" | grep -q "placed=$WANT" \
                || { echo "14z isolate $NAME: placed!=$WANT"; exit 1; }
              sleep 1
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "ours-shots/ours-iso14z-$NAME.png"
              echo "shot 14z isolate $NAME (page $P placed=$WANT)"
            done
          fi
          ls ours-shots/ | head -5 || true
          # 14-ak OURS-LIVENESS ASSERT (mirror of the truth leg's containment,
          # assert-only): the ours client must NEVER die mid-walk — its
          # content is vanilla-type rigs (item_display) and the pack channel,
          # no modded-entity spawns; a death means the harness itself broke
          # and the shard fails loudly instead of shooting garbage.
          ours_alive() {
            local L
            rcon "list" > list-receipt.log 2>/dev/null || return 1
            L=$(cat list-receipt.log)
            case "$L" in *cimviewer*) return 0;; *) return 1;; esac
          }
          EXHAUSTED=0
          for NS in $LADDER_NS; do
            for p in $(seq $SI $K $MAXP); do
              M="srv-wall/c-imagine/scenes/gallery-$NS-p$p.tsv"
              [ -f "$M" ] || { echo "no manifest for $NS page $p — ours block replay exhausted"; EXHAUSTED=1; break; }
              OUT=$(rcon "kill @e[type=!player]" "cim galleryclear" \
                "cim gallerypage $NS $p")
              echo "$OUT" | tee "ours-rcon-$NS-p$p.log"
              echo "$OUT" | grep -q "gallerypage $NS p$p -> placed=" \
                || { echo "$NS page $p no placed marker in the RCON response"; exit 1; }
              ours_alive || { echo "ours client died on $NS block page $p — the ours leg must never die"; exit 1; }
              sleep 1   # section rebuild (the measured fixed-window protocol)
              # 14-aa OURS RENDER-SETTLE (mirror of the truth-leg 14-y fix):
              # heavy sections (p391 = 68 pillar cells) place + rasterise
              # slower than the fixed window; a mid-placement frame carries
              # per-row texture offsets that read as a render defect (#72's
              # pillar[x] fingerprint was column-coherent and row-varying —
              # the signature of entities caught at different placement
              # progress, not of a UV bug; the clean 14-z isolate rendered
              # coherent at NCC 0.94-1.00). Two consecutive identical frames
              # = settled; bounded 8 (animated cells never converge and
              # still proceed).
              PREV=""
              SETTLE_ROUNDS=0
              while [ "$SETTLE_ROUNDS" -lt 3 ]; do
                SETTLE_ROUNDS=$((SETTLE_ROUNDS+1))
                for i in $(seq 1 8); do
                  rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
                  bash scripts/visual/shot.sh "ours-shots/.settle-$NS-p$p.png"
                  CUR=$(md5sum "ours-shots/.settle-$NS-p$p.png" | cut -d' ' -f1)
                  if [ -n "$PREV" ] && [ "$CUR" = "$PREV" ]; then break; fi
                  PREV="$CUR"
                done
                # 14-dz LIGHT POKE + RE-VERIFY: a stable frame can be a
                # STARVED one — the light packets never integrated and the
                # dark frame is as stable as a lit one, so the
                # two-identical law cannot tell (run 43468177851 measured
                # 86% of shard 5's red rows as exactly this class). The
                # poke re-sends the page chunks' light packets (cimscene
                # lightpoke, the vanilla constructor path) and the re-verify
                # demands the SAME frame again: already-lit = idempotent
                # packet = identical frame (accept); starved = the re-send
                # integrates light = the frame CHANGES (the fake settle is
                # rejected and the loop re-runs on the now-live data).
                rcon "cimscene lightpoke 0 0" > poke-receipt.log 2>&1
                                tail -1 poke-receipt.log   # 14-e15 the receipt rides the job log; the FILE route is the coproc-safe one (a pipeline subshell kills the coproc fd — the 14-e15 walk-killer, three runs x 16 shards each)
                bash scripts/visual/shot.sh "ours-shots/.settle-post-$NS-p$p.png"
                POST=$(md5sum "ours-shots/.settle-post-$NS-p$p.png" | cut -d' ' -f1)
                rm -f "ours-shots/.settle-post-$NS-p$p.png"
                if [ "$POST" = "$CUR" ]; then break; fi
                PREV="$POST"
              done
              rm -f "ours-shots/.settle-$NS-p$p.png"
              bash scripts/visual/shot.sh "ours-shots/ours-gal-p-$NS$p.png"
              # 14-e179 THE SECOND-FRAME POLICY (truth-leg mirror, the
              # hashed lane): the SAME manifest drives the producer —
              # identical probe selection on both legs, two frames 2s
              # apart; the policy file = scripts/cimscene/second-frames.py
              # (the hashed lane), the plan decides, bash executes.
              PROBE=$(python3 scripts/cimscene/second-frames.py plan \
                --manifest "$M" \
                --ns "$NS" --page "$p" --policy "${SF_POLICY:-widened}")
              case "$PROBE" in *t0*)
                bash scripts/visual/shot.sh "ours-shots/ours-gal-p-$NS$p-t0.png";; esac
              case "$PROBE" in *t1*)
                sleep 2
                bash scripts/visual/shot.sh "ours-shots/ours-gal-p-$NS$p-t1.png";; esac
              test -s "ours-shots/ours-gal-p-$NS$p.png" || { echo "$NS page $p shot empty/missing"; exit 1; }
              echo "shot $NS page $p"
            done
            [ "$EXHAUSTED" = "1" ] || { echo "ours $NS block replay hit the MAXP cap — staged manifest set incomplete"; exit 1; }
          done

      - name: entity replay — STRIDE (MOB gate + dyn/large diagnostic + every ladder ns)
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=4
          # 14-bt THE PERSISTENT RCON DRIVER (mirror of the truth leg): ONE
          # --batch process carries every replay command of this step; the
          # placed-marker asserts consume the SAME per-command responses.
          coproc RCON { python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate --batch; }
          # 14-e15 THE COPROC LAW: rcon() must NEVER run inside a pipeline
          # element or command substitution — a subshell cannot reach the
          # coproc fd and the send dies ("rcon driver died (send: ...)").
          # The measured walk-killer (runs 43579201630, fe59c8c3-era,
          # 43584748689: all 16 shards each). Route the output through a
          # file when the receipt needs printing.
          rcon() { # one command per argument; prints "> cmd" + response per command
            local c line out ok
            for c in "$@"; do
              [ -n "$c" ] || continue   # the driver skips empty lines; sending one would deadlock the reader
              printf '%s\n' "$c" >&"${RCON[1]}" || { echo "rcon driver died (send: $c)" >&2; return 1; }
              out=""; ok=0
              while IFS= read -r line <&"${RCON[0]}"; do
                if [ "$line" = "__RCON_RESP_END__" ]; then ok=1; break; fi
                out+="$line"$'\n'
              done
              [ "$ok" = "1" ] || { echo "rcon driver died (read: $c)" >&2; return 1; }
              printf '%s' "$out"
            done
          }
          read -r -t 60 RCON_HELLO <&"${RCON[0]}" || { echo "rcon driver failed to start (auth?)" >&2; exit 1; }
          [ "$RCON_HELLO" = "__RCON_READY__" ] || { echo "rcon driver handshake: $RCON_HELLO" >&2; exit 1; }
          # 14-ak OURS-LIVENESS ASSERT (assert-only mirror of the truth leg's
          # containment): the ours client must NEVER die mid-walk — a death
          # means the harness itself broke and the shard fails loudly.
          ours_alive() {
            local L
            rcon "list" > list-receipt.log 2>/dev/null || return 1
            L=$(cat list-receipt.log)
            case "$L" in *cimviewer*) return 0;; *) return 1;; esac
          }
          # SAME difficulty pin as the truth leg (hostile mobs must survive)
          rcon "difficulty easy" "kill @e[type=!player]" "tp cimviewer 0.5 -60 0.5 0 0"
          sleep 5
          # MOB series (the gate): the RCON response IS the completion marker
          for p in $(seq $SI $K $((EPAGES-1))); do
            OUT=$(rcon "kill @e[type=!player]" "cim galleryclear" \
              "cim gallerypage-entity minecraft $p")
            echo "$OUT" | tee "ours-rcon-e$p.log"
            echo "$OUT" | grep -q "gallerypage-entity minecraft p$p -> placed=" \
              || { echo "mob page $p no placed marker in the RCON response"; exit 1; }
            ours_alive || { echo "ours client died on mob page $p — the ours leg must never die"; exit 1; }
            sleep 5   # section rebuild + entity render under llvmpipe
            rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
            # 14-dz the entity pages shoot a fixed window with no settle
            # loop — the same lightmap starvation can strand a dark mob
            # frame (the e lane's 1.18M/839K reds ride luma_fit=false).
            # Poke the light packets before the shot: the integration
            # lands inside the window, the self-pair still names any
            # residual time-varying cells honestly.
            rcon "cimscene lightpoke 0 0" > poke-receipt.log 2>&1
                        tail -1 poke-receipt.log   # 14-e15 the receipt rides the job log; the FILE route is the coproc-safe one (a pipeline subshell kills the coproc fd — the 14-e15 walk-killer, three runs x 16 shards each)
            bash scripts/visual/shot.sh "ours-shots/ours-gal-e$p.png"
            sleep 2   # 14-aj the self-consistency pair (the truth-leg mirror)
            bash scripts/visual/shot.sh "ours-shots/ours-gal-e$p-self.png"
            echo "shot mob page $p"
          done
          # DYN + LARGE series (diagnostic)
          for p in $(seq $SI $K $((EDPAGES-1))); do
            for SERIES in dyn large; do
              OUT=$(rcon "kill @e[type=!player]" "cim galleryclear" \
                "cim gallerypage-entity minecraft $p $SERIES")
              echo "$OUT" | tee "ours-rcon-e$SERIES$p.log"
              echo "$OUT" | grep -q "gallerypage-entity minecraft p$p $SERIES -> placed=" \
                || { echo "$SERIES page $p no placed marker in the RCON response"; exit 1; }
              ours_alive || { echo "ours client died on $SERIES page $p — the ours leg must never die"; exit 1; }
              sleep 5
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              # 14-dz the entity pages shoot a fixed window with no settle
