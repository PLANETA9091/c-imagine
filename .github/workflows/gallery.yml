name: gallery

# THE GATE IS PIXELS — owner directive 2026-10-30 (docs/ROADMAP.md M5.5,
# MODPACK.md Tier 0). THE SHARDED WALL (13-b) — the 12-ax topology (serial
# 75-82-min runs, measured #34/#35) is superseded; its measured lessons —
# RCON control, ghost protocol, fov slider units, spectator camera, OOM
# heaps, fluid skips, fixed-window settles, the marker contracts — are all
# folded into this file unchanged. What changed is WHO runs WHEN:
#
# RUN TOPOLOGY (13-b, owner directive 2026-10-31: "оптимизируй на максимум,
# должно быть 10 минут"): the wall is SHARDED. K=8 truth shards and K=8
# ours shards each boot their OWN server+client pair and walk a STRIDE of
# the page space (shard i walks pages i, i+K, i+2K, ...), so the ~30-min
# serial page walk becomes ~3 min per shard — 16 servers+clients shoot in
# parallel and the wall clock is the SLOWEST SHARD, not the sum.
#
#   seed        (needs: none, CACHED)  the pack + the cell contract. On a
#               cache hit (~always — the key hashes every input) this job
#               exits in ~1 min. On a miss (mod/code change) it boots the
#               real server once, walks ALL series server-side (manifests
#               only, no shots), builds the plugin + the F2vPack pack and
#               seeds BOTH the actions/cache and the seed-pack artifact.
#   wall-truth  (matrix 0..K-1)         real NeoForge 21.1.265 server +
#               real NeoForge 1.21.1 client under xvfb. Each shard walks
#               its stride for EVERY class (blocks/entities/items/
#               particles/fluids), shoots per page, writes the manifests
#               (fresh, every run) and uploads per-shard artifacts.
#   wall-ours   (needs seed, matrix)    Paper 26.3 + the plugin
#               (-Dcim.f2v.fastBoot=true: serve the seeded pack instead of
#               re-running the boot-time rebuild — the integrity contract
#               stays the server.properties sha1 pin + the client's pack
#               hash check) + vanilla 26.3 client. Replays the SAME stride,
#               downloads ONLY its truth-shard counterpart and runs the
#               per-page pixel join INLINE (the diff leaves the critical
#               path — no post-leg diff phase).
#   wall-verdict (needs both)           the COVERAGE gate (ledger vs
#               manifests vs boot-log exhaustion vs shot LISTS — the
#               sharded-shot-list contract in coverage-gate.py) + the
#               merged per-shard gate JSONs. RED unless every shard
#               reported green AND every class walked to exhaustion.
#
# STRIDE LAW: every shard walks pages i, i+K, ... for every class; the
# scene answers exhausted=1 for any page beyond the registry (measured in
# CimSceneMod: the from>=entries.size() branch), so each shard terminates
# on its own sequence and the union of strides is exactly 0..terminal —
# every page walked once, no page skipped, MAXP still the safety cap.
# The pairing truth-shard i <-> ours-shard i <-> diff shard i is exact:
# both legs stride with the same K and the same i.
#
# HONESTY LAW (unchanged — the 2026-10-31 directive): the verdict must SEE
# every blockstate/item/entity/particle/fluid. Nothing was cut for speed —
# every page is still placed, shot, joined and coverage-gated; only the
# WALL CLOCK shrank (parallelism + cached pure-function builds + fast-boot
# state load). A shard that fails = the run is RED (missing shard report is
# RED in wall-verdict); a stale seed cache desyncs pages and lands RED in
# the per-page join, never a silent green.
#
# EXHAUSTIVE COVERAGE LAW (owner directive 2026-10-31): every content class
# walks to EXHAUSTION and the run is RED unless the coverage ledger proves
# every page landed:
#   blocks: EVERY blockstate (77 cells per page, walk until exhausted=1)
#   entities: the minecraft CONTROL (EPAGES) + the mod namespace, all three
#             series (mobs/dyn/large) to exhaustion
#   items: EVERY registered item (truth: item_display with the REAL modded
#          item; ours: the pack's item channel — visual-items rows generated
#          from the same manifests, 300000+i CMD space)
#   particles: EVERY registered particle (vanilla /particle, count 1 speed
#          0, FIXED 1s shot window on both legs; dyn class, diagnostics
#          until the protocol is measured stable)
#   fluids: EVERY registered fluid, one SEALED glass case per cell on the
#          sparse pitch-2 grid; vanilla-namespace block rows replay as
#          REAL liquid states on Paper, mod fluids/buckets are nochannel;
#          dyn class, FIXED 1s shot window both legs
#   block entities: no pages of their own — their picture is drawn by the
#          block wall's real EntityBlock placement; the scene reconciles
#          every BE type against the wall's placeable predicate and the
#          gate turns a non-empty reconciliation file into COVERAGE red
# THE 2026-11-04 CLASSES (all DIAGNOSTIC-first — walked, reported, never
# red until their channel is measured stable; the flip law lives in
# coverage-gate.py DIAGNOSTIC_CLASSES):
#   sound: every registered SoundEvent played in order per page window;
#          the truth capture is a packet-level mixin log
#          (gallery-sound-<ns>-p<p>.log), the ours replay sends one REAL
#          ClientboundSoundPacket per cell through the visual-sounds.tsv
#          rewrite and records the post-rewrite id the vanilla client
#          received (same artifact shape); sound-diff.py joins the ordered
#          streams (--map previews the mapped comparison, report-only)
#   particles (stream): every registered ParticleType spawned in order per
#          page window; same capture shape (the packet-capture mixin's
#          particle branch) and same replay shape (visual-particles.tsv
#          rewrite; simple default options by contract — data-carrying
#          options degrade to the simple lookalike); particle-diff.py
#          joins the ordered streams
#   gui:   one MenuType per page opened for the rig viewer; menus needing
#          block context throw on the empty extra-data buffer (named
#          open-failed rows); Paper cannot instantiate mod menus (nochannel)
#   held:  rides the ITEM pages — the page's first item staged into the
#          viewer's hotbar, the "1" key pressed, first-person shot on both
#          legs (the item channel's first-person proof surface)
#   anim:  kinetic block pages (manifest dyn=1 cells) shot twice 2s apart
#          per leg; anim-diff.py joins the frame DELTAS (ours frozen while
#          truth moves = the named divergence)
#   biome: one biome per page through the vanilla fillbiome surface, the
#          fixed grass/leaves tint-sample rig in frame (the P1 BOP channel
#          proof surface; Paper cannot set modded biomes — nochannel)
# Per-page settles follow the measured fixed-window protocol (particles/
# fluids = 1s; blocks/items = 1s; mob pages 4-5s) — NEVER trimmed for
# speed; the polls around them were (1s RCON granularity -> 0.25s).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

concurrency:
  group: gallery-${{ github.ref }}-${{ github.sha }}
  # Validate distinct source revisions concurrently. A branch-wide queue
  # replaced pending proofs on each push. Started runs still finish, and
  # duplicate runs of the same revision remain grouped.
  cancel-in-progress: false

env:
  MAXP: "460"  # exhaustive-walk safety cap (create measured 31,389 block
               # states = 408 pages at 77/page; the walk ALWAYS breaks on the
               # scene's exhausted marker first, and the coverage gate in
               # wall-verdict re-checks the ledger against what landed)
  # Vanilla entities are out of the gallery (owner decision 2026-11-05): 26.3
  # and 1.21.1 ship different vanilla mobs, a difference no pack can reach.
  EPAGES: "0"  # entity gate scope: MOB pages 0..EPAGES-1 of the minecraft
               # CONTROL namespace on the SPARSE 6x3 grid (18 cells/page,
               # pitch 2 — zero bbox overlap so no subject can ever push
               # another; measured 16d62f0). Each LADDER_NS mod namespace
               # walks ALL THREE series to exhaustion separately
  EDPAGES: "0"
  K: "8"       # THE SHARD COUNT (13-b): pages i, i+K, ... per shard. The
               # free-plan runner pool is 20 concurrent jobs — 8+8 shards +
               # seed + verdict = 18. Raising K: extend BOTH matrices and
               # this number together (the stride law requires K == the
               # matrix size).
               # 14-bt K=10 ANALYSIS (parked, keep 8): on a cache-HIT seed
               # (~1 min) 10+10 shards fit the 20-runner pool exactly and
               # each shard's walk fraction drops ~20% — but zero headroom
               # remains for the concurrent integration/profiling workflows
               # that share the pool, so those runs' wall clocks grow. On a
               # cache MISS (every push that touches the hashed input tree)
               # the seed is SERIAL and unsharded (~40-90 min): K does not
               # touch the critical path at all, so the win is only the
               # ours-leg walk fraction while starving the pool. K=16 needs
               # a paid 34+ runner pool (two waves on the free 20 = strictly
               # worse) — parked behind paid runners.
  # THE LADDER NAMESPACES (multi-ns refactor 2026-11-04): every walk loop,
  # done-marker grep, manifest name and coverage-gate call below iterates
  # THIS list — the namespace is a parameter, `create` is no longer
  # hardcoded anywhere in the walk/join paths. TWO lists on purpose, 1:1
  # ordered:
  #   LADDER_SLUGS — the Modrinth slugs fetch-ladder.sh downloads (the
  #                  lock pins slug=version);
  #   LADDER_NS    — the REGISTRY namespace the mods actually register
  #                  under (verified from each jar's neoforge.mods.toml
  #                  modId — the registry namespace is what the walk
  #                  filters registries by, not the Modrinth slug).
  #
  # THE P1 EXTENSION (2026-11-04, owner ladder directive: Create first,
  # then BOP / Dynamic Trees / Combat Roll): the walk surfaces run for
  # every namespace below. KNOWN HONEST-RED ABSENCES to expect on the
  # first multi-ns run (measured on create, expected structurally
  # identical for the new ns — the channels are the same):
  #   - particles: every mod particle fails the bare vanilla /particle
  #     spawn (no-simple-options) on ALL ns (measured #30: all 13 create
  #     particles);
  #   - fluids without a legacy block/bucket: no-channel rows (measured
  #     #30: 4 of 8 create fluids);
  #   - mod entities/items/blocks with no pack row on ours: nochannel /
  #     honest pixel REDs until the pack channel covers them.
  # MANDATORY COMPANIONS ride the slug list (checked in each jar's
  # neoforge.mods.toml — combat-roll requires playeranimator, BOP requires
  # glitchcore + terrablender; a missing required dependency is a server
  # boot CRASH). Their registry namespaces are deliberately NOT ladder
  # namespaces: they are libraries/providers, not gallery content.
  # cloth-config: UNDECLARED in combat-roll's neoforge.mods.toml but
  # loaded at construct time (me.shedaniel.autoconfig PartitioningSerializer
  # — the measured #102 boot crash: NoClassDefFoundError during mod
  # construction); pinned in mods.lock.
  # THE 14-dq EXTENSION (2026-11-10): two new content rungs, supplementaries
  # + farmersdelight (modIds verified from each jar's neoforge.mods.toml —
  # NOTE the slug/ns asymmetry: the Modrinth slug is farmers-delight, the
  # REGISTRY namespace is farmersdelight). supplementaries requires
  # moonlight [1.21.1-3.6.4,) (pinned 3.8.3, modType=LIBRARY — its ns stays
  # OUT of LADDER_NS like every companion); farmers-delight is
  # self-contained. Coexistence checked: supplementaries declares
  # farmersdelight incompatible only below 1.3.0 — the 1.3.4 pin satisfies
  # both. Pins + provenance in mods.lock. Expect the KNOWN HONEST-RED
  # ABSENCES above on the first run of the new ns (the channels are the
  # same) — that first measurement IS the point of the rung.
  LADDER_SLUGS: "create biomes-o-plenty glitchcore terrablender dynamictrees combat-roll playeranimator cloth-config guideme ae2 mekanism sophisticated-backpacks sophisticated-core jade supplementaries moonlight farmers-delight"
  LADDER_NS: "create biomesoplenty dynamictrees combat_roll ae2 mekanism sophisticatedbackpacks jade supplementaries farmersdelight"
  # THE SOUND FLIP (one switch): off = the sound join is a report-only
  # mapped preview; on = the sound join's verdict is the mapped-identity
  # result (--gate-mapped in sound-diff.py). Flip after mapped-identity
  # measured stable on two consecutive full runs.
  SOUND_FLIP: "on"

jobs:
  # ---------------------------------------------------------------- seed --
  # The pack + the cell contract, content-keyed. Everything that feeds the
  # pack or the manifests is hashed into the key: f2v scripts, the scene
  # walk code, the scene/test-mod sources, the plugin sources, the ladder
  # lock. A hit means "this exact input tree was already walked + built" —
  # the pure functions (server-side walk, F2vPack) are deterministic, the
  # sha1 pin + the per-page join re-verify the result every run.
  seed:
    name: gallery seed — pack + manifests (cache-hit ~1 min, miss = full walk)
    runs-on: ubuntu-latest
    timeout-minutes: 90   # the P2 ladder (ae2/mekanism/backpacks/jade) walks four more registries to exhaustion
    steps:
      - uses: actions/checkout@v4

      # ONE fingerprint for the cache key AND the payload stamp (hashFiles is
      # not allowed in job-level env — measured #48 startup rejection — so a
      # step computes it; steps context IS allowed in `with`). The prefix
      # restore-keys fallback may return an OLDER pack (measured #47: the uv
      # fix changed the builder, the exact key moved, the prefix hit served
      # the stale missingno pack anyway) — the payload carries
      # f2v/inputs.sha1 and every consumer compares it against this hash.
      - name: seed input fingerprint
        id: seed-inputs
        run: echo "hash=${{ hashFiles('.github/workflows/gallery.yml', 'scripts/f2v/**', 'scripts/cimscene/**', 'scene-mod/src/**', 'test-mods/src/**', 'test-mods/*.gradle*', 'scene-mod/*.gradle*', 'gradle/**', 'paper-plugin/src/**', 'paper-plugin/pom.xml') }}" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-java@v4
        id: jdk25
        with:
          distribution: temurin
          java-version: 25    # paper 26.3 api + the 26.3 client are class 69

      - name: restore seed (cache, restore-only)
        id: seed-cache
        uses: actions/cache/restore@v4
        with:
          path: seed-pack
          key: gallery-seed-v3-${{ steps.seed-inputs.outputs.hash }}
          restore-keys: |
            gallery-seed-v3-

      - name: seed payload verify (freshness gate)
        id: seed-verify
        env:
          SEED_INPUTS: ${{ steps.seed-inputs.outputs.hash }}
        run: |
          set -euo pipefail
          HIT=false
          if [ -f seed-pack/f2v/inputs.sha1 ] && [ "$(cat seed-pack/f2v/inputs.sha1)" = "$SEED_INPUTS" ] \
             && [ -f seed-pack/f2v/pack.sha1 ] && [ -f seed-pack/plugin/cim-paper-plugin.jar ]; then
            # block manifests of EVERY ladder namespace (the per-ns glob is
            # exact: gallery-<ns>-p*.tsv; a bare gallery-*-p* would also
            # count entity/item/... manifests)
            N=0
            for NS in $LADDER_NS; do
              NB=$(ls seed-pack/scenes/gallery-$NS-p*.tsv 2>/dev/null | wc -l || true)
              N=$((N + ${NB:-0}))
            done
            [ "${N:-0}" -gt 100 ] && HIT=true
          fi
          if [ "$HIT" = "true" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "seed cache HIT (fresh): pack.sha1=$(cat seed-pack/f2v/pack.sha1), inputs=$SEED_INPUTS"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "seed payload STALE or missing (payload inputs=$(cat seed-pack/f2v/inputs.sha1 2>/dev/null || echo none), want=$SEED_INPUTS) — full rebuild"
            rm -rf seed-pack
          fi

      - name: seed cache miss — build cimtest + cimscene
        if: steps.seed-verify.outputs.hit != 'true'
        run: |
          gradle build --no-daemon -p test-mods
          gradle build --no-daemon -p scene-mod

      - name: restore NeoForge server layer (cache miss)
        if: steps.seed-verify.outputs.hit != 'true'
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer-srv
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 21.1.265 server (cache miss)
        if: steps.seed-verify.outputs.hit != 'true' && steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-srv-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-srv-installer.jar --installServer layer-srv

      - name: fetch ladder mods (locked — scripts/cimscene/mods.lock)
        if: steps.seed-verify.outputs.hit != 'true'
        run: bash scripts/cimscene/fetch-ladder.sh mods-ladder $LADDER_SLUGS

      - name: assemble server dir (cache miss)
        if: steps.seed-verify.outputs.hit != 'true'
        run: |
          cp -r layer-srv srv-wall
          mkdir -p srv-wall/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv-wall/mods/
          cp scene-mod/build/libs/cimscene-1.0.0.jar srv-wall/mods/
          cp mods-ladder/*.jar srv-wall/mods/
          echo "eula=true" > srv-wall/eula.txt
          cat > srv-wall/server.properties <<'PROPS'
          online-mode=false
          white-list=false
          difficulty=peaceful
          level-type=minecraft:flat
          level-seed=42
          view-distance=6
          simulation-distance=4
          spawn-protection=0
          max-players=5
          enable-rcon=true
          rcon.port=25575
          rcon.password=cimgate
          PROPS

      - name: boot real NeoForge server (cache miss; RCON poll 1s)
        if: steps.seed-verify.outputs.hit != 'true'
        run: |
          set -euo pipefail
          cd srv-wall
          rm -rf world world_nether world_the_end   # fresh flat world
          setsid bash -c "java -Xmx2G @libraries/net/neoforged/neoforge/21.1.265/unix_args.txt --nogui >> boot.log 2>&1" < /dev/null > /dev/null 2>&1 &
          cd ..
          for i in $(seq 1 180); do
            R=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1 || true)
            [ -n "$R" ] && break
            sleep 1
          done
          [ -n "$R" ] || { tail -60 srv-wall/boot.log; exit 1; }
          echo "seed server up: $R"

      # 14-bj: the dump client boots BEFORE the walk. A player in the world
      # keeps the wall chunks entity-ticking (the player ticket, level 31 —
      # FORCED/forceload tickets ride level 33 and DO NOT tick block
      # entities), exactly the truth walk's environment, so
      # BlockEntity-driven blocks (Create doors, pipes, shafts) settle the
      # wall identically on both legs. Measured #158 without the player: the
      # seed's doors never ticked (create p16: mutated=0 dissolved=0) while
      # the truth's dissolved 10 and silently flipped open/powered — the
      # manifests diverged and the join compared DIFFERENT states (43 cells
      # in shard 0 alone, all Create BE families). The dump itself waits for
      # the trigger file the walk touches after the last manifest.
      - name: restore NeoForge client runtime for the quad dump (cache miss)
        if: steps.seed-verify.outputs.hit != 'true'
        id: nfc-cache-seed
        uses: actions/cache@v4
        with:
          path: |
            nfc
            truth-client
          key: neoforge-truth-client-1211-v4

      - name: fetch the NeoForge client runtime (client cache miss)
        if: steps.seed-verify.outputs.hit != 'true' && steps.nfc-cache-seed.outputs.cache-hit != 'true'
        run: |
          # the Mojang CDN intermittently serves a truncated client jar
          # (the installer's sha1 check: "invalid checksum", measured on the
          # ada33886 seed) — retry the whole fetch up to 3 times
          for ATTEMPT in 1 2 3; do
            python3 scripts/truth/fetch-truth-client.py nfc truth-client --assets && break
            echo "client fetch attempt $ATTEMPT failed — retrying"
            [ "$ATTEMPT" = "3" ] && exit 1
            rm -rf nfc truth-client
            sleep 20
          done
          sed -i 's/^java /java -Xmx2G /' truth-client/launch.txt

      - name: prep the dump client runtime (player-ticket parity, 14-bj)
        if: steps.seed-verify.outputs.hit != 'true'
        run: |
          set -euo pipefail
          NEED=""
          for pkg in libgl1-mesa-dri libglx-mesa0 libxtst6 xvfb; do
            dpkg -s "$pkg" >/dev/null 2>&1 || NEED="$NEED $pkg"
          done
          apt_retry() {
            # THE RUNNER DNS INCIDENT (43046583185 + rerun: all 8 ours shards died at
            # apt with "Temporary failure resolving security.ubuntu.com" — exit 100,
            # the GL stack never installed, the client never launched). The failure
            # is on the runner's resolver, not the repo; ride it out: up to 4 tries
            # with a 30s gap, Acquire::Retries for the packet-level retries.
            local need="$*"
            for i in 1 2 3 4; do
              # Keep apt's signed security suite on the official archive if
              # only the security host fails DNS; retries alone cannot fix it.
              if ! timeout 10 getent ahosts security.ubuntu.com >/dev/null 2>&1 \
                 && timeout 10 getent ahosts archive.ubuntu.com >/dev/null 2>&1; then
                sudo python3 scripts/visual/ubuntu-mirror-fallback.py /etc/apt
              fi
              if sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq $need; then
                return 0
              fi
              echo "[apt_retry] attempt $i failed — retrying in 30s"
              sleep 30
            done
            echo "[apt_retry] all attempts failed"
            return 1
          }
          if [ -n "${NEED:-}" ]; then
            apt_retry $NEED
          fi
          Xvfb :98 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 1
          mkdir -p truth-client/game/mods truth-client/assets/indexes truth-client/assets/objects
          cp srv-wall/mods/*.jar truth-client/game/mods/
          # pauseOnLostFocus:false (14-cq): the truth walk shoots through the in-game ShotD, but a
          # single focus wobble on the headless display puts the client in the ESC pause overlay
          # (world blur + darkening) for every SUBSEQUENT page — measured 42416372623: 10 gal-p
          # pages (create64/96/128/240/256/272/320, ae232/256, boP96) carried the menu and cost
          # ~123 gate reds. The gallery is a multiplayer world; pausing buys nothing.
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nmipmapLevels:4\nrenderClouds:false\n' > truth-client/game/options.txt
          # tutorialStep:none (menus lane, 12a0ec6c): no first-join tutorial overlay in the frames.
          printf 'tutorialStep:none\nonboardAccessibility:false\npauseOnLostFocus:false\nrenderClouds:false\n' > truth-client/game/options.txt
          # GPU instances bypass the VertexConsumer used by QuadDump.
          # Use Flywheel's ordinary BER fallback in the capture client;
          # reference screenshot clients keep their normal renderer.
          mkdir -p truth-client/game/config
          printf 'backend = "flywheel:off"\n' > truth-client/game/config/flywheel-client.toml
          SCENES="$PWD/srv-wall/c-imagine/scenes"
          TRIGGER="$PWD/dump-go"
          rm -f "$TRIGGER"
          echo "$TRIGGER" > dump-trigger-path.txt
          # the gated launch: the client boots, joins, and STANDS BY until the
          # walk touches $TRIGGER (QuadDump.onTick checks the file per tick).
          # The walk step boots it fresh per attempt — a client that died
          # mid-walk must never serve the next attempt.
          sed "s#^java #java -Dcim.screenart=$PWD/srv-wall/c-imagine/screens -Dcim.quaddump=$SCENES -Dcim.quaddump.waitFor=$TRIGGER #" truth-client/launch.txt > launch-dump.txt

      - name: server-side walk — block pages under a live client, restart on disconnect (14-bj)
        if: steps.seed-verify.outputs.hit != 'true'
        run: |
          set -euo pipefail
          # 14-bt THE PERSISTENT RCON DRIVER: the walk used to pay a fresh
          # python process + TCP connect + auth per page (~500+ invocations
          # in the seed walk ≈ 3-4 min of pure overhead). ONE --batch
          # process carries every walk command of this step; the marker
          # waits stay in bash between the sends (base_of BEFORE the send —
          # the #39 mtime law — then wait_done). A dead driver fails the
          # step the same way a failed per-call rcon did.
          coproc RCON { python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate --batch; }
          rcon() { # one command per argument; prints "> cmd" + response per command
            local c line out ok
            for c in "$@"; do
              [ -n "$c" ] || continue   # the driver skips empty lines; sending one would deadlock the reader
              printf '%s\n' "$c" >&"${RCON[1]}" || { echo "rcon driver died (send: $c)" >&2; return 1; }
              out=""; ok=0
              while IFS= read -r line <&"${RCON[0]}"; do
                if [ "$line" = "__RCON_RESP_END__" ]; then ok=1; break; fi
                out+="$line"$'\n'
              done
              [ "$ok" = "1" ] || { echo "rcon driver died (read: $c)" >&2; return 1; }
              printf '%s' "$out"
            done
          }
          read -r -t 60 RCON_HELLO <&"${RCON[0]}" || { echo "rcon driver failed to start (auth?)" >&2; exit 1; }
          [ "$RCON_HELLO" = "__RCON_READY__" ] || { echo "rcon driver handshake: $RCON_HELLO" >&2; exit 1; }
          # THE MANIFEST-GENERATION WALK (12-ax, kept verbatim except the
          # marker channel): identical walk commands, identical exhaustion
          # asserts — no shot settles, no shots. THE MARKER IS THE FILE the
          # scene writes at the same code point as the boot.log line
          # (13-c): a quiet server's console pipeline can STALL — measured
          # #38: page 0's done line sat 30s and landed exactly when the
          # wait gave up — a Files.writeString cannot stall. The boot.log
          # lines are echoed best-effort for the log readers.
          # 14-bj: the BLOCK walk runs under a LIVE dump client (the player
          # ticket keeps the wall chunks entity-ticking — the truth walk's
          # environment). A client death mid-walk voids the parity for the
          # remaining pages, so each attempt runs the FULL block walk on a
          # FRESH client and a disconnect voids the attempt (#159 attempt 1:
          # a Create contraption spawn-data payload crashed the client near
          # the walk's end — the same class the entity walk bans subjects
          # for). The later series (entity/item/particle/fluid/sound/biome)
          # have NO BlockEntity settle dependence — their manifests do not
          # need the client.
          base_of() { # $1 = stem -> V0D/V0E baselines; MUST run BEFORE the RCON
            # command: the scene writes the marker INSIDE the command's
            # execution (the mtime measured #39: 17:57:32 vs the response
            # 17:57:33.8) — a baseline read after the response would see
            # the fresh file and wait for a change that already happened
            V0D=$(cat "srv-wall/c-imagine/scenes/$1.done" 2>/dev/null || echo 0)
            V0E=$(cat "srv-wall/c-imagine/scenes/$1.exhausted" 2>/dev/null || echo 0)
          }
          wait_done() { # $1 = stem $2 = V0D $3 = V0E; rc0 done | rc1 exhausted | rc2 timeout
            local BASE="srv-wall/c-imagine/scenes/$1"
            local VD VE
            for i in $(seq 1 1000); do
              VD=$(cat "$BASE.done" 2>/dev/null || echo 0)
              VE=$(cat "$BASE.exhausted" 2>/dev/null || echo 0)
              [ "$VD" != "$2" ] && return 0
              [ "$VE" != "$3" ] && return 1
              sleep 0.03
            done
            echo "no done marker file: $1"; return 2
          }
          # no leaf decay or random growth: the seed must settle like the truth
          # walk; the dump client's player keeps the wall chunks entity-ticking
          # now (14-bj), so the settle windows tick exactly like the truth
          # walk's — and doMobSpawning false must ride with it (the truth pins
          # it at camera-pins; a spawn during a settle would walk into the
          # cells on ONE leg only). Ticks stay fast: BE settling is tick-count
          # driven, the same 10-tick windows at 1000 t/s.
          WALK_OK=""
          for ATTEMPT in 1 2 3; do
            echo "=== block walk attempt $ATTEMPT (fresh dump client) ==="
            export DISPLAY=:98 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
            pkill -f cim.quaddump 2>/dev/null || true
            rm -f truth-client/client-dump.out
            LAUNCH=$(cat launch-dump.txt)
            setsid bash -c "cd truth-client && timeout 1500 bash -c \"$LAUNCH\" > client-dump.out 2>&1" < /dev/null > /dev/null 2>&1 &
            # the join IS the parity pin: without it the walk must not run
            for i in $(seq 1 600); do
              grep -qE "Loaded [0-9]+ advancements" truth-client/client-dump.out 2>/dev/null && break
              sleep 1
            done
            grep -qE "Loaded [0-9]+ advancements" truth-client/client-dump.out \
              || { echo "attempt $ATTEMPT: dump client failed to join"; tail -20 truth-client/client-dump.out; continue; }
            sleep 8   # first chunk render on llvmpipe (mirror of camera-pins)
            rcon "gamerule randomTickSpeed 0" "gamerule doMobSpawning false" "tick rate 1000" >/dev/null
            # the join's initial-spawn pass may have placed animals near the
            # wall (the wall chunks only became entity-ticking at the join);
            # the truth block walk kills @e before its first page — same here
            rcon "cimscene cleanup-assemblies" "kill @e[type=!player]" >/dev/null
            # BLOCK pages (to exhaustion — the coverage law), one loop per
            # ladder namespace (LADDER_NS is the single source of the ns list)
            for NS in $LADDER_NS; do
              EXHAUSTED=0
              for p in $(seq 0 $MAXP); do
                base_of "gallery-$NS-p$p"
                rcon "cimscene gallery page $NS $p"
                RC=0; wait_done "gallery-$NS-p$p" "$V0D" "$V0E" || RC=$?
                [ "$RC" = "2" ] && { echo "$NS page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
                if [ "$RC" = "1" ]; then
                  echo "$NS block walk exhausted at page $p"
                  EXHAUSTED=1
                  break
                fi
                grep "gallery done ns=$NS page=$p " srv-wall/boot.log | tail -1 || true
              done
              [ "$EXHAUSTED" = "1" ] || { echo "$NS block walk hit the MAXP cap without the exhausted marker — coverage incomplete"; exit 1; }
            done
            # back to the truth's pace: the remaining series have no BE settle
            # dependence and the truth runs them at 20 t/s; the packet backlog
            # from the 1000 t/s block walk also drains here
            rcon "tick rate 20" >/dev/null
            if grep -qiE "disconnected|connection lost" truth-client/client-dump.out; then
              echo "attempt $ATTEMPT: the client disconnected mid-walk — the block parity voided, redoing on a fresh client"
              tail -20 truth-client/client-dump.out || true
              continue
            fi
            WALK_OK=1
            echo "=== block walk attempt $ATTEMPT: clean (the client lived through the last settle) ==="
            break
          done
          [ -n "$WALK_OK" ] || { echo "no disconnect-free block walk in 3 attempts — the settle parity is unproven, refusing to ship a mixed manifest"; exit 1; }
          # ENTITY pages: difficulty easy (the SAME pin as the truth entity
          # walk — hostile mobs must survive), then the fixed minecraft
          # scope + every LADDER_NS namespace to exhaustion, series by series
          rcon "difficulty easy" "cimscene cleanup-assemblies" "kill @e[type=!player]"
          for p in $(seq 0 $((EPAGES-1))); do
            base_of "gallery-entity-minecraft-p$p"
            rcon "cimscene gallery entity mobs minecraft $p"
            RC=0; wait_done "gallery-entity-minecraft-p$p" "$V0D" "$V0E" || RC=$?
            [ "$RC" = "2" ] && { echo "mob page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
            grep "gallery-entity done ns=minecraft page=$p " srv-wall/boot.log | tail -1 || true
          done
          for p in $(seq 0 $((EDPAGES-1))); do
            for SERIES in dyn large; do
              TAG=$([ "$SERIES" = dyn ] && echo entitydyn || echo entitylarge)
              base_of "gallery-$TAG-minecraft-p$p"
              rcon "cimscene gallery entity $SERIES minecraft $p"
              RC=0; wait_done "gallery-$TAG-minecraft-p$p" "$V0D" "$V0E" || RC=$?
              [ "$RC" = "2" ] && { echo "$SERIES page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
              grep "gallery-$TAG done ns=minecraft page=$p " srv-wall/boot.log | tail -1 || true
            done
          done
          for SERIES in mobs dyn large; do
            TAG=$([ "$SERIES" = mobs ] && echo entity || echo entity$SERIES)
            for NS in $LADDER_NS; do
              EX=0
              for p in $(seq 0 $MAXP); do
                base_of "gallery-$TAG-$NS-p$p"
                rcon "cimscene cleanup-assemblies" "kill @e[type=!player]" "cimscene gallery entity $SERIES $NS $p"
                RC=0; wait_done "gallery-$TAG-$NS-p$p" "$V0D" "$V0E" || RC=$?
                [ "$RC" = "2" ] && { echo "$NS $SERIES page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
                if [ "$RC" = "1" ]; then EX=1; break; fi
                grep "gallery-$TAG done ns=$NS page=$p " srv-wall/boot.log | tail -1 || true
              done
              [ "$EX" = "1" ] || { echo "$NS $SERIES walk hit the MAXP cap without exhausted"; exit 1; }
            done
          done
          # MENU scan (per ladder ns): the probe needs no client, so the ours leg,
          # which runs beside the truth leg, has every menu's class and slots.
          for NS in $LADDER_NS; do
            python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
              "cimscene gallery gui-scan $NS" || true
            grep "gallery-gui-scan ns=$NS " srv-wall/boot.log | tail -1 || true
          done
          # ITEM walk (per ladder ns, to exhaustion)
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq 0 $MAXP); do
              base_of "gallery-item-$NS-p$p"
              rcon "cimscene cleanup-assemblies" "kill @e[type=!player]" "cimscene gallery item $NS $p"
              RC=0; wait_done "gallery-item-$NS-p$p" "$V0D" "$V0E" || RC=$?
              [ "$RC" = "2" ] && { echo "$NS item page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
              if [ "$RC" = "1" ]; then EX=1; break; fi
              grep "gallery-item done ns=$NS page=$p " srv-wall/boot.log | tail -1 || true
            done
            [ "$EX" = "1" ] || { echo "$NS item walk hit the MAXP cap without exhausted"; exit 1; }
          done
          # 14-dw the particle walk needs a LIVE viewer: sendParticles
          # broadcasts only to players in range — the 14-ds forensics measured
          # the dump client dead before the particle series on three
          # consecutive runs (the seed manifests all skip-only
          # 'no-simple-options:empty-broadcast', the ours replay sent 0
          # packets, the mapped-identity stuck 0/38 byte-identical, the sound
          # control 148/148 on the same runs) — the sound flip's bar can never
          # be measured from empty manifests. The quad dump's own relaunch
          # idiom, pulled BEFORE the series (the launch file exists since the
          # walk step's start; block parity is banked, the walk may relaunch
          # freely per the dump step's own comment).
          if ! grep -qE "Loaded [0-9]+ advancements" truth-client/client-dump.out 2>/dev/null \
             || grep -qiE "disconnected|connection lost" truth-client/client-dump.out 2>/dev/null; then
            echo "the dump client did not survive to the particle walk — relaunching so sendParticles has a viewer"
            pkill -f cim.quaddump 2>/dev/null || true
            rm -f truth-client/client-dump.out
            LAUNCH=$(cat launch-dump.txt)
            setsid bash -c "cd truth-client && timeout 900 bash -c \"$LAUNCH\" > client-dump.out 2>&1" < /dev/null > /dev/null 2>&1 &
            for i in $(seq 1 600); do
              grep -qE "Loaded [0-9]+ advancements" truth-client/client-dump.out 2>/dev/null && break
              sleep 1
            done
            grep -qE "Loaded [0-9]+ advancements" truth-client/client-dump.out \
              || { echo "relaunched particle-walk viewer failed to join"; tail -40 truth-client/client-dump.out; exit 1; }
            sleep 5
          fi
          # PARTICLE walk (per ladder ns, to exhaustion)
          # 14-dx THE RANGE PIN (measured #302: the seed job ran 8m1s and the
          # dump client was alive inside its 1500s timeout, yet every particle
          # spawn measured cells=0 — the client stood at the WORLD SPAWN,
          # beyond the 32-block broadcast gate; 14-dw's relaunch covers the
          # client-DEAD mode, the distance mode needs the receiver pinned to
          # the wall vantage (x -5..5, y -60..-53, z 9 reaches <=12.2 blocks
          # from (0.5,-60,0.5)) and the walk must verify the receiver per
          # page — the manifest row KIND depends on the receiver population,
          # and the ours leg (no scene-mod; the seed manifest IS its spawn
          # spec) cannot be allowed to silently all-skip again)
          rcon "gamemode spectator cimviewer" "tp cimviewer 0.5 -60 0.5 0 0" > par-pin.log
          grep -q "Teleported" par-pin.log \
            || { echo "particle walk refused: the dump client cannot be pinned to the wall vantage (the spawns would broadcast to zero receivers, measured #302)"; tail -20 srv-wall/boot.log; exit 1; }
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq 0 $MAXP); do
              base_of "gallery-particle-$NS-p$p"
              rcon "list" > par-list.log 2>/dev/null || true
              grep -q "cimviewer" par-list.log \
                || { echo "$NS particle page $p refused: the receiver vanished mid-walk (the manifests would silently all-skip again)"; exit 1; }
              rcon "cimscene gallery particle $NS $p"
              RC=0; wait_done "gallery-particle-$NS-p$p" "$V0D" "$V0E" || RC=$?
              [ "$RC" = "2" ] && { echo "$NS particle page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
              if [ "$RC" = "1" ]; then EX=1; break; fi
              grep "gallery-particle done ns=$NS page=$p " srv-wall/boot.log | tail -1 || true
            done
            [ "$EX" = "1" ] || { echo "$NS particle walk hit the MAXP cap without exhausted"; exit 1; }
          done
          # FLUID walk (per ladder ns, to exhaustion)
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq 0 $MAXP); do
              base_of "gallery-fluid-$NS-p$p"
              rcon "cimscene gallery fluid $NS $p"
              RC=0; wait_done "gallery-fluid-$NS-p$p" "$V0D" "$V0E" || RC=$?
              [ "$RC" = "2" ] && { echo "$NS fluid page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
              if [ "$RC" = "1" ]; then EX=1; break; fi
              grep "gallery-fluid done ns=$NS page=$p " srv-wall/boot.log | tail -1 || true
            done
            [ "$EX" = "1" ] || { echo "$NS fluid walk hit the MAXP cap without exhausted"; exit 1; }
          done
          # SOUND walk (per ladder ns, to exhaustion) — the ours replay
          # gates on THE SEED's manifest (the replay must run parallel to
          # the truth shards, before truth-meta lands), so the seed must
          # write the sound manifests itself; measured run 42070701695:
          # without this walk the ours replay found no manifests and the
          # whole sound channel stayed silent on ours
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq 0 $MAXP); do
              base_of "gallery-sound-$NS-p$p"
              rcon "cimscene gallery sound $NS $p"
              RC=0; wait_done "gallery-sound-$NS-p$p" "$V0D" "$V0E" || RC=$?
              [ "$RC" = "2" ] && { echo "$NS sound page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
              if [ "$RC" = "1" ]; then EX=1; break; fi
              grep "gallery-sound done ns=$NS page=$p " srv-wall/boot.log | tail -1 || true
            done
            [ "$EX" = "1" ] || { echo "$NS sound walk hit the MAXP cap without exhausted"; exit 1; }
          done
          # BIOME walk (per ladder ns, to exhaustion) — same seed-manifest
          # contract as sound; the rig is server-side placeable (grass_block
          # + oak_leaves samples), no viewer needed for the MANIFEST
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq 0 $MAXP); do
              base_of "gallery-biome-$NS-p$p"
              rcon "cimscene gallery biome $NS $p"
              RC=0; wait_done "gallery-biome-$NS-p$p" "$V0D" "$V0E" || RC=$?
              [ "$RC" = "2" ] && { echo "$NS biome page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
              if [ "$RC" = "1" ]; then EX=1; break; fi
              grep "gallery-biome done ns=$NS page=$p " srv-wall/boot.log | tail -1 || true
            done
            [ "$EX" = "1" ] || { echo "$NS biome walk hit the MAXP cap without exhausted"; exit 1; }
          done
          # the gui SHOTS stay out of the seed walk: openMenu needs a
          # joined viewer, the seed walks headless — its manifests come
          # from the truth shards' walks. INV is different: the inv
          # manifest is a pure SLOT RE-LABELLING of the item manifest
          # (row order -> hotbar.0-8 / inventory.9-35), so the seed
          # derives it server-side and the ours inv replay (which gates
          # on THE SEED's scenes, running parallel to the truth shards)
          # fires. Measured gap: without this derivation the ours inv
          # replay never found manifests and the inventory channel
          # stayed ours-empty on every run.
          python3 - <<'PY'
          import glob, re
          # item pages carry 77 cells but an inventory holds 36 slots, so
          # the derivation CHUNKS the ns's whole ordered item stream into
          # 36-slot inv pages — page-aligned with the truth inv walk
          # (create: 699 items = 10 item pages = 20 inv pages, measured)
          n = 0
          item_files = sorted(glob.glob('srv-wall/c-imagine/scenes/gallery-item-*-p*.tsv'))
          ns_files = {}
          for mf in item_files:
              ns = re.search(r'gallery-item-(.+)-p(\d+)\.tsv$', mf).group(1)
              ns_files.setdefault(ns, []).append(mf)
          for ns, files in ns_files.items():
              files.sort(key=lambda m: int(re.search(r'-p(\d+)\.tsv$', m).group(1)))
              ordered = []
              for mf in files:
                  for line in open(mf, encoding='utf-8'):
                      p = line.rstrip('\n').split('\t')
                      if len(p) >= 5 and p[0] == 'cell' and p[1].lstrip('-').isdigit():
                          ordered.append(p[4])
              chunk = 36
              for pi in range(0, len(ordered), chunk):
                  out = f'srv-wall/c-imagine/scenes/gallery-inv-{ns}-p{pi // chunk}.tsv'
                  with open(out, 'w', encoding='utf-8') as f:
                      f.write('slot\titem\n')
                      for i, item in enumerate(ordered[pi:pi + chunk]):
                          slot = f'hotbar.{i}' if i < 9 else f'inventory.{i}'
                          f.write(f'{slot}\t{item}\n')
                  n += 1
              print(f'inv {ns}: {len(ordered)} items')
          print(f'inv manifests derived: {n}')
          PY
          # 14-dx NAMED EXCLUSION: the seed does NOT walk the variant series
          # (`gallery variant <kind>` — paintings, variants, villagers,
          # effects, trims, banners, pots, enchantments, jukebox songs). The
          # seed exists to seed OURS-side replays, and the ours leg has no
          # variant replay channel yet — the truth shards' variant walk is
          # the only surface these classes need today (the gate runs them
          # DIAGNOSTIC-first, the missing ours shots are the named F2V
          # projection lane). Walking them here would grow the measured
          # ~26-30m seed cache-miss for artifacts nothing reads.
          ls srv-wall/c-imagine/scenes/ | wc -l

      # THE QUAD DUMP: a static pack model cannot know what a dynamic model
      # draws (connected textures, neighbour-aware meshes, culled see-through
      # faces), so the real NeoForge client answers per wall cell, for every mod
      # alike. The block walk ran under a live client (player-ticket parity,
      # 14-bj); the later series may have outlived it — the dump needs A
      # client (models + the join), but NOT the parity (it reads manifests +
      # models, never the wall's settled state), so relaunch freely here.
      - name: quad dump on the real client (cache miss) — trigger after the walk
        if: steps.seed-verify.outputs.hit != 'true'
        run: |
          set -euo pipefail
          SCENES="$PWD/srv-wall/c-imagine/scenes"
          TRIGGER=$(cat dump-trigger-path.txt)
          export DISPLAY=:98 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          if ! grep -qE "Loaded [0-9]+ advancements" truth-client/client-dump.out 2>/dev/null \
             || grep -qiE "disconnected|connection lost" truth-client/client-dump.out 2>/dev/null; then
            echo "the dump client did not survive the walk — relaunching for the dump itself (block parity already banked)"
            pkill -f cim.quaddump 2>/dev/null || true
            rm -f truth-client/client-dump.out
            LAUNCH=$(cat launch-dump.txt)
            setsid bash -c "cd truth-client && timeout 900 bash -c \"$LAUNCH\" > client-dump.out 2>&1" < /dev/null > /dev/null 2>&1 &
            for i in $(seq 1 600); do
              grep -qE "Loaded [0-9]+ advancements" truth-client/client-dump.out 2>/dev/null && break
              sleep 1
            done
            grep -qE "Loaded [0-9]+ advancements" truth-client/client-dump.out \
              || { echo "relaunched dump client failed to join"; tail -40 truth-client/client-dump.out; exit 1; }
            sleep 5
          fi
          # SCREEN CAPTURE: the live client opens every menu the scan found, and
          # ScreenArt saves what the mod really draws. This feeds the pack, so it
          # runs here. A page that fails leaves that menu without art, and a
          # second scan puts back any manifest a lost viewer overwrote.
          for NS in $LADDER_NS; do
            N=$(find "$SCENES" -maxdepth 1 -name "gallery-gui-$NS-p*.tsv" | wc -l)
            for p in $(seq 0 $((N-1))); do
              [ "$N" -gt 0 ] || break
              python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
                "cimscene gallery gui $NS $p" >/dev/null 2>&1 || true
              sleep 5
            done
            python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
              "cimscene gallery gui-scan $NS" >/dev/null 2>&1 || true
          done
          echo "screens captured: $(find srv-wall/c-imagine/screens -name '*.png' 2>/dev/null | wc -l)"
          touch "$TRIGGER"
          for i in $(seq 1 600); do
            grep -q "quad dump done" truth-client/client-dump.out 2>/dev/null && break
            sleep 1
          done
          grep "quad dump done" truth-client/client-dump.out || { tail -40 truth-client/client-dump.out; exit 1; }
          test -f "$SCENES/quads/done"

      - name: build plugin (maven) + F2vPack pack (cache miss)
        if: steps.seed-verify.outputs.hit != 'true'
        env:
          SEED_INPUTS: ${{ steps.seed-inputs.outputs.hash }}
        run: |
          set -euo pipefail
          PV=$(bash scripts/resolve-paper-version.sh 26.3)
          echo "paper-api: $PV"
          mvn -B -ntp -Dpaper.version="$PV" package -f paper-plugin/pom.xml
          (cd paper-plugin && mvn -B -ntp -q dependency:build-classpath \
            -Dmdep.outputFile=target/selftest-cp.txt)
          test -f paper-plugin/target/cim-paper-plugin.jar
          test -f paper-plugin/target/selftest-cp.txt
          # the pack build consumes the manifests (the CMD space) + the mod
          # jars + the VANILLA client jar (--assets: the vanilla-parent
          # resolution must ride the same client that renders the pack —
          # measured run 41126658261)
          [ -f visual-client/launch.txt ] || python3 scripts/fetch-visual-client.py 26.3 visual-client --assets
          mkdir -p seed-pack/scenes seed-pack/f2v seed-pack/plugin
          cp -r srv-wall/c-imagine/scenes/. seed-pack/scenes/
          cp scripts/f2v/visual-items.tsv scripts/f2v/visual-equipment.tsv \
             scripts/f2v/visual-blocks.tsv scripts/f2v/visual-palettes.tsv seed-pack/f2v/
          # the calibration tables ride the pack input dir: absent file =
          # byte-identical behavior (readTintManifest/readEmissiveManifest),
          # present = the measured multiplies / light_emission bake
          for T in visual-tints.tsv visual-emissive.tsv visual-fluid-colors.tsv \
                   visual-rings.tsv; do
            [ -f "scripts/f2v/$T" ] && cp "scripts/f2v/$T" seed-pack/f2v/
          done
          # per-ns pack manifests, then ONE concatenated file per channel —
          # GalleryPack auto-assigns the CMD space (blocks 100000+i, items
          # 300000+i) over the concatenated rows in order, and the plugin
          # resolves by state string, so the ns union is just more rows
          rm -f seed-pack/f2v/visual-gallery.tsv seed-pack/f2v/visual-gallery-items.tsv
          ITEM_CMD=300000   # one CMD space across the namespaces: a restart per ns collides
          for NS in $LADDER_NS; do
            python3 scripts/f2v/gallery-manifest.py \
              seed-pack/scenes $NS seed-pack/f2v/visual-gallery-$NS.tsv
            python3 scripts/f2v/gallery-items-manifest.py \
              seed-pack/scenes $NS seed-pack/f2v/visual-gallery-items-$NS.tsv $ITEM_CMD
            ITEM_CMD=$((ITEM_CMD + $(grep -vc '^#' seed-pack/f2v/visual-gallery-items-$NS.tsv || true)))
            cat seed-pack/f2v/visual-gallery-$NS.tsv >> seed-pack/f2v/visual-gallery.tsv
            cat seed-pack/f2v/visual-gallery-items-$NS.tsv >> seed-pack/f2v/visual-gallery-items.tsv
          done
          # the quad dump's rows: one composite per distinct real mesh. The plain
          # rows stay, for the cells whose static model already draws the same.
          cat seed-pack/scenes/quads/rows.tsv >> seed-pack/f2v/visual-gallery.tsv
          mv seed-pack/scenes/quads seed-pack/f2v/quads
          # the 1.21.1 cow and pig art on 26.3's layouts, read from the real client jar
          pip install -q pillow
          EXTRA=$(find nfc -name 'client-*-extra.jar' | head -1)
          python3 scripts/f2v/entity-remap.py "$EXTRA" scripts/f2v/entity-uv-map.tsv seed-pack/f2v/overlay
          cat scripts/f2v/visual-items.tsv seed-pack/f2v/visual-gallery-items.tsv \
            > seed-pack/f2v/visual-items.tsv
          # THE SOUND+PARTICLE CHANNEL MAPS (2026-11-05, DIAGNOSTIC-first):
          # deterministic vanilla stand-ins for every modded sound/particle
          # the truth walk recorded — the plugin's replays resolve through
          # these (and validate the target against Paper's LIVE registry,
          # so a drifted candidate degrades to the documented default at
          # replay time, never to silence). They ride the f2v dir to the
          # ours shards like the other visual-*.tsv files.
          python3 scripts/f2v/gallery-sounds-mapping.py \
            seed-pack/scenes seed-pack/f2v/visual-sounds.tsv
          python3 scripts/f2v/gallery-particles-mapping.py \
            seed-pack/scenes seed-pack/f2v/visual-particles.tsv
          test -f seed-pack/f2v/visual-sounds.tsv
          test -f seed-pack/f2v/visual-particles.tsv
          FCPL="$(cat paper-plugin/target/selftest-cp.txt)"
          JAVA_HOME=${{ steps.jdk25.outputs.path }} PATH=${{ steps.jdk25.outputs.path }}/bin:$PATH \
            java -cp "paper-plugin/target/cim-paper-plugin.jar:$FCPL" dev.cim.f2v.F2vPack \
            --build srv-wall/mods seed-pack/f2v \
            --assets visual-client/client.jar 2>&1 | tee pack-build.log
          # 14-dy the placeholder ledger: the texture-fidelity audit's named
          # backlog (source sprite + build context + uses per fallback) —
          # the file exists even when EMPTY (the header-only receipt that
          # the build substituted nothing), like the replay .subs.tsv files.
          # THE BUILD WRITES IT (F2vPack drains the ledger at the end of
          # --build; the dump side rides quads/placeholders.tsv) — the assert
          # sits AFTER the build (measured: asserted before the build it
          # failed every run since 14-dy landed, hidden behind the robit
          # disconnect that died the seed earlier).
          test -f seed-pack/f2v/placeholders.tsv
          # Keep the exact captured vertices/colors for parity diagnosis and
          # cache-hit runs, outside the f2v directory served to ours shards.
          mv seed-pack/f2v/quads seed-pack/quads
          rm -rf seed-pack/f2v/overlay
          test -f seed-pack/f2v/pack.sha1
          test -f seed-pack/f2v/visual-gallery.resolved.tsv
          test -f seed-pack/f2v/visual-items.resolved.tsv
          # 14-bi LOADER-UNBAKED demotion (the DT surface_root class): a
          # blockstate whose model chain rides a custom loader the pack
          # cannot bake (dynamictrees:surface_root — the roots' geometry is
          # built by the mod's own code) resolves to NO composite row — the
          # ours display renders sky while the truth renders the mod's own
          # geometry: a structural channel gap, the EntityBlock/BER class.
          # The manifests carry those rows as dyn=1 (reported, never gated —
          # the gate is the real-client leg M5.6). Mechanical: the resolved
          # manifest IS the signal; zero per-mod code; every future mod's
          # loader states get the same honest classification.
          python3 - <<'PY'
          import glob, pathlib, re, sys
          resolved = set()
          total_rows = 0
          for line in pathlib.Path('seed-pack/f2v/visual-gallery.resolved.tsv').read_text().splitlines():
              if line.startswith('#') or not line.strip():
                  continue
              resolved.add(line.split('\t')[0])
          # 14-bx THE RUNTIME-GEOMETRY FAMILIES: dynamictrees builds its
          # leaves, branches, roots and trunk shells from the mod's own code
          # at runtime — the captured mesh is the mod's static fallback blob
          # (#214/#226 measured the q composite riding the captured bake at
          # ae 323K-369K against the truth's own sparse bushy render), so the
          # pack channel structurally cannot reproduce the DT's runtime leaf
          # mesh. The honest class = M5.6 (reported, never gated — the gate
          # is the real-client leg). Mechanical: the namespace + the family
          # pattern, no per-state code.
          dt_runtime = re.compile(
              r'^dynamictrees:[a-z_0-9]*(leaves|branch|root|trunk|sapling|pod|cocoa)[a-z_0-9]*(?:\[|$)')
          flipped = 0
          for mf in pathlib.Path('seed-pack/scenes').glob('gallery-*-p*.tsv'):
              if '.ctx.' in mf.name:
                  continue
              lines = mf.read_text().splitlines()
              out = []
              for line in lines:
                  p = line.split('\t')
                  if (p[0] == 'cell' and len(p) >= 6 and p[5].strip() == '0'
                          and not p[4].startswith('minecraft:')
                          and (p[4] not in resolved or dt_runtime.match(p[4]))):
                      p[5] = '1'
                      flipped += 1
                      out.append('\t'.join(p))
                  else:
                      out.append(line)
              if flipped:
                  mf.write_text('\n'.join(out) + '\n')
              total_rows += sum(1 for line in out if line.startswith('cell\t'))
          # THE SAFEGUARD: the demotion is for the SMALL structural class (the
          # custom-loader states). A mass flip means the pack build is broken
          # (the 14-ay bare-parent class, a jar missing...) — fail loudly, do
          # NOT silently demote the gate away.
          PCT = 100.0 * flipped / max(1, total_rows)
          print(f"loader-unbaked dyn flip: {flipped}/{total_rows} rows ({PCT:.1f}%)")
          if PCT > 25.0:
              print(f"LOADER-UNBAKED FLOOD: {PCT:.1f}% of the modded manifest rows have no pack composite — the pack build is broken; fix the resolver instead of demoting the gate")
              sys.exit(1)
          PY
          cp paper-plugin/target/cim-paper-plugin.jar seed-pack/plugin/
          cp paper-plugin/target/selftest-cp.txt seed-pack/plugin/
          cp srv-wall/boot.log seed-pack/boot-walk.log
          # the FRESHNESS STAMP: this payload is valid only for THIS input
          # tree; the verify steps (seed + ours shards) compare it against
          # SEED_INPUTS — measured #47: a prefix-restored older pack silently
          # served a stale builder and the missingno wall came back
          # the ours leg draws from the same scenes, and the gate masks to this art
          cp srv-wall/c-imagine/f2v/screens.tsv srv-wall/c-imagine/f2v/icons.tsv seed-pack/f2v/ 2>/dev/null || true
          mkdir -p seed-pack/screens
          cp -r srv-wall/c-imagine/screens/. seed-pack/screens/ 2>/dev/null || true
          echo "$SEED_INPUTS" > seed-pack/f2v/inputs.sha1
          echo "seed built: sha1=$(cat seed-pack/f2v/pack.sha1)"

      - name: save seed cache (success-only — a partial seed-pack must never poison the key)
        if: success() && steps.seed-verify.outputs.hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: seed-pack
          key: gallery-seed-v3-${{ steps.seed-inputs.outputs.hash }}

      - name: upload seed-pack artifact (cache-eviction fallback)
        if: success() && steps.seed-verify.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seed-pack
          path: |
            seed-pack/scenes
            seed-pack/screens
            seed-pack/f2v
            seed-pack/plugin
          if-no-files-found: error

      # the pack BYTES themselves, always — local probes must debug the exact
      # model/composite files the CI render consumed (14-g: the empty-display
      # cells reproduced nowhere locally, the byte-level diff was the blocker)
      - name: upload seed pack bytes (always)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seed-pack-bytes
          path: |
            seed-pack/f2v/pack.zip
            seed-pack/f2v/pack.sha1
            seed-pack/f2v/inputs.sha1
            seed-pack/f2v/visual-gallery.resolved.tsv
            seed-pack/f2v/visual-items.resolved.tsv
          if-no-files-found: error

      - name: upload captured meshes and source mappings (also on failure)
        if: ${{ always() && hashFiles('seed-pack/quads/rows.tsv', 'seed-pack/f2v/quads/rows.tsv', 'srv-wall/c-imagine/scenes/quads/rows.tsv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: seed-captured-meshes
          path: |
            seed-pack/quads
            seed-pack/f2v/quads
            srv-wall/c-imagine/scenes/quads
            seed-pack/scenes/*.ctx.tsv
            srv-wall/c-imagine/scenes/*.ctx.tsv
            seed-pack/scenes/*.light
            srv-wall/c-imagine/scenes/*.light
            seed-pack/f2v/visual-gallery.resolved.tsv
            seed-pack/f2v/visual-items.resolved.tsv
            seed-pack/f2v/pack.sha1
            seed-pack/f2v/inputs.sha1
            pack-build.log
            truth-client/client-dump.out
          if-no-files-found: error

  # ----------------------------------------------------------- wall-truth --
  # K shards, each = one full truth stack (real NeoForge server + real
  # client) shooting pages i, i+K, ... of EVERY class. The manifests are
  # written fresh every run by the walk itself (they ARE the cell contract
  # the join consumes — never a cached artifact).
  wall-truth:
    name: gallery truth s${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SI: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: restore built scene/test-mod jars (cache)
        id: jars-cache
        uses: actions/cache@v4
        with:
          path: |
            test-mods/build/libs
            scene-mod/build/libs
          key: gallery-jars-v1-${{ hashFiles('test-mods/src/**', 'scene-mod/src/**', 'test-mods/*.gradle*', 'scene-mod/*.gradle*', 'gradle/**') }}

      - name: build cimtest + cimscene (cache miss)
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          gradle build --no-daemon -p test-mods
          gradle build --no-daemon -p scene-mod

      - name: verify the built jars (stale-cache guard)
        run: |
          test -f test-mods/build/libs/cimtest-1.0.0.jar || { echo "cimtest jar missing"; exit 1; }
          test -f scene-mod/build/libs/cimscene-1.0.0.jar || { echo "cimscene jar missing"; exit 1; }

      - name: restore NeoForge server layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer-srv
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 21.1.265 server (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-srv-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-srv-installer.jar --installServer layer-srv

      - name: fetch ladder mods (locked)
        run: bash scripts/cimscene/fetch-ladder.sh mods-ladder $LADDER_SLUGS

      - name: launch server (background) + assemble client runtime while it boots
        run: |
          set -euo pipefail
          # THE OVERLAP (13-b): the server boots in the background while the
          # client runtime is prepared — the boot wait and the apt/xvfb/
          # options prep used to be sequential steps (measured #35:
          # ~2.5 min serial). The join step polls RCON before launching.
          cp -r layer-srv srv-wall
          mkdir -p srv-wall/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv-wall/mods/
          cp scene-mod/build/libs/cimscene-1.0.0.jar srv-wall/mods/
          cp mods-ladder/*.jar srv-wall/mods/
          echo "eula=true" > srv-wall/eula.txt
          cat > srv-wall/server.properties <<'PROPS'
          online-mode=false
          white-list=false
          difficulty=peaceful
          level-type=minecraft:flat
          level-seed=42
          view-distance=6
          simulation-distance=4
          spawn-protection=0
          max-players=5
          enable-rcon=true
          rcon.port=25575
          rcon.password=cimgate
          PROPS
          cd srv-wall
          rm -rf world world_nether world_the_end   # fresh flat world
          setsid bash -c "java -Xmx2G @libraries/net/neoforged/neoforge/21.1.265/unix_args.txt --nogui >> boot.log 2>&1" < /dev/null > /dev/null 2>&1 &
          cd ..
          javac -d vtools scripts/visual/Shot.java scripts/visual/ShotD.java scripts/visual/Key.java
          NEED=""
          for pkg in libgl1-mesa-dri libglx-mesa0 libxtst6; do
            dpkg -s "$pkg" >/dev/null 2>&1 || NEED="$NEED $pkg"
          done
          apt_retry() {
            # THE RUNNER DNS INCIDENT (43046583185 + rerun: all 8 ours shards died at
            # apt with "Temporary failure resolving security.ubuntu.com" — exit 100,
            # the GL stack never installed, the client never launched). The failure
            # is on the runner's resolver, not the repo; ride it out: up to 4 tries
            # with a 30s gap, Acquire::Retries for the packet-level retries.
            local need="$*"
            for i in 1 2 3 4; do
              # Keep apt's signed security suite on the official archive if
              # only the security host fails DNS; retries alone cannot fix it.
              if ! timeout 10 getent ahosts security.ubuntu.com >/dev/null 2>&1 \
                 && timeout 10 getent ahosts archive.ubuntu.com >/dev/null 2>&1; then
                sudo python3 scripts/visual/ubuntu-mirror-fallback.py /etc/apt
              fi
              if sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq $need; then
                return 0
              fi
              echo "[apt_retry] attempt $i failed — retrying in 30s"
              sleep 30
            done
            echo "[apt_retry] all attempts failed"
            return 1
          }
          if [ -n "${NEED:-}" ]; then
            apt_retry $NEED
          fi
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 1
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=4

      - name: restore NeoForge truth client runtime (cache)
        id: nfc-cache
        uses: actions/cache@v4
        with:
          # MEASURED (run 41106933552, the guard's missing-jar list):
          # fetch-truth-client.py nfc truth-client puts the RUNTIME
          # (libraries/classpath/launch) in nfc/ and the game dir in
          # truth-client/ — the classpath references nfc/...; caching only
          # truth-client shipped a client whose jars were never there
          path: |
            nfc
            truth-client
          key: neoforge-truth-client-1211-v4

      - name: verify the client runtime (stale-cache guard)
        if: steps.nfc-cache.outputs.cache-hit == 'true'
        run: |
          python3 - <<'PY'
          import pathlib, sys
          missing = []
          cp = pathlib.Path('truth-client/classpath.txt')
          if not cp.is_file():
              print('classpath.txt missing'); sys.exit(1)
          missing += [p for p in cp.read_text().split(':')
                      if p.strip() and not pathlib.Path(p).is_file()]
          launch = pathlib.Path('truth-client/launch.txt').read_text()
          if '-p ' in launch:
              seg = launch.split('-p ', 1)[1].split()[0]
              missing += [p for p in seg.split(':')
                          if p.strip() and not pathlib.Path(p).is_file()]
          if missing:
              print('runtime jars MISSING (stale cache):', missing[:8])
              sys.exit(1)
          print('client runtime classpath verified')
          PY

      - name: fetch + assemble the NeoForge client runtime (cache miss)
        if: steps.nfc-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/truth/fetch-truth-client.py nfc truth-client --assets
          wc -c truth-client/classpath.txt truth-client/launch.txt
          sed -i 's/^java /java -Xmx2G /' truth-client/launch.txt

      - name: camera pins (RCON after the server settles) + client joins
        run: |
          set -euo pipefail
          # Runtime caches include game/: fresh inputs MUST be staged after
          # restore, or old jars overwrite the server's current mod/channel set.
          mkdir -p truth-client/game/mods
          find truth-client/game/mods -maxdepth 1 -type f -name '*.jar' -delete
          cp srv-wall/mods/*.jar truth-client/game/mods/
          for JAR in srv-wall/mods/*.jar; do
            cmp "$JAR" "truth-client/game/mods/$(basename "$JAR")"
          done
          sha256sum truth-client/game/mods/*.jar > truth-client-mods.sha256
          cat truth-client-mods.sha256
          # options value maps linearly: 70 + 40*v on both client versions.
          printf 'onboardAccessibility:false\nfov:0.0\npauseOnLostFocus:false\nmipmapLevels:4\nrenderClouds:false\n' > truth-client/game/options.txt
          printf 'tutorialStep:none\nonboardAccessibility:false\nfov:0.0\npauseOnLostFocus:false\nrenderClouds:false\n' > truth-client/game/options.txt
          python3 scripts/visual/make_servers_dat.py truth-client/game
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=4
          # world pins FIRST (they also prove the server's RCON is up)
          R=""
          for i in $(seq 1 180); do
            R=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1 || true)
            [ -n "$R" ] && break
            sleep 1
          done
          [ -n "$R" ] || { tail -60 srv-wall/boot.log; exit 1; }
          echo "truth server up: $R"
          # 14-ab GROUND NEUTRALIZATION (the #74 forensics: the superflat
          # grass around the gallery renders with a version-tinted texture —
          # 1.21.1 vs 26.3 grass_block differ by ~11 mean|d| per channel =
          # ~100k of ae on every crop that touches the ground, an
          # irreducible floor the 60k gate cannot survive). Both legs lay
          # the SAME deterministic floor: smooth_stone (uniform texture, no
          # per-block rotation) over the corridor and the whole ground band
          # the camera can see behind the wall (view-distance 6 = 96 blocks).
          # The fill is part of the RIG, identical on both stacks.
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "forceload add -128 8 128 104" \
            "fill -40 -61 -2 40 -61 9 minecraft:smooth_stone" \
            "fill -128 -61 10 128 -61 100 minecraft:smooth_stone" | tee ground-fill.log
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "gamerule doDaylightCycle false" "time set noon" \
            "gamerule doWeatherCycle false" "weather clear" \
            "gamerule doMobSpawning false" "gamerule randomTickSpeed 0" | tee truth-pins.log
          # 14-di THE PER-RUN SCREEN ART: every menu the truth walk opens
          # dumps its art (ScreenArt) into truth-screens/ — the menu gate's
          # art mask then bounds the CURRENT truth's drawing, and the menus
          # the seed's capture pass missed (the generic-screen class ceiling:
          # safe/trapped_present ride VariableSizeContainerScreen, the ae2
          # terminals) get their scenes from the run instead of the seed.
          mkdir -p truth-screens
          # delimiter '#': $PWD is /-joined, a /-delimited sed program dies on it
          # (char 51: unknown option to `s' — all 8 truth shards died on exactly
          # this line in run 43189508798). '#' cannot appear in an absolute path.
          LAUNCH=$(sed "s#^java #java -Dcim.nomouse=true -Dcim.screenart=$PWD/truth-screens #" truth-client/launch.txt)
          setsid bash -c "cd truth-client && $LAUNCH > client.out 2>&1" < /dev/null > /dev/null 2>&1 &
          for i in $(seq 1 90); do
            L=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1 || true)
            case "$L" in *cimviewer*) break;; esac
            sleep 1
          done
          case "$L" in *cimviewer*) echo "truth client joined: $L";;
            *) tail -30 truth-client/client.out; exit 1;; esac
          for i in $(seq 1 30); do
            grep -qE "Loaded [0-9]+ advancements" truth-client/client.out 2>/dev/null && break
            sleep 1
          done
          sleep 8   # first chunk render on llvmpipe

      # 14-di THE GUI-FIRST WALK + THE EARLY ART HANDSHAKE: the menus lane
      # runs BEFORE the heavy walks so every menu the run opens dumps its
      # ScreenArt (truth-screens/) within the first minutes of the shard;
      # the upload below publishes it, and the ours sibling waits for
      # exactly this artifact before its Paper boot — the pack overlay
      # serves the run's own captures for the menus the seed's walk missed
      # (the generic-screen class ceiling, the opener asymmetry) without
      # serializing the whole truth leg behind the ours boot.
      - name: wall walk — GUI first (14-di early art)
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=4
          coproc RCON { python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate --batch; }
          rcon() { # one command per argument; prints "> cmd" + response per command
            local c line out ok
            for c in "$@"; do
              [ -n "$c" ] || continue   # the driver skips empty lines; sending one would deadlock the reader
              printf '%s\n' "$c" >&"${RCON[1]}" || { echo "rcon driver died (send: $c)" >&2; return 1; }
              out=""; ok=0
              while IFS= read -r line <&"${RCON[0]}"; do
                if [ "$line" = "__RCON_RESP_END__" ]; then ok=1; break; fi
                out+="$line"$'\n'
              done
              [ "$ok" = "1" ] || { echo "rcon driver died (read: $c)" >&2; return 1; }
              printf '%s' "$out"
            done
          }
          read -r -t 60 RCON_HELLO <&"${RCON[0]}" || { echo "rcon driver failed to start (auth?)" >&2; exit 1; }
          [ "$RCON_HELLO" = "__RCON_READY__" ] || { echo "rcon driver handshake: $RCON_HELLO" >&2; exit 1; }
          source scripts/cimscene/walk-helpers.sh
          rcon "cimscene cleanup-assemblies" "kill @e[type=!player]" "tp cimviewer 0.5 -60 0.5 0 0"
          sleep 5
          java -cp vtools Key F1
          sleep 1
          mkdir -p truth-shots truth-screens
          # GUI walk (per ladder ns, to exhaustion — DIAGNOSTIC class): ONE
          # MenuType per page opened for the rig viewer through the vanilla
          # openMenu surface; menus that need block context throw on the
          # empty extra-data buffer and become named open-failed rows (the
          # honest measured surface). Screenshot 2s after the marker (the
          # screen renders on the next client tick).
          for NS in $LADDER_NS; do
            EX=0
            for p in $(seq $SI $K $MAXP); do
              base_of "gallery-gui-$NS-p$p"
              rcon "cimscene gallery gui $NS $p"
              RC=0; wait_done "gallery-gui-$NS-p$p" "$V0D" "$V0E" || RC=$?
              [ "$RC" = "2" ] && { echo "$NS gui page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
              if [ "$RC" = "1" ]; then EX=1; break; fi
              grep "gallery-gui done ns=$NS page=$p " srv-wall/boot.log | tail -1 || true
              sleep 2   # the client screen renders
              # MOUSEOFF (menus lane, 477489e6): the real client's mouse is parked
              # off the menu so no hover state leaks into the truth shot; shot.sh
              # (main lane, b49718b1) captures through the warm ShotD daemon.
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              java -cp vtools Key MOUSEOFF || true
              sleep 0.5
              bash scripts/visual/shot.sh "truth-shots/gal-gui-$NS$p.png" \
                || echo "$NS gui page $p shot failed (diagnostic tolerated)"
              # ESC closes the open screen before the next page (the next
              # command also closeContainer()s server-side — belt, braces)
              java -cp vtools Key ESC || true
            done
            [ "$EX" = "1" ] || { echo "$NS gui walk hit the MAXP cap without exhausted"; exit 1; }
          done
          # the menus lane is done — the client must be alive for the heavy walks
          client_alive || truth_rejoin

      - name: upload truth screens s${{ matrix.shard }} (14-di early art — the ours sibling waits for exactly this)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-truth-screens-${{ matrix.shard }}
          path: truth-screens/
          if-no-files-found: warn

      - name: wall walk — STRIDE, fixed camera, page shots (blocks per ladder ns + probes)
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=4
          # 14-bt THE PERSISTENT RCON DRIVER (mirror of the seed walk): ONE
          # --batch process carries every walk command of this step — the
          # per-page python/TCP/auth startup cost (~0.3-0.5 s x hundreds of
          # pages = minutes per shard) is gone. The marker waits stay in
          # bash between the sends (base_of BEFORE the send — the #39 mtime
          # law — then wait_done); the settle protocol below is untouched.
          coproc RCON { python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate --batch; }
          rcon() { # one command per argument; prints "> cmd" + response per command
            local c line out ok
            for c in "$@"; do
              [ -n "$c" ] || continue   # the driver skips empty lines; sending one would deadlock the reader
              printf '%s\n' "$c" >&"${RCON[1]}" || { echo "rcon driver died (send: $c)" >&2; return 1; }
              out=""; ok=0
              while IFS= read -r line <&"${RCON[0]}"; do
                if [ "$line" = "__RCON_RESP_END__" ]; then ok=1; break; fi
                out+="$line"$'\n'
              done
              [ "$ok" = "1" ] || { echo "rcon driver died (read: $c)" >&2; return 1; }
              printf '%s' "$out"
            done
          }
          read -r -t 60 RCON_HELLO <&"${RCON[0]}" || { echo "rcon driver failed to start (auth?)" >&2; exit 1; }
          [ "$RCON_HELLO" = "__RCON_READY__" ] || { echo "rcon driver handshake: $RCON_HELLO" >&2; exit 1; }
          rcon "cimscene cleanup-assemblies" "kill @e[type=!player]" "tp cimviewer 0.5 -60 0.5 0 0"
          sleep 5
          # 14-di: the HUD is already OFF — the gui-first step pressed F1, and
          # a second press would TOGGLE it back ON over every block shot.
          mkdir -p truth-shots
          # THE STRIDE WALK (13-b): pages $SI, $SI+$K, ... — every shard
          # walks its own arithmetic progression; the scene answers
          # exhausted=1 for any page beyond the registry, so each shard
          # terminates on its own sequence and the union of strides is
          # exactly the full page space. THE MARKER IS THE FILE the scene
          # writes at the same code point as the boot.log line (13-c — a
          # quiet console pipeline can stall, a Files.writeString cannot).
          # the shared walk helpers (14-di: sourced, not inline — three steps, one law)
          source scripts/cimscene/walk-helpers.sh
          EXHAUSTED=0
          for NS in $LADDER_NS; do
            for p in $(seq $SI $K $MAXP); do
              base_of "gallery-$NS-p$p"
              rcon "cimscene gallery page $NS $p"
              RC=0; wait_done "gallery-$NS-p$p" "$V0D" "$V0E" || RC=$?
              [ "$RC" = "2" ] && { echo "$NS page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
              if [ "$RC" = "1" ]; then
                echo "$NS block walk exhausted at page $p"
                EXHAUSTED=1
                break
              fi
              grep "gallery done ns=$NS page=$p " srv-wall/boot.log | tail -1 || true
              sleep 1   # section rebuild + lighting (the measured fixed-window
              # protocol — NEVER trimmed; the polls around it were)
              # 14-i CAMERA RE-PIN before EVERY shot (the measured 14-h/14-g
              # drift: the client slides forward through the collision-free
              # display wall between the step's single pin and the late probes
              # — the isolated v1/v2 shots caught the camera at yaw 180 behind
              # the wall, mirrored x. One RCON call per page is ~free; the
              # shot-time camera is now contract-exact forever).
              # 14-y RENDER-SETTLE (the #72 p5 failure: server reported
              # cells=63 mutated=44 with the settled TSV holding all 48 pillar
              # cells, yet the truth frame caught PRE-RENDER sky + stale
              # debris — the llvmpipe client had not rasterised the heavy
              # section when the 1s window elapsed). Two consecutive identical
              # shots = the frame is settled; bounded to 8 tries; the camera
              # is re-pinned before every attempt (14-i law).
              PREV=""
              for i in $(seq 1 8); do
                rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
                bash scripts/visual/shot.sh "truth-shots/.settle-$NS-p$p.png"
                CUR=$(md5sum "truth-shots/.settle-$NS-p$p.png" | cut -d' ' -f1)
                if [ -n "$PREV" ] && [ "$CUR" = "$PREV" ]; then break; fi
                PREV="$CUR"
              done
              rm -f "truth-shots/.settle-$NS-p$p.png"
              bash scripts/visual/shot.sh "truth-shots/gal-p-$NS$p.png"
              # ANIM liveness probe (DIAGNOSTIC): kinetic pages only — a
              # page whose manifest carries dyn=1 cells (manifest-driven,
              # zero hardcode; the static pages stay one-shot). Two frames
              # 2s apart per leg; anim-diff.py joins the DELTAS (a
              # static-but-should-rotate divergence shows as ours-delta ~ 0
              # while truth-delta > threshold).
              DYNC=$(awk -F'\t' '$1=="cell" && $6=="1"{n++} END{print n+0}' "srv-wall/c-imagine/scenes/gallery-$NS-p$p.tsv")
              if [ "${DYNC:-0}" -gt 0 ]; then
                bash scripts/visual/shot.sh "truth-shots/gal-p-$NS$p-t0.png"
                sleep 2
                bash scripts/visual/shot.sh "truth-shots/gal-p-$NS$p-t1.png"
              fi
              echo "shot $NS page $p"
            done
            [ "$EXHAUSTED" = "1" ] || { echo "$NS block walk hit the MAXP cap without the exhausted marker — coverage incomplete"; exit 1; }
          done
          # determinism probe: re-place page 0, shoot again (diagnostic,
          # not gated) — shard 0 owns page 0 (0 = 0 mod K)
          if [ "$SI" = "0" ]; then
            for NS in $LADDER_NS; do
              rcon "cimscene gallery page $NS 0"
              sleep 2
              bash scripts/visual/shot.sh "truth-shots/gal-p-${NS}0-again.png"
              echo "shot $NS page 0 again"
            done
          fi
          ls truth-shots/ | head -5 || true
          echo "block pages shot: $(ls truth-shots/gal-p-*.png 2>/dev/null | grep -v -- '-again' | wc -l)"

      - name: entity walk — STRIDE (MOB pages gate + dyn/large diagnostic + every ladder ns to exhaustion)
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=4
          # 14-bt THE PERSISTENT RCON DRIVER (mirror of the wall walk): ONE
          # --batch process carries every walk command of this step; the
          # marker waits / settle windows / shot sequences stay in bash
          # between the sends, byte-for-byte the same protocol.
          coproc RCON { python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate --batch; }
          rcon() { # one command per argument; prints "> cmd" + response per command
            local c line out ok
            for c in "$@"; do
              [ -n "$c" ] || continue   # the driver skips empty lines; sending one would deadlock the reader
              printf '%s\n' "$c" >&"${RCON[1]}" || { echo "rcon driver died (send: $c)" >&2; return 1; }
              out=""; ok=0
              while IFS= read -r line <&"${RCON[0]}"; do
                if [ "$line" = "__RCON_RESP_END__" ]; then ok=1; break; fi
                out+="$line"$'\n'
              done
              [ "$ok" = "1" ] || { echo "rcon driver died (read: $c)" >&2; return 1; }
              printf '%s' "$out"
            done
          }
          read -r -t 60 RCON_HELLO <&"${RCON[0]}" || { echo "rcon driver failed to start (auth?)" >&2; exit 1; }
          [ "$RCON_HELLO" = "__RCON_READY__" ] || { echo "rcon driver handshake: $RCON_HELLO" >&2; exit 1; }
