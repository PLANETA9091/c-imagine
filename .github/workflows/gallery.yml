            printf 'cell\t-5\t-60\t9\tcreate:small_scoria_brick_stairs[facing=east,half=bottom,shape=outer_left,waterlogged=false]\n' >> "srv-wall/c-imagine/$SC3"
            SC4=scenes/gallery-create-p9004.tsv
            printf 'cell\tx\ty\tz\tstate\n' > "srv-wall/c-imagine/$SC4"
            printf 'cell\t-5\t-60\t9\tcreate:small_scoria_brick_stairs[facing=east,half=bottom,shape=outer_left,waterlogged=false]\n' >> "srv-wall/c-imagine/$SC4"
            SC6=scenes/gallery-create-p9006.tsv
            printf 'cell\tx\ty\tz\tstate\n' > "srv-wall/c-imagine/$SC6"
            printf 'cell\t-5\t-60\t9\tcreate:cut_scoria_wall[east=low,north=none,south=none,up=true,waterlogged=false,west=none]\n' >> "srv-wall/c-imagine/$SC6"
            SC5=scenes/gallery-create-p9005.tsv
            printf 'cell\tx\ty\tz\tstate\n' > "srv-wall/c-imagine/$SC5"
            printf 'cell\t-5\t-60\t9\tcreate:small_scoria_brick_stairs[facing=north,half=bottom,shape=outer_left,waterlogged=false]\n' >> "srv-wall/c-imagine/$SC5"
            # ENTRY = page:name:camX:camY:camZ:yaw:pitch — the camera is
            # per-isolate now: the front views sit at the cispot (0.5,-60,0.5,
            # yaw 0 = south in MC, the wall's cells face it); the back view
            # (9004) stands SOUTH of the cell (z 17.5) looking NORTH (yaw
            # 180) to see the composite from behind; 9002 aims up at the
