              RC=0; wait_done "gallery-$TAG-minecraft-p$p" "$V0D" "$V0E" || RC=$?
              [ "$RC" = "2" ] && { echo "$SERIES page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
              grep "gallery-$TAG done ns=minecraft page=$p " srv-wall/boot.log | tail -1 || true
              ensure_alive_rerun "gallery-$TAG-minecraft-p$p" "minecraft $SERIES page $p" "$p" \
                "cimscene gallery entity $SERIES minecraft $p"
              sleep 2   # + the 2s settle before done (14-an: the settle rides wait_done)
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "truth-shots/gal-e$SERIES$p.png"
              sleep 2   # 14-bf the self-consistency pair (the mob-page 14-aj pattern): the vanilla dyn/large rows now gate and boats/arrows/camels MOVE — the second shot names the time-varying cells (ANIMATED) instead of red-gating an animation phase
              bash scripts/visual/shot.sh "truth-shots/gal-e$SERIES$p-self.png"
