      - name: wall replay — STRIDE (blocks + probes + isolated displays)
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=4
          # 14-bt THE PERSISTENT RCON DRIVER (mirror of the truth leg): ONE
          # --batch process carries every replay command of this step; the
          # placed-marker asserts consume the SAME per-command responses the
          # per-call invocations printed. A dead driver fails the step the
          # same way a failed per-call rcon did.
          coproc RCON { python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate --batch; }
          # 14-e15 THE COPROC LAW: rcon() must NEVER run inside a pipeline
          # element or command substitution — a subshell cannot reach the
          # coproc fd and the send dies ("rcon driver died (send: ...)").
          # The measured walk-killer (runs 43579201630, fe59c8c3-era,
          # 43584748689: all 16 shards each). Route the output through a
          # file when the receipt needs printing.
          rcon() { # one command per argument; prints "> cmd" + response per command
            local c line out ok
            for c in "$@"; do
              [ -n "$c" ] || continue   # the driver skips empty lines; sending one would deadlock the reader
              printf '%s\n' "$c" >&"${RCON[1]}" || { echo "rcon driver died (send: $c)" >&2; return 1; }
              out=""; ok=0
              while IFS= read -r line <&"${RCON[0]}"; do
                if [ "$line" = "__RCON_RESP_END__" ]; then ok=1; break; fi
                out+="$line"$'\n'
              done
              [ "$ok" = "1" ] || { echo "rcon driver died (read: $c)" >&2; return 1; }
              printf '%s' "$out"
            done
          }
          read -r -t 60 RCON_HELLO <&"${RCON[0]}" || { echo "rcon driver failed to start (auth?)" >&2; exit 1; }
          [ "$RCON_HELLO" = "__RCON_READY__" ] || { echo "rcon driver handshake: $RCON_HELLO" >&2; exit 1; }
          rcon "kill @e[type=!player]" "tp cimviewer 0.5 -60 0.5 0 0"
          sleep 5
          java -cp vtools Key F1
          sleep 1
          mkdir -p ours-shots
          # EXHAUSTIVE STRIDE REPLAY: the staged manifests ARE the page set —
          # replay each stride page until the manifest list runs out for
          # THIS shard's progression. The RCON response IS the completion
          # marker (sendMessage goes to the sender, not boot.log — measured
          # in run 41103826488).
          # determinism probe (diagnostic, not gated) — shard 0 owns page 0
          if [ "$SI" = "0" ]; then
            for NS in $LADDER_NS; do
              rcon "kill @e[type=!player]" "cim galleryclear" "cim gallerypage $NS 0"
              sleep 2
              rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
              bash scripts/visual/shot.sh "ours-shots/ours-gal-p-${NS}0-again.png"
              echo "shot $NS page 0 again"
            done
            # 12-ac/12-ah bisect x2: ONE isolated display per suspect family,
            # shot alone against sky (diagnostic continuity)
            CMD_PANE=$(grep -m1 "create:acacia_window_pane" srv-wall/c-imagine/f2v/visual-gallery.resolved.tsv | cut -f2)
            test -n "$CMD_PANE" || { echo "no pane CMD in the resolved manifest"; exit 1; }
            CMD_CASING=$(grep -m1 "create:andesite_casing" srv-wall/c-imagine/f2v/visual-gallery.resolved.tsv | cut -f2)
            test -n "$CMD_CASING" || { echo "no casing CMD in the resolved manifest"; exit 1; }
            echo "isolated displays: pane cmd=$CMD_PANE casing cmd=$CMD_CASING"
            rcon "kill @e[type=!player]" "cim galleryclear" \
              "summon minecraft:item_display -1.5 -59.5 9.5 {billboard:\"fixed\",item:{id:\"minecraft:paper\",count:1,components:{\"minecraft:custom_model_data\":{floats:[${CMD_PANE}f]}}}}" \
              "summon minecraft:item_display 1.5 -59.5 9.5 {billboard:\"fixed\",item:{id:\"minecraft:paper\",count:1,components:{\"minecraft:custom_model_data\":{floats:[${CMD_CASING}f]}}}}"
            sleep 2
            rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
            bash scripts/visual/shot.sh "ours-shots/ours-isolated-pane-casing.png"
            echo "shot isolated pane+casing"
            # 14-at SCALE DATUM (diagnostic, never gated): the isolate layout
            # is byte-stable across runs when the display pipeline is sane
            # (#95 and #107 render the identical 78x79 casing at x 496-573) —
            # print the casing bbox every run so a page-scale magnification
            # regression announces itself in the log, not in a RED flood.
          # 14-au: the runner python has no numpy/Pillow until the JOIN step
          # installs them — the datum must not depend on step order (measured
          # #110: ModuleNotFoundError, the || true swallowed it, no datum).
          python3 -c "import numpy, PIL" 2>/dev/null \
            || pip install -q numpy pillow || true
          python3 - <<'PY' || true
          import numpy as np
          from PIL import Image
          from collections import deque
          a = np.asarray(Image.open("ours-shots/ours-isolated-pane-casing.png").convert("RGB")).astype(int)
          r, g, b = a[:, :, 0], a[:, :, 1], a[:, :, 2]
          obj = ~(((abs(r - g) < 14) & (abs(g - b) < 14)) | (b > r + 25))
          obj[:390, :] = False
          obj[560:, :] = False
          # no scipy on the runner — deque BFS for the largest component
          seen = np.zeros_like(obj, dtype=bool)
          best = None
          ys, xs = np.where(obj)
          for sy, sx in zip(ys.tolist(), xs.tolist()):
              if seen[sy, sx]:
                  continue
              q = deque([(sy, sx)])
              seen[sy, sx] = True
              n = 0
              minx = maxx = sx
              miny = maxy = sy
              while q:
                  y, x = q.popleft()
                  n += 1
                  if x < minx: minx = x
                  if x > maxx: maxx = x
                  if y < miny: miny = y
                  if y > maxy: maxy = y
                  for dy, dx in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                      ny, nx = y + dy, x + dx
                      if 0 <= ny < obj.shape[0] and 0 <= nx < obj.shape[1] and obj[ny, nx] and not seen[ny, nx]:
                          seen[ny, nx] = True
                          q.append((ny, nx))
              if n >= 1000 and (best is None or n > best[0]):
                  best = (n, minx, maxx, miny, maxy)
          if best:
              _, x0, x1, y0, y1 = best
              print(f"ISOLATE_SCALE casing w={x1 - x0 + 1} h={y1 - y0 + 1} x={x0}..{x1} y={y0}..{y1} (14-av fov:0.0 pin: ~56x57 near x=496..573 y=438..516; pre-14av -0.65 era: 78x79)")
          else:
              print("ISOLATE_SCALE MISSING — no casing-sized object in the isolate frame")
          PY
            # 14-g/h SUSPECT ISOLATES v2 (diagnostic, not gated): the v1 batch
            # shot (8 summons in one frame) rendered a MIRRORED/STRETCHED
            # layout — geometrically impossible for any camera pose, so the
            # batch itself is the suspect. v2: ONE display per shot, and the
            # entity's authoritative Pos is DUMPED to the log next to every
            # shot (data get entity @e[...] — exactly one display exists per
            # frame). 4 positions cover the shift classes: the perfect north
            # control, the (-24,+25)-shifted south straight, the (+23,+27)
            # south top, and the in-page-empty layered_scoria.
            CMD_NB=$(grep -m1 "create:cut_scorchia_brick_stairs\[facing=north,half=bottom,shape=straight,waterlogged=false\]" srv-wall/c-imagine/f2v/visual-gallery.resolved.tsv | cut -f2)
            CMD_SB=$(grep -m1 "create:cut_scorchia_brick_stairs\[facing=south,half=bottom,shape=straight,waterlogged=false\]" srv-wall/c-imagine/f2v/visual-gallery.resolved.tsv | cut -f2)
            CMD_ST=$(grep -m1 "create:cut_scorchia_brick_stairs\[facing=south,half=top,shape=straight,waterlogged=false\]" srv-wall/c-imagine/f2v/visual-gallery.resolved.tsv | cut -f2)
            CMD_LAYERED=$(grep -m1 "create:layered_scoria" srv-wall/c-imagine/f2v/visual-gallery.resolved.tsv | cut -f2)
            test -n "$CMD_NB" && test -n "$CMD_SB" && test -n "$CMD_ST" && test -n "$CMD_LAYERED" \
              || { echo "suspect CMDs missing from the resolved manifest"; exit 1; }
            echo "suspects v2: nb=$CMD_NB sb=$CMD_SB st=$CMD_ST layered=$CMD_LAYERED"
            TR='transformation:{translation:[0f,-0.0184f,0f],left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f],scale:[1.0126f,1.0126f,1.0126f]}'
            for ENTRY in "nb:$CMD_NB:-2.5" "sb:$CMD_SB:-2.5" "st:$CMD_ST:-2.5" "layered:$CMD_LAYERED:-2.5"; do
