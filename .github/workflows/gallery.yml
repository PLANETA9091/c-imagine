            printf 'cell\t-2\t-54\t9\tcreate:light_blue_sail[facing=south]\n' >> "srv-wall/c-imagine/$SC2"
            # 14-q STAIRS FLIP TRIANGULATION: the grain-RED stairs cells
            # (facing east/south) fit a horizontal MIRROR / 180-y rotation of
            # the truth (measured #64 sbs + mirrorX ae -38%), while the
