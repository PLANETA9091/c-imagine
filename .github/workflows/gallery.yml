                                tail -1 poke-receipt.log   # 14-e15 the receipt rides the job log; the FILE route is the coproc-safe one (a pipeline subshell kills the coproc fd — the 14-e15 walk-killer, three runs x 16 shards each)
                bash scripts/visual/shot.sh "ours-shots/ours-gal-e$SERIES-$NS$p.png"
                test -s "ours-shots/ours-gal-e$SERIES-$NS$p.png" || { echo "$NS $SERIES page $p shot missing"; exit 1; }
                sleep 2   # 14-aj the self-consistency pair (the truth-leg mirror): the ANIMATED class needs BOTH legs' second shots
                bash scripts/visual/shot.sh "ours-shots/ours-gal-e$SERIES-$NS$p-self.png"
