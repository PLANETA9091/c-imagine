name: gallery

# THE GATE IS PIXELS — owner directive 2026-10-30 (docs/ROADMAP.md M5.5,
# MODPACK.md Tier 0). The universal block-state gallery runs on BOTH stacks
# and the pixel join is RED unless 100% of cells match at the calibrated
# datum. Census/construct/mixin markers are diagnostics — they never green
# a rank.
#
# job 1 gallery-truth: real NeoForge 21.1.265 server + real NeoForge 1.21.1
#   client under xvfb — /cimscene gallery (universal: EVERY registered block
#   from every loaded mod + all states + vanilla controls) + per-wall shots.
# job 2 gallery-cim: Paper 26.3 + c-imagine plugin + F2vPack pack + vanilla
#   26.3 client under xvfb — the pack-carrier gallery (block_display walk).
# job 3 gallery-diff: per-cell pixel join (scripts/cimscene/gallery-diff.py)
#   — RED ships triptychs (truth | ours | heat) + TSV report as artifacts.
#
# v1 honesty note: the cim leg renders the pack-carrier channel that exists
# TODAY; modded cells without a carrier are RED rows — that IS the fix
# backlog of the f2v port, and the gate stays red until it is 100%.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scene-mod/**'
      - 'paper-plugin/**'
      - 'scripts/cimscene/**'
      - 'scripts/visual/**'
      - 'scripts/f2v/**'
      - 'scripts/truth/**'
      - '.github/workflows/gallery.yml'

jobs:
  gallery-truth:
    name: gallery — truth leg (real NeoForge server + client, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: build cimtest + cimscene
        run: |
          gradle build --no-daemon -p test-mods
          gradle build --no-daemon -p scene-mod

      - name: restore NeoForge server layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer-srv
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 21.1.265 server (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-srv-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-srv-installer.jar --installServer layer-srv

      - name: fetch P0 Create (Modrinth ladder fetch)
        run: bash scripts/cimscene/fetch-ladder.sh mods-create create

      - name: assemble server dir
        run: |
          cp -r layer-srv srv-truth
          mkdir -p srv-truth/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv-truth/mods/
          cp scene-mod/build/libs/cimscene-1.0.0.jar srv-truth/mods/
          cp mods-create/*.jar srv-truth/mods/
          echo "eula=true" > srv-truth/eula.txt
          cat > srv-truth/server.properties <<'PROPS'
          online-mode=false
          white-list=false
          difficulty=peaceful
          level-type=minecraft:flat
          level-seed=42
          view-distance=6
          simulation-distance=4
          spawn-protection=0
          max-players=5
          PROPS

      - name: boot real NeoForge server (console FIFO)
        run: |
          set -euo pipefail
          cd srv-truth
          mkfifo console.in
          tail -f console.in | java -Xmx3G @libraries/net/neoforged/neoforge/21.1.265/unix_args.txt --nogui > boot.log 2>&1 &
          cd ..
          for i in $(seq 1 150); do
            grep -q "Done (" srv-truth/boot.log 2>/dev/null && break
            sleep 2
          done
          grep -q "Done (" srv-truth/boot.log || { tail -60 srv-truth/boot.log; exit 1; }
          # camera-lock parity pins: noon, clear, mob-free, weather locked
          echo "gamerule doDaylightCycle false" > srv-truth/console.in
          echo "time set noon" > srv-truth/console.in
          echo "gamerule doWeatherCycle false" > srv-truth/console.in
          echo "weather clear" > srv-truth/console.in
          echo "gamerule doMobSpawning false" > srv-truth/console.in
          echo "truth server up"

      - name: build the universal gallery (SAME command on both stacks)
        run: |
          echo "cimscene gallery 8 1440" > srv-truth/console.in
          for i in $(seq 1 30); do
            grep -q "\[cimscene\] gallery built" srv-truth/boot.log 2>/dev/null && break
            sleep 2
          done
          grep -q "\[cimscene\] gallery built" srv-truth/boot.log \
            || { tail -40 srv-truth/boot.log; exit 1; }
          grep "\[cimscene\] gallery built" srv-truth/boot.log
          test -f srv-truth/c-imagine/scenes/gallery.tsv

      - name: restore NeoForge truth client runtime (cache)
        id: nfc-cache
        uses: actions/cache@v4
        with:
          path: truth-client
          key: neoforge-truth-client-1211-v1

      - name: fetch + assemble the NeoForge client runtime (cache miss)
        if: steps.nfc-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/truth/fetch-truth-client.py nfc truth-client --assets
          wc -c truth-client/classpath.txt truth-client/launch.txt
          sed -i 's/^java /java -Xmx2G /' truth-client/launch.txt

      - name: NeoForge client joins under xvfb
        run: |
          set -euo pipefail
          javac -d vtools scripts/visual/Shot.java
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri mesa-vulkan-drivers libglx-mesa0
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          mkdir -p truth-client/game
          echo "onboardAccessibility:false" > truth-client/game/options.txt
          echo "fov:45.0" >> truth-client/game/options.txt
          python3 scripts/visual/make_servers_dat.py truth-client/game
          LAUNCH=$(cat truth-client/launch.txt)
          ( cd truth-client && bash -c "$LAUNCH" > client.out 2>&1 ) &
          for i in $(seq 1 90); do
            grep -q "joined the game" truth-client/client.out 2>/dev/null && break
            sleep 2
          done
          grep -q "joined the game" truth-client/client.out \
            || { tail -30 truth-client/client.out; exit 1; }
          echo "truth client joined"

      - name: gallery walk — camera-locked shots per wall
        run: |
          export DISPLAY=:99
          python3 scripts/cimscene/gallery-walk.py \
            srv-truth/c-imagine/scenes/gallery.tsv srv-truth/console.in truth-shots

      - name: upload truth gallery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-truth
          path: |
            truth-shots/
            srv-truth/c-imagine/scenes/gallery.tsv
            srv-truth/boot.log

  gallery-cim:
    name: gallery — c-imagine leg (Paper 26.3 + pack carriers, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: resolve newest stable paper-api for 26.3
        id: paper
        run: |
          PV=$(bash scripts/resolve-paper-version.sh 26.3)
          echo "version=$PV" >> "$GITHUB_OUTPUT"

      - name: build plugin (maven, proven contract)
        working-directory: paper-plugin
        run: mvn -B -ntp -Dpaper.version="${{ steps.paper.outputs.version }}" package
          && test -f target/cim-paper-plugin.jar

      - uses: gradle/actions/setup-gradle@v4

      - name: fetch P0 Create (assets source for the pack)
        run: bash scripts/cimscene/fetch-ladder.sh mods-create create

      - name: fetch visual client runtime (piston-meta, with assets)
        run: |
          python3 scripts/fetch-visual-client.py 26.3 visual-client --assets
          wc -c visual-client/classpath.txt visual-client/launch.txt

      - name: fetch Paper 26.3 (fill API v3, bare)
        run: |
          set -euo pipefail
          mkdir -p srv-cim
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          echo "paper: $URL"
          curl -sL --max-time 300 -o srv-cim/paper.jar "$URL"
          wc -c srv-cim/paper.jar

      - name: stage plugin + pack (pre-boot build, deterministic)
        run: |
          set -euo pipefail
          mkdir -p srv-cim/plugins srv-cim/mods srv-cim/c-imagine/f2v
          cp paper-plugin/target/cim-paper-plugin.jar srv-cim/plugins/
          (cd test-mods/src/main/resources && zip -qr /tmp/cimtest-assets.jar assets)
          cp /tmp/cimtest-assets.jar srv-cim/mods/cimtest-1.0.0.jar
          cp mods-create/*.jar srv-cim/mods/
          cp scripts/f2v/visual-items.tsv scripts/f2v/visual-equipment.tsv scripts/f2v/visual-blocks.tsv scripts/f2v/visual-palettes.tsv srv-cim/c-imagine/f2v/
          java -cp paper-plugin/target/cim-paper-plugin.jar dev.cim.f2v.F2vPack \
            --build srv-cim/mods srv-cim/c-imagine/f2v
          test -f srv-cim/c-imagine/f2v/pack.sha1

      - name: assemble server properties
        run: |
          SHA1=$(cat srv-cim/c-imagine/f2v/pack.sha1)
          echo "eula=true" > srv-cim/eula.txt
          cat > srv-cim/server.properties <<PROPS
          online-mode=false
          white-list=false
          difficulty=peaceful
          level-type=minecraft:flat
          level-seed=42
          view-distance=6
          simulation-distance=4
          spawn-protection=0
          max-players=5
          resource-pack=http://127.0.0.1:25580/cim-f2v-pack.zip
          resource-pack-sha1=$SHA1
          PROPS

      - name: boot Paper (console FIFO)
        run: |
          set -euo pipefail
          cd srv-cim
          mkfifo console.in
          tail -f console.in | java -Xmx2G -jar paper.jar --nogui > boot.log 2>&1 &
          cd ..
          for i in $(seq 1 120); do
            grep -q "Done (" srv-cim/boot.log 2>/dev/null && break
            sleep 2
          done
          grep -q "Done (" srv-cim/boot.log || { tail -30 srv-cim/boot.log; exit 1; }
          grep -q "f2v pack: serving" srv-cim/boot.log || { tail -30 srv-cim/boot.log; exit 1; }
          echo "gamerule doDaylightCycle false" > srv-cim/console.in
          echo "time set noon" > srv-cim/console.in
          echo "gamerule doWeatherCycle false" > srv-cim/console.in
          echo "weather clear" > srv-cim/console.in
          echo "gamerule doMobSpawning false" > srv-cim/console.in
          echo "cim server up + pack serving"

      - name: vanilla client joins under xvfb + pack accepted
        run: |
          set -euo pipefail
          javac -d vtools scripts/visual/Shot.java
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri mesa-vulkan-drivers libglx-mesa0
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          mkdir -p visual-client/game
          echo "onboardAccessibility:false" > visual-client/game/options.txt
          echo "fov:45.0" >> visual-client/game/options.txt
          python3 scripts/visual/make_servers_dat.py visual-client/game
          LAUNCH=$(cat visual-client/launch.txt)
          ( cd visual-client && bash -c "$LAUNCH" > client.out 2>&1 ) &
          for i in $(seq 1 90); do
            grep -q "joined the game" visual-client/client.out 2>/dev/null && break
            sleep 2
          done
          grep -q "joined the game" visual-client/client.out \
            || { tail -30 visual-client/client.out; exit 1; }
          # the SECOND reload line is the server pack applying (measured)
          grep -qc "Reloading ResourceManager" visual-client/client.out
          echo "cim client joined"

      - name: pack-carrier gallery build (block_display per manifest cell)
        run: |
          python3 scripts/cimscene/cim-gallery-walk.py \
            srv-cim/c-imagine/f2v/visual-blocks.tsv \
            srv-cim/c-imagine/scenes/gallery.tsv > /tmp/summons.txt
          grep -v "^#" /tmp/summons.txt | while IFS= read -r cmd; do
            echo "$cmd" > srv-cim/console.in
            sleep 0.3
          done
          sleep 2
          grep -c "summon\|setblock" /tmp/summons.txt

      - name: gallery walk — camera-locked shots per wall
        run: |
          export DISPLAY=:99
          python3 scripts/cimscene/gallery-walk.py \
            srv-cim/c-imagine/scenes/gallery.tsv srv-cim/console.in cim-shots

      - name: upload cim gallery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-cim
          path: |
            cim-shots/
            srv-cim/c-imagine/scenes/gallery.tsv
            srv-cim/boot.log

  gallery-diff:
    name: gallery — pixel join (RED unless 100%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gallery-truth, gallery-cim]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gallery-truth
          path: truth

      - uses: actions/download-artifact@v4
        with:
          name: gallery-cim
          path: cim

      - name: per-cell pixel join
        run: |
          T=$(find truth -name gallery.tsv | head -1)
          C=$(find cim -name gallery.tsv | head -1)
          test -n "$T" || { echo "truth gallery manifest missing"; exit 1; }
          test -n "$C" || { echo "cim gallery manifest missing"; exit 1; }
          mkdir -p truth-shots cim-shots gallery-report
          find truth -name 'wall_*.png' -exec cp {} truth-shots/ \;
          find cim   -name 'wall_*.png' -exec cp {} cim-shots/ \;
          # --datum 0 = pure parity until the vanilla control cells calibrate
          # the cross-version drift floor (calibration runs: add --calibrate)
          python3 scripts/cimscene/gallery-diff.py "$T" truth-shots "$C" cim-shots \
            gallery-report --datum 0 --top 40 || GATE=$?
          echo "=== worst rows ==="
          sort -t$'\t' -k9 -rn gallery-report/gallery-diff.tsv | head -20 || true
          exit ${GATE:-0}

      - name: upload gallery diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-diff-report
          path: gallery-report/
