name: gallery

# THE GATE IS PIXELS — owner directive 2026-10-30 (docs/ROADMAP.md M5.5,
# MODPACK.md Tier 0). THE WALL-GRID LINE (worklog 12-x) — the previous
# corridor design of this file is superseded (it lives in git history and
# worklog 12-w; its measured lessons — RCON control, ghost protocol, fov
# slider units, spectator camera, OOM heaps, fluid skips — are all folded
# into this file).
#
# job 1 wall-truth: real NeoForge 21.1.265 server + Create + real NeoForge
#   1.21.1 client under xvfb. The universal gallery (scene-mod: EVERY block
#   of the namespace in sorted order x EVERY state, 11x7=77 per page, fluid +
#   invisible states skipped honestly) is rebuilt page by page at the fixed
#   camera cell; the client shoots gal-p<p>.png per page plus a page-0
#   re-placement determinism probe. Manifests gallery-create-p<p>.tsv are
#   THE CELL CONTRACT.
# job 2 wall-ours (needs truth): Paper 26.3 + c-imagine plugin + GalleryPack
#   (per-state models synthesized from the mod jar) + vanilla 26.3 client —
#   /cim gallerypage replays the TRUTH manifests one ItemDisplay per cell
#   (brightness pinned 15/15); shots ours-gal-p<p>.png + the same probe.
# job 3 wall-diff (needs both): per-page per-cell pixel join
#   (scripts/cimscene/gallery-diff.py — projection crop + align + luma
#   normalise + AE). GATE: RED unless every non-skip non-dynamic cell of
#   every page sits inside the calibrated AE datum; red cells ship truth |
#   ours | highlight triptychs + TSV/JSON reports as artifacts. Dynamic
#   (EntityBlock) cells are diffed and reported but carry no red verdict —
#   their gate is the real-client leg (roadmap M5.6). Determinism probes are
#   reported as diagnostics, never gated (an llvmpipe flake must not fake a
#   content verdict).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PAGES: "3"   # gate scope: pages 0..PAGES-1 (77 states per page); the
               # census sweep in mod-matrix.yml walks to exhaustion
  EPAGES: "5"  # entity gate scope: MOB pages 0..EPAGES-1 on the SPARSE 6x3
               # grid (18 cells/page, pitch 2 — zero bbox overlap so no
               # subject can ever push another; measured 16d62f0: at the
               # 1-block pitch the wide subjects (ravager/horse/llama)
               # scrambled the wall via collision push, differently per leg).
               # The large/dyn series walk EDPAGES as diagnostics
  EDPAGES: "3"

jobs:
  wall-truth:
    name: gallery wall — truth leg (real NeoForge server + client, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: build cimtest + cimscene
        run: |
          gradle build --no-daemon -p test-mods
          gradle build --no-daemon -p scene-mod

      - name: restore NeoForge server layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer-srv
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 21.1.265 server (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-srv-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-srv-installer.jar --installServer layer-srv

      - name: fetch P0 Create (Modrinth ladder fetch)
        run: bash scripts/cimscene/fetch-ladder.sh mods-create create

      - name: assemble server dir
        run: |
          cp -r layer-srv srv-wall
          mkdir -p srv-wall/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv-wall/mods/
          cp scene-mod/build/libs/cimscene-1.0.0.jar srv-wall/mods/
          cp mods-create/*.jar srv-wall/mods/
          echo "eula=true" > srv-wall/eula.txt
          cat > srv-wall/server.properties <<'PROPS'
          online-mode=false
          white-list=false
          difficulty=peaceful
          level-type=minecraft:flat
          level-seed=42
          view-distance=6
          simulation-distance=4
          spawn-protection=0
          max-players=5
          enable-rcon=true
          rcon.port=25575
          rcon.password=cimgate
          PROPS

      - name: boot real NeoForge server (RCON after the port settles)
        run: |
          set -euo pipefail
          cd srv-wall
          rm -rf world world_nether world_the_end   # fresh flat world
          setsid bash -c "java -Xmx2G @libraries/net/neoforged/neoforge/21.1.265/unix_args.txt --nogui >> boot.log 2>&1" < /dev/null > /dev/null 2>&1 &
          cd ..
          for i in $(seq 1 150); do
            R=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1 || true)
            [ -n "$R" ] && break
            sleep 2
          done
          [ -n "$R" ] || { tail -60 srv-wall/boot.log; exit 1; }
          echo "truth server up: $R"

      - name: camera pins + page-0 wall build (RCON, markers asserted)
        run: |
          set -euo pipefail
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "gamerule doDaylightCycle false" "time set noon" \
            "gamerule doWeatherCycle false" "weather clear" \
            "gamerule doMobSpawning false" | tee truth-pins.log
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "cimscene gallery page create 0" | tee truth-page0.log
          for i in $(seq 1 30); do
            grep -q "gallery done ns=create page=0 " srv-wall/boot.log && break
            sleep 1
          done
          grep -q "gallery done ns=create page=0 " srv-wall/boot.log
          test -f srv-wall/c-imagine/scenes/gallery-create-p0.tsv
          grep "gallery done ns=create page=0 " srv-wall/boot.log | tail -1

      - name: restore NeoForge truth client runtime (cache)
        id: nfc-cache
        uses: actions/cache@v4
        with:
          # MEASURED (run 41106933552, the guard's missing-jar list):
          # fetch-truth-client.py nfc truth-client puts the RUNTIME
          # (libraries/classpath/launch) in nfc/ and the game dir in
          # truth-client/ — the classpath references nfc/...; caching only
          # truth-client shipped a client whose jars were never there
          path: |
            nfc
            truth-client
          key: neoforge-truth-client-1211-v4

      - name: verify the client runtime (stale-cache guard)
        if: steps.nfc-cache.outputs.cache-hit == 'true'
        run: |
          python3 - <<'PY'
          import pathlib, sys
          missing = []
          cp = pathlib.Path('truth-client/classpath.txt')
          if not cp.is_file():
              print('classpath.txt missing'); sys.exit(1)
          missing += [p for p in cp.read_text().split(':')
                      if p.strip() and not pathlib.Path(p).is_file()]
          launch = pathlib.Path('truth-client/launch.txt').read_text()
          if '-p ' in launch:
              seg = launch.split('-p ', 1)[1].split()[0]
              missing += [p for p in seg.split(':')
                          if p.strip() and not pathlib.Path(p).is_file()]
          if missing:
              print('runtime jars MISSING (stale cache):', missing[:8])
              sys.exit(1)
          print('client runtime classpath verified')
          PY

      - name: fetch + assemble the NeoForge client runtime (cache miss)
        if: steps.nfc-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/truth/fetch-truth-client.py nfc truth-client --assets
          wc -c truth-client/classpath.txt truth-client/launch.txt
          sed -i 's/^java /java -Xmx2G /' truth-client/launch.txt

      - name: NeoForge client joins under xvfb (with the server's mods)
        run: |
          set -euo pipefail
          javac -d vtools scripts/visual/Shot.java scripts/visual/Key.java
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri libglx-mesa0 libxtst6
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=2
          mkdir -p truth-client/game/mods
          cp srv-wall/mods/*.jar truth-client/game/mods/   # registry sync needs them
          # fov:0.0 renders 70 deg (options value maps LINEARLY, fov =
          # 70 + 40*v — MEASURED 12-ac: -0.625 rendered 45 deg and pushed the
          # wall's upper rows off-frame, breaking the cell projection)
          printf 'onboardAccessibility:false\nfov:0.0\nrenderClouds:false\n' > truth-client/game/options.txt
          python3 scripts/visual/make_servers_dat.py truth-client/game
          LAUNCH=$(cat truth-client/launch.txt)
          setsid bash -c "cd truth-client && $LAUNCH > client.out 2>&1" < /dev/null > /dev/null 2>&1 &
          for i in $(seq 1 90); do
            L=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1 || true)
            case "$L" in *cimviewer*) break;; esac
            sleep 2
          done
          case "$L" in *cimviewer*) echo "truth client joined: $L";;
            *) tail -30 truth-client/client.out; exit 1;; esac
          for i in $(seq 1 30); do
            grep -qE "Loaded [0-9]+ advancements" truth-client/client.out 2>/dev/null && break
            sleep 2
          done
          sleep 8   # first chunk render on llvmpipe

      - name: wall walk — fixed camera, page shots + determinism probe
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=2
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "kill @e[type=!player]" "tp cimviewer 0.5 -60 0.5 0 0"
          sleep 5
          java -cp vtools Key F1
          sleep 1
          mkdir -p truth-shots
          for p in $(seq 0 $((PAGES-1))); do
            # count-based done wait (run-gallery-truth.sh's wait_page_done):
            # the marker repeats across pages and re-placements, so wait for
            # the count of THIS page's marker to grow past its baseline
            BEFORE=$(grep -c "gallery done ns=create page=$p " srv-wall/boot.log || true)
            python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
              "cimscene gallery page create $p"
            ok=0
            for i in $(seq 1 30); do
              C=$(grep -c "gallery done ns=create page=$p " srv-wall/boot.log || true)
              [ "${C:-0}" -gt "${BEFORE:-0}" ] && { ok=1; break; }
              sleep 1
            done
            [ "$ok" = "1" ] || { echo "page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
            sleep 4   # section rebuild + lighting under llvmpipe
            java -cp vtools Shot "truth-shots/gal-p$p.png"
            echo "shot page $p"
          done
          # determinism probe: re-place page 0, shoot again (diagnostic, not gated)
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "cimscene gallery page create 0"
          sleep 5
          java -cp vtools Shot "truth-shots/gal-p0-again.png"
          echo "shot page 0 again"
          ls -la truth-shots/

      - name: entity walk — MOB pages (gate) + dyn pages (diagnostic)
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=2
          # difficulty easy: HOSTILE mobs must survive — peaceful discards
          # every Monster each tick (both legs pin the SAME difficulty, so
          # the comparison stays fair; frozen mobs ignore everything else)
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "difficulty easy" "kill @e[type=!player]" "tp cimviewer 0.5 -60 0.5 0 0"
          sleep 5
          # MOB series (the gate): frozen NoAI subjects on the wall. The
          # settle pass (40 ticks) writes the manifest + the done marker.
          for p in $(seq 0 $((EPAGES-1))); do
            BEFORE=$(grep -c "gallery-entity done ns=minecraft page=$p " srv-wall/boot.log || true)
            python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
              "cimscene gallery entity mobs minecraft $p"
            ok=0
            for i in $(seq 1 30); do
              C=$(grep -c "gallery-entity done ns=minecraft page=$p " srv-wall/boot.log || true)
              [ "${C:-0}" -gt "${BEFORE:-0}" ] && { ok=1; break; }
              sleep 1
            done
            [ "$ok" = "1" ] || { echo "mob page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
            grep "gallery-entity done ns=minecraft page=$p " srv-wall/boot.log | tail -1
            sleep 4   # section rebuild (wall -> air) + entity render under llvmpipe
            java -cp vtools Shot "truth-shots/gal-e$p.png"
            echo "shot mob page $p"
          done
          # DYN + LARGE series (diagnostic, never gated): non-Mobs and
          # oversized/animated Mobs (universal bbox rule) — their pixels are
          # time-varying by nature and they ASYMMETRICALLY spill into
          # gateable cells (measured 283ad61/afebfbc), hence separate series
          for p in $(seq 0 $((EDPAGES-1))); do
            for SERIES in dyn large; do
              TAG=$([ "$SERIES" = dyn ] && echo entitydyn || echo entitylarge)
              BEFORE=$(grep -c "gallery-$TAG done ns=minecraft page=$p " srv-wall/boot.log || true)
              python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
                "cimscene gallery entity $SERIES minecraft $p"
              ok=0
              for i in $(seq 1 30); do
                C=$(grep -c "gallery-$TAG done ns=minecraft page=$p " srv-wall/boot.log || true)
                [ "${C:-0}" -gt "${BEFORE:-0}" ] && { ok=1; break; }
                sleep 1
              done
              [ "$ok" = "1" ] || { echo "$SERIES page $p no done marker"; tail -10 srv-wall/boot.log; exit 1; }
              grep "gallery-$TAG done ns=minecraft page=$p " srv-wall/boot.log | tail -1
              sleep 4
              java -cp vtools Shot "truth-shots/gal-e$SERIES$p.png"
              echo "shot $SERIES page $p"
            done
          done
          # determinism probe: re-place mob page 0, shoot again (diagnostic)
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "kill @e[type=!player]" "tp cimviewer 0.5 -60 0.5 0 0" \
            "cimscene gallery entity mobs minecraft 0"
          sleep 6
          java -cp vtools Shot "truth-shots/gal-e0-again.png"
          echo "shot mob page 0 again"
          ls -la truth-shots/

      - name: upload truth wall artifacts (manifests = THE CELL CONTRACT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-truth
          path: |
            truth-shots/
            srv-wall/c-imagine/scenes/gallery-create-p*.tsv
            srv-wall/c-imagine/scenes/gallery-entity*-minecraft-p*.tsv
            truth-pins.log
            srv-wall/boot.log
            truth-client/client.out

  wall-ours:
    name: gallery wall — c-imagine leg (Paper 26.3 + GalleryPack, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [wall-truth]   # the truth manifests ARE the cell contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: jdk25
        with:
          distribution: temurin
          java-version: 25    # paper 26.3 api + the 26.3 client are class 69

      - uses: actions/download-artifact@v4
        with:
          name: wall-truth
          path: truth

      - name: resolve newest stable paper-api for 26.3
        id: paper
        run: |
          PV=$(bash scripts/resolve-paper-version.sh 26.3)
          echo "version=$PV" >> "$GITHUB_OUTPUT"

      - name: build plugin (maven, proven contract) + gson classpath
        working-directory: paper-plugin
        run: |
          mvn -B -ntp -Dpaper.version="${{ steps.paper.outputs.version }}" package
          # gson rides the classpath for the F2vPack CLI run below (on a live
          # Paper the server supplies it — measured contract,
          # scripts/build-paper-plugin-offline.sh)
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/selftest-cp.txt
          test -f target/cim-paper-plugin.jar
        env:
          JAVA_HOME: ${{ steps.jdk25.outputs.path }}

      - name: fetch P0 Create (assets source for the pack)
        run: bash scripts/cimscene/fetch-ladder.sh mods-create create

      - name: fetch visual client runtime (piston-meta, with assets)
        run: |
          python3 scripts/fetch-visual-client.py 26.3 visual-client --assets
          wc -c visual-client/classpath.txt visual-client/launch.txt
          sed -i 's/^java /java -Xmx1G /' visual-client/launch.txt

      - name: fetch Paper 26.3 (fill API v3, bare)
        run: |
          set -euo pipefail
          mkdir -p srv-wall
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          echo "paper: $URL"
          curl -sL --max-time 300 -o srv-wall/paper.jar "$URL"
          wc -c srv-wall/paper.jar

      - name: stage plugin + pack + truth manifests (pre-boot build)
        run: |
          set -euo pipefail
          mkdir -p srv-wall/plugins srv-wall/mods srv-wall/c-imagine/f2v srv-wall/c-imagine/scenes
          cp paper-plugin/target/cim-paper-plugin.jar srv-wall/plugins/
          (cd test-mods/src/main/resources && zip -qr /tmp/cimtest-assets.jar assets)
          cp /tmp/cimtest-assets.jar srv-wall/mods/cimtest-1.0.0.jar
          cp mods-create/*.jar srv-wall/mods/
          cp scripts/f2v/visual-items.tsv scripts/f2v/visual-equipment.tsv scripts/f2v/visual-blocks.tsv scripts/f2v/visual-palettes.tsv srv-wall/c-imagine/f2v/
          # the truth manifests ARE the cell contract the plugin replays
          # (download-artifact nests them under truth/srv-wall/... — the LCA
          # of the upload paths; find, not a fixed path). BOTH manifest
          # families stage: the block pages AND the entity pages (measured
          # run 41135456681: entity manifests missing -> the ours replay
          # spawned nothing, placed=0 on every page)
          find truth -name 'gallery-create-p*.tsv' \
            -exec cp {} srv-wall/c-imagine/scenes/ \;
          find truth -name 'gallery-entity*.tsv' \
            -exec cp {} srv-wall/c-imagine/scenes/ \;
          ls srv-wall/c-imagine/scenes/
          # the pack's gallery channel rows: EVERY distinct state of the
          # truth manifests (GalleryPack assigns CMDs in that deterministic
          # order; the plugin's replay resolves through it)
          python3 scripts/f2v/gallery-manifest.py \
            srv-wall/c-imagine/scenes create srv-wall/c-imagine/f2v/visual-gallery.tsv
          wc -l srv-wall/c-imagine/f2v/visual-gallery.tsv
          FCPL="$(cat paper-plugin/target/selftest-cp.txt)"
          JAVA_HOME=${{ steps.jdk25.outputs.path }} PATH=${{ steps.jdk25.outputs.path }}/bin:$PATH \
            java -cp "srv-wall/plugins/cim-paper-plugin.jar:$FCPL" dev.cim.f2v.F2vPack \
            --build srv-wall/mods srv-wall/c-imagine/f2v \
            --assets visual-client/client.jar 2>&1 | tee pack-build.log
          # --assets = the VANILLA client jar: the pack builder resolves
          # vanilla parents (block/cube_all -> block/cube -> block/block, BARE
          # refs) from the same client that will render the pack — without it
          # every vanilla-parent model has no in-jar elements and its row
          # drops (measured: andesite_casing class, run 41126658261 + the
          # 12-af selftest)
          test -f srv-wall/c-imagine/f2v/pack.sha1
          cp srv-wall/c-imagine/f2v/build-report.txt f2v-build-report.txt
          cp srv-wall/c-imagine/f2v/visual-gallery.resolved.tsv f2v-gallery-resolved.tsv

      - name: assemble server properties (pack + RCON)
        run: |
          SHA1=$(cat srv-wall/c-imagine/f2v/pack.sha1)
          echo "eula=true" > srv-wall/eula.txt
          cat > srv-wall/server.properties <<PROPS
          online-mode=false
          white-list=false
          difficulty=peaceful
          level-type=minecraft\:flat
          level-seed=42
          view-distance=6
          simulation-distance=4
          spawn-protection=0
          max-players=5
          enable-rcon=true
          rcon.port=25575
          rcon.password=cimgate
          resource-pack=http\://127.0.0.1\:25580/cim-f2v-pack.zip
          resource-pack-sha1=$SHA1
          PROPS

      - name: boot Paper (RCON after the port settles)
        run: |
          set -euo pipefail
          cd srv-wall
          rm -rf world world_nether world_the_end
          # -Dcim.f2v.assetsJars pins the vanilla client jar for the plugin's
          # SERVER-SIDE pack rebuild (rebuildForVerification): the rebuilt
          # pack must be identical to the staged one (same vanilla-parent
          # resolution) — a drift would shift CMDs and poison the replay
          setsid bash -c "java -Xmx1G -Dcim.f2v.assetsJars=${GITHUB_WORKSPACE}/visual-client/client.jar -jar paper.jar --nogui >> boot.log 2>&1" < /dev/null > /dev/null 2>&1 &
          cd ..
          for i in $(seq 1 120); do
            R=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1 || true)
            [ -n "$R" ] && break
            sleep 2
          done
          [ -n "$R" ] || { tail -30 srv-wall/boot.log; exit 1; }
          grep -q "f2v pack: serving" srv-wall/boot.log || { tail -30 srv-wall/boot.log; exit 1; }
          echo "cim server up + pack serving: $R"

      - name: camera pins + force-load the wall ground
        run: |
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "gamerule doDaylightCycle false" "time set noon" \
            "gamerule doWeatherCycle false" "weather clear" \
            "gamerule doMobSpawning false" "forceload add -64 -32 64 48" \
            | tee ours-pins.log

      - name: vanilla client joins under xvfb + pack accepted
        run: |
          set -euo pipefail
          javac -d vtools scripts/visual/Shot.java scripts/visual/Key.java
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri mesa-vulkan-drivers libglx-mesa0 libxtst6
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=2
          # 26.3 (renderpearl) probes Vulkan even with the opengl launch pin —
          # mesa-vulkan-drivers above satisfies the probe; the render stays GL
          # (fetch-visual-client.py never creates the game dir — the client
          # makes it on first launch; CI needs it BEFORE the pins)
          mkdir -p visual-client/game
          # fov:0.0 = 70 deg (linear mapping 70+40*v, measured 12-ac —
          # -0.625 rendered 45 deg; the wall contract needs 70)
          printf 'onboardAccessibility:false\nfov:0.0\nrenderClouds:false\npreferredGraphicsBackend:opengl\n' > visual-client/game/options.txt
          python3 scripts/visual/make_servers_dat.py visual-client/game
          LAUNCH=$(cat visual-client/launch.txt)
          ARGS="${LAUNCH#java }"
          CLIENT_JAVA="${{ steps.jdk25.outputs.path }}/bin/java"
          setsid bash -c "cd visual-client && $CLIENT_JAVA $ARGS > client.out 2>&1" < /dev/null > /dev/null 2>&1 &
          for i in $(seq 1 90); do
            L=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate "list" 2>/dev/null | tail -1 || true)
            case "$L" in *cimviewer*) break;; esac
            sleep 2
          done
          case "$L" in *cimviewer*) echo "cim client joined: $L";;
            *) tail -30 visual-client/client.out; exit 1;; esac
          # the SECOND reload line is the server pack applying (measured)
          for i in $(seq 1 30); do
            N=$(grep -c "Reloading ResourceManager" visual-client/client.out || true)
            [ "${N:-0}" -ge 2 ] && break
            sleep 2
          done
          for i in $(seq 1 30); do
            grep -qE "Loaded [0-9]+ advancements" visual-client/client.out 2>/dev/null && break
            sleep 2
          done
          sleep 8

      - name: wall walk — fixed camera, page shots + determinism probe
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=2
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "kill @e[type=!player]" "tp cimviewer 0.5 -60 0.5 0 0"
          sleep 5
          java -cp vtools Key F1
          sleep 1
          mkdir -p ours-shots
          for p in $(seq 0 $((PAGES-1))); do
            # MEASURED (12-x run 3): passive mobs pre-spawn and WALK into the
            # frame between pages — clear them before EVERY page. The RCON
            # response IS the completion marker (sendMessage goes to the
            # sender, not boot.log — measured in run 41103826488)
            OUT=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
              "kill @e[type=!player]" "cim galleryclear" \
              "cim gallerypage create $p")
            echo "$OUT" | tee "ours-rcon-p$p.log"
            echo "$OUT" | grep -q "gallerypage create p$p -> placed=" \
              || { echo "page $p no placed marker in the RCON response"; exit 1; }
            sleep 5   # section rebuild + entity render under llvmpipe
            java -cp vtools Shot "ours-shots/ours-gal-p$p.png"
            echo "shot page $p"
          done
          # determinism probe (diagnostic, not gated)
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "kill @e[type=!player]" "cim galleryclear" "cim gallerypage create 0"
          sleep 6
          java -cp vtools Shot "ours-shots/ours-gal-p0-again.png"
          echo "shot page 0 again"
          # 12-ac bisect: ONE isolated display of a settled pane composite
          # (the first acacia_window_pane CMD in the resolved manifest —
          # deterministic order, nothing hardcoded). Answers: does the
          # item-display channel render the composite's full structure
          # alone (then wall deltas are cross-display blending) or not
          # (then the channel itself flattens the model)?
          # 12-ac/12-ah bisect x2: ONE isolated display per suspect family,
          # shot alone against sky. The pane answers "does the item-display
          # channel render the composite's depth structure alone"; the casing
          # (a PLAIN vanilla-parent cube, measured invisible in its wall cell
          # while the structurally identical acacia_window cube renders
          # green) answers "is it the model bake or the wall context".
          CMD_PANE=$(grep -m1 "create:acacia_window_pane" srv-wall/c-imagine/f2v/visual-gallery.resolved.tsv | cut -f2)
          test -n "$CMD_PANE" || { echo "no pane CMD in the resolved manifest"; exit 1; }
          CMD_CASING=$(grep -m1 "create:andesite_casing" srv-wall/c-imagine/f2v/visual-gallery.resolved.tsv | cut -f2)
          test -n "$CMD_CASING" || { echo "no casing CMD in the resolved manifest"; exit 1; }
          echo "isolated displays: pane cmd=$CMD_PANE casing cmd=$CMD_CASING"
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "kill @e[type=!player]" "cim galleryclear" \
            "summon minecraft:item_display -1.5 -59.5 9.5 {billboard:\"fixed\",item:{id:\"minecraft:paper\",count:1,components:{\"minecraft:custom_model_data\":{floats:[${CMD_PANE}f]}}}}" \
            "summon minecraft:item_display 1.5 -59.5 9.5 {billboard:\"fixed\",item:{id:\"minecraft:paper\",count:1,components:{\"minecraft:custom_model_data\":{floats:[${CMD_CASING}f]}}}}"
          sleep 6
          java -cp vtools Shot "ours-shots/ours-isolated-pane-casing.png"
          echo "shot isolated pane+casing"
          ls -la ours-shots/

      - name: entity walk — MOB replay (gate) + dyn replay (diagnostic)
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=2
          # SAME difficulty pin as the truth leg (hostile mobs must survive)
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "difficulty easy" "kill @e[type=!player]" "tp cimviewer 0.5 -60 0.5 0 0"
          sleep 5
          # MOB series (the gate): the RCON response IS the completion marker
          for p in $(seq 0 $((EPAGES-1))); do
            OUT=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
              "kill @e[type=!player]" "cim galleryclear" \
              "cim gallerypage-entity minecraft $p")
            echo "$OUT" | tee "ours-rcon-e$p.log"
            echo "$OUT" | grep -q "gallerypage-entity minecraft p$p -> placed=" \
              || { echo "mob page $p no placed marker in the RCON response"; exit 1; }
            sleep 5   # section rebuild + entity render under llvmpipe
            java -cp vtools Shot "ours-shots/ours-gal-e$p.png"
            echo "shot mob page $p"
          done
          # DYN + LARGE series (diagnostic)
          for p in $(seq 0 $((EDPAGES-1))); do
            for SERIES in dyn large; do
              OUT=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
                "kill @e[type=!player]" "cim galleryclear" \
                "cim gallerypage-entity minecraft $p $SERIES")
              echo "$OUT" | tee "ours-rcon-e$SERIES$p.log"
              echo "$OUT" | grep -q "gallerypage-entity minecraft p$p $SERIES -> placed=" \
                || { echo "$SERIES page $p no placed marker in the RCON response"; exit 1; }
              sleep 5
              java -cp vtools Shot "ours-shots/ours-gal-e$SERIES$p.png"
              echo "shot $SERIES page $p"
            done
          done
          # determinism probe (diagnostic, not gated)
          python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
            "kill @e[type=!player]" "cim galleryclear" "cim gallerypage-entity minecraft 0"
          sleep 6
          java -cp vtools Shot "ours-shots/ours-gal-e0-again.png"
          echo "shot mob page 0 again"
          ls -la ours-shots/

      - name: upload ours wall artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-ours
          path: |
            ours-shots/
            ours-rcon-p*.log
            ours-rcon-e*.log
            ours-pins.log
            f2v-build-report.txt
            f2v-gallery-resolved.tsv
            pack-build.log
            srv-wall/boot.log
            visual-client/client.out

  wall-diff:
    name: gallery wall — pixel join (RED unless 100% inside the datum)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [wall-truth, wall-ours]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wall-truth
          path: truth

      - uses: actions/download-artifact@v4
        with:
          name: wall-ours
          path: ours

      - name: per-page per-cell pixel join
        run: |
          set -euo pipefail
          pip install -q numpy pillow
          mkdir -p truth-shots ours-shots gallery-report
          find truth -name 'gal-p*.png'      -exec cp {} truth-shots/ \;
          find truth -name 'gal-e0.png'       -exec cp {} truth-shots/ \;
          find truth -name 'gal-e1.png'       -exec cp {} truth-shots/ \;
          find truth -name 'gal-e0-again.png' -exec cp {} truth-shots/ \;
          find ours  -name 'ours-gal-p*.png' -exec cp {} ours-shots/ \;
          find ours  -name 'ours-gal-e0.png'  -exec cp {} ours-shots/ \;
          find ours  -name 'ours-gal-e1.png'  -exec cp {} ours-shots/ \;
          find ours  -name 'ours-gal-e0-again.png' -exec cp {} ours-shots/ \;
          find truth -name 'gal-edyn*.png'    -exec cp {} truth-shots/ \;
          find truth -name 'gal-elarge*.png'  -exec cp {} truth-shots/ \;
          find ours  -name 'ours-gal-edyn*.png'  -exec cp {} ours-shots/ \;
          find ours  -name 'ours-gal-elarge*.png' -exec cp {} ours-shots/ \;
          ls truth-shots/ ours-shots/
          GATE=0
          for p in $(seq 0 $((PAGES-1))); do
            T="truth-shots/gal-p$p.png"
            O="ours-shots/ours-gal-p$p.png"
            M=$(find truth -name "gallery-create-p$p.tsv" | head -1)
            test -f "$T" || { echo "missing truth shot p$p"; GATE=1; continue; }
            test -f "$O" || { echo "missing ours shot p$p"; GATE=1; continue; }
            test -n "$M" || { echo "missing manifest p$p"; GATE=1; continue; }
            # determinism probes: page 0 ONLY (the -again shots are page 0
            # re-placements); a probe against another page compares different
            # content and is meaningless
            if [ "$p" = "0" ] && [ -f "truth-shots/gal-p0-again.png" ]; then
              python3 scripts/cimscene/gallery-diff.py --truth "$T" \
                --ours truth-shots/gal-p0-again.png --manifest "$M" \
                --out "gallery-report/determinism-truth-p0.json" || true
            fi
            if [ "$p" = "0" ] && [ -f "ours-shots/ours-gal-p0-again.png" ]; then
              python3 scripts/cimscene/gallery-diff.py --truth "$O" \
                --ours ours-shots/ours-gal-p0-again.png --manifest "$M" \
                --out "gallery-report/determinism-ours-p0.json" || true
            fi
            python3 scripts/cimscene/gallery-diff.py --truth "$T" --ours "$O" \
              --manifest "$M" --out "gallery-report/join-p$p.json" \
              --diff-dir "gallery-report/diff-p$p" || GATE=1
          done
          echo "=== ENTITY pages: the same gate, no channel excuses ==="
          for p in $(seq 0 $((EPAGES-1))); do
            T="truth-shots/gal-e$p.png"
            O="ours-shots/ours-gal-e$p.png"
            M=$(find truth -name "gallery-entity-minecraft-p$p.tsv" | head -1)
            test -f "$T" || { echo "missing truth mob shot p$p"; GATE=1; continue; }
            test -f "$O" || { echo "missing ours mob shot p$p"; GATE=1; continue; }
            test -n "$M" || { echo "missing mob manifest p$p"; GATE=1; continue; }
            # determinism probes (page 0 only, diagnostics, never gated)
            if [ "$p" = "0" ] && [ -f "truth-shots/gal-e0-again.png" ]; then
              python3 scripts/cimscene/gallery-diff.py --truth "$T" \
                --ours truth-shots/gal-e0-again.png --manifest "$M" \
                --out "gallery-report/determinism-truth-e0.json" \
                --pitch 2 --gate 240000 || true
            fi
            if [ "$p" = "0" ] && [ -f "ours-shots/ours-gal-e0-again.png" ]; then
              python3 scripts/cimscene/gallery-diff.py --truth "$O" \
                --ours ours-shots/ours-gal-e0-again.png --manifest "$M" \
                --out "gallery-report/determinism-ours-e0.json" \
                --pitch 2 --gate 240000 || true
            fi
            python3 scripts/cimscene/gallery-diff.py --truth "$T" --ours "$O" \
              --manifest "$M" --out "gallery-report/join-e$p.json" \
              --diff-dir "gallery-report/diff-e$p" \
              --pitch 2 --gate 240000 || GATE=1
          done
          echo "=== DYN + LARGE pages: diagnostic join, never the gate ==="
          for p in $(seq 0 $((EDPAGES-1))); do
            for SERIES in dyn large; do
              T="truth-shots/gal-e$SERIES$p.png"
              O="ours-shots/ours-gal-e$SERIES$p.png"
              M=$(find truth -name "gallery-entity$SERIES-minecraft-p$p.tsv" | head -1)
              if [ -f "$T" ] && [ -f "$O" ] && [ -n "$M" ]; then
                python3 scripts/cimscene/gallery-diff.py --truth "$T" --ours "$O" \
                  --manifest "$M" --out "gallery-report/diag-$SERIES-p$p.json" \
                  --diff-dir "gallery-report/diff-$SERIES$p" \
                  --pitch 2 --gate 240000 || true
              else
                echo "$SERIES page $p incomplete (tolerated: exhausted window or missing shot)"
              fi
            done
          done
          echo "=== per-page verdicts ==="
          python3 - <<'PY'
          import glob, json
          for f in sorted(glob.glob('gallery-report/join-*.json')):
              r = json.load(open(f))
              print(f, r['verdict'], 'cells=%d red=%d dynamic=%d skipped=%d'
                    % (r['cells'], r['red'], r['dynamic'], r['skipped']))
              for row in r['rows']:
                  if row['verdict'] == 'RED':
                      print('  RED', row.get('state'), 'ae=%s' % row.get('ae'))
          PY
          exit $GATE

      - name: upload wall diff artifacts (triptychs per red cell)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-diff-report
          path: gallery-report/
