            rcon "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null 2>&1
            bash scripts/visual/shot.sh "truth-shots/gal-e$p.png"
            sleep 2   # 14-aj the self-consistency pair: a second shot ~2s later
