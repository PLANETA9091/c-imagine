name: integration

# Real end-to-end: Paper 26.3 + CRUSSTY runtime + the c-imagine module + the
# cimtest mod. Asserts boot markers, mod discovery, clean logs, no crashes.
#
# Actions policy (owner directive, updated): Actions minutes are UNLIMITED —
# this workflow runs on every push to main (the three jobs are the real
# proof: harness + live Paper boot + real-NeoForge parity), on manual
# dispatch, and once a week as a scheduled regression net. The local loop
# (scripts/local-check.sh + scripts/run-m2-harness.sh) stays for iteration
# speed, not for economy.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # weekly regression net, Monday 02:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  boot:
    name: boot Paper 26.3 with c-imagine + cimtest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # JDK 21 first (gradle toolchain for the NeoForge 1.21.1 test mod),
      # then JDK 25 (Paper 26.3 runtime; last setup wins for JAVA_HOME).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      # --- build artifacts -------------------------------------------------
      - name: build cimtest mod (NeoForge 1.21.1)
        working-directory: test-mods
        run: gradle build --no-daemon

      - name: build java bootstrap
        run: bash scripts/build-bootstrap.sh

      - name: build paper plugin jar
        working-directory: paper-plugin
        run: mvn -q -B package

      - name: build + package module
        env:
          CIM_BOOTSTRAP_JAR: ${{ github.workspace }}/java/cim-bootstrap/build/cim-bootstrap.jar
        run: |
          bash scripts/package-module.sh

      # --- server directory ------------------------------------------------
      - name: install CRUSSTY CLI and scaffold Paper 26.3
        run: |
          npm i -g crussty
          crussty init --platform paper --version 26.3 --dir srv

      # --- M1: embedded 1.21.1 layer --------------------------------------
      - name: restore NeoForge 1.21.1 layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: srv/layer1211
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 1.21.1 layer (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          JAVA_HOME="$JAVA_HOME_21_X64" java -jar nf-installer.jar --installServer srv/layer1211
          find srv/layer1211 -name "*.jar" | wc -l

      - name: configure c-imagine layer
        run: |
          mkdir -p srv/crus
          cat > srv/crus/c-imagine.json <<'JSON'
          {"layerDir": "layer1211/libraries"}
          JSON
          # layer boot needs headroom alongside Paper (M0 budget stays in place
          # for bare boots; this boot runs Paper + relocated 1.21.1 stack)
          sed -i 's/memory = "2G"/memory = "6G"/' srv/crussty.toml
          cat srv/crussty.toml

      - name: install module + test mod
        run: |
          unzip -o dist/module-imagine.zip -d srv/modules/
          mkdir -p srv/plugins
          cp paper-plugin/target/cim-paper-plugin.jar srv/plugins/
          mkdir -p srv/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv/mods/
          # M2: real NeoForge 1.21.1 mods ride along the first-party test mod
          bash scripts/fetch-real-mods.sh srv/realmods
          cp srv/realmods/*.jar srv/mods/
          # shadow-space log4j config (relative path resolves against the
          # crussty CWD, which is srv/)
          cp scripts/log4j2-layer.xml srv/
          echo "eula=true" > srv/eula.txt
          cat > srv/server.properties <<'PROPS'
          online-mode=false
          level-type=minecraft:flat
          level-seed=42
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          max-players=5
          PROPS

      # --- run --------------------------------------------------------------
      - name: boot server (timeout 6 min)
        id: boot
        run: |
          set +e
          cd srv
          timeout 360 crussty run > boot.log 2>&1
          code=$?
          cd ..
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "--- tail of boot.log ---"
          tail -40 srv/boot.log || true
          true

      # --- assertions --------------------------------------------------------
      - name: assert boot markers
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          grep -q "Done (" srv/boot.log || fail "server did not reach Done"
          grep -q "\[c-imagine\] module init (native, pre-kernel)" srv/boot.log || fail "module init marker missing"
          grep -q "module imagine -> init rc=0" srv/boot.log || fail "module init rc != 0"
          grep -q "\[c-imagine\] class-load hook observed: dev/cim/bootstrap/Bootstrap" srv/boot.log || fail "class hook pipeline marker missing"
          grep -q "\[c-imagine\] kernel ready (Paper class space online)" srv/boot.log || fail "kernel-ready marker missing"
          grep -qE "\[c-imagine\] mods \([0-9]+\): .*cimtest" srv/boot.log || fail "cimtest not discovered in mods/"
          # The ready marker is the combined nested status JSON
          # {"init":{...,"layer":{...}},"mods":{...}} — parse it properly.
          python3 - <<'PY'
          import json, re
          log = open('srv/boot.log', encoding='utf-8', errors='replace').read()
          m = re.search(r'\[c-imagine\] bootstrap ready: (\{.*)', log)
          assert m, "bootstrap ready marker missing"
          ready, _ = json.JSONDecoder().raw_decode(m.group(1))
          init = ready.get('init') or {}
          assert init.get('state') == 'ok', f"init not ok: {init.get('error')}"
          layer = init.get('layer') or {}
          assert layer.get('state') == 'ok', f"layer boot not ok: {layer.get('error')}"
          regs = layer.get('registries') or 0
          assert regs >= 70, f"vanilla registries too low: {regs}"
          print(f"layer registries: {regs}")
          mods = ready.get('mods') or {}
          assert mods.get('state') == 'ok', f"mods not ok: {mods.get('error')}"
          print(f"mods: {mods.get('mods')} in {mods.get('tookMs')} ms; registered={mods.get('registered')}")
          registered = mods.get('registered') or {}
          for k in ('ITEM', 'BLOCK', 'BLOCK_ENTITY_TYPE', 'ENTITY_TYPE'):
              assert registered.get(k, 0) >= 1, f"no {k} registrations: {registered}"
          entries = json.dumps(mods.get('moddedEntries') or {}, ensure_ascii=False)
          assert 'cimtest:test_block' in entries, f"cimtest:test_block missing: {entries}"
          assert 'cimtest:test_block_entity' in entries, "cimtest:test_block_entity missing"
          assert 'cimtest:test_entity' in entries, "cimtest:test_entity missing"
          print("M2 live-boot: real mods + cimtest registration verified")
          PY
          # module->plugin bridge: the module persists the combined status for /cim status
          python3 - <<'PY'
          import json
          status = json.load(open('srv/c-imagine/status.json', encoding='utf-8'))
          assert status.get('init', {}).get('state') == 'ok', f"status.json init not ok: {status}"
          assert status.get('mods', {}).get('state') == 'ok', f"status.json mods not ok: {status}"
          print("status.json bridge:", status.get('mods', {}).get('mods'), "mods")
          PY
          # M2: real-FML mod execution over the composite mod set (real mods +
          # cimtest) inside the live Paper JVM
          grep -q "\[c-imagine\] mod execution ok" srv/boot.log || fail "M2 mod execution FAILED"
          for m in appleskin neoforge cimtest ferritecore jade jei spark; do
            grep -q "\[c-imagine\] mod $m: constructed" srv/boot.log || fail "mod $m not constructed on live boot"
          done
          # shadow-space log pipeline: first-party mod markers must reach the
          # boot log through the layer's own slf4j/log4j stack — the same
          # lines the real NeoForge server emits (parity contract)
          grep -q "\[cim-layer\].*\[cimtest\] mod constructed" srv/boot.log \
            || fail "shadow log pipeline broken: [cimtest] constructed marker missing"
          grep -q "\[cim-layer\].*\[cimtest\] common setup ok" srv/boot.log \
            || fail "shadow log pipeline broken: [cimtest] common setup marker missing"
          # M3.1 kernel state bridge: place via layer -> Paper sees it; break
          # via Paper -> the layer facade observes it; modded id -> stand-in
          grep -q "\[c-imagine\] bridge: plugin instance resolved" srv/boot.log \
            || fail "bridge: plugin instance never resolved"
          grep -q "bridge smoke: vanilla set ok=true.*roundtrip ok" srv/boot.log \
            || fail "bridge smoke: vanilla roundtrip missing"
          grep -q "bridge smoke: modded set ok=true" srv/boot.log \
            || fail "bridge smoke: modded stand-in leg missing"
          grep -q "bridge smoke: paper-side break ok=true.*observed" srv/boot.log \
            || fail "bridge smoke: paper-side break not observed by the layer"
          # M3.2 state-translation legs: 1.21.1 chain rename through the live
          # kernel + note_block value-set identity
          grep -q "bridge smoke: drift leg set=true.*chain->iron_chain ok" srv/boot.log \
            || fail "bridge smoke: M3.2 chain->iron_chain drift leg missing"
          grep -q "bridge smoke: note leg set=true.*value-set ok" srv/boot.log \
            || fail "bridge smoke: M3.2 note_block value-set leg missing"
          grep -q "\[c-imagine\] bridge smoke: ALL OK" srv/boot.log \
            || fail "bridge smoke did not end ALL OK"
          # M3.3: the modded write left a persisted sidecar record (the
          # restore census on boot 1 is legitimately 0 live — smoke order)
          [ -f srv/c-imagine/sidecar.tsv ] || fail "sidecar.tsv missing after first boot"
          grep -q "cimtest:test_block" srv/c-imagine/sidecar.tsv \
            || fail "cimtest:test_block not persisted to sidecar.tsv"
          echo "all integration markers present (incl. M1 layer boot + M2 real mods + M3.2 drift + M3.3 sidecar)"

      # --- M3.3 restart contract ---------------------------------------------
      # The world dir persists (SIGTERM -> Paper saves). A second boot must
      # restore the modded state from the sidecar with the stand-in intact:
      # the zero-orphan-state acceptance for the milestone.
      - name: restart server (timeout 6 min)
        id: boot2
        run: |
          set +e
          cd srv
          timeout 360 crussty run > boot2.log 2>&1
          code=$?
          cd ..
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "--- tail of boot2.log ---"
          tail -25 srv/boot2.log || true
          true

      - name: assert M3.3 restore markers
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          grep -q "Done (" srv/boot2.log || fail "second boot did not reach Done"
          grep -q "sidecar restore: cimtest:test_block @ .* (stand-in intact)" srv/boot2.log \
            || fail "M3.3: modded state not restored from the persisted sidecar"
          grep -q "sidecar restore: 1 live, 0 culled" srv/boot2.log \
            || fail "M3.3: restore census wrong (stand-in lost or ghost culled)"
          grep -q "\[c-imagine\] bridge smoke: ALL OK" srv/boot2.log \
            || fail "second boot smoke failed"
          echo "M3.3 restart contract: modded state survived the restart (zero orphan state)"

      - name: report + upload restart logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-restart-logs
          path: |
            srv/boot2.log
            srv/c-imagine/sidecar.tsv
          if-no-files-found: ignore

      - name: report + upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            srv/boot.log
            srv/crash-reports/
            srv/logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # M2: real-FML mod execution over REAL NeoForge 1.21.1 mods (Modrinth)
  # in the shadow space via the local harness (no Paper, no CRUSSTY).
  # Owner requirement: early, visible progression against third-party mods.
  # ---------------------------------------------------------------------
  m2-real-mods:
    name: M2 real mods (Modrinth) — FML pipeline in shadow space
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: gradle/actions/setup-gradle@v4

      # --- build (all on CI per owner directive) --------------------------
      - name: build rust (release)
        run: cargo build --release --quiet

      - name: build java bootstrap
        run: bash scripts/build-bootstrap.sh

      - name: build cimtest mod (NeoForge 1.21.1)
        working-directory: test-mods
        run: gradle build --no-daemon

      # --- 1.21.1 layer (cached) ------------------------------------------
      - name: restore NeoForge 1.21.1 layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer1211
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 1.21.1 layer (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-installer.jar --installServer layer1211
          find layer1211 -name "*.jar" | wc -l

      # --- real mods -------------------------------------------------------
      - name: fetch real NeoForge 1.21.1 mods (Modrinth)
        run: |
          bash scripts/fetch-real-mods.sh realmods
          mkdir -p mods
          cp realmods/*.jar mods/
          cp test-mods/build/libs/cimtest-1.0.0.jar mods/

      # --- run -------------------------------------------------------------
      - name: run M2 harness (relocation + real FML mod execution)
        run: bash scripts/run-m2-harness.sh layer1211/libraries mods out

      # --- assertions ------------------------------------------------------
      - name: assert M2 markers
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          L=out/harness.log
          grep -q "mod execution ok" $L || fail "mod execution FAILED (see harness.log)"
          # every real mod + layer + cimtest constructed through real FML
          for m in appleskin neoforge cimtest ferritecore jade mezz_config jei spark; do
            grep -q "\[c-imagine\] mod $m: constructed" $L || fail "mod $m not constructed"
          done
          # cimtest registrations went through the real RegisterEvent pipeline
          REG=$(grep -oE "registered=\{[^}]*\}" $L | tail -1)
          echo "cimtest registrations: $REG"
          echo "$REG" | grep -q "ITEM=[1-9]" || fail "no ITEM registrations"
          echo "$REG" | grep -q "BLOCK=[1-9]" || fail "no BLOCK registrations"
          echo "$REG" | grep -q "BLOCK_ENTITY_TYPE=[1-9]" || fail "no BLOCK_ENTITY_TYPE registrations"
          echo "$REG" | grep -q "ENTITY_TYPE=[1-9]" || fail "no ENTITY_TYPE registrations"
          grep -q "cimtest:test_block" $L || fail "cimtest:test_block not registered"
          grep -q "cimtest:test_block_entity" $L || fail "cimtest:test_block_entity not registered"
          grep -q "cimtest:test_entity" $L || fail "cimtest:test_entity not registered"
          # timing report for the trend
          grep -oE "mod execution ok \(mods=[0-9]+, registered=[^)]+\)" $L | tail -1
          # shadow-space log pipeline parity markers (identical lines the
          # real NeoForge server prints — see the parity-real-neoforge job)
          grep -q "\[cim-layer\].*\[cimtest\] mod constructed" $L \
            || fail "shadow log pipeline broken: [cimtest] constructed marker missing"
          grep -q "\[cim-layer\].*\[cimtest\] common setup ok" $L \
            || fail "shadow log pipeline broken: [cimtest] common setup marker missing"
          echo "M2 real-mod markers: all present"

      - name: report + upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-real-mods-logs
          path: |
            out/harness.log
            out/m2manifest.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # M2 parity ground truth: the SAME mod set (real Modrinth mods + cimtest)
  # on a REAL NeoForge 21.1.265 dedicated server. The first-party [cimtest]
  # markers are the parity contract: every line printed there must appear
  # identically in the c-imagine boots (live boot + harness).
  # ---------------------------------------------------------------------
  parity-real-neoforge:
    name: ground truth — real NeoForge 21.1.265 server (same mod set)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: build cimtest mod (NeoForge 1.21.1)
        working-directory: test-mods
        run: gradle build --no-daemon

      - name: restore NeoForge 21.1.265 server (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer1211
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 21.1.265 server (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-installer.jar --installServer layer1211

      - name: prepare server directory (isolated copy)
        run: |
          cp -r layer1211 srv-parity
          mkdir -p srv-parity/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv-parity/mods/
          bash scripts/fetch-real-mods.sh realmods
          cp realmods/*.jar srv-parity/mods/
          echo "eula=true" > srv-parity/eula.txt
          cat > srv-parity/server.properties <<'PROPS'
          online-mode=false
          level-type=minecraft:flat
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          max-players=5
          PROPS

      - name: boot real NeoForge server (timeout 5 min)
        run: |
          set +e
          cd srv-parity
          timeout 300 ./run.sh > boot.log 2>&1
          code=$?
          cd ..
          echo "exit=$code"
          tail -30 srv-parity/boot.log || true
          true

      - name: assert real-server parity markers
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          L=srv-parity/boot.log
          grep -q "Done (" $L || fail "real NeoForge server did not reach Done"
          grep -q "\[cimtest\] mod constructed (registration queues armed)" $L \
            || fail "cimtest constructed marker missing on real server"
          grep -q "\[cimtest\] common setup ok (block=cimtest:test_block" $L \
            || fail "cimtest common setup marker missing on real server"
          echo "real NeoForge 21.1.265 parity markers: all present"

      - name: report + upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-real-neoforge-logs
          path: |
            srv-parity/boot.log
            srv-parity/logs/
          if-no-files-found: ignore
