name: integration

# Real end-to-end: Paper 26.3 + CRUSSTY runtime + the c-imagine module + the
# cimtest mod. Asserts boot markers, mod discovery, clean logs, no crashes.
#
# Actions policy (owner directive, updated 2026-10-26): minutes nearly
# exhausted — SPARING use. Runs on push to main only when runtime code changes
# (paths filter below), on manual dispatch, and once a week as a scheduled
# regression net. Docs-only pushes run nothing. The local loop
# (scripts/local-check.sh + scripts/run-m2-harness.sh) stays for iteration.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "java/**"
      - "paper-plugin/**"
      - "test-mods/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/integration.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # weekly regression net, Monday 02:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  boot:
    name: boot Paper 26.3 with c-imagine + cimtest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # JDK 21 first (gradle toolchain for the NeoForge 1.21.1 test mod),
      # then JDK 25 (Paper 26.3 runtime; last setup wins for JAVA_HOME).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      # --- build artifacts -------------------------------------------------
      - name: build cimtest mod (NeoForge 1.21.1)
        working-directory: test-mods
        run: gradle build --no-daemon

      - name: build cimscene harness mod (NeoForge 1.21.1)
        working-directory: scene-mod
        run: gradle build --no-daemon

      - name: build java bootstrap
        run: bash scripts/build-bootstrap.sh

      - name: build paper plugin jar
        working-directory: paper-plugin
        run: mvn -q -B package

      - name: build + package module
        env:
          CIM_BOOTSTRAP_JAR: ${{ github.workspace }}/java/cim-bootstrap/build/cim-bootstrap.jar
        run: |
          bash scripts/package-module.sh

      - name: build cimbot (protocol bot)
        run: cargo build --release --bin cimbot --quiet

      # --- server directory ------------------------------------------------
      - name: install CRUSSTY CLI and scaffold Paper 26.3
        run: |
          npm i -g crussty
          crussty init --platform paper --version 26.3 --dir srv

      # --- M1: embedded 1.21.1 layer --------------------------------------
      - name: restore NeoForge 1.21.1 layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: srv/layer1211
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 1.21.1 layer (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          JAVA_HOME="$JAVA_HOME_21_X64" java -jar nf-installer.jar --installServer srv/layer1211
          find srv/layer1211 -name "*.jar" | wc -l

      - name: configure c-imagine layer
        run: |
          mkdir -p srv/crus
          cat > srv/crus/c-imagine.json <<'JSON'
          {"layerDir": "layer1211/libraries"}
          JSON
          # layer boot needs headroom alongside Paper (M0 budget stays in place
          # for bare boots; this boot runs Paper + relocated 1.21.1 stack)
          sed -i 's/memory = "2G"/memory = "6G"/' srv/crussty.toml
          cat srv/crussty.toml

      - name: install module + test mod
        run: |
          unzip -o dist/module-imagine.zip -d srv/modules/
          mkdir -p srv/plugins
          cp paper-plugin/target/cim-paper-plugin.jar srv/plugins/
          mkdir -p srv/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv/mods/
          # M5.5: the census harness rides in the SAME mods/ dir — an ordinary
          # mod on both stacks, the registration-parity gate emitter
          cp scene-mod/build/libs/cimscene-1.0.0.jar srv/mods/
          # M2: real NeoForge 1.21.1 mods ride along the first-party test mod
          bash scripts/fetch-real-mods.sh srv/realmods
          cp srv/realmods/*.jar srv/mods/
          # shadow-space log4j config (relative path resolves against the
          # crussty CWD, which is srv/)
          cp scripts/log4j2-layer.xml srv/
          echo "eula=true" > srv/eula.txt
          cat > srv/server.properties <<'PROPS'
          online-mode=false
          white-list=false
          level-type=minecraft:flat
          level-seed=42
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          max-players=5
          PROPS

      # M5.2: build the F2V 2.0 visual pack BEFORE boot — the vanilla client
      # pack push rides the CONFIG phase (server.properties), so pack.zip +
      # its sha1 must exist (and be final) before the JVM starts. The builder
      # is a plain main() on the plugin jar (no server classes needed).
      # Determinism contract: a second build must be byte-identical — the
      # plugin's boot-time rebuild verifies the same sha1 at runtime.
      - name: build F2V visual pack (pre-boot)
        run: |
          set -euo pipefail
          mkdir -p srv/c-imagine/f2v
          cp scripts/f2v/visual-items.tsv scripts/f2v/visual-equipment.tsv scripts/f2v/visual-blocks.tsv srv/c-imagine/f2v/
          java -cp paper-plugin/target/cim-paper-plugin.jar dev.cim.f2v.F2vPack \
            --build srv/mods srv/c-imagine/f2v
          cat srv/c-imagine/f2v/build-report.txt
          SHA1=$(cat srv/c-imagine/f2v/pack.sha1)
          # second build in a scratch dir must produce the identical sha1
          # (the scratch dir gets BOTH manifests — the equipment manifest is
          # read from the outDir by default, measured 94e1e28)
          mkdir -p /tmp/f2v-again
          cp srv/c-imagine/f2v/visual-items.tsv srv/c-imagine/f2v/visual-equipment.tsv srv/c-imagine/f2v/visual-blocks.tsv /tmp/f2v-again/
          java -cp paper-plugin/target/cim-paper-plugin.jar dev.cim.f2v.F2vPack \
            --build srv/mods /tmp/f2v-again --manifest srv/c-imagine/f2v/visual-items.tsv
          diff /tmp/f2v-again/pack.sha1 srv/c-imagine/f2v/pack.sha1 \
            || { echo "F2V pack is NOT byte-deterministic"; exit 1; }
          # the vanilla config-phase pack push (measured 26.3: resource_pack_push
          # = config id 9) carries the URL + sha1 the client enforces on download
          cat >> srv/server.properties <<PROPS
          resource-pack=http://127.0.0.1:25580/cim-f2v-pack.zip
          resource-pack-sha1=$SHA1
          PROPS
          cat srv/server.properties
          unzip -l srv/c-imagine/f2v/pack.zip

      # --- run --------------------------------------------------------------
      # M4 wire contract runs INSIDE the boot window: the protocol bot waits
      # for the Done marker, joins as "cimbot", the plugin's async net leg
      # drives the full wire contract against it (projected oak_boat,
      # post_effects apply+clear, drift block_update, remove_entities), and
      # the bot exits as soon as every leg is observed. Server window then
      # ends EARLY (12 s grace for the net-leg log lines to flush) — that is
      # the CI-minutes saving; the hard cap stays 240 s for safety.
      - name: boot server + protocol bot (cap 4 min)
        id: boot
        run: |
          set +e
          # background observer: wait for Done, then run the bot
          (
            for i in $(seq 1 90); do
              grep -q "Done (" srv/boot.log 2>/dev/null && break
              sleep 2
            done
            ./target/release/cimbot --host 127.0.0.1 --port 25565 --name cimbot \
              --timeout 150 --no-expect-block \
              --expect-extra-entity minecraft:item_display \
              --report cimbot-report.json > cimbot.log 2>&1
            echo $? > cimbot-exit
          ) &
          BOT_PID=$!
          cd srv
          crussty run > boot.log 2>&1 &
          SRV_PID=$!
          # window: early end only when BOTH the bot contract finished AND
          # the bridge smoke printed ALL OK (the assert below needs that
          # marker); hard cap 240 s otherwise. cwd here is srv/ — boot.log
          # is local, cimbot-exit lives one level up (bot subshell cwd).
          for i in $(seq 1 120); do
            [ -f ../cimbot-exit ] && grep -q "bridge smoke: ALL OK" boot.log 2>/dev/null && { sleep 12; break; }
            kill -0 "$SRV_PID" 2>/dev/null || break
            sleep 2
          done
          timeout 90 crussty stop || true
          # wait for the actual server JVM to exit (crussty guard checks a
          # LIVE pid from -Donload.pidFile= — Paper shutdown takes seconds)
          for i in $(seq 1 60); do
            pgrep -f onload.pidFile >/dev/null || break
            sleep 2
          done
          pgrep -f onload.pidFile >/dev/null && { pkill -9 -f onload.pidFile || true; sleep 5; }
          cd ..
          wait $BOT_PID 2>/dev/null || true
          echo "--- tail of cimbot.log ---"
          tail -15 cimbot.log 2>/dev/null || true
          echo "--- tail of boot.log ---"
          tail -40 srv/boot.log || true
          true

      - name: assert M4 wire contract (protocol bot)
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          [ -f cimbot-exit ] || fail "protocol bot never ran (cimbot-exit missing)"
          code=$(cat cimbot-exit)
          [ "$code" = "0" ] || { tail -40 cimbot.log || true; fail "cimbot exited $code (wire contract not observed)"; }
          python3 - <<'PY'
          import json
          r = json.load(open('cimbot-report.json', encoding='utf-8'))
          assert r.get('ok') is True, f"bot report not ok: {r.get('errors')}"
          assert r.get('joined') is True, "bot did not reach play"
          assert r.get('registries_parsed', 0) >= 25, \
              f"registries parsed too low: {r.get('registries_parsed')}"
          assert r.get('packets_read', 0) > 200, \
              f"too few packets seen: {r.get('packets_read')}"
          checks = {c['name']: c['passed'] for c in r.get('checks', [])}
          for name in ('entity leg: add_entity', 'entity leg: set_entity_data',
                       'entity leg: remove_entities', 'post_effects apply',
                       'post_effects clear', 'resource pack accepted (F2V)',
                       'hud leg: show_dialog observed',
                       'hud leg: custom_click answered'):
              assert checks.get(name) is True, \
                  f"bot check not passed: {name} (checks={checks})"
          print(f"cimbot wire contract: all {len(checks)} checks passed, "
                f"{len(r.get('observations', []))} observations")
          for o in r.get('observations', []):
              print(f"  observed: {o['kind']} {o['detail']}")
          PY
          # server-side net-leg markers (the driver side of the contract)
          grep -q "f2v net: bot joined name=cimbot" srv/boot.log \
            || fail "server net leg never saw the bot join"
          grep -q "f2v net: leg complete boat=" srv/boot.log \
            || fail "server net leg did not complete"
          grep -q "net watch attached: cimbot" srv/boot.log \
            || fail "netty net-watch was not attached to the bot channel"
          pc=$(grep -c "net watch: post_effects -> cimbot" srv/boot.log || true)
          [ "${pc:-0}" -ge 3 ] || fail "postfx apply+modded-chain+clear not all seen server-side (count=$pc)"
          grep -q "f2v net: postfx modded chain c-imagine:cimsepia requested -> sent" srv/boot.log \
            || fail "modded postfx chain never requested over the wire"
          grep -q "c-imagine:cimsepia" srv/boot.log \
            || fail "modded chain id never reached the wire descriptions"
          # HUD channel (parity matrix "hud", dialog-hud-26-3.md): the plugin
          # showed a server-authored dialog (inlined Dialog.create), the bot
          # observed show_dialog on the wire and answered with the serverbound
          # custom_click, and Paper surfaced it as PlayerCustomClickEvent —
          # the full response round-trip on one line each.
          grep -q "\[cim-hud\] dialog shown to cimbot" srv/boot.log \
            || fail "HUD dialog was never shown (Dialog.create/showDialog failed)"
          grep -q "\[cim-hud\] custom click received" srv/boot.log \
            || fail "HUD custom_click never surfaced as PlayerCustomClickEvent"
          # block leg — server-side proof (Paper 26.3 does not emit clientbound
          # single block updates to late-joining bots; measured. The wire-level
          # fact is the netty outbound object: pos + translated state).
          grep -q "net watch: block update -> cimbot" srv/boot.log \
            || grep -q "net watch: section blocks update -> cimbot" srv/boot.log \
            || fail "no outbound block packets to the bot at netty level"
          grep -q "minecraft:iron_chain" srv/boot.log \
            || fail "translated iron_chain state never reached the wire"
          echo "M4 wire contract: bot legs + server net leg + netty watch verified"

      - name: assert F2V visual pipeline (M5.2)
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          # pack lifecycle server-side: built + integrity + loopback serving
          grep -q "f2v pack: built (" srv/boot.log \
            || fail "plugin did not build the F2V pack"
          grep -q "integrity=ok (matches pre-boot build)" srv/boot.log \
            || fail "boot-time rebuild sha1 does not match the pre-boot pack (determinism broken)"
          grep -q "f2v pack: serving http://127.0.0.1:25580/cim-f2v-pack.zip" srv/boot.log \
            || fail "pack HTTP server not serving on the properties URL"
          # client-side state machine: the WIRE accept is proven bot-side
          # ("resource pack accepted (F2V)" check, asserted in the python
          # block above). MEASURED on 3cab5d8: the config-phase (properties)
          # pack does NOT fire PlayerResourcePackStatusEvent server-side —
          # paper-api 26.3 has exactly one pack status event and Paper fires
          # it for play-phase pushes only. The status log lines stay as
          # diagnostics; apply-side proof rides the M5 xvfb real client.
          # the visual item leg: host item + custom_model_data component
          grep -q "f2v item: gave cimtest:test_block as minecraft:paper cmd=1000.0 (inventory verified)" \
            srv/boot.log || fail "visual item give/verify leg missing"
          # v2 SELECT row: CMD STRINGS ride the same vanilla codec
          # (brick host + when:wand select def — the second ItemsAdder/
          # Oraxen dispatch family from the parity matrix)
          grep -q "f2v item: gave cimtest:test_wand as minecraft:brick strings=\[wand\] (inventory verified)" \
            srv/boot.log || fail "visual wand give/verify leg missing"
          grep -Eq "net watch: container (content|slot) -> cimbot .*strings=\[wand\]" srv/boot.log \
            || fail "custom_model_data strings never rode the wire to the client"
          # M6 pull-forward: the equippable helmet (asset_id -> the pack's
          # equipment asset mapped from the legacy 1.21.1 armor textures)
          grep -q "f2v armor: equipped cimtest:test_armor on cimbot (verified)" \
            srv/boot.log || fail "equippable armor leg missing (server-side)"
          grep -q "assets/cimtest/equipment/test_armor.json" srv/boot.log \
            || true # equipment asset rides the pack (asserted on the zip below)
          unzip -p srv/c-imagine/f2v/pack.zip assets/cimtest/equipment/test_armor.json \
            | grep -q '"humanoid"' \
            || fail "equipment asset missing from the pack"
          # wire-level: the CMD component must ride the vanilla container
          # codec to the client (netty outbound object proof, same policy as
          # the block leg — Paper-side object, not a bot parse)
          # MEASURED 1a1a5ce: addItem syncs via the SLOT packet (content
          # packets appear on window resync) — watch both classes
          grep -Eq "net watch: container (content|slot) -> cimbot .*cmd=" srv/boot.log \
            || fail "custom_model_data never rode the wire to the client"
          # M5.4 display leg: the item_display rig carrying the CMD stack —
          # the parity matrix "entities" channel (v1: display/Rig ItemDisplay
          # per part) — spawn + wire observation, both sides asserted
          grep -q "f2v net: display spawned uuid=" srv/boot.log \
            || fail "display entity spawn leg missing"
          grep -q "add_entity(extra)" cimbot-report.json \
            || fail "bot never observed the item_display rig on the wire"
          # pack content sanity: the override def + modded model rode the zip
          unzip -p srv/c-imagine/f2v/pack.zip assets/minecraft/items/paper.json \
            | grep -q "minecraft:custom_model_data" \
            || fail "paper.json override missing from the pack"
          unzip -p srv/c-imagine/f2v/pack.zip assets/cimtest/models/item/test_block.json \
            | grep -q "cimtest:block/test_block" \
            || fail "modded item model missing from the pack"
          # BLOCK channel (parity matrix "blocks", block-channel-26-3.md):
          # the note_block carrier state rides a BlockDisplay ENTITY (owner
          # directive 2026-10-30: the real-block stand-in is deprecated — no
          # world block, no collision, brightness pinned 15/15), placed for
          # the bot, plus the merged blockstates override in the pack
          grep -q "f2v block: placed cimtest:test_block as block_display\[note_block instrument=creeper,note=13\] for cimbot (verified @" \
            srv/boot.log || fail "note_block carrier place leg missing"
          unzip -p srv/c-imagine/f2v/pack.zip assets/minecraft/blockstates/note_block.json \
            | grep -q '"instrument=creeper,note=13"' \
            || fail "note_block blockstate override missing from the pack"
          unzip -p srv/c-imagine/f2v/pack.zip assets/cimtest/models/block/test_block.json \
            | grep -q "cimtest:block/test_block" \
            || fail "modded block model missing from the pack"
          echo "F2V visual pipeline: pack built + deterministic + served + accepted + loaded + visual item verified"

      # --- assertions --------------------------------------------------------
      - name: assert boot markers
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          grep -q "Done (" srv/boot.log || fail "server did not reach Done"
          grep -q "\[c-imagine\] module init (native, pre-kernel)" srv/boot.log || fail "module init marker missing"
          grep -q "module imagine -> init rc=0" srv/boot.log || fail "module init rc != 0"
          grep -q "\[c-imagine\] class-load hook observed: dev/cim/bootstrap/Bootstrap" srv/boot.log || fail "class hook pipeline marker missing"
          grep -q "\[c-imagine\] kernel ready (Paper class space online)" srv/boot.log || fail "kernel-ready marker missing"
          grep -qE "\[c-imagine\] mods \([0-9]+\): .*cimtest" srv/boot.log || fail "cimtest not discovered in mods/"
          grep -qE "\[c-imagine\] mods \([0-9]+\): .*cimscene" srv/boot.log || fail "cimscene not discovered in mods/"
          # M5.5 census harness lifecycle in the layer (mod-parity-harness.md §4:
          # registration parity is the FIRST gate — common setup fires on both
          # stacks, so the census must exist in the layer boot too)
          grep -q "\[cimscene\] mod constructed" srv/boot.log \
            || fail "cimscene not constructed in the layer"
          grep -q "\[cimscene\] common setup ok" srv/boot.log \
            || fail "cimscene common setup missing in the layer"
          grep -q "\[cimscene\] census written scene-manifest.tsv" srv/boot.log \
            || fail "cimscene census missing in the layer"
          # The ready marker is the combined nested status JSON
          # {"init":{...,"layer":{...}},"mods":{...}} — parse it properly.
          python3 - <<'PY'
          import json, re
          log = open('srv/boot.log', encoding='utf-8', errors='replace').read()
          m = re.search(r'\[c-imagine\] bootstrap ready: (\{.*)', log)
          assert m, "bootstrap ready marker missing"
          ready, _ = json.JSONDecoder().raw_decode(m.group(1))
          init = ready.get('init') or {}
          assert init.get('state') == 'ok', f"init not ok: {init.get('error')}"
          layer = init.get('layer') or {}
          assert layer.get('state') == 'ok', f"layer boot not ok: {layer.get('error')}"
          regs = layer.get('registries') or 0
          assert regs >= 70, f"vanilla registries too low: {regs}"
          print(f"layer registries: {regs}")
          mods = ready.get('mods') or {}
          assert mods.get('state') == 'ok', f"mods not ok: {mods.get('error')}"
          print(f"mods: {mods.get('mods')} in {mods.get('tookMs')} ms; registered={mods.get('registered')}")
          registered = mods.get('registered') or {}
          for k in ('ITEM', 'BLOCK', 'BLOCK_ENTITY_TYPE', 'ENTITY_TYPE'):
              assert registered.get(k, 0) >= 1, f"no {k} registrations: {registered}"
          entries = json.dumps(mods.get('moddedEntries') or {}, ensure_ascii=False)
          assert 'cimtest:test_block' in entries, f"cimtest:test_block missing: {entries}"
          assert 'cimtest:test_block_entity' in entries, "cimtest:test_block_entity missing"
          assert 'cimtest:test_entity' in entries, "cimtest:test_entity missing"
          print("M2 live-boot: real mods + cimtest registration verified")
          PY
          # module->plugin bridge: the module persists the combined status for /cim status
          python3 - <<'PY'
          import json
          status = json.load(open('srv/c-imagine/status.json', encoding='utf-8'))
          assert status.get('init', {}).get('state') == 'ok', f"status.json init not ok: {status}"
          assert status.get('mods', {}).get('state') == 'ok', f"status.json mods not ok: {status}"
          print("status.json bridge:", status.get('mods', {}).get('mods'), "mods")
          PY
          # M2: real-FML mod execution over the composite mod set (real mods +
          # cimtest) inside the live Paper JVM
          grep -q "\[c-imagine\] mod execution ok" srv/boot.log || fail "M2 mod execution FAILED"
          for m in appleskin neoforge cimtest ferritecore jade jei spark; do
            grep -q "\[c-imagine\] mod $m: constructed" srv/boot.log || fail "mod $m not constructed on live boot"
          done
          # shadow-space log pipeline: first-party mod markers must reach the
          # boot log through the layer's own slf4j/log4j stack — the same
          # lines the real NeoForge server emits (parity contract)
          grep -q "\[cim-layer\].*\[cimtest\] mod constructed" srv/boot.log \
            || fail "shadow log pipeline broken: [cimtest] constructed marker missing"
          grep -q "\[cim-layer\].*\[cimtest\] common setup ok" srv/boot.log \
            || fail "shadow log pipeline broken: [cimtest] common setup marker missing"
          # M3.1 kernel state bridge: place via layer -> Paper sees it; break
          # via Paper -> the layer facade observes it; modded id -> stand-in
          grep -q "\[c-imagine\] bridge: plugin instance resolved" srv/boot.log \
            || fail "bridge: plugin instance never resolved"
          grep -q "bridge smoke: vanilla set ok=true.*roundtrip ok" srv/boot.log \
            || fail "bridge smoke: vanilla roundtrip missing"
          grep -q "bridge smoke: modded set ok=true" srv/boot.log \
            || fail "bridge smoke: modded stand-in leg missing"
          grep -q "bridge smoke: paper-side break ok=true.*observed" srv/boot.log \
            || fail "bridge smoke: paper-side break not observed by the layer"
          # M3.2 state-translation legs: 1.21.1 chain rename through the live
          # kernel + note_block value-set identity
          grep -q "bridge smoke: drift leg set=true.*chain->iron_chain ok" srv/boot.log \
            || fail "bridge smoke: M3.2 chain->iron_chain drift leg missing"
          grep -q "bridge smoke: note leg set=true.*value-set ok" srv/boot.log \
            || fail "bridge smoke: M3.2 note_block value-set leg missing"
          # M3.4 entity projection legs: 1.21.1 boat spawns as the 26.3
          # oak_boat (registry split), the layer view translates back, pig
          # passes identity, despawn through the facade removes it
          grep -q "bridge smoke: entity boat leg uuid=.*boat split ok" srv/boot.log \
            || fail "bridge smoke: M3.4 boat split entity leg missing"
          grep -q "bridge smoke: entity pig leg uuid=.*identity ok" srv/boot.log \
            || fail "bridge smoke: M3.4 pig identity entity leg missing"
          grep -q "\[c-imagine\] bridge smoke: ALL OK" srv/boot.log \
            || fail "bridge smoke did not end ALL OK"
          # M3.3: the modded write left a persisted sidecar record (the
          # restore census on boot 1 is legitimately 0 live — smoke order)
          [ -f srv/c-imagine/sidecar.tsv ] || fail "sidecar.tsv missing after first boot"
          grep -q "cimtest:test_block" srv/c-imagine/sidecar.tsv \
            || fail "cimtest:test_block not persisted to sidecar.tsv"
          echo "all integration markers present (incl. M1 layer boot + M2 real mods + M3.2 drift + M3.3 sidecar)"

      # --- M3.3 restart contract ---------------------------------------------
      # The world dir persists (SIGTERM -> Paper saves). A second boot must
      # restore the modded state from the sidecar with the stand-in intact:
      # the zero-orphan-state acceptance for the milestone.
      - name: restart server (timeout 4 min)
        id: boot2
        run: |
          set +e
          cd srv
          # boot1 was killed after its window — the engine's singleton guard
          # checks a LIVE pid (from -Donload.pidFile=), and the server JVM
          # can outlive the CLI for seconds while Paper saves. Stop, then
          # wait for the JVM process itself to disappear.
          timeout 90 crussty stop || true
          for i in $(seq 1 60); do
            pgrep -f onload.pidFile >/dev/null || break
            sleep 2
          done
          pgrep -f onload.pidFile >/dev/null && { pkill -9 -f onload.pidFile || true; sleep 5; }
          timeout 240 crussty run > boot2.log 2>&1
          code=$?
          cd ..
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "--- tail of boot2.log ---"
          tail -25 srv/boot2.log || true
          true

      - name: assert M3.3 restore markers
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          grep -q "Done (" srv/boot2.log || fail "second boot did not reach Done"
          grep -q "sidecar restore: cimtest:test_block @ .* (stand-in intact)" srv/boot2.log \
            || fail "M3.3: modded state not restored from the persisted sidecar"
          grep -q "sidecar restore: 1 live, 0 culled" srv/boot2.log \
            || fail "M3.3: restore census wrong (stand-in lost or ghost culled)"
          grep -q "\[c-imagine\] bridge smoke: ALL OK" srv/boot2.log \
            || fail "second boot smoke failed"
          echo "M3.3 restart contract: modded state survived the restart (zero orphan state)"

      - name: report + upload restart logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-restart-logs
          path: |
            srv/boot2.log
            srv/c-imagine/sidecar.tsv
          if-no-files-found: ignore

      - name: report + upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            srv/boot.log
            cimbot.log
            cimbot-report.json
            cimbot-exit
            srv/crash-reports/
            srv/logs/
          if-no-files-found: ignore

      - name: upload layer census (cimscene)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-census
          path: |
            srv/c-imagine/scenes/scene-manifest.tsv
            srv/c-imagine/scenes/scene-manifest-entries.tsv
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # M2: real-FML mod execution over REAL NeoForge 1.21.1 mods (Modrinth)
  # in the shadow space via the local harness (no Paper, no CRUSSTY).
  # Owner requirement: early, visible progression against third-party mods.
  # ---------------------------------------------------------------------
  m2-real-mods:
    name: M2 real mods (Modrinth) — FML pipeline in shadow space
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: gradle/actions/setup-gradle@v4

      # --- build (all on CI per owner directive) --------------------------
      - name: build rust (release)
        run: cargo build --release --quiet

      - name: build java bootstrap
        run: bash scripts/build-bootstrap.sh

      - name: build cimtest mod (NeoForge 1.21.1)
        working-directory: test-mods
        run: gradle build --no-daemon

      # --- 1.21.1 layer (cached) ------------------------------------------
      - name: restore NeoForge 1.21.1 layer (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer1211
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 1.21.1 layer (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-installer.jar --installServer layer1211
          find layer1211 -name "*.jar" | wc -l

      # --- real mods -------------------------------------------------------
      - name: fetch real NeoForge 1.21.1 mods (Modrinth)
        run: |
          bash scripts/fetch-real-mods.sh realmods
          mkdir -p mods
          cp realmods/*.jar mods/
          cp test-mods/build/libs/cimtest-1.0.0.jar mods/

      # --- run -------------------------------------------------------------
      - name: run M2 harness (relocation + real FML mod execution)
        run: bash scripts/run-m2-harness.sh layer1211/libraries mods out

      # --- assertions ------------------------------------------------------
      - name: assert M2 markers
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          L=out/harness.log
          grep -q "mod execution ok" $L || fail "mod execution FAILED (see harness.log)"
          # every real mod + layer + cimtest constructed through real FML
          for m in appleskin neoforge cimtest ferritecore jade mezz_config jei spark; do
            grep -q "\[c-imagine\] mod $m: constructed" $L || fail "mod $m not constructed"
          done
          # cimtest registrations went through the real RegisterEvent pipeline
          REG=$(grep -oE "registered=\{[^}]*\}" $L | tail -1)
          echo "cimtest registrations: $REG"
          echo "$REG" | grep -q "ITEM=[1-9]" || fail "no ITEM registrations"
          echo "$REG" | grep -q "BLOCK=[1-9]" || fail "no BLOCK registrations"
          echo "$REG" | grep -q "BLOCK_ENTITY_TYPE=[1-9]" || fail "no BLOCK_ENTITY_TYPE registrations"
          echo "$REG" | grep -q "ENTITY_TYPE=[1-9]" || fail "no ENTITY_TYPE registrations"
          grep -q "cimtest:test_block" $L || fail "cimtest:test_block not registered"
          grep -q "cimtest:test_block_entity" $L || fail "cimtest:test_block_entity not registered"
          grep -q "cimtest:test_entity" $L || fail "cimtest:test_entity not registered"
          # timing report for the trend
          grep -oE "mod execution ok \(mods=[0-9]+, registered=[^)]+\)" $L | tail -1
          # shadow-space log pipeline parity markers (identical lines the
          # real NeoForge server prints — see the parity-real-neoforge job)
          grep -q "\[cim-layer\].*\[cimtest\] mod constructed" $L \
            || fail "shadow log pipeline broken: [cimtest] constructed marker missing"
          grep -q "\[cim-layer\].*\[cimtest\] common setup ok" $L \
            || fail "shadow log pipeline broken: [cimtest] common setup marker missing"
          echo "M2 real-mod markers: all present"

      - name: report + upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-real-mods-logs
          path: |
            out/harness.log
            out/m2manifest.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # M2 parity ground truth: the SAME mod set (real Modrinth mods + cimtest)
  # on a REAL NeoForge 21.1.265 dedicated server. The first-party [cimtest]
  # markers are the parity contract: every line printed there must appear
  # identically in the c-imagine boots (live boot + harness).
  # ---------------------------------------------------------------------
  parity-real-neoforge:
    name: ground truth — real NeoForge 21.1.265 server (same mod set)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: build cimtest mod (NeoForge 1.21.1)
        working-directory: test-mods
        run: gradle build --no-daemon

      - name: build cimscene harness mod (NeoForge 1.21.1)
        working-directory: scene-mod
        run: gradle build --no-daemon

      - name: restore NeoForge 21.1.265 server (cache)
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: layer1211
          key: neoforge-layer-21.1.265

      - name: download + install NeoForge 21.1.265 server (cache miss)
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 300 -o nf-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.265/neoforge-21.1.265-installer.jar"
          java -jar nf-installer.jar --installServer layer1211

      - name: prepare server directory (isolated copy)
        run: |
          cp -r layer1211 srv-parity
          mkdir -p srv-parity/mods
          cp test-mods/build/libs/cimtest-1.0.0.jar srv-parity/mods/
          cp scene-mod/build/libs/cimscene-1.0.0.jar srv-parity/mods/
          bash scripts/fetch-real-mods.sh realmods
          cp realmods/*.jar srv-parity/mods/
          echo "eula=true" > srv-parity/eula.txt
          cat > srv-parity/server.properties <<'PROPS'
          online-mode=false
          level-type=minecraft:flat
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          max-players=5
          PROPS

      - name: boot real NeoForge server (timeout 5 min)
        run: |
          set +e
          cd srv-parity
          timeout 300 ./run.sh > boot.log 2>&1
          code=$?
          cd ..
          echo "exit=$code"
          tail -30 srv-parity/boot.log || true
          true

      - name: assert real-server parity markers
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          L=srv-parity/boot.log
          grep -q "Done (" $L || fail "real NeoForge server did not reach Done"
          grep -q "\[cimtest\] mod constructed (registration queues armed)" $L \
            || fail "cimtest constructed marker missing on real server"
          grep -q "\[cimtest\] common setup ok (block=cimtest:test_block" $L \
            || fail "cimtest common setup marker missing on real server"
          grep -q "\[cimscene\] mod constructed" $L \
            || fail "cimscene constructed marker missing on real server"
          grep -q "\[cimscene\] common setup ok" $L \
            || fail "cimscene common setup marker missing on real server"
          grep -q "\[cimscene\] census written scene-manifest.tsv" $L \
            || fail "cimscene census marker missing on real server"
          grep -q "\[cimscene\] commands registered" $L \
            || fail "cimscene commands marker missing on real server"
          echo "real NeoForge 21.1.265 parity markers: all present"

      - name: report + upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-real-neoforge-logs
          path: |
            srv-parity/boot.log
            srv-parity/logs/
          if-no-files-found: ignore

      - name: upload truth census (cimscene)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truth-census
          path: |
            srv-parity/c-imagine/scenes/scene-manifest.tsv
            srv-parity/c-imagine/scenes/scene-manifest-entries.tsv
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # M5.5: the FIRST cross-stack registration-parity diff — the census
  # cimscene emitted inside the c-imagine layer vs the SAME-mod-set real
  # NeoForge boot (mod-parity-harness.md §4: census parity gates every
  # later channel; pixels are meaningless if the stacks do not even
  # register the same sets).
  # ---------------------------------------------------------------------
  census-diff:
    name: census parity — layer vs real NeoForge (same mod set)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [boot, parity-real-neoforge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: layer-census
          path: layer

      - uses: actions/download-artifact@v4
        with:
          name: truth-census
          path: truth

      - name: diff the registries (registration parity)
        run: |
          T=$(find truth -name scene-manifest.tsv | head -1)
          L=$(find layer -name scene-manifest.tsv | head -1)
          TE=$(find truth -name scene-manifest-entries.tsv | head -1)
          LE=$(find layer -name scene-manifest-entries.tsv | head -1)
          test -n "$T" || { echo "truth census missing"; exit 1; }
          test -n "$L" || { echo "layer census missing"; exit 1; }
          echo "truth=$T layer=$L"
          # counts first; when both entry listings exist, the join goes to
          # EXACT set equality per registry (counts can match, sets can't lie)
          if test -n "$TE" && test -n "$LE"; then
            python3 scripts/cimscene/census-diff.py "$T" "$L" "$TE" "$LE" | tee census-diff.txt
          else
            echo "(entry listings missing — counts-only diff)"
            python3 scripts/cimscene/census-diff.py "$T" "$L" | tee census-diff.txt
          fi
          grep -q "CENSUS PARITY: GREEN" census-diff.txt

      - name: upload census diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: census-diff-report
          path: census-diff.txt
          if-no-files-found: ignore
