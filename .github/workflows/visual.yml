name: visual

# Visual parity pipeline. M0: protocol-level smoke of the visual data path
# (registry snapshots + mapping tables the F2V v2 packet hooks will consume).
# M5 (roadmap): real vanilla client under xvfb with screenshot diffing
# against NeoForge-rendered ground truth.
# Actions policy (owner directive, updated 2026-10-26): minutes nearly
# exhausted — dispatch-only. STAYS dispatch-only: its role is the
# calibrated manual harness (the push-wired pixel gate is gallery.yml).
#
# 2026-11-05 re-arm (feat/parity-modern): the vanilla-client contract legs
# ride the SEED V2 contract — an optional gallery_run_id input stages the
# gallery seed-pack manifests and the ladder legs walk page 0 of EVERY
# LADDER_NS namespace through the same replay surfaces the gallery ours
# leg uses (items/held/inv parity shots + the ordered sound stream).
# Without the input the job stays exactly the calibrated cimtest harness.
on:
  workflow_dispatch:
    inputs:
      gallery_run_id:
        description: "optional gallery.yml run id — its seed-pack artifact seeds the ladder parity legs (items/held/inv/sound page 0 per LADDER_NS). Empty = cimtest-only harness"
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  # THE LADDER mirror (gallery.yml is the single source of these lists —
  # keep the two in sync when the ladder grows; the registry namespaces,
  # not the Modrinth slugs, are what the walks filter by)
  LADDER_SLUGS: "create biomes-o-plenty glitchcore terrablender dynamictrees combat-roll playeranimator cloth-config"
  LADDER_NS: "create biomesoplenty dynamictrees combat_roll"

jobs:
  protocol-smoke:
    name: visual data path smoke (M0)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: f2v translation-plan smoke test
        run: |
          # The plan builder is the contract every M4 packet rewrite obeys.
          cargo test -p cim-f2v
          cargo test -p cim-registry

      - name: visual contract fixture (cimtest defaults)
        run: |
          cat > /tmp/visual-contract.md <<'EOF'
          | modded key | renders as (vanilla) | scale |
          |---|---|---|
          | cimtest:test_entity | minecraft:iron_golem | 0.5 |
          | cimtest:test_block | minecraft:iron_block | 1.0 |
          EOF
          cat /tmp/visual-contract.md >> "$GITHUB_STEP_SUMMARY"

      # M5 milestone (see docs/ROADMAP.md): xvfb + headless vanilla client
      # + screenshot diff vs NeoForge ground truth. Scaffolded there; kept
      # out of M0 until the protocol bot (cim-proto based) exists.

  # M5.3: REAL vanilla client under xvfb — downloads the pack from PackHttp,
  # applies it, receives the visual item (CMD component through the vanilla
  # give component syntax), and screenshots the result. The pixel contract:
  # a CMD item and a plain paper item must render DIFFERENTLY in the hotbar
  # (the pack's range_dispatch override is what makes them differ).
  vanilla-client-visual:
    name: vanilla 26.3 client visual contract (M5.3 + ladder parity legs)
    runs-on: ubuntu-latest
    # the ladder legs add: the ladder fetch + the item-row pack build
    # (+1-3 min), and 4 ns x (held/inv shots + one sound page) (+~3 min) —
    # the join budget itself is unchanged (12 min llvmpipe window)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: resolve newest stable paper-api for 26.3
        id: paper
        run: |
          PV=$(bash scripts/resolve-paper-version.sh 26.3)
          echo "version=$PV" >> "$GITHUB_OUTPUT"
      - name: build plugin
        working-directory: paper-plugin
        run: mvn -B -ntp -Dpaper.version="${{ steps.paper.outputs.version }}" package
      # --- SEED V2 MANIFESTS (optional, gallery_run_id) ---------------------
      # The seed-pack artifact of a gallery.yml run carries the TRUTH-side
      # walk manifests (gallery-item/sound/biome/... per LADDER_NS) the
      # ladder legs replay against. Only MANIFESTS ride over — the pack is
      # built from THIS checkout's builder; the seed never ships pack bytes
      # into this job (the parity side must render what this commit builds).
      - name: download gallery seed-pack (seed v2 manifests)
        if: inputs.gallery_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: seed-pack
          path: seed-pack
          run-id: ${{ inputs.gallery_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: verify the seed payload (ladder manifests present)
        if: inputs.gallery_run_id != ''
        run: |
          set -euo pipefail
          N=0
          for NS in $LADDER_NS; do
            [ -f "seed-pack/scenes/gallery-sound-$NS-p0.tsv" ] && N=$((N+1)) \
              || echo "NOTE: $NS sound manifest p0 missing from the seed"
            [ -f "seed-pack/scenes/gallery-item-$NS-p0.tsv" ] \
              || echo "NOTE: $NS item manifest p0 missing from the seed (its item/held/inv legs will be skipped honestly)"
          done
          [ "$N" -gt 0 ] || { echo "the seed carries NO sound manifests — a pre-seed-v2 gallery run cannot arm the ladder legs"; exit 1; }
          echo "seed verified: $N/$(echo $LADDER_NS | wc -w) sound manifests staged"
      - name: fetch visual client runtime (piston-meta, with assets)
        run: |
          python3 scripts/fetch-visual-client.py 26.3 visual-client --assets
          ls visual-client | head
          wc -c visual-client/classpath.txt visual-client/launch.txt
      - name: measure the 26.3 tint surface (vanilla items/ defs from the client jar)
        run: |
          set -euo pipefail
          # the biome-tint channel (parity matrix 2.10b) needs the EXACT
          # vanilla dyed_color model-tint shape: the vanilla defs live in the
          # client jar — read them from the primary source, no decompile
          echo "--- vanilla items/leather_helmet.json (dyed_color tint shape) ---"
          unzip -p visual-client/client.jar assets/minecraft/items/leather_helmet.json \
            || echo "MISSING leather_helmet def"
          echo "--- classes carrying the dyed_color key (obf census) ---"
          mkdir -p /tmp/tintc && cd /tmp/tintc
          unzip -qo "$OLDPWD/visual-client/client.jar" 'net/minecraft/*' >/dev/null 2>&1 || true
          grep -rl "dyed_color" net/ 2>/dev/null | head -8 || echo "no dyed_color classes found"
          cd "$OLDPWD"
      - name: fetch Paper 26.3 (fill API v3, bare — no module)
        run: |
          set -euo pipefail
          mkdir -p srv
          # MEASURED (first dispatch): crussty init downloads Paper lazily on
          # `run` — a bare visual job needs the paperclip jar directly.
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          echo "paper: $URL"
          curl -sL --max-time 300 -o srv/paper.jar "$URL"
          wc -c srv/paper.jar
      - name: stage plugin + pack (pre-boot build, deterministic)
        run: |
          set -euo pipefail
          mkdir -p srv/plugins srv/mods srv/c-imagine/f2v
          cp paper-plugin/target/cim-paper-plugin.jar srv/plugins/
          # the pack builder reads ASSETS from mod jars — the cimtest jar
          # assets suffice (no layer, no module in this job)
          (cd test-mods/src/main/resources && zip -qr /tmp/cimtest-assets.jar assets)
          cp /tmp/cimtest-assets.jar srv/mods/cimtest-1.0.0.jar
          cp scripts/f2v/visual-items.tsv scripts/f2v/visual-equipment.tsv scripts/f2v/visual-blocks.tsv scripts/f2v/visual-palettes.tsv srv/c-imagine/f2v/
          # --- SEED V2 LADDER AWARENESS (only when a seed was staged) ------
          # The ladder item rows ride the pack: the CMD space is assigned
          # from the TRUTH-side item manifests (gallery-item-<ns>-p*.tsv)
          # exactly per the seed's law — 300000+i over the CONCATENATED rows
          # (a per-ns restart collides the thresholds, measured a83ec48f).
          # The ladder jars join the build so the item model graphs resolve
          # from the SAME locked jars the seed walked (mods.lock pins them).
          # The sound channel map is regenerated from the staged sound
          # manifests (pure function of them) — the plugin's sound replay
          # resolves through it and records the post-rewrite ids.
          if [ -d seed-pack/scenes ]; then
            mkdir -p srv/c-imagine/scenes
            cp seed-pack/scenes/gallery-item-*.tsv srv/c-imagine/scenes/ 2>/dev/null || true
            cp seed-pack/scenes/gallery-sound-*.tsv srv/c-imagine/scenes/ 2>/dev/null || true
            bash scripts/cimscene/fetch-ladder.sh mods-ladder $LADDER_SLUGS
            cp mods-ladder/*.jar srv/mods/
            ITEM_CMD=300000
            for NS in $LADDER_NS; do
              python3 scripts/f2v/gallery-items-manifest.py \
                srv/c-imagine/scenes $NS /tmp/visual-gallery-items-$NS.tsv $ITEM_CMD
              ITEM_CMD=$((ITEM_CMD + $(grep -vc '^#' /tmp/visual-gallery-items-$NS.tsv || true)))
              cat /tmp/visual-gallery-items-$NS.tsv >> srv/c-imagine/f2v/visual-items.tsv
            done
            python3 scripts/f2v/gallery-sounds-mapping.py \
              srv/c-imagine/scenes srv/c-imagine/f2v/visual-sounds.tsv
          fi
          # the standalone builder needs the plugin's runtime deps (gson for
          # the model-graph JSON walk) — same classpath rule as the gallery
          # seed and the integration pre-boot build
          (cd paper-plugin && mvn -q -B dependency:build-classpath \
            -Dmdep.outputFile=target/selftest-cp.txt)
          FCPL="$(cat paper-plugin/target/selftest-cp.txt)"
          # --assets: the vanilla-parent fallback must ride the SAME client
          # that renders the pack (measured run 41126658261; the 14-ay rule
          # — BOP bare parents point at vanilla templates). The cimtest
          # graphs are self-contained and resolve identically either way,
          # so the calibrated cimtest legs' pixels are unaffected.
          java -cp "paper-plugin/target/cim-paper-plugin.jar:$FCPL" dev.cim.f2v.F2vPack \
            --build srv/mods srv/c-imagine/f2v --assets visual-client/client.jar
          SHA1=$(cat srv/c-imagine/f2v/pack.sha1)
          echo "eula=true" > srv/eula.txt
          cat > srv/server.properties <<PROPS
          online-mode=false
          white-list=false
          # MEASURED (run 8): a superflat slime killed cimviewer between the
          # baseline and the item shots — the death screen covered every
          # later frame and the contract asserted on a corpse. Peaceful
          # removes hostile spawns entirely.
          difficulty=peaceful
          level-type=minecraft:flat
          level-seed=42
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          max-players=5
          # the ladder legs read the replay markers from the command OUTPUT
          # (rcon.py) — the console FIFO stays for the cimtest legs
          enable-rcon=true
          rcon.port=25575
          rcon.password=cimgate
          resource-pack=http://127.0.0.1:25580/cim-f2v-pack.zip
          resource-pack-sha1=$SHA1
          PROPS
          cat srv/server.properties
      # DERIVED INV MANIFESTS (seed v2 legs only): the inv class is TRUTH-
      # WALK-ONLY (a viewer fills the slots; the seed walks headless), so
      # the seed cannot carry inv manifests — derive them deterministically
      # from the item manifests (the first 36 rows of page 0, the scene
      # walk's exact slot naming: hotbar.0..8, inventory.9..35). The same
      # file feeds the parity-diff pairing guard.
      - name: derive inv manifests from the seed item pages
        if: inputs.gallery_run_id != ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          scenes = pathlib.Path("srv/c-imagine/scenes")
          for ns in "create biomesoplenty dynamictrees combat_roll".split():
              mf = scenes / f"gallery-item-{ns}-p0.tsv"
              if not mf.is_file():
                  print(f"derived inv manifest {ns}: skipped (no item manifest p0)")
                  continue
              items = []
              for line in mf.read_text(encoding="utf-8").splitlines():
                  p = line.split("\t")
                  if len(p) >= 5 and p[0] == "cell" and p[4].strip():
                      items.append(p[4].strip())
              items = items[:36]
              rows = ["slot\titem"]
              rows += [f"{'hotbar.' if i < 9 else 'inventory.'}{i}\t{it}"
                       for i, it in enumerate(items)]
              (scenes / f"gallery-inv-{ns}-p0.tsv").write_text(
                  "\n".join(rows) + "\n", encoding="utf-8")
              print(f"derived inv manifest {ns}: {len(items)} slot(s)")
          PY
      - name: boot server (bare Paper + plugin, console FIFO)
        run: |
          set -euo pipefail
          cd srv
          mkfifo console.in
          # keep the FIFO open and feed console commands from a file later
          # paperclip patches the Mojang jar on first boot (network needed)
          tail -f console.in | java -Xmx2G -Dcim.f2v.assetsJars="$GITHUB_WORKSPACE/visual-client/client.jar" -jar paper.jar --nogui > boot.log 2>&1 &
          echo $! > ../srv.pid
          cd ..
          # wait for Done (120 x 2s)
          for i in $(seq 1 120); do
            grep -q "Done (" srv/boot.log 2>/dev/null && break
            sleep 2
          done
          grep -q "Done (" srv/boot.log || { tail -30 srv/boot.log; exit 1; }
          grep -q "f2v pack: serving" srv/boot.log || { tail -30 srv/boot.log; exit 1; }
          grep -Fq "integrity=ok (matches pre-boot build)" srv/boot.log || { tail -40 srv/boot.log; exit 1; }
          # CAMERA-LOCK PARITY PIN (docs/runtime-analysis/camera-lock-26-3.md):
          # the NeoForge truth side (parity-diff.yml) pins the SAME sun angle
          # and kills weather — both worlds must shoot under identical sky
          # light, and rain/sky drift between shots is poison for the pixel
          # gates below. 14-at: Paper 26.3 renamed the gamerules
          # (GameRuleRegistryFix): doDaylightCycle -> advance_time,
          # doWeatherCycle -> advance_weather, doMobSpawning -> spawn_mobs —
          # the old names fail with "Incorrect argument" (measured locally on
          # paper-26.3-242).
          echo "gamerule advance_time false" > console.in
          echo "time set noon" > console.in
          echo "gamerule advance_weather false" > console.in
          echo "weather clear" > console.in
          # camera-lock: NO ambient mobs — a wandering peaceful mob pollutes
          # the locked pre/shot pair (measured: a pig walked into the run-45
          # locked frame)
          echo "gamerule spawn_mobs false" > console.in
          echo "server up + pack serving"
      - name: vanilla client joins under xvfb + visual contract
        run: |
          set -euo pipefail
          # Java-only screenshot/diff/key tools (measured: runners ship IM7
          # with no `import`/`xwd`); Robot needs the X display
          javac -d vtools scripts/visual/Shot.java scripts/visual/PixelDiff.java scripts/visual/PixelDiffTol.java scripts/visual/Key.java
          # MEASURED (run 4): GlDevice needs a matching GLX visual — install
          # the software GL/Vulkan stack explicitly and expose GLX on Xvfb
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri mesa-vulkan-drivers libglx-mesa0
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          XVFB_PID=$!
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          LAUNCH=$(cat visual-client/launch.txt)
          # MEASURED (run 6 javap autopsy): quickPlayMultiplayer reads
          # <gameDir>/servers.dat SYNCHRONOUSLY (ServerList.load -> get(ip)
          # exact match) and takes the entry's pack policy. Without the file
          # the client builds a fresh PROMPT entry and stalls forever on the
          # PackConfirmScreen under xvfb. Pre-seed the bytecode-proven
          # layout: NbtIo.read(Path) = UNCOMPRESSED NBT, key "acceptTextures"
          # (Codec.BOOL optionalFieldOf) = true -> ENABLED -> ALLOWED ->
          # ServerPackManager auto-accepts the config-phase pack push.
          python3 scripts/visual/make_servers_dat.py visual-client/game
          # MEASURED (run 7 stall-state.png — the harness screenshot paid off):
          # the client sat on the FIRST-RUN AccessibilityOnboardingScreen
          # ("Welcome to Minecraft! ... Continue") for the whole 12-minute
          # window — the connect never started, the pack prompt never fired.
          # The skip flag is bytecode-proven: Options FieldAccess key
          # "onboardAccessibility" (javap) — false => onboarding skipped.
          mkdir -p visual-client/game
          echo "onboardAccessibility:false" > visual-client/game/options.txt
          # cwd must be the client dir (assets/game dir are resolved there);
          # the launch line carries ABSOLUTE classpaths (measured fix)
          ( cd visual-client && bash -c "$LAUNCH" > client.out 2>&1 ) &
          CLIENT_PID=$!
          # wait for the world join — client.out is the log4j stdout mirror
          # (measured: latest.log may lag/land elsewhere under software GL);
          # llvmpipe shader compilation is SLOW — 12 min budget.
          # Markers (javap-proven): the SECOND "Reloading ResourceManager"
          # line is the server pack being applied (startup reload is the
          # first); "joined the game" is the [CHAT]-logged play-phase marker
          # (ChatComponent logs [CHAT] <msg> at INFO to stdout).
          JOINED=0
          for i in $(seq 1 240); do
            if grep -q "joined the game" visual-client/client.out 2>/dev/null; then JOINED=1; break; fi
            RELOADS=$(grep -c "Reloading ResourceManager" visual-client/client.out 2>/dev/null || true)
            if [ "$RELOADS" -ge 2 ] && [ "$((i % 10))" = "0" ]; then
              echo "[wait] pack reload seen (reloads=$RELOADS), waiting for play-phase chat marker..."
            fi
            # every ~90s: progress tail so a stall is diagnosable WITHOUT
            # burning the whole 12-minute blind window again (run 6 lesson)
            if [ "$((i % 30))" = "0" ]; then
              echo "--- [wait $i] client.out progress tail ---"
              tail -8 visual-client/client.out || true
            fi
            sleep 3
          done
          if [ "$JOINED" != "1" ]; then
            echo "--- client.out tail ---"; tail -60 visual-client/client.out || true
            find visual-client -name "*.log" -o -name "latest.txt" | head
            # stall-state screenshots: run 6 would have been solved by these
            java -cp vtools Shot shots/stall-state.png || true
            exit 1
          fi
          sleep 30   # world render settles (software GL)
          java -cp vtools Shot shots/00-baseline.png
          # hotbar contract: empty -> plain paper -> CMD paper (the pack's
          # range_dispatch must make the LAST two render differently)
          echo "clear cimviewer" > srv/console.in
          sleep 2
          echo "give cimviewer paper 1" > srv/console.in
          sleep 4
          java -cp vtools Shot shots/01-vanilla-paper.png
          echo "clear cimviewer" > srv/console.in
          sleep 2
          echo "give cimviewer paper[minecraft:custom_model_data={floats:[1000.0]}] 1" > srv/console.in
          sleep 4
          java -cp vtools Shot shots/02-cmd-paper.png
          # postfx leg (parity matrix "atmosphere"): the pack-contributed
          # c-imagine:cimsepia chain, requested via the /cim postfx surface,
          # must tint the whole frame on the stock client — the M4 wire leg
          # proved the packet; THIS shot proves the client resolves the
          # pack-contributed chain and renders it (failedPostEffects would
          # leave the frame untouched and the assert below fails)
          echo "cim postfx cimviewer c-imagine:cimsepia" > srv/console.in
          sleep 5   # chain resolve + program compile under llvmpipe
          java -cp vtools Shot shots/03-postfx-on.png
          echo "cim postfx cimviewer clear" > srv/console.in
          sleep 3
          java -cp vtools Shot shots/04-postfx-clear.png
          # select-dispatch pixel leg (2nd ItemsAdder/Oraxen family): the
          # brick host with CMD STRINGS must render the modded wand — the
          # pack's items/brick.json select def (when:"wand") is what makes
          # the LAST shot differ from the plain brick
          echo "clear cimviewer" > srv/console.in
          sleep 2
          echo "give cimviewer brick 1" > srv/console.in
          sleep 4
          java -cp vtools Shot shots/05-plain-brick.png
          echo "clear cimviewer" > srv/console.in
          sleep 2
          echo "give cimviewer brick[minecraft:custom_model_data={strings:[\"wand\"]}] 1" > srv/console.in
          sleep 4
          java -cp vtools Shot shots/06-cmd-brick.png
          # equipment pixel leg (M6 pull-forward, parity matrix "armor"):
          # third-person view (F5 via Robot), the bare model, then the
          # equippable helmet — the ONLY delta is the pack's armor layer on
          # the player model. The component syntax is bytecode-proven
          # (Equippable codec: slot required, asset_id optional identifier).
          echo "clear cimviewer" > srv/console.in
          sleep 2
          java -cp vtools Key F5
          sleep 2
          java -cp vtools Shot shots/07-thirdperson.png
          echo "item replace entity cimviewer armor.head with leather_helmet[minecraft:equippable={slot:\"head\",asset_id:\"cimtest:test_armor\"}]" > srv/console.in
          sleep 4
          java -cp vtools Shot shots/08-armor.png
          java -cp vtools Key F5
          # BLOCK pixel leg (parity matrix "blocks", block-channel-26-3.md):
          # the note_block stand-in placed in FRONT of the viewer (2.5 blocks
          # along the look direction, feet level) — the pack's merged
          # blockstates/note_block.json override is what turns that vanilla
          # note block into the modded cube on the stock client. The pre-shot
          # is the same view WITHOUT the block.
          echo "clear cimviewer" > srv/console.in
          sleep 2
          java -cp vtools Shot shots/09-block-pre.png
          echo "cim placeblock cimviewer cimtest:test_block" > srv/console.in
          sleep 5   # block update + section rebuild under llvmpipe
          java -cp vtools Shot shots/10-block.png
          # ENTITY pixel leg (parity matrix "entities"): the item_display rig
          # spawned in the viewer's view carrying the CMD stack — the same
          # modded cube model through the pack's range_dispatch. MEASURED
          # (run 43): the rig parks in the sky 2.5 above feet (feet+0.4 was
          # swallowed by the block silhouette) and CLOUD DRIFT pollutes the
          # full-frame AE — shot 12 (hold, rig static, clouds moving)
          # measures the drift for the subtraction gate below.
          echo "cim display cimviewer cimtest:test_block" > srv/console.in
          sleep 5   # add_entity + render under llvmpipe
          java -cp vtools Shot shots/11-display.png
          sleep 4
          java -cp vtools Shot shots/12-display-hold.png
          # CAMERA-LOCK BLOCK IDENTITY leg (parity-diff side of the
          # "identical to the modded client" directive — the EXACT same rig
          # the NeoForge truth client walks in parity-diff.yml, see
          # docs/runtime-analysis/camera-lock-26-3.md). MEASURED lessons
          # baked in: (run 46) the VANILLA pitch sign is +DOWN — "0 -30"
          # pointed the camera UP (sky/clouds filled the frame); (run 46)
          # Paper RANDOMIZES the join spawn per run (45: (-6.5,-2.5), 46:
          # (5.5,7.5)) so earlier legs' blocks wander — the sweep fill is
          # sized for the whole spawn radius; (run 45) console `execute ...`
          # is silent — PLAIN + ABSOLUTE commands only; (run 46) plain
          # setblock/fill/kill all log feedback and work.
          echo "kill @e[type=!player]" > srv/console.in
          sleep 2
          echo "tp cimviewer 0.5 -60 0.5 0 30" > srv/console.in
          sleep 2
          echo "fill -12 -60 -12 12 -50 16 air" > srv/console.in
          sleep 2
          # PERSPECTIVE: first person. MEASURED (run 45/46): the armor leg's
          # F5 cycle ends at THIRD-PERSON FRONT (first→back @07, →front @08);
          # THIS leg returns to first person with ONE more press (front→
          # first, deterministic cycle position — run 46 frames show no
          # player = first person achieved).
          java -cp vtools Key F5
          sleep 1
          java -cp vtools Key F1
          sleep 1
          java -cp vtools Shot shots/13-locked-pre.png
          # NOTE: instrument=creeper,note=13 mirrors visual-blocks.tsv
          # (cimtest:test_block) — keep the two in sync when the manifest
          # grows (the manifest-driven F2vPack path is authoritative).
          # The ONLY delta pre→shot is this block (the camera is NOT touched
          # between the two shots).
          echo "setblock 0 -60 3 note_block[instrument=creeper,note=13]" > srv/console.in
          sleep 5   # block/light/section rebuild
          java -cp vtools Shot shots/14-locked.png
          java -cp vtools Key F1
          # console-feedback gates (MEASURED: Paper console logs command
          # feedback — run 45's `execute` silence proved the commands must
          # be plain; if even the plain setblock is silent, report HERE,
          # not only at the pixel gate):
          grep -q "Changed the block at 0, -60, 3" srv/boot.log \
            || { echo "setblock feedback MISSING — the locked leg's block was never placed"; tail -20 srv/boot.log; }
          grep -E "Filled|No blocks were filled" srv/boot.log \
            || echo "fill feedback not found (non-fatal — pre/shot pair decides)"
          # PALETTE pixel leg (M6 palette channel — the ModTintScanner/
          # ColorAtlas family replaced by two small PNGs + ONE atlas source):
          # the pack's paletted_permutations source recolors the gem sprite —
          # the red variant (CMD 1101 = base 1100 + 1, the palette manifest
          # determines it) must render DIFFERENTLY from the base gem (CMD
          # 1100) in the hotbar slot-0 crop. The atlas json rides
          # assets/minecraft/atlases/items.json (APPENDS to the vanilla
          # source stack — measured SpriteSourceList.load).
          echo "clear cimviewer" > srv/console.in
          sleep 2
          echo "give cimviewer amethyst_shard[minecraft:custom_model_data={floats:[1100.0]}] 1" > srv/console.in
          sleep 4
          java -cp vtools Shot shots/15-gem.png
          echo "clear cimviewer" > srv/console.in
          sleep 2
          echo "give cimviewer amethyst_shard[minecraft:custom_model_data={floats:[1101.0]}] 1" > srv/console.in
          sleep 4
          java -cp vtools Shot shots/16-gem-red.png
          # ----------------------------------------------------------------
          # LADDER PARITY LEGS (seed v2 — armed only when a seed was staged;
          # the cimtest stand-ins above stay the calibrated harness). Per
          # ladder namespace, page 0 of the truth-side manifests, the SAME
          # replay surfaces the gallery ours leg uses — here as PARITY
          # SHOTS for the parity-diff.yml identity join:
          #   gal-item-<ns>.png  hotbar slot-0 pack carrier (the icon crop)
          #   gal-held-<ns>.png  first-person held carrier ("1" pressed)
          #   gal-inv-<ns>.png   the open-inventory view (E / ESC)
          #   gallery-sound-<ns>-p0.log  the ordered POST-REWRITE sound
          #                      stream the plugin recorded (no shot — the
          #                      stream IS the picture, sound-diff.py joins)
          # Camera pinned to the gallery held-class convention (0.5 -60 0.5
          # yaw 0 pitch 0). The namespace walks headless on the truth side
          # of the seed — here the viewer gives them their GUI surfaces.
          if [ -d srv/c-imagine/scenes ]; then
            python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
              "tp cimviewer 0.5 -60 0.5 0 0" >/dev/null || true
            for NS in $LADDER_NS; do
              echo "=== ladder parity leg: $NS ==="
              FIRST=""
              if [ -f "srv/c-imagine/scenes/gallery-item-$NS-p0.tsv" ]; then
                FIRST=$(awk -F'\t' '$1=="cell"{print $5; exit}' \
                  "srv/c-imagine/scenes/gallery-item-$NS-p0.tsv")
              fi
              if [ -z "$FIRST" ]; then
                echo "[ladder] $NS: no item rows on manifest page 0 (registry empty for the class — combat_roll case) — item/held/inv legs skipped, honest absence"
              else
                echo "clear cimviewer" > srv/console.in
                sleep 2
                HOUT=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
                  "cim gallerypage-held $NS 0")
                echo "$HOUT"
                echo "$HOUT" | grep -q "gallerypage-held $NS p0 -> held=" \
                  || { echo "[ladder] $NS: gallerypage-held marker missing (the replay surface did not answer)"; exit 1; }
                if echo "$HOUT" | grep -q "cmd=nochannel"; then
                  echo "[ladder] $NS: the pack channel dropped the first item row ($FIRST) — nochannel is a NAMED FAILURE (the pack is built from these very rows)"
                  exit 1
                fi
                sleep 2   # the carrier renders into slot 0
                java -cp vtools Shot "shots/gal-item-$NS.png"
                AEI=$(java -cp vtools PixelDiff shots/00-baseline.png "shots/gal-item-$NS.png" 375 663 48 48)
                echo "AE(baseline,gal-item-$NS)=$AEI (slot-0 icon crop)"
                [ "$AEI" != "0" ] || { echo "[ladder] $NS: the pack carrier never appeared in the hotbar"; exit 1; }
                java -cp vtools Key 1
                sleep 1
                java -cp vtools Shot "shots/gal-held-$NS.png"
              fi
              # INV leg: the derived manifest fills the real inventory slots
              # through the pack carriers; the open-inventory shot is the
              # GUI-items surface (inv-diff.py's geometry joins it later).
              if [ -f "srv/c-imagine/scenes/gallery-inv-$NS-p0.tsv" ] \
                 && [ "$(grep -vc '^#' "srv/c-imagine/scenes/gallery-inv-$NS-p0.tsv")" -gt 0 ]; then
                IOUT=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
                  "cim gallerypage-inv $NS 0")
                echo "$IOUT"
                echo "$IOUT" | grep -q "gallerypage-inv $NS p0 -> placed=" \
                  || { echo "[ladder] $NS: gallerypage-inv marker missing"; exit 1; }
                java -cp vtools Key E
                sleep 2   # the inventory screen renders (fixed window, both legs)
                java -cp vtools Shot "shots/gal-inv-$NS.png"
                java -cp vtools Key ESC
              else
                echo "[ladder] $NS: no inv rows derived — inv leg skipped"
              fi
              # SOUND replay: the plugin sends one REAL ClientboundSoundPacket
              # per manifest cell through the visual-sounds.tsv rewrite and
              # records the post-rewrite id the vanilla client received into
              # gallery-sound-<ns>-p0.log — the parity-diff truth side walks
              # the SAME page on the real modded client and sound-diff.py
              # joins the two ordered streams.
              if [ -f "srv/c-imagine/scenes/gallery-sound-$NS-p0.tsv" ]; then
                SOUT=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
                  "cim gallerypage-sound $NS 0")
                echo "$SOUT"
                echo "$SOUT" | grep -q "gallerypage-sound $NS p0 -> placed=" \
                  || { echo "[ladder] $NS: gallerypage-sound marker missing"; exit 1; }
                test -s "srv/c-imagine/scenes/gallery-sound-$NS-p0.log" \
                  || echo "[ladder] $NS: sound capture log EMPTY (the honest nochannel stream — sound-diff names every row)"
              fi
              # GUI awareness: the seed v2 does NOT carry gui manifests (the
              # class is truth-walk-only — a viewer must open the menus; the
              # seed walks headless). Named, never silent; when a future
              # seed stages them the replay runs here.
              if [ -f "srv/c-imagine/scenes/gallery-gui-$NS-p0.tsv" ]; then
                GOUT=$(python3 scripts/cimscene/rcon.py 127.0.0.1 25575 cimgate \
                  "cim gallerypage-gui $NS 0")
                echo "$GOUT"
                java -cp vtools Key E || true
                sleep 2
                java -cp vtools Shot "shots/gal-gui-$NS.png" || true
                java -cp vtools Key ESC || true
              else
                echo "[ladder] $NS: no gui manifest in the seed (expected — gui is truth-walk-only; the gui parity leg needs a truth-shard artifact)"
              fi
            done
          else
            echo "[ladder] no seed staged (no gallery_run_id) — the calibrated cimtest-only harness ran, ladder legs skipped"
          fi
          kill $CLIENT_PID $XVFB_PID 2>/dev/null || true
          ls -la shots/
      - name: assert visual contract + upload evidence
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          # the client actually applied the server pack — measured run 9:
          # latest.log lands in visual-client/logs/ (cwd-relative), and the
          # ROBUST marker is the SECOND reload line in client.out (the
          # pack's repository id rides it: "vanilla, vanilla, server/...")
          grep -q "Reloading ResourceManager: vanilla, vanilla, server/" \
            visual-client/client.out \
            || { grep -qi "pack" visual-client/logs/latest.log 2>/dev/null \
                 || fail "no pack activity in the client log"; }
          # pixel contract (Java-only diff): CMD item vs plain paper differ,
          # and the item differs from the empty baseline
          AE12=$(java -cp vtools PixelDiff shots/01-vanilla-paper.png shots/02-cmd-paper.png)
          AE10=$(java -cp vtools PixelDiff shots/00-baseline.png shots/01-vanilla-paper.png)
          echo "AE(vanilla,cmd)=$AE12 AE(baseline,vanilla)=$AE10"
          [ "$AE10" != "0" ] || fail "the item never appeared in the hotbar"
          [ "$AE12" != "0" ] || fail "CMD paper renders IDENTICAL to vanilla paper — the pack override did not apply"
          # atmosphere channel: the modded chain must visibly tint the frame
          # (same CMD item in both shots — only the postfx differs)
          AEfx=$(java -cp vtools PixelDiff shots/02-cmd-paper.png shots/03-postfx-on.png)
          echo "AE(cmd,postfx-on)=$AEfx"
          [ "$AEfx" -gt "5000" ] || fail "cimsepia tint not visible (AE=$AEfx) — the client did not resolve the pack-contributed chain"
          # select family: plain brick vs CMD-strings brick must differ
          AE56=$(java -cp vtools PixelDiff shots/05-plain-brick.png shots/06-cmd-brick.png)
          echo "AE(plain-brick,cmd-brick)=$AE56"
          [ "$AE56" != "0" ] || fail "CMD strings rendered IDENTICAL to plain brick — the select def did not apply"
          # armor channel: the worn equippable helmet must visibly change the
          # third-person player model (pack equipment layer resolves)
          AE78=$(java -cp vtools PixelDiff shots/07-thirdperson.png shots/08-armor.png)
          echo "AE(thirdperson,armor)=$AE78"
          [ "$AE78" -gt "1000" ] || fail "armor layer not visible on the model (AE=$AE78) — the equipment asset did not resolve"
          # block channel: the stand-in cube must appear in the view (the
          # pack's note_block override rendered the modded model client-side)
          AE910=$(java -cp vtools PixelDiff shots/09-block-pre.png shots/10-block.png)
          echo "AE(block-pre,block)=$AE910"
          [ "$AE910" -gt "3000" ] || fail "placed stand-in block not visible (AE=$AE910) — the blockstate override did not resolve"
          # entity channel: the rig must appear ON TOP of the cloud drift —
          # AE(11,12) is the pure drift control (rig static, world moving);
          # the rig's own pixels are the difference
          AE1011=$(java -cp vtools PixelDiff shots/10-block.png shots/11-display.png)
          AE1112=$(java -cp vtools PixelDiff shots/11-display.png shots/12-display-hold.png)
          RIG=$((AE1011 - AE1112))
          echo "AE(block,display)=$AE1011 AE(display,hold)=$AE1112 rig-pixels=$RIG"
          [ "$RIG" -gt "3000" ] || fail "item_display rig not visible above cloud drift (rig-pixels=$RIG) — the display entity did not render"
          # camera-lock leg: the stand-in cube must appear on the floor grid
          # in front of the LOCKED camera. Region = CUBE-ONLY (545,170,190,115
          # — the projected cube, measured run 47; the floor below it carries
          # a light-map mystery region — camera-lock-26-3.md §3) with
          # PixelDiffTol tolerance 4 (the ±2/255 lightmap drift between the
          # two client versions would otherwise count EVERY pixel differing
          # — camera-lock-26-3.md)
          AE1314=$(java -cp vtools PixelDiffTol shots/13-locked-pre.png shots/14-locked.png 545 170 190 115 4)
          echo "AE(locked-pre,locked)=$AE1314 (tol 4, cube-only region)"
          [ "$AE1314" -gt "3000" ] || fail "locked stand-in block not visible (AE=$AE1314) — the camera-lock leg did not place the block"
          # palette channel: the recolored variant must visibly differ from
          # the base gem in the hotbar slot-0 crop — the paletted_permutations
          # atlas source resolved CLIENT-SIDE (the generated variant sprite
          # exists and the variant model renders through it)
          AE1516=$(java -cp vtools PixelDiff shots/15-gem.png shots/16-gem-red.png 375 663 48 48)
          echo "AE(gem,gem-red)=$AE1516"
          [ "$AE1516" -gt "500" ] || fail "palette recolor not visible (AE=$AE1516) — the paletted_permutations source did not resolve"
          echo "M5.3 visual contract: pack applied + range_dispatch + select + postfx + equipment + block-in-world + display-rig + camera-lock + palette all render on the stock client"
          if [ -d srv/c-imagine/scenes ]; then
            echo "ladder parity legs: per-ns hotbar/first-person/inventory shots + the ordered sound replay logs recorded for parity-diff (seed v2, page 0 per LADDER_NS)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-contract-evidence
          path: |
            shots/
            srv/boot.log
            visual-client/game/logs/latest.log
            visual-client/client.out
            visual-client/game/servers.dat
            # the ladder parity surfaces (seed v2 legs): the ordered sound
            # replay logs the plugin wrote, the item manifests the identity
            # pairing guards against, the derived inv manifests, and the
            # sound channel map sound-diff.py's --map preview resolves
            srv/c-imagine/scenes/gallery-sound-*.log
            srv/c-imagine/scenes/gallery-item-*-p0.tsv
            srv/c-imagine/scenes/gallery-inv-*-p0.tsv
            srv/c-imagine/f2v/visual-sounds.tsv
          if-no-files-found: warn

  # Placeholder naming the future job so the intent is visible in the UI.
  xvfb-client-diff:
    name: xvfb client diff (superseded by vanilla-client-visual)
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "superseded"
