name: visual

# Visual parity pipeline. M0: protocol-level smoke of the visual data path
# (registry snapshots + mapping tables the F2V v2 packet hooks will consume).
# M5 (roadmap): real vanilla client under xvfb with screenshot diffing
# against NeoForge-rendered ground truth.
# Actions policy (owner directive, updated 2026-10-26): minutes nearly
# exhausted — dispatch-only.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  protocol-smoke:
    name: visual data path smoke (M0)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: f2v translation-plan smoke test
        run: |
          # The plan builder is the contract every M4 packet rewrite obeys.
          cargo test -p cim-f2v
          cargo test -p cim-registry

      - name: visual contract fixture (cimtest defaults)
        run: |
          cat > /tmp/visual-contract.md <<'EOF'
          | modded key | renders as (vanilla) | scale |
          |---|---|---|
          | cimtest:test_entity | minecraft:iron_golem | 0.5 |
          | cimtest:test_block | minecraft:iron_block | 1.0 |
          EOF
          cat /tmp/visual-contract.md >> "$GITHUB_STEP_SUMMARY"

      # M5 milestone (see docs/ROADMAP.md): xvfb + headless vanilla client
      # + screenshot diff vs NeoForge ground truth. Scaffolded there; kept
      # out of M0 until the protocol bot (cim-proto based) exists.

  # M5.3: REAL vanilla client under xvfb — downloads the pack from PackHttp,
  # applies it, receives the visual item (CMD component through the vanilla
  # give component syntax), and screenshots the result. The pixel contract:
  # a CMD item and a plain paper item must render DIFFERENTLY in the hotbar
  # (the pack's range_dispatch override is what makes them differ).
  vanilla-client-visual:
    name: vanilla 26.3 client visual contract (M5.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: resolve newest stable paper-api for 26.3
        id: paper
        run: |
          PV=$(bash scripts/resolve-paper-version.sh 26.3)
          echo "version=$PV" >> "$GITHUB_OUTPUT"
      - name: build plugin
        working-directory: paper-plugin
        run: mvn -B -ntp -Dpaper.version="${{ steps.paper.outputs.version }}" package
      - name: fetch visual client runtime (piston-meta, with assets)
        run: |
          python3 scripts/fetch-visual-client.py 26.3 visual-client --assets
          ls visual-client | head
          wc -c visual-client/classpath.txt visual-client/launch.txt
      - name: fetch Paper 26.3 (fill API v3, bare — no module)
        run: |
          set -euo pipefail
          mkdir -p srv
          # MEASURED (first dispatch): crussty init downloads Paper lazily on
          # `run` — a bare visual job needs the paperclip jar directly.
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          echo "paper: $URL"
          curl -sL --max-time 300 -o srv/paper.jar "$URL"
          wc -c srv/paper.jar
      - name: stage plugin + pack (pre-boot build, deterministic)
        run: |
          set -euo pipefail
          mkdir -p srv/plugins srv/mods srv/c-imagine/f2v
          cp paper-plugin/target/cim-paper-plugin.jar srv/plugins/
          # the pack builder reads ASSETS from mod jars — the cimtest jar
          # assets suffice (no layer, no module in this job)
          (cd test-mods/src/main/resources && zip -qr /tmp/cimtest-assets.jar assets)
          cp /tmp/cimtest-assets.jar srv/mods/cimtest-1.0.0.jar
          cp scripts/f2v/visual-items.tsv srv/c-imagine/f2v/visual-items.tsv
          java -cp paper-plugin/target/cim-paper-plugin.jar dev.cim.f2v.F2vPack \
            --build srv/mods srv/c-imagine/f2v
          SHA1=$(cat srv/c-imagine/f2v/pack.sha1)
          echo "eula=true" > srv/eula.txt
          cat > srv/server.properties <<PROPS
          online-mode=false
          white-list=false
          level-type=minecraft:flat
          level-seed=42
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          max-players=5
          resource-pack=http://127.0.0.1:25580/cim-f2v-pack.zip
          resource-pack-sha1=$SHA1
          PROPS
          cat srv/server.properties
      - name: boot server (bare Paper + plugin, console FIFO)
        run: |
          set -euo pipefail
          cd srv
          mkfifo console.in
          # keep the FIFO open and feed console commands from a file later
          # paperclip patches the Mojang jar on first boot (network needed)
          tail -f console.in | java -Xmx2G -jar paper.jar --nogui > boot.log 2>&1 &
          echo $! > ../srv.pid
          cd ..
          # wait for Done (120 x 2s)
          for i in $(seq 1 120); do
            grep -q "Done (" srv/boot.log 2>/dev/null && break
            sleep 2
          done
          grep -q "Done (" srv/boot.log || { tail -30 srv/boot.log; exit 1; }
          grep -q "f2v pack: serving" srv/boot.log || { tail -30 srv/boot.log; exit 1; }
          echo "server up + pack serving"
      - name: vanilla client joins under xvfb + visual contract
        run: |
          set -euo pipefail
          # Java-only screenshot/diff tools (measured: runners ship IM7 with
          # no `import`/`xwd`); Robot needs the X display
          javac -d vtools scripts/visual/Shot.java scripts/visual/PixelDiff.java
          # MEASURED (run 4): GlDevice needs a matching GLX visual — install
          # the software GL/Vulkan stack explicitly and expose GLX on Xvfb
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri mesa-vulkan-drivers libglx-mesa0
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          XVFB_PID=$!
          sleep 3
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          LAUNCH=$(cat visual-client/launch.txt)
          # cwd must be the client dir (assets/game dir are resolved there);
          # the launch line carries ABSOLUTE classpaths (measured fix)
          ( cd visual-client && bash -c "$LAUNCH" > client.out 2>&1 ) &
          CLIENT_PID=$!
          # wait for the world join — client.out is the log4j stdout mirror
          # (measured: latest.log may lag/land elsewhere under software GL);
          # llvmpipe shader compilation is SLOW — 12 min budget
          JOINED=0
          for i in $(seq 1 240); do
            if grep -q "joined the game" visual-client/client.out 2>/dev/null; then JOINED=1; break; fi
            sleep 3
          done
          if [ "$JOINED" != "1" ]; then
            echo "--- client.out tail ---"; tail -60 visual-client/client.out || true
            find visual-client -name "*.log" -o -name "latest.txt" | head
            exit 1
          fi
          sleep 30   # world render settles (software GL)
          java -cp vtools Shot shots/00-baseline.png
          # hotbar contract: empty -> plain paper -> CMD paper (the pack's
          # range_dispatch must make the LAST two render differently)
          echo "clear cimviewer" > srv/console.in
          sleep 2
          echo "give cimviewer paper 1" > srv/console.in
          sleep 4
          java -cp vtools Shot shots/01-vanilla-paper.png
          echo "clear cimviewer" > srv/console.in
          sleep 2
          echo "give cimviewer paper[minecraft:custom_model_data={floats:[1000.0]}] 1" > srv/console.in
          sleep 4
          java -cp vtools Shot shots/02-cmd-paper.png
          kill $CLIENT_PID $XVFB_PID 2>/dev/null || true
          ls -la shots/
      - name: assert visual contract + upload evidence
        run: |
          fail() { echo "ASSERTION FAILED: $1"; exit 1; }
          # the client actually applied the server pack (its log carries the
          # pack flow; sha1 mismatch or decline would surface here)
          grep -qi "pack" visual-client/game/logs/latest.log \
            || fail "no pack activity in the client log"
          # pixel contract (Java-only diff): CMD item vs plain paper differ,
          # and the item differs from the empty baseline
          AE12=$(java -cp vtools PixelDiff shots/01-vanilla-paper.png shots/02-cmd-paper.png)
          AE10=$(java -cp vtools PixelDiff shots/00-baseline.png shots/01-vanilla-paper.png)
          echo "AE(vanilla,cmd)=$AE12 AE(baseline,vanilla)=$AE10"
          [ "$AE10" != "0" ] || fail "the item never appeared in the hotbar"
          [ "$AE12" != "0" ] || fail "CMD paper renders IDENTICAL to vanilla paper — the pack override did not apply"
          echo "M5.3 visual contract: pack applied + CMD item renders as the modded model"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-contract-evidence
          path: |
            shots/
            srv/boot.log
            visual-client/game/logs/latest.log
            visual-client/client.out
          if-no-files-found: warn

  # Placeholder naming the future job so the intent is visible in the UI.
  xvfb-client-diff:
    name: xvfb client diff (superseded by vanilla-client-visual)
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "superseded"
