name: diagnostic-light

# Native 26.3 display-light control, not a mod-parity verdict.
# A/B/C sample inside opaque enclosures while their identical block-model
# geometry is translated into view. D samples front air at the same rendered
# depth. A has no override; B=(block0,sky15); C=(15,15); D=(0,15).
# Manual-only, isolated from the gallery's concurrency group.
on:
  workflow_dispatch: {}

jobs:
  display-light:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DISPLAY: ':99'
      SDL_VIDEO_DRIVER: x11
      SDL_VIDEO_FORCE_EGL: '1'
      EGL_PLATFORM: x11
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install display stack and verify probe contracts
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq xvfb libgl1-mesa-dri \
            mesa-vulkan-drivers libglx-mesa0 libegl1 libegl-mesa0 libxtst6 x11-utils
          python3 -m pip install pillow
          python3 scripts/visual/test-probe-client.py
          mkdir -p /tmp/rig/vtools
          javac --release 21 -d /tmp/rig/vtools scripts/visual/Shot.java scripts/visual/Key.java

      - name: verify a real client window on the supported 24-bit display
        run: |
          set -euo pipefail
          setsid Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset \
            < /dev/null > /tmp/rig/xvfb.log 2>&1 &
          for _ in $(seq 1 40); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          xdpyinfo -display :99 >/dev/null
          python3 scripts/fetch-visual-client.py 26.3 /tmp/rig/client --assets
          mkdir -p /tmp/rig/client/game
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderClouds:false\nmipmapLevels:0\nfov:0.0\nfovEffectScale:0.0\nbobView:false\n' > /tmp/rig/client/game/options.txt
          found=0
          for backend in opengl vulkan; do
            if bash scripts/visual/probe-client.sh /tmp/rig/client/launch.txt "$backend" "/tmp/rig/probe-$backend.out"; then
              echo "$backend" > /tmp/rig/glbackend.txt
              found=1
              break
            fi
          done
          [ "$found" = 1 ] || { echo "No backend produced a native post-window receipt"; exit 1; }

      - name: local native server boot
        run: |
          set -euo pipefail
          mkdir -p /tmp/srv
          curl --fail --location --retry 2 --max-time 240 \
            https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar -o /tmp/srv/server.jar
          cd /tmp/srv
          echo 'eula=true' > eula.txt
          printf 'online-mode=false\nwhite-list=false\nenforce-whitelist=false\nserver-ip=127.0.0.1\nlevel-type=minecraft:flat\ngamemode=spectator\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\nmotd=diag\n' > server.properties
          mkfifo cmd.fifo
          # Keep a writer open in the server process across Actions steps:
          # otherwise console readLine reaches EOF before the scene is sent.
          (
            exec 3<> cmd.fifo
            exec java -Xmx1G -jar server.jar nogui <&3 > boot.log 2>&1
          ) &
          for _ in $(seq 1 120); do grep -q 'Done (' boot.log && break; sleep 1; done
          grep 'Done (' boot.log

      - name: client join, four distinct controls, and native screenshot
        run: |
          set -euo pipefail
          backend=$(cat /tmp/rig/glbackend.txt)
          sed -E "s/--graphicsBackend (opengl|vulkan)/--graphicsBackend $backend/g" /tmp/rig/client/launch.txt > /tmp/rig/client/launch-run.txt
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nmipmapLevels:0\nrenderClouds:false\nfov:0.0\nfovEffectScale:0.0\nbobView:false\npreferredGraphicsBackend:%s\n' "$backend" > /tmp/rig/client/game/options.txt
          setsid bash -c 'cd /tmp/rig/client && bash launch-run.txt > client.out 2>&1' < /dev/null > /dev/null 2>&1 &
          client_pid=$!
          joined=0
          for _ in $(seq 1 240); do
            if grep -q 'joined the game' /tmp/srv/boot.log; then joined=1; break; fi
            if grep -qE 'Disconnecting cimviewer|cimviewer.*lost connection' /tmp/srv/boot.log; then break; fi
            kill -0 "$client_pid" 2>/dev/null || break
            sleep 1
          done
          [ "$joined" = 1 ] || { tail -25 /tmp/srv/boot.log; tail -35 /tmp/rig/client/client.out; exit 1; }
          exec 3<> /tmp/srv/cmd.fifo
          printf '%s\n' \
            'difficulty peaceful' \
            'time set noon' \
            'weather clear' \
            'fill -7 -61 -1 -5 -59 1 minecraft:calcite' \
            'fill -3 -61 -1 -1 -59 1 minecraft:calcite' \
            'fill 1 -61 -1 3 -59 1 minecraft:calcite' \
            'summon minecraft:item_display -5.5 -59.5 0.5 {Tags:["light_A"],item:{id:"minecraft:white_concrete",count:1},transformation:{translation:[0f,0f,3f],left_rotation:[0f,0f,0f,1f],scale:[1f,1f,1f],right_rotation:[0f,0f,0f,1f]}}' \
            'summon minecraft:item_display -1.5 -59.5 0.5 {Tags:["light_B"],brightness:{sky:15,block:0},item:{id:"minecraft:white_concrete",count:1},transformation:{translation:[0f,0f,3f],left_rotation:[0f,0f,0f,1f],scale:[1f,1f,1f],right_rotation:[0f,0f,0f,1f]}}' \
            'summon minecraft:item_display 2.5 -59.5 0.5 {Tags:["light_C"],brightness:{sky:15,block:15},item:{id:"minecraft:white_concrete",count:1},transformation:{translation:[0f,0f,3f],left_rotation:[0f,0f,0f,1f],scale:[1f,1f,1f],right_rotation:[0f,0f,0f,1f]}}' \
            'summon minecraft:item_display 6.5 -59.5 3.5 {Tags:["light_D"],brightness:{sky:15,block:0},item:{id:"minecraft:white_concrete",count:1}}' \
            'tp @a 0.5 -60 14.5 180 6' \
            'data get entity @e[type=minecraft:item_display,tag=light_A,limit=1]' \
            'data get entity @e[type=minecraft:item_display,tag=light_B,limit=1]' \
            'data get entity @e[type=minecraft:item_display,tag=light_C,limit=1]' \
            'data get entity @e[type=minecraft:item_display,tag=light_D,limit=1]' \
            'data get entity @a[limit=1] Pos' \
            'data get entity @a[limit=1] Rotation' \
            'execute if data entity @e[tag=light_A,limit=1] transformation{translation:[0f,0f,3f]} run say CIM_LIGHT_A_TRANSFORM_OK' \
            'execute if data entity @e[tag=light_B,limit=1] transformation{translation:[0f,0f,3f]} run say CIM_LIGHT_B_TRANSFORM_OK' \
            'execute if data entity @e[tag=light_C,limit=1] transformation{translation:[0f,0f,3f]} run say CIM_LIGHT_C_TRANSFORM_OK' >&3
          for _ in $(seq 1 20); do
            if grep -q 'CIM_LIGHT_C_TRANSFORM_OK' /tmp/srv/boot.log; then break; fi
            sleep 0.5
          done
          for label in A B C; do
            grep -q "CIM_LIGHT_${label}_TRANSFORM_OK" /tmp/srv/boot.log
          done
          sleep 6
          java -cp /tmp/rig/vtools Key F1
          sleep 1
          java -cp /tmp/rig/vtools Shot /tmp/rig/shot.png
          test -s /tmp/rig/shot.png

      - name: labeled luma receipt
        run: |
          set -euo pipefail
          python3 scripts/visual/measure-display-light.py /tmp/rig/shot.png /tmp/rig/light-receipt

      - name: upload the receipt on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-light-receipt
          path: |
            /tmp/rig/shot.png
            /tmp/rig/light-receipt
            /tmp/rig/client/client.out
            /tmp/rig/client/game/options.txt
            /tmp/srv/boot.log
            /tmp/srv/server.properties
            /tmp/rig/glbackend.txt
            /tmp/rig/probe-*.out
            /tmp/rig/xvfb.log
          if-no-files-found: warn
