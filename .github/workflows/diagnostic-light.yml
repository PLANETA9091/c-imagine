name: diagnostic-light

# Native renderer experiment using real captured Create/AE2 meshes.
# Before/after images are diagnostic; the full dual-stack gallery gates parity.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  display-light:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DISPLAY: ':99'
      SDL_VIDEO_DRIVER: x11
      SDL_VIDEO_FORCE_EGL: '1'
      EGL_PLATFORM: x11
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install display stack and verify probe contracts
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq xvfb libgl1-mesa-dri \
            mesa-vulkan-drivers libglx-mesa0 libegl1 libegl-mesa0 libxtst6 x11-utils
          python3 -m pip install pillow
          python3 scripts/visual/test-probe-client.py
          mkdir -p /tmp/rig/vtools
          javac --release 21 -d /tmp/rig/vtools scripts/visual/Shot.java scripts/visual/Key.java

      - name: verify a real client window on the supported 24-bit display
        run: |
          set -euo pipefail
          setsid Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset \
            < /dev/null > /tmp/rig/xvfb.log 2>&1 &
          for _ in $(seq 1 40); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          xdpyinfo -display :99 >/dev/null
          python3 scripts/fetch-visual-client.py 26.3 /tmp/rig/client --assets
          mkdir -p /tmp/rig/client/game
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderClouds:false\nmipmapLevels:0\nfov:0.0\nfovEffectScale:0.0\nbobView:false\n' > /tmp/rig/client/game/options.txt
          found=0
          for backend in opengl vulkan; do
            if bash scripts/visual/probe-client.sh /tmp/rig/client/launch.txt "$backend" "/tmp/rig/probe-$backend.out"; then
              echo "$backend" > /tmp/rig/glbackend.txt
              found=1
              break
            fi
          done
          [ "$found" = 1 ] || { echo "No backend produced a native post-window receipt"; exit 1; }

      - name: build the real c-imagine Paper plugin
        run: mvn -B -f paper-plugin/pom.xml verify dependency:build-classpath -Dmdep.outputFile=target/probe-cp.txt

      - name: download the real native Create and AE2 capture
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14133294738
          run-id: 43645299155
          github-token: ${{ github.token }}
          path: /tmp/rig/native-capture

      - name: build before and candidate packs with the production builder
        run: |
          set -euo pipefail
          python3 scripts/visual/build-captured-light-probe.py /tmp/rig/native-capture /tmp/rig/client/client.jar /tmp/rig/captured-probe > /tmp/rig/captured-probe-build.log 2>&1
          mkdir -p /tmp/srv/c-imagine/f2v
          cp /tmp/rig/captured-probe/served/* /tmp/srv/c-imagine/f2v/

      - name: local Paper server boot
        run: |
          set -euo pipefail
          mkdir -p /tmp/srv
          curl --fail --location --retry 2 --max-time 240 \
            https://fill-data.papermc.io/v1/objects/1331d9f32c8b605591e6ee0eb9c7e701d191cfae0db080ffc4a1f46d370c0bfd/paper-26.3-252.jar -o /tmp/srv/server.jar
          echo '1331d9f32c8b605591e6ee0eb9c7e701d191cfae0db080ffc4a1f46d370c0bfd  /tmp/srv/server.jar' | sha256sum --check
          mkdir -p /tmp/srv/plugins
          cp paper-plugin/target/cim-paper-plugin.jar /tmp/srv/plugins/
          cd /tmp/srv
          echo 'eula=true' > eula.txt
          printf 'online-mode=false\nwhite-list=false\nenforce-whitelist=false\nserver-ip=127.0.0.1\nlevel-type=minecraft:flat\ngamemode=spectator\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\nmotd=diag\n' > server.properties
          printf 'resource-pack=http://127.0.0.1:25580/cim-f2v-pack.zip\nresource-pack-sha1=%s\nrequire-resource-pack=true\n' "$(cat c-imagine/f2v/pack.sha1)" >> server.properties
          mkfifo cmd.fifo
          # Keep a writer open in the server process across Actions steps:
          # otherwise console readLine reaches EOF before the scene is sent.
          (
            exec 3<> cmd.fifo
            exec java -Xmx1G -Dcim.f2v.fastBoot=true -jar server.jar nogui <&3 > boot.log 2>&1
          ) &
          for _ in $(seq 1 120); do grep -q 'Done (' boot.log && break; sleep 1; done
          grep 'Done (' boot.log
          grep 'paper plugin enabled (bridge lifecycle owner)' boot.log

      - name: client join, four distinct controls, and native screenshot
        run: |
          set -euo pipefail
          backend=$(cat /tmp/rig/glbackend.txt)
          sed -E "s/--graphicsBackend (opengl|vulkan)/--graphicsBackend $backend/g" /tmp/rig/client/launch.txt > /tmp/rig/client/launch-run.txt
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nmipmapLevels:0\nrenderClouds:false\nfov:0.0\nfovEffectScale:0.0\nbobView:false\npreferredGraphicsBackend:%s\n' "$backend" > /tmp/rig/client/game/options.txt
          python3 scripts/visual/make_servers_dat.py /tmp/rig/client/game
          setsid bash -c 'cd /tmp/rig/client && bash launch-run.txt > client.out 2>&1' < /dev/null > /dev/null 2>&1 &
          client_pid=$!
          joined=0
          for _ in $(seq 1 240); do
            if grep -q 'joined the game' /tmp/srv/boot.log; then joined=1; break; fi
            if grep -qE 'Disconnecting cimviewer|cimviewer.*lost connection' /tmp/srv/boot.log; then break; fi
            kill -0 "$client_pid" 2>/dev/null || break
            sleep 1
          done
          [ "$joined" = 1 ] || { tail -25 /tmp/srv/boot.log; tail -35 /tmp/rig/client/client.out; exit 1; }
          # Paper reports status for a real play-phase offer, not the
          # configuration-phase server.properties pack (gallery contract).
          exec 3<> /tmp/srv/cmd.fifo
          printf '%s\n' 'cim pack cimviewer' >&3
          for _ in $(seq 1 120); do
            if grep -q '=SUCCESSFULLY_LOADED' /tmp/srv/boot.log; then break; fi
            if grep -qE 'status cimviewer=(DECLINED|FAILED_DOWNLOAD|FAILED_RELOAD|INVALID_URL|DISCARDED)' /tmp/srv/boot.log; then
              tail -30 /tmp/srv/boot.log
              tail -35 /tmp/rig/client/client.out
              exit 1
            fi
            sleep 1
          done
          grep -q '=SUCCESSFULLY_LOADED' /tmp/srv/boot.log || {
            tail -30 /tmp/srv/boot.log
            tail -35 /tmp/rig/client/client.out
            exit 1
          }
          printf '%s\n' \
            'difficulty peaceful' \
            'gamerule advance_time false' \
            'time set noon' \
            'weather clear' \
            'summon minecraft:item_display -5.5 -59.5 3.5 {Tags:["white_control"],brightness:{sky:15,block:0},item:{id:"minecraft:white_concrete",count:1}}' \
            'tp @a 0.5 -60 14.5 180 6' >&3
          for phase in before after; do
            cat "/tmp/rig/captured-probe/scene-$phase.txt" >&3
            for _ in $(seq 1 30); do
              if grep -q "CIM_CAPTURE_${phase}_2_OK" /tmp/srv/boot.log; then break; fi
              sleep 0.5
            done
            for i in 0 1 2; do
              grep -q "CIM_CAPTURE_${phase}_${i}_OK" /tmp/srv/boot.log
            done
            sleep 5
            if [ "$phase" = before ]; then java -cp /tmp/rig/vtools Key F1; sleep 1; fi
            java -cp /tmp/rig/vtools Shot "/tmp/rig/captured-$phase.png"
            test -s "/tmp/rig/captured-$phase.png"
          done

      - name: retain the diagnostic provenance
        run: cat /tmp/rig/captured-probe/provenance.json

      - name: upload the receipt on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-light-receipt
          path: |
            /tmp/rig/captured-before.png
            /tmp/rig/captured-after.png
            /tmp/rig/captured-probe/provenance.json
            /tmp/rig/captured-probe/scene-*.txt
            /tmp/rig/captured-probe/served/pack.sha1
            /tmp/rig/captured-probe/served/pack.zip
            /tmp/rig/captured-probe-build.log
            /tmp/rig/client/client.out
            /tmp/rig/client/game/options.txt
            /tmp/srv/boot.log
            /tmp/srv/server.properties
            /tmp/rig/glbackend.txt
            /tmp/rig/probe-*.out
            /tmp/rig/xvfb.log
          if-no-files-found: warn
