name: diagnostic-light

# 14-e30(b') — THE DISPLAY-LIGHT DIAGNOSTIC SHARD.
# Manual dispatch only (the workflow_dispatch group = separate from the
# gallery's concurrency group; this run NEVER supersedes a gallery).
#
# The question it settles on the EXACT production stack (the runner's mesa 26
# GL stack, the 26.3 vanilla client): for an item_display carrying the pack's
# block-model route, which light source reaches the shader —
#   (1) the Brightness override (the bytecode says the client consumes it via
#       DisplayRenderer.get{Block,Sky}LightLevel),
#   (2) the entity's positional light (the e24 front-air rig's premise), or
#   (3) neither (the e25 census measured the wall-class rows at the sky-0
#       ambient band ~0.46 with the pin (0,15) AND the rig in place).
#
# The matrix: four item_display entities (the same flat white paper item),
#   A = inside an opaque calcite cell, no override
#   B = inside the same cell, override (0,15)      <- the pin as the CI pins it
#   C = inside the same cell, override (15,15)     <- fullbright override
#   D = one block into the front air, override (0,15)  <- the e24 rig
# The crop luma of A vs B vs C vs D decides: A==B => the override is a no-op;
# B==C => the override IS consumed (and the e25 census lightmap = the sky-0
# means the POSITION is the boss, so D must go fullbright); A==D => the
# position does not matter either and the light = something else entirely.
#
# 14-e30(b'') THE WINDOW LADDER (the first dispatch, run 43697680168, died at
# the GL wall: "Couldn't find matching GLX visual" on OpenGL + "VK_KHR_surface
# not implemented" on Vulkan — the same measured signature the gallery's ours
# leg hit and solved in 14-bo; the gallery's GLPROBE ladder is the working
# recipe and rides here now): opengl/24bit -> opengl/32bit (RGBA visuals) ->
# vulkan/32bit (lavapipe, mesa-vulkan-drivers) — every step probed with the
# client's OWN verdict (opengl_missing is instant; "Sound engine started"
# fires only post-window), never an external GL probe (run #192 measured
# glxinfo green while the client died).

on:
  workflow_dispatch: {}

jobs:
  display-light:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: install display stack
        run: |
          set -euo pipefail
          echo "[apt_retry] 2 attempts"; for i in 1 2; do
            sudo apt-get update -qq && break || sleep 20
          done
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers \
            libglx-mesa0 libxtst6 mesa-utils imagemagick vulkan-tools > /dev/null
          ls /usr/share/vulkan/icd.d/ || true

      - name: THE WINDOW LADDER (GLPROBE, ported from the gallery's ours leg)
        run: |
          set -uo pipefail
          # THE GALLERY'S OURS-STEP ENV, 1:1 (the e26 run measured "window up
          # on opengl/24bit" with exactly this export set; the first two
          # dispatches rode per-process env only and the client refused the
          # GLX visual the gallery's client accepts — the step-level export
          # is the measured difference, Xvfb's GLX included)
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export LP_NUM_THREADS=4
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset < /dev/null > xvfb.log 2>&1 &
          # the X must be UP before any probe: xdpyinfo-verified (the second
          # dispatch measured the 32-bit restart racing the client — "Unable
          # to initialize SDL: No available video device" = the dead X)
          xwait() {
            for i in $(seq 1 15); do
              xdpyinfo -display "${1:-:99}" >/dev/null 2>&1 && return 0
              sleep 1
            done
            return 1
          }
          xwait :99 || { echo "Xvfb :99 never came up"; cat xvfb.log; exit 1; }
          glxinfo -display :99 | head -4 || echo "GLX probe FAILED"
          python3 scripts/fetch-visual-client.py 26.3 /tmp/rig/client --assets 2>&1 | tail -2
          grep -oE "\-\-graphicsBackend [a-z]*" /tmp/rig/client/launch.txt || true
          mkdir -p /tmp/rig/client/game /tmp/rig/client/game/crash-reports
          printf 'onboardAccessibility:false\nfov:0.0\npauseOnLostFocus:false\nrenderClouds:false\npreferredGraphicsBackend:opengl\n' > /tmp/rig/client/game/options.txt
          probe_client() {
            OUT=$(mktemp)
            timeout 90 env DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
              $(cat /tmp/rig/client/launch.txt) > "$OUT" 2>&1 || true
            cp "$OUT" /tmp/rig/probe-last.log || true
            if grep -qE "Game crashed!|Unable to initialize SDL" "$OUT" \
               && ! grep -q "Sound engine started" "$OUT"; then
              echo "PROBE: CLIENT-CRASH on $1 (a crash is a refusal, never inconclusive)"
              grep -E "IllegalStateException|BackendCreationException|Exception" "$OUT" | head -3 | sed 's/^/PROBE: /'
              rm -f "$OUT"; return 3
            fi
            if grep -qE "opengl_missing|Couldn't find matching GLX visual|BackendCreationException" "$OUT" \
               && ! grep -q "Sound engine started" "$OUT"; then
              echo "PROBE: backend-refused on $1"
              grep -E "BackendCreationException|opengl_missing|GLX visual|Vulkan is not supported" "$OUT" | head -3 | sed 's/^/PROBE: /'
              rm -f "$OUT"; return 3
            fi
            if grep -qE "Sound engine started|Created: .*atlas|Backend:" "$OUT"; then
              echo "PROBE: window up on $1"
              rm -f "$OUT"; return 0
            fi
            echo "PROBE: inconclusive on $1 (no verdict in 90s) — keeping the current backend"
            tail -4 "$OUT" | sed 's/^/PROBE: /'
            rm -f "$OUT"; return 0
          }
          xrestart() { # xrestart <depth> — kill :99, start at <depth>, VERIFY it serves
            pkill -f "Xvfb :99" 2>/dev/null || true
            sleep 1
            Xvfb :99 -screen 0 1280x720x$1 +extension GLX +render -noreset < /dev/null > xvfb$1.log 2>&1 &
            if ! xwait :99; then
              echo "Xvfb :99 depth $1 NEVER CAME UP:"; cat xvfb$1.log || true
              return 1
            fi
            return 0
          }
          GLBACKEND=opengl
          if ! probe_client "opengl/24bit"; then
            if xrestart 32 && probe_client "opengl/32bit"; then
              echo "GLPROBE: recovered on the 32-bit screen — the opengl pin stands"
            else
              # fallback 2: the vulkan backend — lavapipe, no GLX involved;
              # if the 32-bit X died, the 24-bit screen serves the vulkan probe
              if ! xwait :99; then xrestart 24 || { echo "no X at all"; exit 1; }; fi
              printf 'onboardAccessibility:false\nfov:0.0\npauseOnLostFocus:false\nrenderClouds:false\npreferredGraphicsBackend:vulkan\n' > /tmp/rig/client/game/options.txt
              if probe_client "vulkan/$(xdpyinfo -display :99 >/dev/null 2>&1 && echo 32bit || echo 24bit)"; then
                GLBACKEND=vulkan
                echo "GLPROBE: FLIPPED to vulkan and verified — the shard rides lavapipe"
              else
                echo "GLPROBE: neither backend can start the 26.3 client on this image"
                exit 1
              fi
            fi
          else
            echo "GLPROBE: the opengl pin stands (the client's window came up)"
          fi
          echo "$GLBACKEND" > /tmp/rig/glbackend.txt
          cat /tmp/rig/glbackend.txt

      - name: local server boot
        run: |
          set -euo pipefail
          curl -s -m 240 https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar -o /tmp/server.jar
          mkdir -p /tmp/srv && cp /tmp/server.jar /tmp/srv/server.jar
          cd /tmp/srv
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft:flat\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\nmotd=diag\n' > server.properties
          mkfifo cmd.fifo
          java -Xmx1G -jar server.jar nogui < cmd.fifo > boot.log 2>&1 &
          exec 3<> cmd.fifo
          for _ in $(seq 1 120); do grep -q "Done (" boot.log && break; sleep 1; done
          grep "Done (" boot.log

      - name: client join + scene + crops
        run: |
          set -uo pipefail
          GLBACKEND=$(cat /tmp/rig/glbackend.txt 2>/dev/null || echo opengl)
          echo "riding backend: $GLBACKEND"
          if [ "$GLBACKEND" = "vulkan" ]; then
            sed -i 's/--graphicsBackend opengl/--graphicsBackend vulkan/' /tmp/rig/client/launch.txt
            printf 'onboardAccessibility:false\nfov:0.0\npauseOnLostFocus:false\nrenderClouds:false\npreferredGraphicsBackend:vulkan\n' > /tmp/rig/client/game/options.txt
          fi
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nmipmapLevels:0\nrenderClouds:false\nfov:0.0\npreferredGraphicsBackend:%s\n' "$GLBACKEND" > /tmp/rig/client/game/options.txt
          setsid bash -c 'cd /tmp/rig/client && DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe bash launch.txt > client.out 2>&1' < /dev/null > /dev/null 2>&1 &
          joined=0
          for _ in $(seq 1 240); do
            if grep -q "joined the game" /tmp/srv/boot.log 2>/dev/null; then joined=1; break; fi
            sleep 1
          done
          if [ "$joined" != "1" ]; then
            echo "CLIENT DID NOT JOIN — the receipt (the honest wall):"
            tail -30 /tmp/rig/client/client.out || true
            exit 1
          fi
          # the scene: the opaque wall at y=-60; the four displays at x=-1..2
          # A(-1) B(0) C(1) inside the wall cell column, D(2) in the front air
          exec 3<> /tmp/srv/cmd.fifo
          printf '%s\n' \
            "setblock -1 -60 0 minecraft:calcite" \
            "setblock 0 -60 0 minecraft:calcite" \
            "setblock 1 -60 0 minecraft:calcite" \
            "summon item_display -0.5 -59.5 0.5 {brightness:{sky:15b,block:0b},item:{id:\"minecraft:paper\",count:1b},transformation:{translation:[0f,-0.5f,0f],scale:[4f,4f,4f]}}" \
            "summon item_display 0.5 -59.5 0.5 {brightness:{sky:15b,block:0b},item:{id:\"minecraft:paper\",count:1b},transformation:{translation:[0f,-0.5f,0f],scale:[4f,4f,4f]}}" \
            "summon item_display 1.5 -59.5 0.5 {brightness:{sky:15b,block:15b},item:{id:\"minecraft:paper\",count:1b},transformation:{translation:[0f,-0.5f,0f],scale:[4f,4f,4f]}}" \
            "summon item_display 2.5 -59.5 0.5 {brightness:{sky:15b,block:0b},item:{id:\"minecraft:paper\",count:1b},transformation:{translation:[0f,-0.5f,0f],scale:[4f,4f,4f]}}" \
            "tp @a -0.0 -58.5 12.0 0 8" \
            "time set noon" \
            "gamerule doDaylightCycle false" >&3
          sleep 6
          java -cp /tmp/rig/client/vtools Shot /tmp/rig/shot.png || \
            java -cp vtools Shot /tmp/rig/shot.png || true
          ls -la /tmp/rig/shot.png || true

      - name: the luma receipt
        run: |
          set -uo pipefail
          python3 - << 'PY'
          from PIL import Image
          import statistics, os
          if not os.path.exists('/tmp/rig/shot.png'):
              print("NO SHOT — the client never rendered"); raise SystemExit(1)
          img = Image.open('/tmp/rig/shot.png').convert('RGB')
          w, h = img.size
          px = img.load()
          print("shot:", w, "x", h)
          rows = []
          for y in range(0, h, 8):
              vals = [sum(px[x, y])/3 for x in range(0, w, 8)]
              rows.append((y, round(statistics.mean(vals),1)))
          for y, m in rows:
              if m > 30: print(y, m)
          PY

      - name: upload the receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-light-receipt
          path: |
            /tmp/rig/shot.png
            /tmp/rig/client/client.out
            /tmp/rig/client/game/crash-reports/*
            /tmp/rig/probe-last.log
            /tmp/srv/boot.log
            /tmp/rig/glbackend.txt
            xvfb.log
            xvfb32.log
            xvfb24.log
          if-no-files-found: ignore
