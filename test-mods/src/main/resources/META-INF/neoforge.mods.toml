modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/PLANETA9091/c-imagine/issues"

[[mods]]
modId = "cimtest"
version = "1.0.0"
displayName = "CIM Test Mod"
authors = "PLANETA9091"
description = '''
First-party test mod for c-imagine: exercises registration (block, item,
block entity, entity), lifecycle events and login hooks so the CI matrix
can assert mini-NeoForge layer behavior end to end.
'''

[[dependencies.cimtest]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cimtest]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,]"
ordering = "NONE"
side = "BOTH"

# --- Tier-1 net leg: same jar (multi-mod), its own modId ---------------------
[[mods]]
modId = "cimtest_net"
version = "1.0.0"
displayName = "CIM Test Mod — Net"
authors = "PLANETA9091"
description = '''
Tier-1 net leg: custom payload/channel both directions (1.21.1
PayloadRegistrar/StreamCodec) with a deterministic token echo round trip.
Server-side safe (no client classes) — the S2C echo handler is inert on
dedicated servers.
'''

[[dependencies.cimtest_net]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cimtest_net]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,]"
ordering = "NONE"
side = "BOTH"

# --- Tier-1 cap leg: same jar (multi-mod), its own modId ---------------------
[[mods]]
modId = "cimtest_cap"
version = "1.0.0"
displayName = "CIM Test Mod — Cap"
authors = "PLANETA9091"
description = '''
Tier-1 cap leg: custom DataComponent (cimtest_cap:charge) + item capability
(RegisterCapabilitiesEvent) registered and round-tripped server-side through
the layer.
'''

[[dependencies.cimtest_cap]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cimtest_cap]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,]"
ordering = "NONE"
side = "BOTH"

# rides cimtest's registered test item for the round trips
[[dependencies.cimtest_cap]]
modId = "cimtest"
type = "required"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"

