plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'dev.cim'

base {
    archivesName = 'cimtest'
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    mods {
        cimtest {
            sourceSet sourceSets.main
        }
        // multi-mod jar: cimtest_net + cimtest_cap ride the same cimtest jar
        'cimtest_net' {
            sourceSet sourceSets.main
        }
        'cimtest_cap' {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

// FML validates these at discovery, before any @Mod class is constructed.
tasks.register('verifyModIds') {
    def metadata = layout.projectDirectory.file('src/main/resources/META-INF/neoforge.mods.toml')
    inputs.file(metadata)
    doLast {
        def ids = metadata.asFile.text =~ /(?m)^modId\s*=\s*"([^"]+)"/
        ids.each { match ->
            if (!(match[1] ==~ /[a-z][a-z0-9_]{1,63}/)) {
                throw new GradleException("Invalid NeoForge mod ID: ${match[1]}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyModIds')
}
