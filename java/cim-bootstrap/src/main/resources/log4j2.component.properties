# Scoped log4j2 configuration for the embedded 1.21.1 layer.
#
# This resource is packaged inside cim-bootstrap.jar and therefore visible
# ONLY through the ShadowClassLoader — log4j-core inside the shadow space
# resolves its own configuration through the loader that loaded it, so this
# file never reaches Paper's log4j copy (hermetic by construction).
#
# The relative path resolves against the process working directory:
#   - CRUSSTY boot: srv/log4j2-layer.xml (CI copies it there)
#   - local harness: run-m2-harness.sh copies it to the java CWD
log4j2.configurationFile = log4j2-layer.xml
