plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'dev.cim'

base {
    archivesName = 'cimscene'
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    mods {
        cimscene {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    captureTest {
        compileClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.register('captureTextureTest', JavaExec) {
    dependsOn captureTestClasses
    classpath = sourceSets.captureTest.runtimeClasspath
    mainClass = 'dev.cim.scenemod.CaptureTextureTest'
}

check.dependsOn captureTextureTest

tasks.register('captureBufferTest', JavaExec) {
    dependsOn captureTestClasses
    classpath = sourceSets.captureTest.runtimeClasspath
    mainClass = 'dev.cim.scenemod.CaptureBufferTest'
    systemProperty 'java.awt.headless', 'true'
}

check.dependsOn captureBufferTest

tasks.register('captureColorTest', JavaExec) {
    dependsOn captureTestClasses
    classpath = sourceSets.captureTest.runtimeClasspath
    mainClass = 'dev.cim.scenemod.CaptureColorTest'
    systemProperty 'java.awt.headless', 'true'
}

check.dependsOn captureColorTest
