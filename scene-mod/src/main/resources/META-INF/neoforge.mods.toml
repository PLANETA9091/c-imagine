[[mods]]
modId = "cimscene"
version = "1.0.0"
displayName = "CIM Scene Harness"
authors = "PLANETA9091"
description = '''
The real-mod parity harness (roadmap M5.5): an ORDINARY NeoForge mod — zero
c-imagine APIs — that drives the census-driven scene sweep on BOTH stacks
(real NeoForge ground truth and the c-imagine layer). Any behavior divergence
between the stacks is by construction a c-imagine defect.
'''

# The entity-tick quarantine (12-ar): a bare-spawned modded entity whose
# tick NPEs (measured: create:potato_projectile, gallery #27) used to be a
# FATAL server crash on the truth leg; the guard degrades it into a named
# discard that the settle pass reports and the coverage gate reds.
[[mixins]]
config = "cimscene.mixins.json"

[[dependencies.cimscene]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

